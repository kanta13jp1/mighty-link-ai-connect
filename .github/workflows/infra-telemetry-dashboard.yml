name: Infra Telemetry Dashboard

on:
  schedule:
    # 06:30 JST daily.
    - cron: "30 21 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/generate_infra_monitoring_dashboard.py"
      - "tests/test_infra_monitoring_dashboard.py"
      - ".github/workflows/infra-telemetry-dashboard.yml"
      - "docs/INFRA_TELEMETRY_DASHBOARD_RUNBOOK.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Generate input reports
        run: |
          python scripts/check_uptime_targets.py
          python scripts/diagnose_supabase_performance.py --dry-run
          python scripts/rotate_runtime_logs.py --dry-run

      - name: Build infra telemetry dashboard
        env:
          SUPABASE_METRICS_URL: ${{ secrets.SUPABASE_METRICS_URL }}
          SUPABASE_METRICS_BEARER_TOKEN: ${{ secrets.SUPABASE_METRICS_BEARER_TOKEN }}
        run: python scripts/generate_infra_monitoring_dashboard.py

      - name: Run dashboard tests
        run: python -m pytest tests/test_infra_monitoring_dashboard.py
