name: Quota Error Alert Review

on:
  schedule:
    # 06:45 JST every Monday, after uptime/infra/cost diagnostic inputs.
    - cron: "45 21 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/quota-error-alert-review.yml"
      - "data/cost_allocation_budgets.tsv"
      - "scripts/generate_quota_error_alert_review.py"
      - "scripts/generate_infra_monitoring_dashboard.py"
      - "scripts/generate_weekly_cost_dashboard.py"
      - "scripts/generate_supabase_query_performance_review.py"
      - "tests/test_quota_error_alert_review.py"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest httpx

      - name: Build uptime input
        run: python scripts/check_uptime_targets.py

      - name: Build Supabase performance inputs
        run: |
          python scripts/diagnose_supabase_performance.py --dry-run
          python scripts/generate_supabase_query_performance_review.py --fail-on-critical

      - name: Build infrastructure and cost inputs
        run: |
          python scripts/rotate_runtime_logs.py --dry-run
          python scripts/generate_infra_monitoring_dashboard.py
          python scripts/generate_weekly_cost_dashboard.py

      - name: Build quota/error alert review
        run: python scripts/generate_quota_error_alert_review.py --fail-on-critical

      - name: Run quota/error alert tests
        run: python -m pytest tests/test_quota_error_alert_review.py
