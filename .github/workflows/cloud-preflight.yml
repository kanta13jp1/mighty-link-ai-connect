name: Cloud Full Preflight

on:
  push:
    branches:
      - "codex/preflight/**"
      - "codex/preflight-*"
      - "codex/cloud-first-preflight-t997"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: cloud-full-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-preflight:
    name: Full preflight for exact candidate SHA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install httpx pytest playwright

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run cloud full preflight
        run: python scripts/run_lane_preflight.py --full

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloud-preflight-${{ github.sha }}
          path: |
            exports/lane_preflight_report.json
            exports/lane_preflight_report.md
            exports/lane_preflight_pytest.xml
            exports/lane_preflight_pytest.log
          if-no-files-found: warn
          retention-days: 7
