name: Cloud Full Preflight

on:
  push:
    branches:
      - "codex/preflight/**"
      - "codex/preflight-*"
      - "codex/cloud-first-preflight-t997"
  # PR validation is invoked once by CI/CD Pipeline via workflow_call.
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: cloud-full-preflight-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-preflight:
    name: Full preflight for exact candidate SHA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install httpx pytest playwright

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Verify source compilation and public demo contract
        run: |
          python -m py_compile src/app.py
          python scripts/verify_public_demo.py
          python -c "from pathlib import Path; required = ['data/test_results.tsv', 'data/security_log.tsv']; missing = [p for p in required if not Path(p).is_file()]; assert not missing, f'Missing verification logs: {missing}'"

      - name: Run cloud full preflight
        run: python scripts/run_lane_preflight.py --full

      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-preflight-${{ github.sha }}
          path: |
            exports/lane_preflight_report.json
            exports/lane_preflight_report.md
            exports/lane_preflight_pytest.xml
            exports/lane_preflight_pytest.log
          if-no-files-found: warn
          retention-days: 7
