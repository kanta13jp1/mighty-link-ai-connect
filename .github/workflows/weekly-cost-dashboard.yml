name: Weekly Cost Dashboard

on:
  schedule:
    # 08:15 JST every Monday.
    - cron: "15 23 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/generate_weekly_cost_dashboard.py"
      - "tests/test_weekly_cost_dashboard.py"
      - "data/cost_allocation_budgets.tsv"
      - "docs/WEEKLY_COST_DASHBOARD_RUNBOOK.md"
      - ".github/workflows/weekly-cost-dashboard.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  weekly-cost-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Generate weekly cost dashboard
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COST_ALERT_EMAIL_TO: ${{ vars.COST_ALERT_EMAIL_TO }}
          COST_ALERT_EMAIL_FROM: ${{ vars.COST_ALERT_EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python scripts/generate_weekly_cost_dashboard.py

      - name: Run weekly cost dashboard tests
        run: python -m pytest tests/test_weekly_cost_dashboard.py
