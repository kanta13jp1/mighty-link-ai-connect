name: Supabase Performance Diagnostic

on:
  schedule:
    # 05:45 JST every Monday.
    - cron: "45 20 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build performance diagnostic bundle
        run: python scripts/diagnose_supabase_performance.py --dry-run
