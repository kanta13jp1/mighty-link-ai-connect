name: Supabase Production UAT Write Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-uat-write
  cancel-in-progress: false

jobs:
  verify-production-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client dependency
        run: python -m pip install "psycopg2-binary>=2.9,<3"

      - name: Run rollback-only production write verification
        run: python scripts/verify_supabase_uat_writes.py --execute

      - name: Publish verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: supabase-uat-writes-${{ github.run_id }}
          path: |
            exports/supabase_uat_writes_live.json
            exports/supabase_uat_writes_live.md
          if-no-files-found: error
          retention-days: 14
