name: Secret Rotation Review

on:
  schedule:
    # 06:15 JST every Monday.
    - cron: "15 21 * * 0"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check secret rotation schedule metadata
        run: python scripts/check_secret_rotation_schedule.py --fail-on-overdue
