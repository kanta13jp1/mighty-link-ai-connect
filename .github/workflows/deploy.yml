name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install httpx pytest fastapi playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Syntax and Compile Check
        run: |
          python -m py_compile src/app.py

      - name: Execute Automated Test Suite & Log Audits
        run: |
          python scripts/run_phase4_tests.py

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        env:
          FIREBASE_DEPLOY_TARGETS: ${{ vars.FIREBASE_DEPLOY_TARGETS || 'hosting' }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'mighty-link-ai-connect-d7fa2' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_MIGHTY_LINK_AI_CONNECT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail

          AUTH_FLAGS=()

          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "[*] Using Google Application Default Credentials from Workload Identity Federation."
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "[*] Using Firebase service account credentials via Application Default Credentials."
            FIREBASE_CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_CREDENTIALS_FILE"
            chmod 600 "$FIREBASE_CREDENTIALS_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_CREDENTIALS_FILE"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "[!] WARNING: FIREBASE_TOKEN is legacy. Prefer FIREBASE_SERVICE_ACCOUNT_JSON with Application Default Credentials."
            AUTH_FLAGS=(--token "$FIREBASE_TOKEN")
          else
            echo "[!] WARNING: Firebase credentials are not set. Skipping real deployment."
            echo "[*] Firebase configuration file dry-run validation passed."
            exit 0
          fi

          echo "[*] Initiating deploy to Firebase project: $FIREBASE_PROJECT_ID"
          echo "[*] Deploy targets: $FIREBASE_DEPLOY_TARGETS"
          if ! firebase deploy --project "$FIREBASE_PROJECT_ID" --only "$FIREBASE_DEPLOY_TARGETS" --non-interactive "${AUTH_FLAGS[@]}"; then
            echo "::error title=Firebase deploy failed::Could not deploy '$FIREBASE_DEPLOY_TARGETS' to Firebase project '$FIREBASE_PROJECT_ID'. Confirm the project exists, credentials have deploy permissions, and set FIREBASE_DEPLOY_TARGETS=hosting,functions only after the Firebase project is on the Blaze plan."
            exit 2
          fi
