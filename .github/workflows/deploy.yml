name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install httpx pytest fastapi playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Syntax and Compile Check
        run: |
          python -m py_compile src/app.py

      - name: Execute Automated Test Suite & Log Audits
        run: |
          python scripts/run_phase4_tests.py

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    concurrency:
      group: firebase-deploy-mighty-link-ai-connect-13d22
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Node.js (for Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Set up Python (for Firebase Functions SDK)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python Virtual Environment and Install Dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python Environment and Source Imports
        run: |
          source venv/bin/activate
          echo "[*] Python executable: $(which python)"
          python --version
          echo "[*] Pip version: $(pip --version)"
          echo "[*] Testing main.py import..."
          python -c "import main; print('Import check passed!')"

      - name: Deploy to Firebase
        env:
          FIREBASE_DEPLOY_TARGETS: ${{ vars.FIREBASE_DEPLOY_TARGETS || 'hosting' }}
          FIREBASE_FUNCTIONS_DEPLOY_ENABLED: ${{ vars.FIREBASE_FUNCTIONS_DEPLOY_ENABLED || 'false' }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'mighty-link-ai-connect-13d22' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_MIGHTY_LINK_AI_CONNECT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail

          # Activate virtual environment so Firebase CLI detects it
          source venv/bin/activate

          AUTH_FLAGS=()

          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "[*] Using Google Application Default Credentials from Workload Identity Federation."
            unset FIREBASE_TOKEN
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "[*] Using Firebase service account credentials via Application Default Credentials."
            FIREBASE_CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_CREDENTIALS_FILE"
            chmod 600 "$FIREBASE_CREDENTIALS_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_CREDENTIALS_FILE"
            unset FIREBASE_TOKEN
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "[!] WARNING: FIREBASE_TOKEN is legacy. Prefer FIREBASE_SERVICE_ACCOUNT_JSON with Application Default Credentials."
            AUTH_FLAGS=(--token "$FIREBASE_TOKEN")
          else
            echo "[!] WARNING: Firebase credentials are not set. Skipping real deployment."
            echo "[*] Firebase configuration file dry-run validation passed."
            exit 0
          fi

          FUNCTIONS_DEPLOY_ENABLED="$(printf '%s' "${FIREBASE_FUNCTIONS_DEPLOY_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$FUNCTIONS_DEPLOY_ENABLED" != "true" ]; then
            if [ "$FIREBASE_DEPLOY_TARGETS" != "hosting" ]; then
              echo "[*] FIREBASE_FUNCTIONS_DEPLOY_ENABLED is not true; overriding Firebase deploy targets to hosting."
            fi
            FIREBASE_DEPLOY_TARGETS="hosting"
          fi

          echo "[*] Initiating deploy to Firebase project: $FIREBASE_PROJECT_ID"
          echo "[*] Deploy targets: $FIREBASE_DEPLOY_TARGETS"
          if ! firebase deploy --project "$FIREBASE_PROJECT_ID" --only "$FIREBASE_DEPLOY_TARGETS" --non-interactive --force "${AUTH_FLAGS[@]}"; then
            echo "::error title=Firebase deploy failed::Could not deploy '$FIREBASE_DEPLOY_TARGETS' to Firebase project '$FIREBASE_PROJECT_ID'. Confirm the project exists and credentials have deploy permissions. Set FIREBASE_FUNCTIONS_DEPLOY_ENABLED=true and FIREBASE_DEPLOY_TARGETS=hosting,functions only after the Firebase project and CI service account can update Cloud Functions IAM."
            exit 2
          fi

