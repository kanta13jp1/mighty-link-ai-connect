name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install httpx pytest fastapi playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Syntax and Compile Check
        run: |
          python -m py_compile src/app.py

      - name: Execute Automated Test Suite & Log Audits
        run: |
          python scripts/run_phase4_tests.py

  deploy:
    name: Deploy to Firebase
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: firebase-deploy-mighty-link-ai-connect-13d22
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # github.event.before はpush範囲の先頭より前を指すため、shallow
          # cloneだと解決できずHEAD^へフォールバックし、複数コミットpushで
          # 先頭以外のアプリ変更がデプロイ判定から漏れる (R140)
          fetch-depth: 0

      - name: Detect Firebase deploy changes
        id: firebase_changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "[*] Manual dispatch; forcing Firebase deploy."
            echo "firebase_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -z "$BEFORE" ]; then
            echo "[!] Could not resolve previous commit; enabling Firebase deploy."
            echo "firebase_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || true)"
          echo "$CHANGED_FILES"

          if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^(index\.html|firebase\.json|src/|main\.py|requirements\.txt|package(-lock)?\.json|functions/)'; then
            echo "firebase_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "firebase_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud via WIF
        if: ${{ steps.firebase_changes.outputs.firebase_deploy == 'true' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Node.js (for Firebase CLI)
        if: ${{ steps.firebase_changes.outputs.firebase_deploy == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Firebase CLI
        if: ${{ steps.firebase_changes.outputs.firebase_deploy == 'true' }}
        run: npm install -g firebase-tools

      - name: Set up Python (for Firebase Functions SDK)
        if: ${{ steps.firebase_changes.outputs.firebase_deploy == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Python Virtual Environment and Install Dependencies
        if: ${{ steps.firebase_changes.outputs.firebase_deploy == 'true' }}
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python Environment and Source Imports
        if: ${{ steps.firebase_changes.outputs.firebase_deploy == 'true' }}
        run: |
          source venv/bin/activate
          echo "[*] Python executable: $(which python)"
          python --version
          echo "[*] Pip version: $(pip --version)"
          echo "[*] Testing main.py import..."
          python -c "import main; print('Import check passed!')"

      - name: Deploy to Firebase
        if: ${{ steps.firebase_changes.outputs.firebase_deploy == 'true' }}
        env:
          FIREBASE_DEPLOY_TARGETS: ${{ vars.FIREBASE_DEPLOY_TARGETS || 'hosting' }}
          FIREBASE_FUNCTIONS_DEPLOY_ENABLED: ${{ vars.FIREBASE_FUNCTIONS_DEPLOY_ENABLED || 'false' }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'mighty-link-ai-connect-13d22' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_MIGHTY_LINK_AI_CONNECT }}
          FIREBASE_FUNCTIONS_DOTENV: ${{ secrets.FIREBASE_FUNCTIONS_DOTENV }}
          SALES_EMAIL_IMAP_ENV: ${{ secrets.SALES_EMAIL_IMAP_ENV }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          # Activate virtual environment so Firebase CLI detects it
          source venv/bin/activate

          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "[*] Using Google Application Default Credentials from Workload Identity Federation."
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "[*] Using Firebase service account credentials via Application Default Credentials."
            FIREBASE_CREDENTIALS_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_CREDENTIALS_FILE"
            chmod 600 "$FIREBASE_CREDENTIALS_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_CREDENTIALS_FILE"
          else
            echo "::error title=Missing Firebase deploy credentials::Deploy-affecting files changed, but neither Workload Identity Federation nor service account JSON credentials are available."
            exit 2
          fi

          FUNCTIONS_DEPLOY_ENABLED="$(printf '%s' "${FIREBASE_FUNCTIONS_DEPLOY_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          if [ "$FUNCTIONS_DEPLOY_ENABLED" != "true" ]; then
            if [ "$FIREBASE_DEPLOY_TARGETS" != "hosting" ]; then
              echo "[*] FIREBASE_FUNCTIONS_DEPLOY_ENABLED is not true; overriding Firebase deploy targets to hosting."
            fi
            FIREBASE_DEPLOY_TARGETS="hosting"
          fi

          # .env is gitignored, but Firebase Functions reads runtime env vars from it
          # at deploy time. Without this, a CI functions deploy would silently wipe
          # USE_SUPABASE / SUPABASE_DB_URL from the production service (R44/T795).
          if [ "$FUNCTIONS_DEPLOY_ENABLED" = "true" ]; then
            if [ -n "${FIREBASE_FUNCTIONS_DOTENV:-}" ]; then
              printf '%s\n' "$FIREBASE_FUNCTIONS_DOTENV" > .env
              chmod 600 .env
              echo "[*] Materialized functions runtime .env from FIREBASE_FUNCTIONS_DOTENV secret."
            else
              echo "::error title=Missing FIREBASE_FUNCTIONS_DOTENV::Functions deploy is enabled but the FIREBASE_FUNCTIONS_DOTENV secret is empty. Deploying functions without it would wipe production runtime env vars (USE_SUPABASE / SUPABASE_DB_URL)."
              exit 3
            fi

            if [ -n "${SALES_EMAIL_IMAP_ENV:-}" ]; then
              grep -Ev '^(IMAP_HOST|IMAP_PORT|IMAP_USE_SSL|IMAP_USERNAME|IMAP_PASSWORD|IMAP_FOLDERS|IMAP_MAX_MESSAGES|SALES_EMAIL_SYNC_ENABLED|SALES_EMAIL_SYNC_MAX_MESSAGES|SALES_EMAIL_SYNC_SCHEDULE)=' .env > .env.base
              mv .env.base .env
              printf '\n%s\n' "$SALES_EMAIL_IMAP_ENV" >> .env
              chmod 600 .env
              echo "[*] Overlaid the dedicated read-only IMAP runtime settings."
            else
              echo "::error title=Missing SALES_EMAIL_IMAP_ENV::Functions deploy requires the dedicated read-only IMAP settings so stale mailbox credentials cannot be deployed silently."
              exit 4
            fi

            if [ -n "${SUPABASE_DB_URL:-}" ]; then
              grep -Ev '^(USE_SUPABASE|SUPABASE_DB_URL)=' .env > .env.base
              mv .env.base .env
              ESCAPED_SUPABASE_DB_URL="${SUPABASE_DB_URL//\\/\\\\}"
              ESCAPED_SUPABASE_DB_URL="${ESCAPED_SUPABASE_DB_URL//\"/\\\"}"
              printf '\nUSE_SUPABASE=true\nSUPABASE_DB_URL="%s"\n' "$ESCAPED_SUPABASE_DB_URL" >> .env
              chmod 600 .env
              echo "[*] Overlaid the dedicated Supabase PostgreSQL runtime setting."
            else
              echo "::error title=Missing SUPABASE_DB_URL::Functions deploy requires the dedicated production PostgreSQL connection secret."
              exit 5
            fi
          fi

          echo "[*] Initiating deploy to Firebase project: $FIREBASE_PROJECT_ID"
          echo "[*] Deploy targets: $FIREBASE_DEPLOY_TARGETS"
          if ! firebase deploy --project "$FIREBASE_PROJECT_ID" --only "$FIREBASE_DEPLOY_TARGETS" --non-interactive --force; then
            echo "::error title=Firebase deploy failed::Could not deploy '$FIREBASE_DEPLOY_TARGETS' to Firebase project '$FIREBASE_PROJECT_ID'. Confirm the project exists and credentials have deploy permissions. Set FIREBASE_FUNCTIONS_DEPLOY_ENABLED=true and FIREBASE_DEPLOY_TARGETS=hosting,functions only after the Firebase project and CI service account can update Cloud Functions IAM."
            exit 2
          fi

      - name: Skip Firebase deploy
        if: ${{ steps.firebase_changes.outputs.firebase_deploy != 'true' }}
        run: echo "[*] Firebase deploy skipped because no deploy-affecting files changed."
