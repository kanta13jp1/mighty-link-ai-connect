<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <defs>
    <linearGradient id="grad_radar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>
  </defs>

  <rect width="800" height="650" fill="url(#grad_radar)"/>

  <!-- Card Frame -->
  <rect x="40" y="40" width="720" height="570" rx="16" fill="#0d1117" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="70" y="80" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">📊 エンジニア自己診断 &amp; 6次元スコアプロファイル</text>
  <text x="70" y="105" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12">コンディション指数・チーム適合性・カルチャーフィットの多次元可視化</text>

  <!-- Gauge -->
  <circle cx="160" cy="220" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
  <circle cx="160" cy="220" r="60" fill="none" stroke="#4fd1a5" stroke-width="10" stroke-dasharray="376" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90 160 220)"/>
  <text x="160" y="222" fill="#4fd1a5" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">84.5</text>
  <text x="160" y="242" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11" text-anchor="middle">/ 100点</text>

  <!-- Status Badge with Symbol -->
  <rect x="250" y="170" width="90" height="26" rx="6" fill="rgba(79,209,165,0.15)" stroke="#4fd1a5" stroke-width="1"/>
  <text x="295" y="188" fill="#4fd1a5" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">✓ 正常 (Good)</text>

  <text x="250" y="225" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">回答数: 12問 / 平均: 4.2</text>
  <text x="250" y="250" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="12">技術スタックおよびチーム親和性が極めて高い状態です。</text>

  <!-- 6 Dimension Bars -->
  <text x="70" y="320" fill="#8bdcff" font-family="sans-serif" font-size="14" font-weight="bold">6次元プロファイル</text>

  <text x="70" y="360" fill="#ffffff" font-family="sans-serif" font-size="12">技術力 (Tech Fit)</text>
  <rect x="220" y="350" width="380" height="12" rx="6" fill="#21262d"/>
  <rect x="220" y="350" width="340" height="12" rx="6" fill="#4fd1a5"/>
  <text x="620" y="361" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">4.8 / 5.0</text>

  <text x="70" y="400" fill="#ffffff" font-family="sans-serif" font-size="12">自走力 (Autonomy)</text>
  <rect x="220" y="390" width="380" height="12" rx="6" fill="#21262d"/>
  <rect x="220" y="390" width="320" height="12" rx="6" fill="#4fd1a5"/>
  <text x="620" y="401" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">4.5 / 5.0</text>

  <text x="70" y="440" fill="#ffffff" font-family="sans-serif" font-size="12">カルチャー (Culture)</text>
  <rect x="220" y="430" width="380" height="12" rx="6" fill="#21262d"/>
  <rect x="220" y="430" width="300" height="12" rx="6" fill="#e6c15a"/>
  <text x="620" y="441" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">4.0 / 5.0</text>
</svg>
