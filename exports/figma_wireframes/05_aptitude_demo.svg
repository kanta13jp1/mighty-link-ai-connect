            <text x="44" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="13" font-weight="500">営業メールマッチング</text>
            
        </g>
        <g transform="translate(16, 202)">
            <rect width="218" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1"/>
