            <text x="44" y="25" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">営業メールマッチング</text>
            <circle cx="200" cy="20" r="3.5" fill="#baff66"/>
        </g>
        <g transform="translate(16, 202)">
            <rect width="218" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1"/>
            <text x="16" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">🛡️</text>
            <text x="44" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="13" font-weight="500">管理者ダッシュボード</text>
            
        </g>
        <g transform="translate(16, 248)">
            <rect width="218" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1"/>
            <text x="16" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">⏱️</text>
            <text x="44" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="13" font-weight="500">勤怠管理</text>
            
        </g>
        <g transform="translate(16, 294)">
            <rect width="218" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1"/>
            <text x="16" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">📊</text>
            <text x="44" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="13" font-weight="500">適性アンケート</text>
            
        </g>
        <g transform="translate(16, 340)">
            <rect width="218" height="40" rx="8" fill="transparent" stroke="transparent" stroke-width="1"/>
            <text x="16" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">📈</text>
            <text x="44" y="25" fill="#8b949e" font-family="Arial, sans-serif" font-size="13" font-weight="500">自己診断デモ</text>
            
