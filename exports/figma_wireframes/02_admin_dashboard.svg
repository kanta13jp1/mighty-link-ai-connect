                <rect width="400" height="610" rx="14" fill="#101726" stroke="#1e293b"/>
                <text x="24" y="35" fill="#8bdcff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">🛡️ セキュリティ監査ログ (リアルタイム)</text>
