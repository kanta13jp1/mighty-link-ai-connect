        const rawMarkdown = "# MightyLink AI Connect \u30b5\u30fc\u30d3\u30b9\u6599\u91d1\u30d7\u30e9\u30f3\u4ed5\u69d8\u66f8\n\n\u4f5c\u6210\u65e5: 2026-07-23  \n\u4f5c\u6210\u8cac\u4efb\u8005: \u30d7\u30ed\u30c0\u30af\u30c8\u30de\u30cd\u30fc\u30b8\u30e3\u30fc (PdM) \u5c0f\u6797 \u96c5\u6c34  \n\u30b9\u30c6\u30fc\u30bf\u30b9: **\u6b63\u5f0f\u7248\u4ed5\u69d8\u66f8\uff08\u6709\u511f\u5316\u5224\u5b9a T862 / \u8ab2\u91d1\u5b9f\u88c5 T791 \u57fa\u6e96\uff09**  \n\u95a2\u9023WBS: T804 / T860 / T861 / T862 / T791 / T807 / T813 / T900  \n\u95a2\u9023\u6cd5\u52d9\u30fb\u6280\u8853\u6587\u66f8: [BILLING_AND_REFUND_POLICY.md](BILLING_AND_REFUND_POLICY.md) / [TOKUSHOHO_NOTATION.md](TOKUSHOHO_NOTATION.md) / [STRIPE_BILLING_INTEGRATION_DESIGN.md](STRIPE_BILLING_INTEGRATION_DESIGN.md) / [COST_REPORT_2026-06.md](COST_REPORT_2026-06.md)\n\n---\n\n## 1. \u6982\u8981\u3068\u76ee\u7684\n\n\u672c\u4ed5\u69d8\u66f8\u306f\u3001\u300cMightyLink AI Connect\u300d\u306e\u30b5\u30fc\u30d3\u30b9\u6599\u91d1\u30d7\u30e9\u30f3\u4f53\u7cfb\u3001\u5229\u7528\u5236\u9650\u67a0\u3001\u5f93\u91cf\u8ab2\u91d1\u30eb\u30fc\u30eb\u3001\u30e1\u30fc\u30bf\u30fc\u8a08\u6e2c\u4ed5\u69d8\u3001\u304a\u3088\u3073\u4e8b\u696d\u30fb\u539f\u4fa1\u6839\u62e0\u3092\u660e\u78ba\u306b\u898f\u5b9a\u3059\u308b\u30d7\u30ed\u30c0\u30af\u30c8\u6b63\u672c\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u3067\u3059\u3002\n\n- **\u5bfe\u8c61\u5e02\u5834**: \u4e2d\u5c0fSES\u4f01\u696d\u3001\u6d3e\u9063\u30fb\u4eba\u6750\u30b5\u30fc\u30d3\u30b9\u4e8b\u696d\u8005\u3001\u30a8\u30f3\u30b8\u30cb\u30a2\u7d44\u7e54\u3002\n- **\u57fa\u672c\u4fa1\u683c\u6226\u7565**: \u30b9\u30e2\u30fc\u30eb\u30b9\u30bf\u30fc\u30c8\u3057\u3084\u3059\u3044\u6708\u984d1\u4e07\u5186\u672a\u6e80\uff08Standard: \u6708\u984d\u00a59,800\uff09\u3092\u4e3b\u529b\u30d7\u30ed\u30c0\u30af\u30c8\u3068\u3057\u3001\u5229\u7528\u898f\u6a21\u306b\u5fdc\u3058\u305f\u6bb5\u968e\u7684SaaS\u6599\u91d1\u4f53\u7cfb\uff08Free / Standard / Pro / Enterprise\uff09\u3092\u63a1\u7528\u3002\n- **\u5b9f\u8ab2\u91d1\u7ba1\u7406**: Stripe Billing Meters API \u304a\u3088\u3073 Stripe Customer Portal \u306b\u3088\u308b\u5b8c\u5168\u81ea\u52d5\u5316\u3002\n\n---\n\n## 2. \u6599\u91d1\u30d7\u30e9\u30f3\u4f53\u7cfb\u4e00\u89a7\n\n\u203b\u6708\u984d\u8868\u793a\u306f\u7a0e\u5225\u4fa1\u683c\u3002\u7533\u8fbc\u753b\u9762\u30fb\u8acb\u6c42\u66f8\u30fb\u7279\u5546\u6cd5\u8868\u8a18\u3067\u306f\u6d88\u8cbb\u7a0e10%\u3092\u542b\u3080\u7a0e\u8fbc\u8868\u8a18\u3092\u660e\u793a\u3057\u307e\u3059\u3002\n\n| \u9805\u76ee | Free \u30d7\u30e9\u30f3 | Standard \u30d7\u30e9\u30f3 | Pro \u30d7\u30e9\u30f3 | Enterprise \u30d7\u30e9\u30f3 |\n| :--- | :--- | :--- | :--- | :--- |\n| **\u6708\u984d\u6599\u91d1\uff08\u7a0e\u5225\uff09** | **\u00a50** | **\u00a59,800** | **\u00a529,800** | **\u500b\u5225\u898b\u7a4d** |\n| **\u6708\u984d\u6599\u91d1\uff08\u7a0e\u8fbc\uff09** | \u00a50 | \u00a510,780 | \u00a532,780 | \u500b\u5225\u898b\u7a4d |\n| **\u5e74\u984d\u6599\u91d1\uff08\u4e00\u62ec\u30fb10%\u5f15\uff09** | \u2014 | \u00a5105,840/\u5e74\uff08\u7a0e\u8fbc \u00a5116,424\uff09 | \u00a5321,840/\u5e74\uff08\u7a0e\u8fbc \u00a5354,024\uff09 | \u500b\u5225\u898b\u7a4d |\n| **\u30e6\u30fc\u30b6\u30fc\u6570\u4e0a\u9650** | \u6700\u5927 3 \u540d | \u6700\u5927 30 \u540d | \u6700\u5927 100 \u540d | 101 \u540d\u4ee5\u4e0a |\n| **\u9069\u6027\u30fb\u72b6\u6cc1\u8a3a\u65ad (`analysis_run`)** | \u6708 10 \u56de | \u6708 200 \u56de | \u6708 1,000 \u56de | \u8981\u4ef6\u306b\u5fdc\u3058\u3066\u500b\u5225\u8a2d\u5b9a |\n| **\u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0 (`sales_email_match_run`)** | \u6708 10 \u56de | \u6708 200 \u56de | \u6708 1,000 \u56de | \u8981\u4ef6\u306b\u5fdc\u3058\u3066\u500b\u5225\u8a2d\u5b9a |\n| **\u8fbc\u307f\u56de\u6570\u8d85\u904e\u6642\u306e\u5f93\u91cf\u5358\u4fa1** | \u8d85\u904e\u4e0d\u53ef\uff08\u5229\u7528\u30d6\u30ed\u30c3\u30af\uff09 | **\u00a550 / \u56de** | **\u00a530 / \u56de** | \u500b\u5225\u8a2d\u5b9a |\n| **\u7ba1\u7406\u8005\u30c7\u30fc\u30bf\u30a8\u30af\u30b9\u30dd\u30fc\u30c8** | \u6708 3 \u56de\u307e\u3067 | \u7121\u5236\u9650 | \u7121\u5236\u9650 | \u7121\u5236\u9650 |\n| **\u30b5\u30dd\u30fc\u30c8\u5bfe\u5fdc** | \u30b3\u30df\u30e5\u30cb\u30c6\u30a3/FAQ | \u30e1\u30fc\u30eb\u30b5\u30dd\u30fc\u30c8 | \u512a\u5148\u30e1\u30fc\u30eb/SLA\u9069\u5fdc | \u5c02\u4efb\u30ab\u30b9\u30bf\u30de\u30fc\u30b5\u30af\u30bb\u30b9 |\n| **\u57fa\u672c\u6a5f\u80fd\uff08\u52e4\u6020\u30fb\u540c\u610f\u7ba1\u7406\uff09** | \u5168\u6a5f\u80fd\u5229\u7528\u53ef\u80fd | \u5168\u6a5f\u80fd\u5229\u7528\u53ef\u80fd | \u5168\u6a5f\u80fd\u5229\u7528\u53ef\u80fd | \u5168\u6a5f\u80fd\u5229\u7528\u53ef\u80fd |\n\n---\n\n## 3. \u8ab2\u91d1\u30e1\u30fc\u30bf\u30fc\uff08Billing Meters\uff09\u4ed5\u69d8\n\n\u672c\u30b5\u30fc\u30d3\u30b9\u3067\u306f\u3001AI\u30ea\u30bd\u30fc\u30b9\u3092\u6d88\u8cbb\u3059\u308b2\u5927\u6a5f\u80fd\u3092\u8ab2\u91d1\u5bfe\u8c61\u30e1\u30fc\u30bf\u30fc\u3068\u3057\u3066\u5b9a\u7fa9\u30fb\u8a08\u6e2c\u3057\u307e\u3059\u3002\n\n| \u30e1\u30fc\u30bf\u30fc\u8b58\u5225\u5b50 (`meter_event_name`) | \u5bfe\u8c61\u6a5f\u80fd | \u5358\u4f4d | \u8ab2\u91d1\u30eb\u30fc\u30eb |\n| :--- | :--- | :--- | :--- |\n| `analysis_run` | AI\u9069\u6027\u30fb\u72b6\u6cc1\u8a3a\u65ad\u5b9f\u884c | \u8a3a\u65ad1\u56de | \u30d7\u30e9\u30f3\u5185\u8fbc\u307f\u56de\u6570\u3092\u8d85\u904e\u3057\u305f\u5206\u306b\u5bfe\u3057\u3001\u6708\u672b\u306b\u78ba\u5b9a\u5f93\u91cf\u8ab2\u91d1 |\n| `sales_email_match_run` | \u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0\u30fb\u62bd\u51fa\u5b9f\u884c | \u30de\u30c3\u30c1\u30f3\u30b01\u56de | \u30d7\u30e9\u30f3\u5185\u8fbc\u307f\u56de\u6570\u3092\u8d85\u904e\u3057\u305f\u5206\u306b\u5bfe\u3057\u3001\u6708\u672b\u306b\u78ba\u5b9a\u5f93\u91cf\u8ab2\u91d1 |\n| `admin_export_run` | \u7ba1\u7406\u8005\u30c7\u30fc\u30bf\u30a8\u30af\u30b9\u30dd\u30fc\u30c8 | \u5b9f\u884c1\u56de | **\u975e\u8ab2\u91d1**\uff08Free\u30d7\u30e9\u30f3\u306e\u56de\u6570\u5236\u9650\u30c1\u30a7\u30c3\u30af\u306e\u307f\u306b\u4f7f\u7528\uff09 |\n\n### \u51aa\u7b49\u6027\u30fb\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\n- \u30e1\u30fc\u30bf\u30fc\u30a4\u30d9\u30f3\u30c8\u306e\u9001\u4fe1\u6642\u306b\u306f\u3001Stripe\u8981\u6c42\u306b\u5f93\u3044 `idempotency_key`\uff08UUIDv4\uff09\u3092\u4ed8\u4e0e\u3057\u3001\u91cd\u8907\u30ab\u30a6\u30f3\u30c8\u3092\u9632\u6b62\u3057\u307e\u3059\u3002\n- \u30e1\u30fc\u30bf\u30fc\u306e\u30a4\u30d9\u30f3\u30c8\u30da\u30a4\u30ed\u30fc\u30c9\u306b\u306f\u30e6\u30fc\u30b6\u30fcID\u307e\u305f\u306f\u7d44\u7e54ID\u306e\u533f\u540d\u30cf\u30c3\u30b7\u30e5\u5024\u306e\u307f\u3092\u542b\u3081\u3001\u500b\u4eba\u8b58\u5225\u60c5\u5831\uff08\u6c0f\u540d\u30fb\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u30fb\u6587\u7ae0\u672c\u6587\u7b49\uff09\u306f\u4e00\u5207\u542b\u3081\u307e\u305b\u3093\u3002\n\n---\n\n## 4. \u5951\u7d04\u30fb\u6c7a\u6e08\u30fb\u8acb\u6c42\u6761\u4ef6\n\n1. **\u6c7a\u6e08\u624b\u6bb5**:\n   - \u30af\u30ec\u30b8\u30c3\u30c8\u30ab\u30fc\u30c9\u6c7a\u6e08\uff08Stripe Checkout / Customer Portal\uff09\u3002\n   - Enterprise \u30d7\u30e9\u30f3\u306e\u307f\u9280\u884c\u632f\u8fbc\uff08\u8acb\u6c42\u66f8\u6255\u3044\uff09\u306b\u5bfe\u5fdc\u3002\n2. **\u8ab2\u91d1\u30b5\u30a4\u30af\u30eb**:\n   - \u30b5\u30d6\u30b9\u30af\u30ea\u30d7\u30b7\u30e7\u30f3\u7533\u8fbc\u65e5\u306b\u521d\u56de\u8ab2\u91d1\u304c\u767a\u751f\u3057\u3001\u4ee5\u964d\u6bce\u6708\uff08\u307e\u305f\u306f\u6bce\u5e74\uff09\u306e\u540c\u65e5\u306b\u81ea\u52d5\u66f4\u65b0\u3002\n3. **\u30d7\u30e9\u30f3\u5909\u66f4\u30fb\u89e3\u7d04\u30eb\u30fc\u30eb**:\n   - **\u30a2\u30c3\u30d7\u30b0\u30ec\u30fc\u30c9**: \u5373\u6642\u53cd\u6620\u3002\u65e7\u30d7\u30e9\u30f3\u306e\u672a\u5229\u7528\u65e5\u6570\u306f\u65e5\u5272\u308a\u8a08\u7b97\uff08\u30d7\u30ed\u30ec\u30fc\u30b7\u30e7\u30f3\uff09\u3055\u308c\u3001\u5dee\u984d\u3092\u5373\u6642\u8acb\u6c42\u3002\n   - **\u30c0\u30a6\u30f3\u30b0\u30ec\u30fc\u30c9\u30fb\u89e3\u7d04**: Stripe Customer Portal \u3088\u308a\u5373\u6642\u624b\u7d9a\u304d\u53ef\u80fd\u3002\u6b21\u56de\u66f4\u65b0\u65e5\u3092\u3082\u3063\u3066\u9069\u7528\u3055\u308c\u3001\u6709\u52b9\u671f\u9593\u6e80\u4e86\u307e\u3067\u5229\u7528\u53ef\u80fd\uff08\u672a\u5229\u7528\u671f\u9593\u306e\u8fd4\u91d1\u306f\u539f\u5247\u884c\u3044\u307e\u305b\u3093\u3002\u8a73\u7d30\u306f [BILLING_AND_REFUND_POLICY.md](BILLING_AND_REFUND_POLICY.md) \u3092\u53c2\u7167\uff09\u3002\n4. **\u6d88\u8cbb\u7a0e\u30fb\u30a4\u30f3\u30dc\u30a4\u30b9\u5236\u5ea6\u5bfe\u5fdc**:\n   - \u65e5\u672c\u56fd\u5185\u306e\u6d88\u8cbb\u7a0e\u7387\uff0810%\uff09\u3092\u9069\u7528\u3002Stripe Tax \u306b\u3088\u308a\u81ea\u52d5\u7a0e\u7387\u8a08\u7b97\u3092\u5b9f\u65bd\u3002\n   - \u9069\u683c\u8acb\u6c42\u66f8\u767a\u884c\u4e8b\u696d\u8005\u767b\u9332\u756a\u53f7\uff08T\u756a\u53f7\uff09\u306f Stripe \u767a\u884c\u306e\u9818\u53ce\u66f8\u30fb\u8acb\u6c42\u66f8\u306b\u8a18\u8f09\u3002\n\n---\n\n## 5. \u539f\u4fa1\u69cb\u9020\u30fb\u640d\u76ca\u5206\u5c90\u30fb\u4fa1\u683c\u8a2d\u5b9a\u6839\u62e0\n\n1. **\u30a4\u30f3\u30d5\u30e9\u30fbAI\u539f\u4fa1\u69cb\u9020**:\n   - \u56fa\u5b9a\u30a4\u30f3\u30d5\u30e9\u8cbb: Firebase / Supabase \u30b5\u30fc\u30d0\u30fc\u30ec\u30b9\u69cb\u6210\u306b\u3088\u308a\u3001\u30d9\u30fc\u30b9\u8cbb\u7528\u6708\u984d \u00a50\uff08\u7121\u6599\u67a0\u5185\u904b\u7528\u53ef\u80fd\uff09\u3002\n   - AI\u5909\u52d5\u539f\u4fa1: \u8a3a\u65ad1\u56de\u3042\u305f\u308a Gemini \u7d4c\u7531\u3067\u7d04 0.2\u301c0.5 \u5186\u7a0b\u5ea6\u3002\n2. **\u640d\u76ca\u5206\u5c90\u70b9 (Break-Even Point)**:\n   - \u6708\u9593\u56fa\u5b9a\u30b3\u30b9\u30c8\uff08\u30c9\u30e1\u30a4\u30f3\u30fb\u30c4\u30fc\u30eb\u5229\u7528\u6599\u7b49\u542b\u3080\uff09\u306f\u7d04 \u00a55,000\u301c\u00a510,000\u3002\n   - Standard \u30d7\u30e9\u30f3\uff08\u6708\u984d \u00a59,800\uff09\u3092 **1 \u5951\u7d04**\u7372\u5f97\u3059\u308b\u3053\u3068\u3067\u5358\u6708\u9ed2\u5b57\u5316\u304c\u9054\u6210\u3055\u308c\u308b\u6975\u3081\u3066\u30b9\u30ea\u30e0\u306a\u9ad8\u7c97\u5229\u7387\u69cb\u9020\uff08\u7c97\u5229\u76ca\u7387 90% \u4ee5\u4e0a\uff09\u3002\n3. **\u4fa1\u683c\u59a5\u5f53\u6027**:\n   - \u7af6\u5408\u3059\u308b\u9069\u6027\u8a3a\u65ad\u30c4\u30fc\u30eb\u3084\u55b6\u696dAI\u5206\u6790\u30b5\u30fc\u30d3\u30b9\uff08\u6708\u984d\u6570\u4e07\u5186\u301c\u6570\u5341\u4e07\u5186\uff09\u3068\u6bd4\u8f03\u3057\u3066\u5727\u5012\u7684\u306a\u30b3\u30b9\u30c8\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9\u3092\u63d0\u4f9b\u3057\u3001\u4e2d\u5c0f\u4f01\u696d\u306e\u5c0e\u5165\u30cf\u30fc\u30c9\u30eb\u3092\u6700\u5c0f\u5316\u3002\n\n### 5.1. Pro/Enterprise \u5dee\u5225\u5316\u6a5f\u80fd\u30ed\u30fc\u30c9\u30de\u30c3\u30d7\n- **\u5916\u90e8\u9069\u6027\u8a3a\u65ad\u30c4\u30fc\u30eb\u300c\u30df\u30ad\u30ef\u30e1AI\u300d\u7b2c1\u5f3e\u9023\u643aPoC (\u6700\u512a\u5148\u958b\u767a)**:\n  - Pro\u30d7\u30e9\u30f3\uff08\u00a529,800/\u6708\uff09\u304a\u3088\u3073 Enterprise \u30d7\u30e9\u30f3\u5411\u3051\u306b\u3001\u5916\u90e8\u9069\u6027\u8a3a\u65ad\u30c7\u30fc\u30bf\uff08\u30df\u30ad\u30ef\u30e1AI\uff09\u3092\u30a4\u30f3\u30dd\u30fc\u30c8\u3057\u3001\u793e\u5185\u30a8\u30f3\u30b8\u30cb\u30a2\u306e\u76f8\u6027\u8a3a\u65ad\u304a\u3088\u3073\u9762\u8ac7\u30a2\u30c9\u30d0\u30a4\u30b9\u3068\u81ea\u52d5\u9023\u643a\u3059\u308b\u5dee\u5225\u5316\u6a5f\u80fd\u3092\u63d0\u4f9b\uff082026\u5e748\u6708\u4e2d\u65ecPoC\u5b8c\u6210\u30018/24\u6709\u511f\u5316\u5224\u5b9a\u6642\u306e\u4e3b\u8981\u30c7\u30e2\u3068\u3057\u3066\u5c0e\u5165\uff09\u3002\n\n---\n\n## 6. \u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u6539\u8a02\u5c65\u6b74\n\n- **2026-07-03**: \u4eee\u6c7a\u5b9a\u7248\u4f5c\u6210\uff08T860 / T804\uff09\n- **2026-07-23**: PdM (\u5c0f\u6797 \u96c5\u6c34) \u306b\u3088\u308a\u6b63\u5f0f\u306a\u30b5\u30fc\u30d3\u30b9\u6599\u91d1\u30d7\u30e9\u30f3\u4ed5\u69d8\u66f8\u3068\u3057\u3066\u5168\u9805\u76ee\u78ba\u5b9a\uff08T862 \u6709\u511f\u5316\u5224\u5b9a\u57fa\u6e96\uff09\n- **2026-07-24**: \u4f01\u753b\u6226\u7565\u62c5\u5f53\u306b\u3088\u
