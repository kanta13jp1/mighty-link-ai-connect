        const rawMarkdown = "# Mighty Skill-Bridge \u30b5\u30fc\u30d3\u30b9\u5229\u7528\u898f\u7d04\uff08\u78ba\u5b9a\u7248\u30fb\u793e\u5185GA\u9069\u7528\uff09\n\n> [!IMPORTANT]\n> **\u30b9\u30c6\u30fc\u30bf\u30b9: \u78ba\u5b9a\u7248\uff08\u793e\u5185GA\u9069\u7528\uff09**\n> \u672c\u6587\u66f8\u306f WBS T798 \u306b\u3066\u793e\u5185GA\u9069\u7528\u7248\u3068\u3057\u3066\u793e\u5185\u78ba\u5b9a\uff08\u78ba\u8a8d\u8005: \u4ee3\u8868\u53d6\u7de0\u5f79 \u5c0f\u6797 \u96c5\u6c34 / \u6cd5\u52d9\u62c5\u5f53 \u9ad8\u6a4b \u5065\u4e8c\u3001\u78ba\u5b9a\u65e5: 2026-07-24\uff09\u3057\u305f\u5229\u7528\u898f\u7d04\u3067\u3059\u3002\u793e\u5185\u5229\u7528\u30d5\u30a7\u30fc\u30ba\u306b\u304a\u3044\u3066\u9069\u7528\u3055\u308c\u307e\u3059\u3002\u6709\u511f\u516c\u958b\u304a\u3088\u3073\u8ab2\u91d1live\u6709\u52b9\u5316\uff08T862\uff09\u306e\u6bb5\u968e\u3067\u3001\u5916\u90e8\u5f01\u8b77\u58eb\u30ec\u30d3\u30e5\u30fc\uff08R36\uff09\u3092\u7d4c\u3066\u6709\u6599\u516c\u958b\u524d\u5fc5\u9808\u8ad6\u70b9\u3082\u542b\u3081\u305f\u6700\u7d42\u78ba\u5b9a\u3092\u884c\u3044\u307e\u3059\u3002\n> \u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011\u793e\u5185GA\u5fc5\u9808\u8ad6\u70b9\uff089\u4ef6\uff09\u306f\u78ba\u5b9a\u6e08\u307f\u3067\u3059\u3002\u305d\u306e\u4ed6\u306e\u30de\u30fc\u30ab\u30fc\u306e\u7b87\u6240\u306f\u6709\u511f\u5316\u6642\uff08T862\uff09\u306b\u78ba\u5b9a\u3055\u305b\u307e\u3059\u3002\n\n- \u8d77\u8349\u65e5: 2026-06-12\uff08Claude Code \u30ec\u30fc\u30f3\uff09 / \u793e\u5185GA\u78ba\u5b9a\u65e5: 2026-07-24\n- \u6839\u62e0\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8: `docs/requirements.md` / `docs/PILOT_CONSENT_TEMPLATE.md` / `docs/USER_DATA_DELETION_FLOW.md` / `docs/SLA_KPI_DEFINITION_AND_MEASUREMENT.md` / `docs/FIREBASE_AUTH_SUPABASE_RLS_SECURITY_DESIGN.md` / `docs/LEGAL_REVIEW_RESOLUTION_DRAFT.md`\n\n---\n\n## \u7b2c1\u6761\uff08\u9069\u7528\uff09\n\n1. \u672c\u898f\u7d04\u306f\u3001\u682a\u5f0f\u4f1a\u793eMightyLINK\uff08\u672c\u5e97\u6240\u5728\u5730: \u3012160-0006 \u6771\u4eac\u90fd\u65b0\u5bbf\u533a\u821f\u753a7-46 LANDDEN\u821f\u753a 6F\u3001\u4ee3\u8868\u53d6\u7de0\u5f79: \u5c0f\u6797 \u96c5\u6c34\u3002\u4ee5\u4e0b\u300c\u5f53\u793e\u300d\u3068\u3044\u3044\u307e\u3059\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d: \u78ba\u5b9a\u6e08\uff08\u793e\u5185GA\u9069\u7528\u30fb\u5546\u53f7: \u682a\u5f0f\u4f1a\u793eMightyLINK\uff09\u3011\u4f1a\u793eHP\uff08mighty-link.com/company\u30012026-07-19\u53d6\u5f97\uff09\u8a18\u8f09\u306e\u5546\u53f7\u300c\u682a\u5f0f\u4f1a\u793e MightyLINK\u300d\u306b\u57fa\u3065\u304d\u78ba\u5b9a\uff09\u304c\u63d0\u4f9b\u3059\u308b\u30a8\u30f3\u30b8\u30cb\u30a2\uff06\u6848\u4ef6 AI \u30d5\u30a3\u30c3\u30c8\u30b7\u30df\u30e5\u30ec\u30fc\u30bf\u30fc\u300cMighty Skill-Bridge\u300d\uff08\u4ee5\u4e0b\u300c\u672c\u30b5\u30fc\u30d3\u30b9\u300d\u3068\u3044\u3044\u307e\u3059\uff09\u306e\u5229\u7528\u6761\u4ef6\u3092\u5b9a\u3081\u308b\u3082\u306e\u3067\u3059\u3002\n2. \u5229\u7528\u8005\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u5229\u7528\u767b\u9332\u3092\u884c\u3044\u3001\u307e\u305f\u306f\u672c\u30b5\u30fc\u30d3\u30b9\u3092\u5229\u7528\u3059\u308b\u3053\u3068\u306b\u3088\u308a\u3001\u672c\u898f\u7d04\u306b\u540c\u610f\u3057\u305f\u3082\u306e\u3068\u307f\u306a\u3055\u308c\u307e\u3059\u3002\n3. \u5f53\u793e\u304c\u672c\u30b5\u30fc\u30d3\u30b9\u4e0a\u3067\u968f\u6642\u63b2\u8f09\u3059\u308b\u500b\u5225\u898f\u5b9a\u30fb\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u306f\u3001\u672c\u898f\u7d04\u306e\u4e00\u90e8\u3092\u69cb\u6210\u3057\u307e\u3059\u3002\n\n## \u7b2c2\u6761\uff08\u5b9a\u7fa9\uff09\n\n1. \u300c\u5229\u7528\u8005\u300d\u3068\u306f\u3001\u672c\u898f\u7d04\u306b\u540c\u610f\u306e\u3046\u3048\u672c\u30b5\u30fc\u30d3\u30b9\u3092\u5229\u7528\u3059\u308b\u500b\u4eba\u307e\u305f\u306f\u6cd5\u4eba\u3092\u3044\u3044\u307e\u3059\u3002\n2. \u300c\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u30c7\u30fc\u30bf\u300d\u3068\u306f\u3001\u5229\u7528\u8005\u304c\u672c\u30b5\u30fc\u30d3\u30b9\u306b\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u3059\u308b\u30b9\u30ad\u30eb\u30b7\u30fc\u30c8\uff08\u7d4c\u6b74\u66f8\u30fb\u8077\u52d9\u7d4c\u6b74\u66f8\u7b49\u306e PDF / Word / \u753b\u50cf / \u30c6\u30ad\u30b9\u30c8\uff09\u304a\u3088\u3073\u6848\u4ef6\u5b9a\u7fa9\u66f8\u7b49\u306e\u4e00\u5207\u306e\u30c7\u30fc\u30bf\u3092\u3044\u3044\u307e\u3059\u3002\n3. \u300cAI \u8a3a\u65ad\u7d50\u679c\u300d\u3068\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u304c Google Gemini API \u7b49\u306e AI \u6280\u8853\u3092\u7528\u3044\u3066\u751f\u6210\u3059\u308b\u30d5\u30a3\u30c3\u30c8\u5206\u6790\uff084 \u8ef8\u30b9\u30b3\u30a2\u30fb\u30ec\u30fc\u30c0\u30fc\u30c1\u30e3\u30fc\u30c8\u30fb\u30d5\u30a3\u30c3\u30c8\u8981\u7d04\u30fb\u9762\u8ac7\u60f3\u5b9a\u8cea\u554f\u30fb\u80b2\u6210\u30ed\u30fc\u30c9\u30de\u30c3\u30d7\u7b49\uff09\u3092\u3044\u3044\u307e\u3059\u3002\n4. \u300c\u5f93\u696d\u54e1\u652f\u63f4\u6a5f\u80fd\u300d\u3068\u306f\u3001\u5f93\u696d\u54e1\u9069\u6027\u30fb\u72b6\u6cc1\u30a2\u30f3\u30b1\u30fc\u30c8\u3001\u52e4\u6020\u6253\u523b\u30fb\u52e4\u52d9\u8868\u89e3\u6790\u3001\u304a\u3088\u3073\u55b6\u696d\u30e1\u30fc\u30eb\u7531\u6765\u60c5\u5831\u306b\u3082\u3068\u3065\u304f\u6848\u4ef6\u30fb\u4eba\u6750\u30de\u30c3\u30c1\u30f3\u30b0\u5019\u88dc\u306e\u63d0\u793a\u6a5f\u80fd\u3092\u3044\u3044\u307e\u3059\u3002\u5f93\u696d\u54e1\u652f\u63f4\u6a5f\u80fd\u306e\u500b\u4eba\u60c5\u5831\u306e\u53d6\u6271\u3044\u306f\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u306b\u5b9a\u3081\u308b\u3068\u304a\u308a\u3068\u3057\u3001\u533b\u7642\u30fb\u5fc3\u7406\u8a3a\u65ad\u3084\u81ea\u52d5\u7684\u306a\u51e6\u9047\u6c7a\u5b9a\u306b\u306f\u4f7f\u7528\u3057\u307e\u305b\u3093\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011\u5f93\u696d\u54e1\u652f\u63f4\u6a5f\u80fd\u306b\u95a2\u3059\u308b\u52b4\u52d9\u30fb\u4eba\u4e8b\u95a2\u9023\u6cd5\u4ee4\uff08\u52b4\u50cd\u5b89\u5168\u885b\u751f\u6cd5\u30fb\u8077\u696d\u5b89\u5b9a\u6cd5\u7b49\uff09\u3068\u306e\u6574\u5408\u3002\n\n## \u7b2c3\u6761\uff08\u5229\u7528\u767b\u9332\uff09\n\n1. \u5229\u7528\u5e0c\u671b\u8005\u306f\u3001\u5f53\u793e\u6240\u5b9a\u306e\u65b9\u6cd5\uff08Firebase Authentication \u306b\u3088\u308b\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u8a8d\u8a3c\u7b49\uff09\u306b\u3088\u308a\u5229\u7528\u767b\u9332\u3092\u884c\u3046\u3082\u306e\u3068\u3057\u307e\u3059\u3002\n2. \u5f53\u793e\u306f\u3001\u4ee5\u4e0b\u306e\u5834\u5408\u306b\u5229\u7528\u767b\u9332\u3092\u627f\u8a8d\u3057\u306a\u3044\u3053\u3068\u304c\u3042\u308a\u307e\u3059\u3002\n   - \u865a\u507d\u306e\u60c5\u5831\u3092\u5c4a\u3051\u51fa\u305f\u5834\u5408\n   - \u904e\u53bb\u306b\u672c\u898f\u7d04\u9055\u53cd\u7b49\u306b\u3088\u308a\u5229\u7528\u5236\u9650\u3092\u53d7\u3051\u305f\u3053\u3068\u304c\u3042\u308b\u5834\u5408\n   - \u305d\u306e\u4ed6\u3001\u5f53\u793e\u304c\u5229\u7528\u767b\u9332\u3092\u76f8\u5f53\u3067\u306a\u3044\u3068\u5224\u65ad\u3057\u305f\u5834\u5408\n3. \u73fe\u5728\u306e\u63d0\u4f9b\u5f62\u614b\u306f\u30af\u30ed\u30fc\u30ba\u30c9\u30d1\u30a4\u30ed\u30c3\u30c8\u904b\u7528\uff08\u62db\u5f85\u5236\uff09\u3067\u3042\u308a\u3001\u5f53\u793e\u304c\u500b\u5225\u306b\u627f\u8a8d\u3057\u305f\u5229\u7528\u8005\u306e\u307f\u304c\u5229\u7528\u3067\u304d\u307e\u3059\uff08`docs/PILOT_CLOSED_OPERATION_DESIGN.md` \u53c2\u7167\uff09\u3002\n\n## \u7b2c4\u6761\uff08\u30a2\u30ab\u30a6\u30f3\u30c8\u7ba1\u7406\uff09\n\n1. \u5229\u7528\u8005\u306f\u3001\u81ea\u5df1\u306e\u8cac\u4efb\u306b\u304a\u3044\u3066\u8a8d\u8a3c\u60c5\u5831\u3092\u7ba1\u7406\u3059\u308b\u3082\u306e\u3068\u3057\u3001\u7b2c\u4e09\u8005\u3078\u306e\u8cb8\u4e0e\u30fb\u8b72\u6e21\u3092\u3057\u3066\u306f\u306a\u308a\u307e\u305b\u3093\u3002\n2. \u8a8d\u8a3c\u60c5\u5831\u306e\u7ba1\u7406\u4e0d\u5341\u5206\u307e\u305f\u306f\u7b2c\u4e09\u8005\u306b\u3088\u308b\u4e0d\u6b63\u4f7f\u7528\u306b\u8d77\u56e0\u3059\u308b\u640d\u5bb3\u306b\u3064\u3044\u3066\u3001\u5f53\u793e\u306f\u5f53\u793e\u306b\u6545\u610f\u307e\u305f\u306f\u91cd\u904e\u5931\u304c\u3042\u308b\u5834\u5408\u3092\u9664\u304d\u8cac\u4efb\u3092\u8ca0\u3044\u307e\u305b\u3093\u3002\n\n## \u7b2c5\u6761\uff08\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u5185\u5bb9\uff09\n\n1. \u672c\u30b5\u30fc\u30d3\u30b9\u306f\u3001\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u30c7\u30fc\u30bf\u3092 AI \u306b\u3088\u308a\u89e3\u6790\u3057\u3001\u30a8\u30f3\u30b8\u30cb\u30a2\u3068\u6848\u4ef6\u306e\u9069\u5408\u5ea6\u306b\u95a2\u3059\u308b AI \u8a3a\u65ad\u7d50\u679c\u3092\u63d0\u4f9b\u3059\u308b\u3082\u306e\u3067\u3059\u3002\n2. \u5f53\u793e\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u54c1\u8cea\u76ee\u6a19\u3068\u3057\u3066\u7a3c\u50cd\u7387\u30fb\u5fdc\u7b54\u6642\u9593\u7b49\u306e KPI\uff08`docs/SLA_KPI_DEFINITION_AND_MEASUREMENT.md`\uff09\u3092\u5b9a\u3081\u307e\u3059\u304c\u3001\u3053\u308c\u3089\u306f\u76ee\u6a19\u5024\u3067\u3042\u308a\u3001\u9054\u6210\u3092\u4fdd\u8a3c\u3059\u308b\u3082\u306e\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011SLA \u3092\u5951\u7d04\u4e0a\u306e\u4fdd\u8a3c\u3068\u3057\u306a\u3044\u514d\u8cac\u69cb\u6210\u306e\u59a5\u5f53\u6027\u3002\n\n## \u7b2c6\u6761\uff08AI \u8a3a\u65ad\u7d50\u679c\u306e\u53d6\u6271\u3044\uff09\n\n1. AI \u8a3a\u65ad\u7d50\u679c\u306f\u3001\u7d71\u8a08\u7684\u30fb\u78ba\u7387\u7684\u624b\u6cd5\u306b\u57fa\u3065\u304f**\u53c2\u8003\u60c5\u5831**\u3067\u3042\u308a\u3001\u305d\u306e\u6b63\u78ba\u6027\u30fb\u5b8c\u5168\u6027\u30fb\u6709\u7528\u6027\u30fb\u7279\u5b9a\u76ee\u7684\u9069\u5408\u6027\u3092\u5f53\u793e\u306f\u4fdd\u8a3c\u3057\u307e\u305b\u3093\u3002\n2. \u5229\u7528\u8005\u306f\u3001\u63a1\u7528\u30fb\u914d\u5c5e\u30fb\u51e6\u9047\u305d\u306e\u4ed6\u306e\u4eba\u4e8b\u4e0a\u306e\u6c7a\u5b9a\u3092 AI \u8a3a\u65ad\u7d50\u679c\u306e\u307f\u306b\u4f9d\u62e0\u3057\u3066\u884c\u3063\u3066\u306f\u306a\u3089\u305a\u3001\u6700\u7d42\u5224\u65ad\u306f\u5229\u7528\u8005\u81ea\u8eab\u306e\u8cac\u4efb\u3067\u884c\u3046\u3082\u306e\u3068\u3057\u307e\u3059\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011AI \u51fa\u529b\u306e\u514d\u8cac\u7bc4\u56f2\u3001\u8077\u696d\u5b89\u5b9a\u6cd5\u30fb\u52b4\u50cd\u95a2\u9023\u6cd5\u4ee4\u3068\u306e\u6574\u5408\u3002\n3. AI \u8a3a\u65ad\u7d50\u679c\u306e\u751f\u6210\u306b\u306f\u5916\u90e8 AI \u30b5\u30fc\u30d3\u30b9\uff08Google Gemini API\uff09\u3092\u5229\u7528\u3057\u307e\u3059\u3002\u9001\u4fe1\u3055\u308c\u308b\u30c7\u30fc\u30bf\u306e\u53d6\u6271\u3044\u306f\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u306b\u5b9a\u3081\u308b\u3068\u304a\u308a\u3067\u3059\u3002\n\n## \u7b2c7\u6761\uff08\u5229\u7528\u6599\u91d1\uff09\n\n1. \u672c\u30b5\u30fc\u30d3\u30b9\u306e\u30d1\u30a4\u30ed\u30c3\u30c8\u671f\u9593\u4e2d\u306e\u5229\u7528\u6599\u91d1\u306f\u7121\u511f\u3068\u3057\u307e\u3059\u3002\n2. \u5f53\u793e\u306f\u3001\u5c06\u6765\u6709\u511f\u30d7\u30e9\u30f3\uff08\u5f93\u91cf\u8ab2\u91d1\u3092\u542b\u3080\uff09\u3092\u5c0e\u5165\u3059\u308b\u5834\u5408\u3001\u6599\u91d1\u30fb\u652f\u6255\u65b9\u6cd5\u30fb\u8ab2\u91d1\u898f\u7d04\u3092\u4e8b\u524d\u306b\u544a\u77e5\u3057\u3001\u5229\u7528\u8005\u306e\u540c\u610f\u3092\u5f97\u308b\u3082\u306e\u3068\u3057\u307e\u3059\u3002\u8ab2\u91d1\u30fb\u89e3\u7d04\u30fb\u8fd4\u91d1\u306e\u6761\u4ef6\u306f\u300c\u8ab2\u91d1\u898f\u7d04\u30fb\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc\u300d\uff08`docs/BILLING_AND_REFUND_POLICY.md`\uff09\u3001\u6cd5\u5b9a\u8868\u793a\u306f\u300c\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u306b\u57fa\u3065\u304f\u8868\u8a18\u300d\uff08`docs/TOKUSHOHO_NOTATION.md`\uff09\u306b\u5b9a\u3081\u307e\u3059\uff08\u3044\u305a\u308c\u3082 T792 \u8d77\u8349\u6e08\u306e\u521d\u7248\u30c9\u30e9\u30d5\u30c8\u3002T798 \u6cd5\u52d9\u78ba\u8a8d\u30fbT804 \u4fa1\u683c\u6c7a\u5b9a\u3067\u78ba\u5b9a\uff09\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011\u672c\u6761\u3068\u500b\u5225\u898f\u5b9a\u306e\u512a\u5148\u95a2\u4fc2\u3002\n\n## \u7b2c8\u6761\uff08\u7981\u6b62\u4e8b\u9805\uff09\n\n\u5229\u7528\u8005\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u5229\u7528\u306b\u3042\u305f\u308a\u3001\u4ee5\u4e0b\u306e\u884c\u70ba\u3092\u3057\u3066\u306f\u306a\u308a\u307e\u305b\u3093\u3002\n\n1. \u6cd5\u4ee4\u307e\u305f\u306f\u516c\u5e8f\u826f\u4fd7\u306b\u9055\u53cd\u3059\u308b\u884c\u70ba\n2. \u672c\u4eba\u306e\u540c\u610f\u3092\u5f97\u3066\u3044\u306a\u3044\u7b2c\u4e09\u8005\u306e\u500b\u4eba\u60c5\u5831\u30fb\u7d4c\u6b74\u60c5\u5831\u3092\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u3059\u308b\u884c\u70ba\n3. \u5f53\u793e\u307e\u305f\u306f\u7b2c\u4e09\u8005\u306e\u77e5\u7684\u8ca1\u7523\u6a29\u30fb\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30fb\u540d\u8a89\u3092\u4fb5\u5bb3\u3059\u308b\u884c\u70ba\n4. \u672c\u30b5\u30fc\u30d3\u30b9\u306e\u30b5\u30fc\u30d0\u30fc\u30fb\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u3078\u306e\u904e\u5ea6\u306a\u8ca0\u8377\u3001\u30ea\u30d0\u30fc\u30b9\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0\u3001\u4e0d\u6b63\u30a2\u30af\u30bb\u30b9\u884c\u70ba\n5. AI \u8a3a\u65ad\u7d50\u679c\u3092\u6539\u3056\u3093\u3057\u3066\u7b2c\u4e09\u8005\u3078\u63d0\u793a\u3059\u308b\u884c\u70ba\n6. \u672c\u30b5\u30fc\u30d3\u30b9\u3092\u5dee\u5225\u7684\u306a\u9078\u8003\u30fb\u8a55\u4fa1\u306b\u5229\u7528\u3059\u308b\u884c\u70ba\n7. \u305d\u306e\u4ed6\u3001\u5f53\u793e\u304c\u4e0d\u9069\u5207\u3068\u5408\u7406\u7684\u306b\u5224\u65ad\u3059\u308b\u884c\u70ba\n\n## \u7b2c9\u6761\uff08\u500b\u4eba\u60c5\u5831\u30fb\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u30c7\u30fc\u30bf\u306e\u53d6\u6271\u3044\uff09\n\n1. \u5f53\u793e\u306f\u3001\u5225\u9014\u5b9a\u3081\u308b\u300cMighty Skill-Bridge \u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u300d\uff08`docs/PRIVACY_POLICY.md`\uff09\u306b\u5f93\u3044\u3001\u5229\u7528\u8005\u306e\u500b\u4eba\u60c5\u5831\u3092\u9069\u5207\u306b\u53d6\u308a\u6271\u3044\u307e\u3059\u3002\n2. \u5229\u7528\u8005\u304c\u7b2c\u4e09\u8005\uff08\u6240\u5c5e\u30a8\u30f3\u30b8\u30cb\u30a2\u7b49\uff09\u306e\u500b\u4eba\u60c5\u5831\u3092\u542b\u3080\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u30c7\u30fc\u30bf\u3092\u767b\u9332\u3059\u308b\u5834\u5408\u3001\u5229\u7528\u8005\u306f\u5f53\u8a72\u672c\u4eba\u304b\u3089\u9069\u6cd5\u306a\u540c\u610f\u3092\u53d6\u5f97\u6e08\u307f\u3067\u3042\u308b\u3053\u3068\u3092\u4fdd\u8a3c\u3059\u308b\u3082\u306e\u3068\u3057\u307e\u3059\uff08`docs/PILOT_CONSENT_TEMPLATE.md` \u306e\u540c\u610f\u66f8\u904b\u7528\u3092\u542b\u3080\uff09\u3002\n3. \u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u30c7\u30fc\u30bf\u306e\u8457\u4f5c\u6a29\u305d\u306e\u4ed6\u306e\u6a29\u5229\u306f\u5229\u7528\u8005\u307e\u305f\u306f\u6b63\u5f53\u306a\u6a29\u5229\u8005\u306b\u5e30\u5c5e\u3057\u307e\u3059\u3002\u5f53\u793e\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u63d0\u4f9b\u30fb\u4fdd\u5b88\u30fb\u54c1\u8cea\u6539\u5584\u306b\u5fc5\u8981\u306a\u7bc4\u56f2\u3067\u306e\u307f\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u30c7\u30fc\u30bf\u3092\u5229\u7528\u3057\u307e\u3059\u3002\n\n## \u7b2c10\u6761\uff08\u77e5\u7684\u8ca1\u7523\u6a29\uff09\n\n1. \u672c\u30b5\u30fc\u30d3\u30b9\u3092\u69cb\u6210\u3059\u308b\u30d7\u30ed\u30b0\u30e9\u30e0\u30fb\u30c7\u30b6\u30a4\u30f3\u30fb\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u7b49\u306e\u77e5\u7684\u8ca1\u7523\u6a29\u306f\u3001\u5f53\u793e\u307e\u305f\u306f\u6b63\u5f53\u306a\u6a29\u5229\u8005\u306b\u5e30\u5c5e\u3057\u307e\u3059\u3002\n2. AI \u8a3a\u65ad\u7d50\u679c\u306b\u3064\u3044\u3066\u3001\u5229\u7528\u8005\u306f\u81ea\u5df1\u306e\u793e\u5185\u5229\u7528\u306e\u7bc4\u56f2\u3067\u81ea\u7531\u306b\u5229\u7528\u3067\u304d\u307e\u3059\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011AI \u751f\u6210\u7269\u306e\u6a29\u5229\u5e30\u5c5e\u30fb\u5bfe\u5916\u5229\u7528\u306e\u8a31\u8afe\u7bc4\u56f2\u3002\n\n## \u7b2c11\u6761\uff08\u30b5\u30fc\u30d3\u30b9\u63d0\u4f9b\u306e\u505c\u6b62\u30fb\u4e2d\u65ad\uff09\n\n1. \u5f53\u793e\u306f\u3001\u4ee5\u4e0b\u306e\u5834\u5408\u306b\u4e8b\u524d\u901a\u77e5\u306a\u304f\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u5168\u90e8\u307e\u305f\u306f\u4e00\u90e8\u306e\u63d0\u4f9b\u3092\u505c\u6b62\u30fb\u4e2d\u65ad\u3067\u304d\u308b\u3082\u306e\u3068\u3057\u307e\u3059\u3002\n   - \u30b7\u30b9\u30c6\u30e0\u306e\u4fdd\u5b88\u70b9\u691c\u30fb\u66f4\u65b0\u3092\u884c\u3046\u5834\u5408\n   - \u5730\u9707\u30fb\u706b\u707d\u30fb\u505c\u96fb\u30fb\u5929\u707d\u7b49\u306e\u4e0d\u53ef\u6297\u529b\u306b\u3088\u308a\u63d0\u4f9b\u304c\u56f0\u96e3\u306a\u5834\u5408\n   - Firebase / Supabase / Google Gemini API \u7b49\u306e\u5916\u90e8\u30b5\u30fc\u30d3\u30b9\u306b\u969c\u5bb3\u30fb\u4ed5\u69d8\u5909\u66f4\u304c\u751f\u3058\u305f\u5834\u5408\n   - \u5916\u90e8 API \u5229\u7528\u67a0\u306e\u4e0a\u9650\u5230\u9054\u306b\u3088\u308a\u30b5\u30fc\u30ad\u30c3\u30c8\u30d6\u30ec\u30a4\u30ab\u30fc\uff08\u81ea\u52d5\u906e\u65ad\u30fbfallback \u30e2\u30fc\u30c9\uff09\u304c\u4f5c\u52d5\u3057\u305f\u5834\u5408\n   - \u305d\u306e\u4ed6\u3001\u5f53\u793e\u304c\u505c\u6b62\u30fb\u4e2d\u65ad\u3092\u5fc5\u8981\u3068\u5224\u65ad\u3057\u305f\u5834\u5408\n2. \u5f53\u793e\u306f\u3001\u524d\u9805\u306b\u3088\u308b\u505c\u6b62\u30fb\u4e2d\u65ad\u306b\u3088\u308a\u5229\u7528\u8005\u306b\u751f\u3058\u305f\u640d\u5bb3\u306b\u3064\u3044\u3066\u3001\u5f53\u793e\u306b\u6545\u610f\u307e\u305f\u306f\u91cd\u904e\u5931\u304c\u3042\u308b\u5834\u5408\u3092\u9664\u304d\u8cac\u4efb\u3092\u8ca0\u3044\u307e\u305b\u3093\u3002\n\n## \u7b2c12\u6761\uff08\u5229\u7528\u5236\u9650\u30fb\u767b\u9332\u62b9\u6d88\uff09\n\n\u5f53\u793e\u306f\u3001\u5229\u7528\u8005\u304c\u672c\u898f\u7d04\u306b\u9055\u53cd\u3057\u305f\u5834\u5408\u3001\u4e8b\u524d\u901a\u77e5\u306e\u3046\u3048\uff08\u7dca\u6025\u6642\u306f\u4e8b\u5f8c\u901a\u77e5\uff09\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u5229\u7528\u5236\u9650\u307e\u305f\u306f\u30a2\u30ab\u30a6\u30f3\u30c8\u524a\u9664\u3092\u884c\u3046\u3053\u3068\u304c\u3067\u304d\u307e\u3059\u3002\n\n## \u7b2c13\u6761\uff08\u9000\u4f1a\u30fb\u30c7\u30fc\u30bf\u524a\u9664\uff09\n\n1. \u5229\u7528\u8005\u306f\u3001\u5f53\u793e\u6240\u5b9a\u306e\u624b\u7d9a\uff08\u9000\u4f1a API \u307e\u305f\u306f\u30b5\u30dd\u30fc\u30c8\u7a93\u53e3\u3078\u306e\u7533\u8acb\uff09\u306b\u3088\u308a\u9000\u4f1a\u3067\u304d\u307e\u3059\u3002\n2. \u9000\u4f1a\u6642\u306e\u30c7\u30fc\u30bf\u524a\u9664\u306f `docs/USER_DATA_DELETION_FLOW.md` \u306b\u5b9a\u3081\u308b\u30d5\u30ed\u30fc\uff08\u8ad6\u7406\u524a\u9664\u5f8c 24 \u6642\u9593\u4ee5\u5185\u306e\u7269\u7406\u524a\u9664\u30d0\u30c3\u30c1\u3001\u8ab2\u91d1\u8a18\u9332\u306e\u533f\u540d\u5316\u4fdd\u6301\uff09\u306b\u5f93\u3044\u307e\u3059\u3002\n3. \u6cd5\u4ee4\u4e0a\u4fdd\u5b58\u304c\u7fa9\u52d9\u4ed8\u3051\u3089\u308c\u308b\u8a18\u9332\uff08\u8ab2\u91d1\u95a2\u9023\u53f0\u5e33\u7b49\uff09\u306f\u3001\u533f\u540d\u5316\u306e\u3046\u3048\u6cd5\u5b9a\u671f\u9593\u4fdd\u5b58\u3057\u307e\u3059\u3002\n\n## \u7b2c14\u6761\uff08\u4fdd\u8a3c\u306e\u5426\u8a8d\u30fb\u514d\u8cac\uff09\n\n1. \u5f53\u793e\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306b\u4e8b\u5b9f\u4e0a\u307e\u305f\u306f\u6cd5\u5f8b\u4e0a\u306e\u7455\u75b5\uff08\u5b89\u5168\u6027\u30fb\u4fe1\u983c\u6027\u30fb\u6b63\u78ba\u6027\u30fb\u5b8c\u5168\u6027\u30fb\u6709\u52b9\u6027\u30fb\u7279\u5b9a\u76ee\u7684\u9069\u5408\u6027\u30fb\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u7b49\u306b\u95a2\u3059\u308b\u6b20\u9665\u3001\u30a8\u30e9\u30fc\u3084\u30d0\u30b0\u3001\u6a29\u5229\u4fb5\u5bb3\u7b49\u3092\u542b\u3080\uff09\u304c\u306a\u3044\u3053\u3068\u3092\u660e\u793a\u7684\u306b\u3082\u9ed9\u793a\u7684\u306b\u3082\u4fdd\u8a3c\u3057\u307e\u305b\u3093\u3002\n2. \u5f53\u793e\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306b\u8d77\u56e0\u3057\u3066\u5229\u7528\u8005\u306b\u751f\u3058\u305f\u3042\u3089\u3086\u308b\u640d\u5bb3\u306b\u3064\u3044\u3066\u3001\u5f53\u793e\u306b\u6545\u610f\u307e\u305f\u306f\u91cd\u904e\u5931\u304c\u3042\u308b\u5834\u5408\u3092\u9664\u304d\u3001\u8cac\u4efb\u3092\u8ca0\u3044\u307e\u305b\u3093\u3002\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u305d\u306e\u4ed6\u306e\u5f37\u884c\u6cd5\u898f\u304c\u9069\u7528\u3055\u308c\u308b\u5834\u5408\u3001\u5f53\u793e\u306e\u640d\u5bb3\u8ce0\u511f\u8cac\u4efb\u306f\u76f4\u8fd1\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d: \u671f\u9593\u30fb\u4e0a\u9650\u984d\uff08\u4f8b: 1 \u30f6\u6708\u5206\u306e\u5229\u7528\u6599\u76f8\u5f53\u984d\u307e\u305f\u306f\u91d1 1 \u4e07\u5186\u306e\u3044\u305a\u308c\u304b\u9ad8\u3044\u65b9\uff09\u3011\u3092\u4e0a\u9650\u3068\u3057\u307e\u3059\u3002\n\n## \u7b2c15\u6761\uff08\u30b5\u30fc\u30d3\u30b9\u5185\u5bb9\u306e\u5909\u66f4\u30fb\u7d42\u4e86\uff09\n\n1. \u5f53\u793e\u306f\u3001\u5229\u7528\u8005\u3078\u306e\u4e8b\u524d\u544a\u77e5\u306e\u3046\u3048\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u5185\u5bb9\u3092\u5909\u66f4\u3057\u3001\u307e\u305f\u306f\u63d0\u4f9b\u3092\u7d42\u4e86\u3059\u308b\u3053\u3068\u304c\u3067\u304d\u307e\u3059\u3002\n2. \u672c\u30b5\u30fc\u30d3\u30b9\u3092\u7d42\u4e86\u3059\u308b\u5834\u5408\u3001\u5f53\u793e\u306f\u7d42\u4e86\u65e5\u306e\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d: \u544a\u77e5\u671f\u9593\uff08\u4f8b: 30 \u65e5\u524d\uff09\u3011\u307e\u3067\u306b\u901a\u77e5\u3057\u3001\u5229\u7528\u8005\u30c7\u30fc\u30bf\u306e\u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u624b\u6bb5\uff08WBS T781 \u30bb\u30eb\u30d5\u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u6a5f\u80fd\uff09\u3092\u63d0\u4f9b\u3059\u308b\u3088\u3046\u52aa\u3081\u307e\u3059\u3002\n\n## \u7b2c16\u6761\uff08\u898f\u7d04\u306e\u5909\u66f4\uff09\n\n1. \u5f53\u793e\u306f\u3001\u6c11\u6cd5\u7b2c548\u6761\u306e4\uff08\u5b9a\u578b\u7d04\u6b3e\u306e\u5909\u66f4\uff09\u306b\u57fa\u3065\u304d\u3001\u5229\u7528\u8005\u306e\u4e00\u822c\u306e\u5229\u76ca\u306b\u9069\u5408\u3059\u308b\u5834\u5408\u3001\u307e\u305f\u306f\u5909\u66f4\u304c\u5408\u7406\u7684\u306a\u5834\u5408\u306b\u3001\u672c\u898f\u7d04\u3092\u5909\u66f4\u3067\u304d\u307e\u3059\u3002\n2. \u5909\u66f4\u5f8c\u306e\u898f\u7d04\u306f\u3001\u672c\u30b5\u30fc\u30d3\u30b9\u4e0a\u3067\u306e\u63b2\u793a\u305d\u306e\u4ed6\u5f53\u793e\u6240\u5b9a\u306e\u65b9\u6cd5\u3067\u5468\u77e5\u3057\u3001\u5468\u77e5\u306e\u969b\u306b\u5b9a\u3081\u308b\u52b9\u529b\u767a\u751f\u65e5\u304b\u3089\u9069\u7528\u3055\u308c\u307e\u3059\u3002\n\n## \u7b2c17\u6761\uff08\u901a\u77e5\u30fb\u9023\u7d61\uff09\n\n\u5f53\u793e\u304
