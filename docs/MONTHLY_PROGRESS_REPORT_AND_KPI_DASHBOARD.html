    <script>
        const rawMarkdown = "# \u6708\u6b21\u9032\u6357\u30ec\u30dd\u30fc\u30c8\u30fbKPI\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u6574\u5099\u4ed5\u69d8 (T767)\n\n\u30b9\u30c6\u30fc\u30af\u30db\u30eb\u30c0\u30fc\uff08\u793e\u9577\u30fb\u6295\u8cc7\u5bb6\u30fb\u958b\u767a\u30c1\u30fc\u30e0\uff09\u5411\u3051\u306e\u6708\u6b21\u9032\u6357\u30ec\u30dd\u30fc\u30c8\u3068\u3001Google Sheets \u306b\u3088\u308b KPI \u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u306e\u6574\u5099\u4ed5\u69d8\u3092\u5b9a\u7fa9\u3057\u307e\u3059\u3002\n\n---\n\n## \u30d0\u30fc\u30b8\u30e7\u30f3\u5c65\u6b74\n\n| \u65e5\u4ed8 | \u30d0\u30fc\u30b8\u30e7\u30f3 | \u5185\u5bb9 | \u8d77\u7a3f\u8005 |\n| :--- | :--- | :--- | :--- |\n| 2026-06-10 | v1.0.0 | \u521d\u7248\u4f5c\u6210\uff08\u30ec\u30dd\u30fc\u30c8\u69cb\u6210\u30fbSheets\u8a2d\u8a08\u30fb\u81ea\u52d5\u6295\u7a3f\u30d5\u30ed\u30fc\uff09 | Claude Code |\n| 2026-06-21 | v1.1.0 | T808\u3067\u6708\u6b21\u914d\u4fe1\u30b9\u30af\u30ea\u30d7\u30c8\u3001GitHub Actions\u3001Runbook\u3092\u5b9f\u88c5\u3002\u672a\u8a08\u6e2cKPI\u306f\u634f\u9020\u305b\u305a `\u672a\u8a08\u6e2c` \u3068\u3057\u3066Sheets\u3078upsert\u3059\u308b\u904b\u7528\u306b\u66f4\u65b0 | Codex |\n\n---\n\n## 1. \u6708\u6b21\u9032\u6357\u30ec\u30dd\u30fc\u30c8\u69cb\u6210\n\n### 1.1 \u30ec\u30dd\u30fc\u30c8\u30d5\u30a1\u30a4\u30eb\u547d\u540d\u898f\u5247\n\n```\ndocs/MONTHLY_REPORT_YYYY-MM.md\n```\n\n### 1.2 \u30ec\u30dd\u30fc\u30c8\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\n\n```markdown\n# Mighty Skill-Bridge \u6708\u6b21\u9032\u6357\u30ec\u30dd\u30fc\u30c8: YYYY\u5e74MM\u6708\n\n**\u4f5c\u6210\u65e5**: YYYY-MM-DD\n**\u4f5c\u6210\u8005**: \u6885\u6fa4 \u5bdb\u592a\uff08+ Claude Code\uff09\n\n---\n\n## \u30a8\u30b0\u30bc\u30af\u30c6\u30a3\u30d6\u30b5\u30de\u30ea\u30fc\n\n[3\u301c5\u884c\u3067\u4eca\u6708\u306e\u6700\u5927\u30c8\u30d4\u30c3\u30af\u3092\u7b87\u6761\u66f8\u304d]\n\n---\n\n## 1. WBS \u9032\u6357\n\n| \u6307\u6a19 | \u4eca\u6708 | \u5148\u6708\u6bd4 |\n| :--- | :--- | :--- |\n| \u5b8c\u4e86\u30bf\u30b9\u30af\u6570 | XX \u4ef6 | +XX \u4ef6 |\n| \u5b8c\u4e86\u7387 | XX.X% | +X.X pt |\n| \u4e88\u5b9a\u5bfe\u6bd4 | X \u65e5\u524d\u5012\u3057 / X \u65e5\u9045\u5ef6 | \u2014 |\n\n[\u672a\u5b8c\u4e86\u30bf\u30b9\u30af\u3067\u5f53\u6708\u4e2d\u306b\u5b8c\u4e86\u3059\u3079\u304d\u3060\u3063\u305f\u3082\u306e]\n\n---\n\n## 2. \u30b5\u30fc\u30d3\u30b9\u54c1\u8cea KPI\n\n| KPI | \u4eca\u6708\u5b9f\u7e3e | \u76ee\u6a19 | \u9054\u6210 |\n| :--- | :--- | :--- | :--- |\n| \u7a3c\u50cd\u7387 | XX.XX% | \u226599.5% | \u2705/\u274c |\n| P95 \u30ec\u30b9\u30dd\u30f3\u30b9 | X.X \u79d2 | \u22643.0 \u79d2 | \u2705/\u274c |\n| 5xx \u30a8\u30e9\u30fc\u7387 | X.XX% | \u22640.5% | \u2705/\u274c |\n| \u8a3a\u65ad\u5b9f\u884c\u4ef6\u6570 | XX \u4ef6 | \u22655\u4ef6/\u9031 | \u2705/\u274c |\n| \u8a3a\u65ad\u7cbe\u5ea6\u30b9\u30b3\u30a2 | XX% | \u226570% | \u2705/\u274c |\n\n---\n\n## 3. \u30a4\u30f3\u30d5\u30e9\u30b3\u30b9\u30c8\u5b9f\u7e3e\n\n| \u30b5\u30fc\u30d3\u30b9 | \u4eca\u6708\u8cbb\u7528 | \u4e88\u7b97 | \u72b6\u6cc1 |\n| :--- | :--- | :--- | :--- |\n| Gemini API | $XX.XX | \u2264$50 | \u2705/\u26a0\ufe0f/\u274c |\n| Firebase (Hosting/Functions) | $XX.XX | \u2264$30 | \u2705/\u26a0\ufe0f/\u274c |\n| Supabase | $XX.XX | \u2264$25 | \u2705/\u26a0\ufe0f/\u274c |\n| **\u5408\u8a08** | **$XX.XX** | **\u2264$105** | \u2705/\u26a0\ufe0f/\u274c |\n\n---\n\n## 4. \u30a4\u30f3\u30b7\u30c7\u30f3\u30c8\u30fb\u8ab2\u984c\n\n| \u65e5\u4ed8 | \u30ec\u30d9\u30eb | \u6982\u8981 | \u72b6\u614b |\n| :--- | :--- | :--- | :--- |\n| [\u306a\u3057] | \u2014 | \u2014 | \u2014 |\n\n---\n\n## 5. \u7fcc\u6708\u306e\u512a\u5148\u30a2\u30af\u30b7\u30e7\u30f3\n\n1. [\u30bf\u30b9\u30afID] \u30bf\u30b9\u30af\u540d\uff08\u62c5\u5f53: XXX\uff09\n2. [\u30bf\u30b9\u30afID] \u30bf\u30b9\u30af\u540d\uff08\u62c5\u5f53: XXX\uff09\n3. [\u30bf\u30b9\u30afID] \u30bf\u30b9\u30af\u540d\uff08\u62c5\u5f53: XXX\uff09\n\n---\n\n## 6. \u53c2\u7167\u30ea\u30f3\u30af\n\n- [WBS \u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8](https://docs.google.com/spreadsheets/d/1L99HCBHr4IsVUWqnUuG6OgoUmxEQUdfaYQim1n6etB8)\n- [GitHub \u30ea\u30dd\u30b8\u30c8\u30ea](https://github.com/kanta13jp1/mighty-link-ai-connect)\n- [\u516c\u958b\u30c7\u30e2 URL](https://kanta13jp1.github.io/mighty-link-ai-connect/)\n```\n\n---\n\n## 2. Google Sheets KPI\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u8a2d\u8a08\n\n### 2.1 \u30b7\u30fc\u30c8\u69cb\u6210\uff08\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u5185\u30bf\u30d6\uff09\n\n| \u30bf\u30d6\u540d | \u5185\u5bb9 | \u66f4\u65b0\u983b\u5ea6 |\n| :--- | :--- | :--- |\n| **WBS** | \u30bf\u30b9\u30af\u4e00\u89a7\u30fb\u9032\u6357\u30fb\u30ac\u30f3\u30c8\u30c1\u30e3\u30fc\u30c8 | \u30bb\u30c3\u30b7\u30e7\u30f3\u6bce |\n| **\u6708\u6b21KPI\u30b5\u30de\u30ea\u30fc** | \u6708\u5225 KPI \u5b9f\u7e3e\u30c6\u30fc\u30d6\u30eb + \u30b9\u30d1\u30fc\u30af\u30e9\u30a4\u30f3 | \u6708\u6b21 |\n| **\u7a3c\u50cd\u7387\u30c8\u30ec\u30f3\u30c9** | \u65e5\u5225\u7a3c\u50cd\u7387\u30b0\u30e9\u30d5\uff08\u6298\u308c\u7dda\uff09 | \u6708\u6b21 |\n| **\u30b3\u30b9\u30c8\u30c8\u30ec\u30f3\u30c9** | \u30b5\u30fc\u30d3\u30b9\u5225\u6708\u6b21\u30b3\u30b9\u30c8\u7a4d\u307f\u4e0a\u3052\u30b0\u30e9\u30d5 | \u6708\u6b21 |\n| **\u8a3a\u65ad\u4ef6\u6570\u63a8\u79fb** | \u65e5\u6b21\u8a3a\u65ad\u4ef6\u6570 + \u7d2f\u8a08\u30b0\u30e9\u30d5 | \u6708\u6b21 |\n| **\u8ab2\u984c\u7ba1\u7406\u8868** | GitHub Issues \u9023\u643a\u30fbP1\u301cP4 \u4e00\u89a7 | \u30bb\u30c3\u30b7\u30e7\u30f3\u6bce |\n| **QA\u8868** | \u30c6\u30b9\u30c8\u30b1\u30fc\u30b9\u30fb\u7d50\u679c\u30fb\u672a\u89e3\u6c7a\u30d0\u30b0 | \u30bb\u30c3\u30b7\u30e7\u30f3\u6bce |\n\n### 2.2 \u6708\u6b21KPI\u30b5\u30de\u30ea\u30fc \u30bf\u30d6\u306e\u30b9\u30ad\u30fc\u30de\n\n```\n\u6708\t\u7a3c\u50cd\u7387(%)\tP95\u30ec\u30b9\u30dd\u30f3\u30b9(s)\t5xx\u30a8\u30e9\u30fc\u7387(%)\t\u8a3a\u65ad\u4ef6\u6570\t\u7cbe\u5ea6\u30b9\u30b3\u30a2(%)\tGemini\u8cbb\u7528($)\tFirebase\u8cbb\u7528($)\tSupabase\u8cbb\u7528($)\t\u5408\u8a08\u8cbb\u7528($)\n2026-05\t\u2014\t\u2014\t\u2014\t\u2014\t\u2014\t\u2014\t\u2014\t\u2014\t\u2014\n2026-06\t99.9\t1.8\t0.1\t12\t76\t8.50\t0\t0\t8.50\n```\n\n### 2.3 \u81ea\u52d5\u66f4\u65b0\u30b9\u30af\u30ea\u30d7\u30c8\u4ed5\u69d8\n\n```python\n# scripts/sync_monthly_kpi_to_sheets.py\n# \u5b9f\u884c: python scripts/sync_monthly_kpi_to_sheets.py --month 2026-06\n#\n# \u51e6\u7406\u30d5\u30ed\u30fc:\n# 1. docs/MONTHLY_REPORT_YYYY-MM.md \u3068 data/*.tsv \u304b\u3089\u6708\u6b21KPI summary\u3092\u751f\u6210\n# 2. \u73fe\u6642\u70b9\u3067live source\u672a\u63a5\u7d9a\u306eSLA/\u8cbb\u7528\u6307\u6a19\u306f `\u672a\u8a08\u6e2c` \u3068\u3057\u3066\u4fdd\u6301\n# 3. Google Sheets\u300c\u6708\u6b21KPI\u30b5\u30de\u30ea\u30fc\u300d\u30bf\u30d6\u3078\u6708\u5358\u4f4d\u3067upsert\n# 4. \u66f8\u5f0f\u306fSheets API batchUpdate\u3067\u30d8\u30c3\u30c0\u30fc\u56fa\u5b9a\u30fb\u30d5\u30a3\u30eb\u30bf\u30fb\u5217\u5e45\u3092\u9069\u7528\n# 5. T800/T807/T811\u3067live telemetry/billing source\u304c\u63c3\u3063\u305f\u3089\u540c\u3058\u6708\u884c\u3092\u518dupsert\n```\n\nT808\u5b9f\u88c5:\n\n- `scripts/monthly_quality_delivery.py`\n- `scripts/sync_monthly_kpi_to_sheets.py`\n- `exports/monthly_quality_kpi_YYYY-MM.json`\n- `docs/MONTHLY_QUALITY_REPORT_DELIVERY_RUNBOOK.md`\n\n---\n\n## 3. Notion \u3078\u306e\u81ea\u52d5\u6295\u7a3f\u30d5\u30ed\u30fc\n\n\u6708\u6b21\u30ec\u30dd\u30fc\u30c8\u3092 Notion \u306e\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u30da\u30fc\u30b8\u306b\u3082\u81ea\u52d5\u6295\u7a3f\u3059\u308b\u3002\n\n```python\n# scripts/post_report_to_notion.py\n# Notion API: https://api.notion.com/v1/pages\n#\n# \u5fc5\u8981\u74b0\u5883\u5909\u6570:\n#   NOTION_API_KEY \u307e\u305f\u306f NOTION_TOKEN: Notion Integration Token\n#   NOTION_DATABASE_ID / NOTION_DATA_SOURCE_ID / NOTION_PARENT_PAGE_ID \u306e\u3044\u305a\u308c\u304b\n#\n# \u51e6\u7406:\n# 1. docs/MONTHLY_REPORT_YYYY-MM.md \u3092\u8aad\u307f\u8fbc\u307f\n# 2. \u6708\u6b21KPI summary \u2192 Notion \u30d6\u30ed\u30c3\u30af\u30
