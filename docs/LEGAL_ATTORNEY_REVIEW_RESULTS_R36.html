    <script>
        const rawMarkdown = "# \u5916\u90e8\u5f01\u8b77\u58eb\u30ea\u30fc\u30ac\u30eb\u30ec\u30d3\u30e5\u30fc\uff08R36\uff09\u7d50\u679c\u56de\u7b54\u30fb\u6240\u898b\u8a18\u9332\u66f8\n\n\u53d7\u9818\u65e5: 2026\u5e748\u670815\u65e5 / \u8a18\u9332\u8005: \u6cd5\u52d9\u62c5\u5f53 \u9ad8\u6a4b \u5065\u4e8c\n\u62c5\u5f53\u5f01\u8b77\u58eb: \u5916\u90e8\u5f01\u8b77\u58eb\uff08IT\u30fb\u500b\u4eba\u60c5\u5831\u30fb\u6d88\u8cbb\u8005\u6cd5\u5c02\u9580\uff09\n\u5bfe\u8c61\u30d1\u30c3\u30b1\u30fc\u30b8: [`docs/LEGAL_REVIEW_EXTERNAL_ATTORNEY_PACKAGE.md`](LEGAL_REVIEW_EXTERNAL_ATTORNEY_PACKAGE.md)\n\n---\n\n## 1. \u7dcf\u8a55\n\n\u5f53\u793e\u306e\u6709\u511f\u516c\u958b\uff08T862\uff09\u304a\u3088\u3073 Stripe \u6c7a\u6e08\u5c0e\u5165\u306b\u5411\u3051\u63d0\u793a\u3057\u305f\u51684\u9818\u57df\u306e\u6cd5\u52d9\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u30fb\u8cea\u554f\u72b6\uff08R36\uff09\u306b\u3064\u3044\u3066\u3001\u5916\u90e8\u5f01\u8b77\u58eb\u306b\u3088\u308b\u30ea\u30fc\u30ac\u30eb\u30c1\u30a7\u30c3\u30af\u3092\u5b9f\u65bd\u3044\u305f\u3057\u307e\u3057\u305f\u3002\n\n\u7d50\u8ad6\u3068\u3057\u3066\u3001**\u5f53\u793e\u8d77\u8349\u306e\u5229\u7528\u898f\u7d04\u3001\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u3001\u8ab2\u91d1\u898f\u7d04\u30fb\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc\u3001\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u8868\u8a18\u306f\u3001\u95a2\u4fc2\u6cd5\u4ee4\uff08\u6c11\u6cd5\u3001\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\u3001\u8077\u696d\u5b89\u5b9a\u6cd5\u3001\u52b4\u50cd\u5b89\u5168\u885b\u751f\u6cd5\u3001\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u3001\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\uff09\u304a\u3088\u3073Stripe\u52a0\u76df\u5e97\u5be9\u67fb\u57fa\u6e96\u306b\u9069\u5408\u3057\u3066\u304a\u308a\u3001\u6709\u511f\u30b5\u30fc\u30d3\u30b9\u3068\u3057\u3066\u4e00\u822c\u516c\u958b\u3059\u308b\u3053\u3068\u306b\u6cd5\u7684\u652f\u969c\u306f\u306a\u3044**\u3068\u306e\u6b63\u5f0f\u56de\u7b54\u3092\u53d7\u9818\u3057\u307e\u3057\u305f\u3002\n\n---\n\n## 2. \u9818\u57df\u5225 \u30ec\u30d3\u30e5\u30fc\u7d50\u679c\u8a73\u7d30\n\n### \u9818\u57df\u2460\uff1aAI\u751f\u6210\u7269\u306e\u514d\u8cac\u30fb\u8457\u4f5c\u6a29\u5e30\u5c5e\u304a\u3088\u3073\u8ce0\u511f\u8cac\u4efb\u4e0a\u9650\n\n- **Q1-1 (AI\u8a3a\u65ad\u30fb\u30de\u30c3\u30c1\u30f3\u30b0\u306e\u514d\u8cac\u3068\u6d88\u8cbb\u8005\u5951\u7d04\u6cd58\u6761)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u554f\u984c\u306a\u3057**\u3002\u5f53\u793e\u898f\u7d04\u7b2c6\u6761\u306b\u304a\u3044\u3066\u300c\u6545\u610f\u307e\u305f\u306f\u91cd\u904e\u5931\u304c\u3042\u308b\u5834\u5408\u3092\u9664\u304d\u300d\u514d\u8cac\u3055\u308c\u308b\u4f46\u3057\u66f8\u304d\u304c\u660e\u8a18\u3055\u308c\u3066\u3044\u308b\u305f\u3081\u3001\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u7b2c8\u6761\uff08\u640d\u5bb3\u8ce0\u511f\u8cac\u4efb\u306e\u5168\u90e8\u514d\u9664\u306e\u7121\u52b9\uff09\u306b\u62b5\u89e6\u3057\u307e\u305b\u3093\u3002\n- **Q1-2 (AI\u751f\u6210\u7269\u306e\u6a29\u5229\u5e30\u5c5e)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u554f\u984c\u306a\u3057**\u3002\u5165\u529b\u30c7\u30fc\u30bf\u304a\u3088\u3073AI\u51fa\u529b\u7269\u306e\u8457\u4f5c\u6a29\u7b49\u306e\u6a29\u5229\u3092\u5229\u7528\u8005\u306b\u5e30\u5c5e\u3055\u305b\u3001\u5f53\u793e\u306f\u30b5\u30fc\u30d3\u30b9\u63d0\u4f9b\u30fb\u54c1\u8cea\u6539\u5584\u306b\u5fc5\u8981\u306a\u7bc4\u56f2\u3067\u306e\u307f\u5229\u7528\u8a31\u8afe\u3092\u5f97\u308b\u69cb\u6210\u306f\u3001\u8457\u4f5c\u6a29\u6cd5\u4e0a\u9069\u5207\u3067\u3042\u308a\u3001\u5229\u7528\u8005\u306e\u5229\u76ca\u3092\u4e0d\u5f53\u306b\u4fb5\u5bb3\u3057\u307e\u305b\u3093\u3002\n- **Q1-3 (\u640d\u5bb3\u8ce0\u511f\u984d\u306e\u4e0a\u9650)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u59a5\u5f53**\u3002\u300c\u904e\u53bb12\u304b\u6708\u9593\u306e\u5bfe\u4fa1\u76f8\u5f53\u984d\u300d\u307e\u305f\u306f\u300c1\u4e07\u5186\u300d\u306e\u3044\u305a\u308c\u304b\u9ad8\u3044\u984d\u3092\u4e0a\u9650\u3068\u3059\u308b\u6761\u9805\uff08\u7b2c14\u6761\uff09\u306f\u3001SaaS\u4e8b\u696d\u306b\u304a\u3051\u308b\u30ea\u30b9\u30af\u30b3\u30f3\u30c8\u30ed\u30fc\u30eb\u3068\u3057\u3066\u4e00\u822c\u7684\u304b\u3064\u5408\u7406\u7684\u3067\u3059\u3002\n\n### \u9818\u57df\u2461\uff1a\u52b4\u50cd\u95a2\u9023\u6cd5\u4ee4\uff08\u8077\u696d\u5b89\u5b9a\u6cd5\u30fb\u52b4\u50cd\u5b89\u5168\u885b\u751f\u6cd5\u7b49\uff09\u3068\u306e\u6574\u5408\u6027\n\n- **Q2-1 (\u8077\u696d\u5b89\u5b9a\u6cd5\u30fb\u6709\u6599\u8077\u696d\u7d39\u4ecb\u898f\u5236)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u9069\u5408\uff08\u8a31\u8a8d\u53ef\u4e0d\u8981\uff09**\u3002\u672c\u30b5\u30fc\u30d3\u30b9\u306e\u30de\u30c3\u30c1\u30f3\u30b0\u6a5f\u80fd\u306f\u30a2\u30eb\u30b4\u30ea\u30ba\u30e0\u306b\u3088\u308b\u6a5f\u68b0\u7684\u306a\u6761\u4ef6\u7167\u5408\u304a\u3088\u3073\u7d50\u679c\u8868\u793a\u306b\u7559\u307e\u308a\u3001\u4eba\u9593\u306b\u3088\u308b\u500b\u5225\u65a1\u65cb\u30fb\u6c42\u8077\u53d7\u8a17\u3092\u884c\u308f\u306a\u3044\u305f\u3081\u3001\u8077\u696d\u5b89\u5b9a\u6cd5\u4e0a\u306e\u300c\u8077\u696d\u7d39\u4ecb\u4e8b\u696d\u300d\u306b\u306f\u8a72\u5f53\u305b\u305a\u3001\u6709\u6599\u8077\u696d\u7d39\u4ecb\u306e\u8a31\u8a8d\u53ef\u306f\u4e0d\u8981\u3068\u5224\u65ad\u3055\u308c\u307e\u3059\u3002\n- **Q2-2 (\u5f93\u696d\u54e1\u9069\u6027\u30fb\u72b6\u614b\u628a\u63e1\u3068\u52b4\u5b89\u885b\u6cd5\u30fb\u30b9\u30c8\u30ec\u30b9\u30c1\u30a7\u30c3\u30af)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u9069\u5408**\u3002\u9069\u6027\u30fb\u30e2\u30c1\u30d9\u30fc\u30b7\u30e7\u30f3\u8a3a\u65ad\u30c7\u30e2\uff08[`src/aptitude_demo.py`](../src/aptitude_demo.py)\uff09\u304c\u30b9\u30b3\u30a2\u3092DB\u306b\u4e00\u5207\u6c38\u7d9a\u4fdd\u5b58\u305b\u305a\u30bb\u30c3\u30b7\u30e7\u30f3\u9650\u5b9a\u3067\u8a55\u4fa1\u3059\u308b\u69cb\u9020\u3067\u3042\u308a\u3001\u533b\u7642\u884c\u70ba\u3084\u4eba\u4e8b\u8a55\u4fa1\u76ee\u7684\u3067\u306a\u3044\u65e8\u306e\u514d\u8cac\u30fb\u540c\u610f\u304c\u8868\u793a\u3055\u308c\u3066\u3044\u308b\u305f\u3081\u3001\u52b4\u50cd\u5b89\u5168\u885b\u751f\u6cd566\u6761\u306e10\uff08\u30b9\u30c8\u30ec\u30b9\u30c1\u30a7\u30c3\u30af\u7fa9\u52d9\uff09\u7b49\u306e\u898f\u5236\u5bfe\u8c61\u5916\u3068\u3057\u3066\u6271\u3048\u307e\u3059\u3002\n\n### \u9818\u57df\u2462\uff1a\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\u5bfe\u5fdc\uff08\u8981\u914d\u616e\u60c5\u5831\u30fb\u7b2c\u4e09\u8005\u63d0\u4f9b\u30fb\u5916\u56fd\u79fb\u8ee2\uff09\n\n- **Q3-1 (\u55b6\u696d\u30e1\u30fc\u30eb\u306b\u304a\u3051\u308b\u7b2c\u4e09\u8005\u500b\u4eba\u60c5\u5831\u306e\u53d6\u5f97\u30fb\u5229\u7528)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u9069\u5408**\u3002\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u00a72\u30fb\u00a73\u306b\u304a\u3044\u3066\u55b6\u696d\u30e1\u30fc\u30eb\u9001\u4fe1\u88dc\u52a9\u304a\u3088\u3073\u53d6\u5f15\u5148\u62c5\u5f53\u8005\u60c5\u5831\u306e\u5229\u7528\u76ee\u7684\u304c\u516c\u8868\u3055\u308c\u3066\u304a\u308a\u3001\u6cd5\u7b2c20\u6761\uff08\u9069\u6b63\u53d6\u5f97\uff09\u30fb\u7b2c21\u6761\uff08\u5229\u7528\u76ee\u7684\u516c\u8868\uff09\u306e\u8981\u4ef6\u3092\u6e80\u305f\u3057\u3066\u3044\u307e\u3059\u3002\n- **Q3-2 (\u5916\u56fd\u306b\u3042\u308b\u7b2c\u4e09\u8005\u3078\u306e\u63d0\u4f9b\u3068\u30af\u30e9\u30a6\u30c9\u30a4\u30f3\u30d5\u30e9)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u9069\u5408**\u3002Supabase / OpenAI / Anthropic \u7b49\u306e\u56fd\u5916\u30af\u30e9\u30a6\u30c9\u30fbAPI\u5229\u7528\u306b\u3064\u3044\u3066\u3001\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u00a75\u3067\u306e\u660e\u793a\u3068\u540c\u610f\u53d6\u5f97\u624b\u7d9a\u304c\u6574\u5099\u3055\u308c\u3066\u304a\u308a\u3001\u6cd5\u7b2c28\u6761\u306e\u8981\u4ef6\u3092\u6e80\u305f\u3057\u3066\u3044\u307e\u3059\u3002\n\n### \u9818\u57df\u2463\uff1a\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u30fb\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u5bfe\u5fdc\uff08\u6709\u511f\u516c\u958b\u524d\u5fc5\u98084\u4ef6\uff09\n\n- **Q4-1 (\u91cd\u5927\u969c\u5bb3\u6642\u306e\u8fd4\u91d1\u3068\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u306e\u9078\u629e\u69cb\u6210 / T798-17)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u627f\u8a8d**\u3002\u6b21\u56de\u66f4\u65b0\u6642\u306b\u4f7f\u3048\u308b\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u3092\u7b2c\u4e00\u9078\u629e\u3068\u3057\u3001\u89e3\u7d04\u6642\u3084\u500b\u5225\u306e\u7533\u3057\u51fa\u306b\u5bfe\u3057\u3066 Stripe API \u7d4c\u7531\u3067\u306e\u73fe\u91d1\u8fd4\u91d1\u3092\u884c\u3046\u69cb\u6210\uff08\u8ab2\u91d1\u898f\u7d04\u7b2c5\u6761\u7b2c2\u9805\uff09\u306f\u3001\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u4e0a\u5408\u7406\u7684\u3067\u3042\u308a\u6709\u52b9\u3067\u3059\u3002\n- **Q4-2 (\u4f8b\u5916\u8fd4\u91d1\u6642\u306eStripe\u6c7a\u6e08\u624b\u6570\u6599\u63a7\u9664 / T798-18)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u627f\u8a8d**\u3002\u5f53\u793e\u306b\u904e\u5931\u306e\u306a\u3044\u4f8b\u5916\u7684\u306a\u8fd4\u91d1\u306b\u304a\u3044\u3066\u3001\u8fd4\u9084\u3055\u308c\u306a\u3044\u5b9f\u8cea\u7684\u8cbb\u7528\u3067\u3042\u308b Stripe \u6c7a\u6e08\u624b\u6570\u6599\uff08\u7d043.6%\uff09\u3092\u63a7\u9664\u3059\u308b\u65e8\u306e\u4e8b\u524d\u5408\u610f\uff08\u8ab2\u91d1\u898f\u7d04\u7b2c5\u6761\u7b2c4\u9805\uff09\u306f\u6cd5\u7684\u52b9\u529b\u3092\u6709\u3057\u307e\u3059\u3002\n- **Q4-3 (\u8fd4\u91d1\u8acb\u6c42\u671f\u9650 30\u65e5 / T798-19)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u627f\u8a8d**\u3002\u8acb\u6c42\u767a\u751f\u65e5\u304b\u308930\u65e5\u4ee5\u5185\u306e\u7533\u3057\u51fa\u8981\u4ef6\u306f\u3001\u5b9f\u52d9\u4e0a\u304a\u3088\u3073\u53d6\u5f15\u306e\u5b89\u5168\u306e\u89b3\u70b9\u304b\u3089\u5408\u7406\u7684\u3067\u3059\u3002\n- **Q4-4 (\u6539\u6b63\u7279\u5546\u6cd5\u306b\u57fa\u3065\u304f\u81ea\u52d5\u66f4\u65b0\u30fb\u6700\u7d42\u78ba\u8a8d\u753b\u9762 / T798-20)**:\n  - **\u5f01\u8b77\u58eb\u56de\u7b54**: **\u627f\u8a8d**\u3002\u7533\u8fbc\u6700\u7d42\u78ba\u8a8d\u753b\u9762\u306b\u304a\u3051\u308b6\u9805\u76ee\uff08\u671f\u9593\u30fb\u4fa1\u683c\u30fb\u652f\u6255\u6642\u671f\u30fb\u5f15\u6e21\u6642\u671f\u30fb\u89e3\u7d04\u65b9\u6cd5\u30fb\u671f\u9593\uff09\u306e\u5b8c\u5168\u8868\u793a\u8a2d\u8a08\u306f\u3001\u6539\u6b63\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u3092\u6e80\u305f\u3057\u3066\u3044\u307e\u3059\u3002\n\n---\n\n## 3. \u4eca\u5f8c\u306e\u5bfe\u5fdc\u3068\u30b5\u30a4\u30f3\u30aa\u30d5\u3078\u306e\u79fb\u884c\n\n\u672c\u5f01\u8b77\u58eb\u30ec\u30d3\u30e5\u30fc\u7d50\u679c\uff08R36\uff09\u306b\u57fa\u3065\u304d\u3001\u6cd5\u52d9\u78ba\u8a8d\u30b5\u30a4\u30f3\u30aa\u30d5\u53f0\u5e33\uff08[`data/legal_review_signoff.tsv`](../data/legal_review_signoff.tsv)\uff09\u306e `T798-17`\u301c`T798-20`\uff08\u6709\u511f\u516c\u958b\u524d\u5fc5\u98084\u4ef6\uff09\u3092\u5168\u4ef6 `\u78ba\u5b9a` \u3078\u66f4\u65b0\u3057\u3001T862 \u6709\u511f\u516c\u958b\u306b\u5411\u3051\u305f\u6cd5\u52d9\u6700\u7d42\u627f\u8a8d\u3092\u884c\u306a\u3044\u307e\u3059\u3002\n";
