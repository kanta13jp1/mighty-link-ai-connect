        const rawMarkdown = "# \u8ab2\u91d1\u898f\u7d04\u30fb\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc\uff08\u521d\u7248\u30c9\u30e9\u30d5\u30c8\uff09\n\n> [!IMPORTANT]\n> **\u30b9\u30c6\u30fc\u30bf\u30b9: \u521d\u7248\u30c9\u30e9\u30d5\u30c8\uff08\u6cd5\u52d9\u78ba\u8a8d\u30fb\u6599\u91d1\u30d7\u30e9\u30f3\u78ba\u5b9a\u5f85\u3061\uff09**\n> \u672c\u6587\u66f8\u306f WBS T792 \u3067\u8d77\u8349\u3057\u305f\u521d\u7248\u3067\u3059\u3002T745/T777\u3067\u30c9\u30e9\u30d5\u30c8\u3078\u306e\u540c\u610fUI/API\u30ac\u30fc\u30c9\u3068\u30d5\u30c3\u30bf\u30fc\u30ea\u30f3\u30af\u306f\u5b9f\u88c5\u6e08\u307f\u3067\u3059\u304c\u3001\u5916\u90e8\u5f01\u8b77\u58eb\u306b\u3088\u308b\u30ea\u30fc\u30ac\u30eb\u30ec\u30d3\u30e5\u30fc\uff08T798 / \u8ab2\u984c\u7ba1\u7406\u8868 R36\u30fbR48\u30fbR51\uff09\u3068\u6709\u511f\u516c\u958b\u306e\u5b9f\u65bd\u5224\u65ad\uff08T862\uff09\u306e\u5b8c\u4e86\u307e\u3067\u306f\u6b63\u5f0f\u306a\u516c\u958b\u30fb\u6709\u511f\u63d0\u4f9b\u7528\u898f\u7d04\u3068\u3057\u3066\u6271\u3044\u307e\u305b\u3093\u3002\u672c\u898f\u7d04\u306f\u5229\u7528\u898f\u7d04\uff08`docs/TERMS_OF_SERVICE.md` \u7b2c7\u6761\uff09\u306e\u500b\u5225\u898f\u5b9a\u3068\u3057\u3066\u3001\u305d\u306e\u4e00\u90e8\u3092\u69cb\u6210\u3057\u307e\u3059\u3002\n> \u3010\u8981\u78ba\u8a8d\u3011\u30de\u30fc\u30ab\u30fc\u306f\u6cd5\u52d9\u78ba\u8a8d\u307e\u305f\u306f\u6709\u511f\u516c\u958b\u5224\u65ad\uff08T862\uff09\u3067\u57cb\u3081\u308b\u7b87\u6240\u3067\u3059\u3002\u6599\u91d1\u306f T804 \u3067\u4eee\u627f\u8a8d\u6e08\u307f\uff08`docs/PRICING_PLAN_PROVISIONAL_2026-07-03.md`\uff09\u3067\u3059\u304c\u3001\u5f53\u9762\u306f\u793e\u5185\u5229\u7528\u306e\u307f\u3067\u5b9f\u8ab2\u91d1\u306f\u767a\u751f\u3057\u307e\u305b\u3093\uff08`docs/INTERNAL_LAUNCH_AND_BILLING_SCOPE_2026-07-03.md`\uff09\u3002\n\n- \u8d77\u8349\u65e5: 2026-06-12\uff08Claude Code \u30ec\u30fc\u30f3\uff09\n- \u6839\u62e0\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8: `docs/TERMS_OF_SERVICE.md` / `docs/TOKUSHOHO_NOTATION.md` / `docs/STRIPE_BILLING_INTEGRATION_DESIGN.md` / Stripe \u516c\u5f0f\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\uff08Billing / Checkout / Webhooks / Customer Portal / Invoicing / Tax\uff09\n\n---\n\n## \u7b2c1\u6761\uff08\u9069\u7528\u7bc4\u56f2\uff09\n\n1. \u672c\u898f\u7d04\u306f\u3001Mighty Skill-Bridge \u306e\u6709\u511f\u30d7\u30e9\u30f3\uff08\u30b5\u30d6\u30b9\u30af\u30ea\u30d7\u30b7\u30e7\u30f3\u304a\u3088\u3073\u5f93\u91cf\u8ab2\u91d1\uff09\u306e\u8ab2\u91d1\u30fb\u652f\u6255\u30fb\u89e3\u7d04\u30fb\u8fd4\u91d1\u6761\u4ef6\u3092\u5b9a\u3081\u307e\u3059\u3002\n2. \u30d1\u30a4\u30ed\u30c3\u30c8\u671f\u9593\u4e2d\u306e\u7121\u511f\u5229\u7528\uff08\u5229\u7528\u898f\u7d04\u7b2c7\u6761\u7b2c1\u9805\uff09\u306b\u306f\u672c\u898f\u7d04\u306e\u8ab2\u91d1\u6761\u9805\u306f\u9069\u7528\u3055\u308c\u307e\u305b\u3093\u3002\n\n## \u7b2c2\u6761\uff08\u6599\u91d1\u30d7\u30e9\u30f3\u3068\u8ab2\u91d1\u65b9\u5f0f\uff09\n\n1. \u6599\u91d1\u30d7\u30e9\u30f3\u30fb\u4fa1\u683c\u30fb\u7121\u6599\u67a0\u30fb\u5f93\u91cf\u8ab2\u91d1\u5358\u4fa1\u306f\u3001\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u306b\u57fa\u3065\u304f\u8868\u8a18\uff08`docs/TOKUSHOHO_NOTATION.md`\uff09\u304a\u3088\u3073\u7533\u8fbc\u753b\u9762\u306b\u8868\u793a\u3059\u308b\u3068\u304a\u308a\u3068\u3057\u307e\u3059\u3002\u3010\u8981\u78ba\u8a8d\u3011\u6709\u511f\u516c\u958b\u5224\u65ad\uff08T862\uff09\u3067\u6700\u7d42\u78ba\u8a8d\u3057\u305f\u30d7\u30e9\u30f3\u8868\uff08T860 \u4eee\u6c7a\u5b9a\u8868\u3092\u57fa\u790e\u3068\u3059\u308b\uff09\u3092\u3053\u3053\u306b\u8ee2\u8a18\u3002\n2. \u30b5\u30d6\u30b9\u30af\u30ea\u30d7\u30b7\u30e7\u30f3\u306f\u7533\u8fbc\u65e5\u306b\u521d\u56de\u8ab2\u91d1\u3057\u3001\u4ee5\u5f8c 1 \u304b\u6708\u3054\u3068\uff08\u5e74\u984d\u30d7\u30e9\u30f3\u306f 1 \u5e74\u3054\u3068\uff09\u306e\u66f4\u65b0\u65e5\u306b\u81ea\u52d5\u8ab2\u91d1\u3055\u308c\u307e\u3059\u3002**\u30d7\u30e9\u30f3\u306f\u89e3\u7d04\u624b\u7d9a\u304d\u3092\u3057\u306a\u3044\u9650\u308a\u81ea\u52d5\u66f4\u65b0\u3055\u308c\u307e\u3059\u3002**\n3. \u5f93\u91cf\u8ab2\u91d1\uff08\u8a3a\u65ad\u56de\u6570\u7b49\u306e\u30e1\u30fc\u30bf\u30fc\u8ab2\u91d1\uff09\u306f\u3001\u5f53\u6708\u5229\u7528\u5206\u3092\u7fcc\u6708\u306e\u8acb\u6c42\u65e5\u306b\u307e\u3068\u3081\u3066\u8ab2\u91d1\u3057\u307e\u3059\uff08Stripe Billing Meters / T791\uff09\u3002\n4. \u6c7a\u6e08\u306f Stripe \u3092\u901a\u3058\u3066\u30af\u30ec\u30b8\u30c3\u30c8\u30ab\u30fc\u30c9\u3067\u884c\u3044\u307e\u3059\u3002\u5f53\u793e\u306f\u30ab\u30fc\u30c9\u756a\u53f7\u3092\u4fdd\u6301\u3057\u307e\u305b\u3093\u3002\n\n## \u7b2c3\u6761\uff08\u30d7\u30e9\u30f3\u5909\u66f4\uff09\n\n1. \u4e0a\u4f4d\u30d7\u30e9\u30f3\u3078\u306e\u5909\u66f4\uff08\u30a2\u30c3\u30d7\u30b0\u30ec\u30fc\u30c9\uff09\u306f\u5373\u6642\u9069\u7528\u3057\u3001\u5dee\u984d\u306f Stripe \u306e\u6bd4\u4f8b\u914d\u5206\uff08\u30d7\u30ed\u30ec\u30fc\u30b7\u30e7\u30f3\uff09\u306b\u5f93\u3044\u7cbe\u7b97\u3057\u307e\u3059\u3002\n2. \u4e0b\u4f4d\u30d7\u30e9\u30f3\u3078\u306e\u5909\u66f4\uff08\u30c0\u30a6\u30f3\u30b0\u30ec\u30fc\u30c9\uff09\u306f\u6b21\u56de\u66f4\u65b0\u65e5\u304b\u3089\u9069\u7528\u3057\u307e\u3059\u3002\u65e5\u5272\u308a\u8fd4\u91d1\u306f\u884c\u3044\u307e\u305b\u3093\u3002\n\n## \u7b2c4\u6761\uff08\u89e3\u7d04\uff09\n\n1. \u5229\u7528\u8005\u306f\u3001\u30a2\u30ab\u30a6\u30f3\u30c8\u8a2d\u5b9a\u753b\u9762\uff08Stripe \u30ab\u30b9\u30bf\u30de\u30fc\u30dd\u30fc\u30bf\u30eb / T829 API\u57fa\u76e4\u30fbT807 live\u6709\u52b9\u5316\uff09\u304b\u3089\u3044\u3064\u3067\u3082\u89e3\u7d04\u3067\u304d\u307e\u3059\u3002\n2. \u89e3\u7d04\u5f8c\u3082\u73fe\u8ab2\u91d1\u671f\u9593\u306e\u672b\u65e5\u307e\u3067\u672c\u30b5\u30fc\u30d3\u30b9\u3092\u5229\u7528\u3067\u304d\u3001\u671f\u9593\u9014\u4e2d\u306e\u89e3\u7d04\u306b\u3088\u308b\u65e5\u5272\u308a\u8fd4\u91d1\u306f\u884c\u3044\u307e\u305b\u3093\u3002\n3. \u89e3\u7d04\u5f8c\u306e\u30e6\u30fc\u30b6\u30fc\u30c7\u30fc\u30bf\u306e\u53d6\u6271\u3044\u306f `docs/USER_DATA_DELETION_FLOW.md` \u306b\u5b9a\u3081\u308b\u3068\u304a\u308a\u3067\u3059\uff08\u9000\u4f1a\uff1d\u30c7\u30fc\u30bf\u524a\u9664\u3068\u306f\u5225\u624b\u7d9a\uff09\u3002\n\n## \u7b2c5\u6761\uff08\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc\uff09\n\n1. \u672c\u30b5\u30fc\u30d3\u30b9\u306f\u30c7\u30b8\u30bf\u30eb\u5f79\u52d9\u3067\u3042\u308a\u3001\u5f79\u52d9\u63d0\u4f9b\u958b\u59cb\u5f8c\u306e\u5229\u7528\u8005\u90fd\u5408\u306b\u3088\u308b\u8fd4\u91d1\u306f\u539f\u5247\u3068\u3057\u3066\u884c\u3044\u307e\u305b\u3093\u3002\n2. \u524d\u9805\u306b\u304b\u304b\u308f\u3089\u305a\u3001\u4ee5\u4e0b\u306e\u5834\u5408\u306f\u5f53\u793e\u306e\u5224\u65ad\u306b\u3088\u308a\u5168\u90e8\u307e\u305f\u306f\u4e00\u90e8\u3092\u8fd4\u91d1\uff08\u307e\u305f\u306f\u6b21\u56de\u8acb\u6c42\u3078\u306e\u5145\u5f53\uff1d\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\uff09\u3057\u307e\u3059\u3002\n   - \u5f53\u793e\u306e\u8cac\u306b\u5e30\u3059\u3079\u304d\u91cd\u5927\u306a\u969c\u5bb3\u306b\u3088\u308a\u3001\u6708\u9593\u7a3c\u50cd\u7387\u304c SLA \u76ee\u6a19\uff08`docs/SLA_KPI_DEFINITION_AND_MEASUREMENT.md`\uff09\u3092\u8457\u3057\u304f\u4e0b\u56de\u3063\u305f\u5834\u5408\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011\u8fd4\u91d1\u3068\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u306e\u9078\u629e\u69cb\u6210\u30fb\u7b97\u5b9a\u57fa\u6e96\uff08\u793e\u5185\u30c9\u30e9\u30d5\u30c8\u78ba\u5b9a: \u539f\u5247\u3068\u3057\u3066\u6b21\u56de\u66f4\u65b0\u6642\u306b\u5229\u7528\u53ef\u80fd\u306a\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u3092\u7b2c\u4e00\u9078\u629e\u3068\u3057\u3001\u89e3\u7d04\u6642\u307e\u305f\u306f\u500b\u5225\u306e\u7533\u3057\u51fa\u306b\u3088\u308a Stripe API \u7d4c\u7531\u3067\u306e\u8fd4\u91d1\u306b\u3082\u5bfe\u5fdc\u3002T862\u6709\u511f\u5316\u5224\u65ad\u30fbR36\u5f01\u8b77\u58eb\u78ba\u8a8d\u3078\u5c55\u958b\uff09\n   - \u4e8c\u91cd\u8ab2\u91d1\u30fb\u8aa4\u8ab2\u91d1\u304c\u78ba\u8a8d\u3055\u308c\u305f\u5834\u5408\uff08\u5168\u984d\u8fd4\u91d1\uff09\n   - \u6cd5\u4ee4\u306b\u3088\u308a\u8fd4\u91d1\u304c\u7fa9\u52d9\u4ed8\u3051\u3089\u308c\u308b\u5834\u5408\n3. \u8fd4\u91d1\u306f Stripe Refunds API \u3092\u901a\u3058\u3066**\u5143\u306e\u652f\u6255\u65b9\u6cd5\u306b\u5bfe\u3057\u3066\u306e\u307f**\u884c\u3044\u307e\u3059\u3002\u8fd4\u91d1\u306e\u7740\u91d1\u306b\u306f\u901a\u5e38 5\u301c10 \u55b6\u696d\u65e5\u3092\u8981\u3057\u307e\u3059\u3002\n4. \u90e8\u5206\u8fd4\u91d1\u3092\u884c\u3046\u5834\u5408\u304c\u3042\u308a\u307e\u3059\u3002\u306a\u304a\u3001\u8fd4\u91d1\u6642\u306b\u5f53\u793e\u304c Stripe \u3078\u652f\u6255\u3063\u305f\u6c7a\u6e08\u624b\u6570\u6599\u306f Stripe \u304b\u3089\u8fd4\u9084\u3055\u308c\u306a\u3044\u305f\u3081\u3001\u5f53\u793e\u306b\u904e\u5931\u306e\u306a\u3044\u4f8b\u5916\u7684\u306a\u8fd4\u91d1\u306b\u304a\u3044\u3066\u306f\u3001\u6c7a\u6e08\u624b\u6570\u6599\u76f8\u5f53\u984d\uff08\u7d043.6%\uff09\u3092\u63a7\u9664\u3059\u308b\u3053\u3068\u304c\u3042\u308a\u307e\u3059\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011\u624b\u6570\u6599\u63a7\u9664\u306e\u53ef\u5426\u3068\u8868\u793a\u65b9\u6cd5\uff08\u793e\u5185\u30c9\u30e9\u30d5\u30c8\u78ba\u5b9a: \u6c7a\u6e08\u624b\u6570\u6599\u76f8\u5f53\u984d\u7d043.6%\u3092\u63a7\u9664\u3002T862\u6709\u511f\u5316\u5224\u65ad\u30fbR36\u5f01\u8b77\u58eb\u78ba\u8a8d\u3078\u5c55\u958b\uff09\u3002\n5. \u8fd4\u91d1\u8acb\u6c42\u306f\u30b5\u30dd\u30fc\u30c8\u7a93\u53e3\uff08T790\u3001`docs/USER_GUIDE_AND_FAQ.md`\uff09\u3078\u3001\u5bfe\u8c61\u8acb\u6c42\u306e\u767a\u751f\u65e5\u304b\u3089 30 \u65e5\u4ee5\u5185\u306b\u7533\u3057\u51fa\u308b\u3082\u306e\u3068\u3057\u307e\u3059\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011\u8acb\u6c42\u671f\u9650\u306e\u59a5\u5f53\u6027\uff08\u793e\u5185\u30c9\u30e9\u30d5\u30c8\u78ba\u5b9a: \u767a\u751f\u65e5\u304b\u308930\u65e5\u4ee5\u5185\u3002T862\u6709\u511f\u5316\u5224\u65ad\u30fbR36\u5f01\u8b77\u58eb\u78ba\u8a8d\u3078\u5c55\u958b\uff09\u3002\n\n## \u7b2c6\u6761\uff08\u652f\u6255\u9045\u5ef6\u30fb\u8ab2\u91d1\u5931\u6557\uff09\n\n1. \u30af\u30ec\u30b8\u30c3\u30c8\u30ab\u30fc\u30c9\u6c7a\u6e08\u304c\u5931\u6557\u3057\u305f\u5834\u5408\u3001Stripe \u306e\u30ea\u30c8\u30e9\u30a4\uff08Smart Retries\uff09\u306b\u3088\u308a\u518d\u6c7a\u6e08\u3092\u8a66\u307f\u307e\u3059\u3002\n2. \u518d\u6c7a\u6e08\u304c\u4e00\u5b9a\u671f\u9593\uff08\u3010\u8981\u78ba\u8a8d\u3011Stripe \u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u306e dunning \u8a2d\u5b9a: 7\u301c14 \u65e5\u3092\u60f3\u5b9a\uff09\u6210\u529f\u3057\u306a\u3044\u5834\u5408\u3001\u6709\u511f\u30d7\u30e9\u30f3\u306e\u63d0\u4f9b\u3092\u505c\u6b62\u3057\u3001\u7121\u511f\u30d7\u30e9\u30f3\u76f8\u5f53\u3078\u964d\u683c\u307e\u305f\u306f\u5229\u7528\u505c\u6b62\u3068\u3057\u307e\u3059\u3002\n3. \u652f\u6255\u9045\u5ef6\u306b\u3088\u308a\u5f53\u793e\u306b\u640d\u5bb3\u304c\u751f\u3058\u305f\u5834\u5408\u3001\u5f53\u793e\u306f\u5229\u7528\u8005\u3078\u305d\u306e\u8ce0\u511f\u3092\u8acb\u6c42\u3067\u304d\u307e\u3059\u3002\n\n## \u7b2c7\u6761\uff08\u4fa1\u683c\u6539\u5b9a\uff09\n\n1. \u5f53\u793e\u306f\u3001\u4fa1\u683c\u3092\u6539\u5b9a\u3059\u308b\u5834\u5408\u3001\u9069\u7528\u958b\u59cb\u65e5\u306e 30 \u65e5\u524d\u307e\u3067\u306b\u672c\u30b5\u30fc\u30d3\u30b9\u4e0a\u306e\u901a\u77e5\u304a\u3088\u3073\u30e1\u30fc\u30eb\u3067\u544a\u77e5\u3057\u307e\u3059\u3002\n2. \u6539\u5b9a\u5f8c\u306e\u4fa1\u683c\u306f\u3001\u30b5\u30d6\u30b9\u30af\u30ea\u30d7\u30b7\u30e7\u30f3\u306b\u3064\u3044\u3066\u306f\u544a\u77e5\u5f8c\u6700\u521d\u306b\u5230\u6765\u3059\u308b\u66f4\u65b0\u65e5\u304b\u3089\u9069\u7528\u3057\u307e\u3059\u3002\u5229\u7528\u8005\u306f\u66f4\u65b0\u65e5\u524d\u306b\u89e3\u7d04\u3059\u308b\u3053\u3068\u3067\u6539\u5b9a\u4fa1\u683c\u306e\u9069\u7528\u3092\u56de\u907f\u3067\u304d\u307e\u3059\u3002\n\n## \u7b2c8\u6761\uff08\u672c\u898f\u7d04\u306e\u5909\u66f4\uff09\n\n\u672c\u898f\u7d04\u306e\u5909\u66f4\u306f\u3001\u5229\u7528\u898f\u7d04\u7b2c14\u6761\u3010\u8981\u78ba\u8a8d\u3011\uff08\u898f\u7d04\u5909\u66f4\u6761\u9805\uff09\u306e\u624b\u7d9a\u306b\u5f93\u3044\u307e\u3059\u3002\u91cd\u8981\u306a\u5909\u66f4\u306f 30 \u65e5\u524d\u307e\u3067\u306b\u544a\u77e5\u3057\u307e\u3059\u3002\n\n---\n\n## \u5b9f\u88c5\u30e1\u30e2\uff08\u516c\u958b\u30da\u30fc\u30b8\u306b\u306f\u63b2\u8f09\u3057\u306a\u3044 / T791\u30fbT807 \u5411\u3051\uff09\n\n- Stripe API version \u306f\u3001T791\u306e\u5b9f\u88c5\u958b\u59cb\u6642\u70b9\u3067Stripe Dashboard\u3068\u516c\u5f0f\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u3092\u518d\u78ba\u8a8d\u3057\u3001\u30b3\u30fc\u30c9\u30fbRunbook\u5074\u3067\u660e\u793a\u7684\u306b\u56fa\u5b9a\u3059\u308b\u3002\u904e\u53bb\u30e1\u30e2\u306eAPI version\u6587\u5b57\u5217\u3060\u3051\u3092\u6839\u62e0\u306b\u3057\u306a\u3044\u3002\n- \u8ab2\u91d1\u672c\u4f53\u3001Webhook\u3001Billing Meters\u3001Sheets\u540c\u671f\u3001Secret\u975e\u8a18\u9332\u5883\u754c\u306f [Stripe Billing \u7d71\u5408\u8a2d\u8a08\uff08T776\uff09](STRIPE_BILLING_INTEGRATION_DESIGN.md) \u3092\u6b63\u672c\u3068\u3059\u308b\u3002\n- \u7533\u8fbc\u307f\u6700\u7d42\u78ba\u8a8d\u753b\u9762\u306e\u7279\u5546\u6cd5 6 \u9805\u76ee\u8868\u793a\u306f `docs/TOKUSHOHO_NOTATION.md` \u306e\u5b9f\u88c5\u8981\u4ef6\u30bb\u30af\u30b7\u30e7\u30f3\u306b\u5f93\u3046\uff08\u81ea\u52d5\u66f4\u65b0\u30b5\u30d6\u30b9\u30af\u3067\u3042\u308b\u65e8\u306e\u660e\u793a\u304c\u5fc5\u9808\uff09\u3002\n- **\u7279\u5546\u6cd5\u8868\u8a18\u30da\u30fc\u30b8\u306e\u6b63\u5f0f\u516c\u958b\u306f Stripe \u30a2\u30ab\u30a6\u30f3\u30c8\u5be9\u67fb\uff08JCB \u5be9\u67fb\u542b\u3080\uff09\u306e\u524d\u63d0\u8981\u4ef6**\u306e\u305f\u3081\u3001\u6709\u511f\u516c\u958b\uff08T862 \u5224\u65ad\u5f8c\u306e Stripe live \u9069\u7528\uff09\u306e\u524d\u306b T798 \u78ba\u5b9a\u7d50\u679c\u3068\u6700\u7d42\u4fa1\u683c\u3092\u53cd\u6620\u3059\u308b\u3053\u3068\u3002T777\u306e\u30d5\u30c3\u30bf\u30fc\u30ea\u30f3\u30af\u7d71\u5408\u306f\u5b8c\u4e86\u6e08\u307f\u3002\n- \u89e3\u7d04\u5c0e\u7dda\u306f Stripe \u30ab\u30b9\u30bf\u30de\u30fc\u30dd\u30fc\u30bf\u30eb\u3092\u63a1\u7528\u3057\u3001T829\u3067\u30bb\u30c3\u30b7\u30e7\u30f3\u751f\u6210API\u3068dry-run\u5c0e\u7dda\u309
