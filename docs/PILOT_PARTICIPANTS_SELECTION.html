a5\u5f53\u6027\u3092\u30d7\u30ed\u306e\u8996\u70b9\u304b\u3089\u8a55\u4fa1\u3067\u304d\u308b\u305f\u3081\u3002\n2. **\u55b6\u696d\u63a8\u9032\u90e8\uff08SES/\u55b6\u696d\u62c5\u5f53\uff09**: 1\u540d\n   * \u9078\u5b9a\u7406\u7531: \u30af\u30e9\u30a4\u30a2\u30f3\u30c8\u4f01\u696d\u304b\u3089\u306e\u6025\u306aSES\u6848\u4ef6\u306b\u5bfe\u3057\u3066\u3001\u624b\u6301\u3061\u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u7d4c\u6b74\u66f8\u304b\u3089\u5373\u5ea7\u306b\u30de\u30c3\u30c1\u30f3\u30b0\u5019\u88dc\u3092\u898b\u3064\u3051\u308b\u5fc5\u8981\u304c\u3042\u308a\u3001\u672c\u30c4\u30fc\u30eb\u306e\u9ad8\u901f\u30de\u30c3\u30c1\u30f3\u30b0\u304a\u3088\u3073\u30ae\u30e3\u30c3\u30d7\u5206\u6790\uff08\u30b9\u30ad\u30eb\u30ae\u30e3\u30c3\u30d7\u3001\u9762\u8ac7\u60f3\u5b9a\u8cea\u554f\uff09\u306e\u5b9f\u7528\u6027\u3092\u691c\u8a3c\u3067\u304d\u308b\u305f\u3081\u3002\n\n---\n\n## 2. \u9078\u5b9a\u3055\u308c\u305f\u30d1\u30a4\u30ed\u30c3\u30c8\u53c2\u52a0\u8005\n\n| \u90e8\u7f72\u30fb\u5f79\u8077 | \u6c0f\u540d | \u4e3b\u306a\u691c\u8a3c\u89b3\u70b9 |\n| :--- | :--- | :--- |\n| \u4eba\u6750\u7d39\u4ecb\u4e8b\u696d\u90e8 \u30b3\u30fc\u30b8\u30cd\u30fc\u30bf\u30fc | **\u4f50\u85e4 \u7f8e\u54b2 (Sato Misaki)** | \u7d4c\u6b74\u66f8\uff08\u30ec\u30b8\u30e5\u30e1\uff09\u00d7\u6848\u4ef6\u7968\u306e4\u8ef8\u30b9\u30b3\u30a2\u30ea\u30f3\u30b0\u7cbe\u5ea6\u3001\u9762\u8ac7\u60f3\u5b9a\u8cea\u554f\u306e\u59a5\u5f53\u6027\u8a55\u4fa1 |\n| \u55b6\u696d\u63a8\u9032\u90e8 SES\u30a2\u30ab\u30a6\u30f3\u30c8\u30de\u30cd\u30fc\u30b8\u30e3\u30fc | **\u9234\u6728 \u5065\u592a (Suzuki Kenta)** | \u8907\u6570\u6848\u4ef6\u00d7\u8907\u6570\u30a8\u30f3\u30b8\u30cb\u30a2\u306e\u7a81\u5408\u30b9\u30d4\u30fc\u30c9\u3001\u30b9\u30ad\u30eb\u30ae\u30e3\u30c3\u30d7\u53ef\u8996\u5316\u306b\u3088\u308b\u63d0\u6848\u30a2\u30d7\u30ed\u30fc\u30c1\u306e\u6539\u5584\u52b9\u679c |\n\n---\n\n## 3. \u30d1\u30a4\u30ed\u30c3\u30c8\u30d7\u30ed\u30b0\u30e9\u30e0\u4f9d\u983c\u6587\u9762\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\n\u9078\u5b9a\u3055\u308c\u305f\u53c2\u52a0\u8005\uff08\u4f50\u85e4\u6c0f\u3001\u9234\u6728\u6c0f\uff09\u306b\u5bfe\u3057\u3066\u9001\u4fe1\u3059\u308b\u500b\u5225\u4f9d\u983c\uff08Slack\u304a\u3088\u3073\u30e1\u30fc\u30eb\uff09\u306e\u6587\u9762\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\u3067\u3059\u3002\n\n### 3.1 Slack\u9001\u4fe1\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\n> **To**: @\u4f50\u85e4\u7f8e\u54b2 / @\u9234\u6728\u5065\u592a  \n> **From**: @\u5bdb\u592a\u6885\u6fa4  \n> **Subject**: \u3010\u3054\u5354\u529b\u4f9d\u983c\u3011\u65b0\u30de\u30c3\u30c1\u30f3\u30b0\u652f\u63f4\u30c4\u30fc\u30eb\u300cMighty Skill-Bridge\u300d\u793e\u5185\u30d1\u30a4\u30ed\u30c3\u30c8\u691c\u8a3c\u306b\u3064\u3044\u3066  \n> \n> \u304a\u75b2\u308c\u69d8\u3067\u3059\u3001\u5bdb\u592a\u3067\u3059\u3002\n> \n> \u73fe\u5728\u3001\u793e\u5185\u3067\u958b\u767a\u3092\u9032\u3081\u3066\u3044\u308bAI\u30de\u30c3\u30c1\u30f3\u30b0\u30fb\u9069\u6027\u72b6\u6cc1\u8a3a\u65ad\u30c4\u30fc\u30eb **\u300cMighty Skill-Bridge\u300d** \u306e\u30d7\u30ed\u30c8\u30bf\u30a4\u30d7\u304c\u5b8c\u6210\u3057\u3001\u672c\u756a\u30ea\u30ea\u30fc\u30b9\u306b\u5411\u3051\u305f\u793e\u5185\u30d1\u30a4\u30ed\u30c3\u30c8\u30d7\u30ed\u30b0\u30e9\u30e0\u3092\u958b\u59cb\u3059\u308b\u904b\u3073\u3068\u306a\u308a\u307e\u3057\u305f\u3002\n> \n> \u3064\u304d\u307e\u3057\u3066\u306f\u3001\u5b9f\u969b\u306e\u696d\u52d9\u30b7\u30fc\u30f3\u3067\u306e\u4f7f\u3044\u52dd\u624b\u3084AI\u5224\u5b9a\u306e\u7cbe\u5ea6\u3092\u691c\u8a3c\u3044\u305f\u3060\u304f\u305f\u3081\u3001\u304a\u4e8c\u4eba\u306b\u30d1\u30a4\u30ed\u30c3\u30c8\u53c2\u52a0\u8005\u3068\u3057\u3066\u3054\u5354\u529b\u3092\u304a\u9858\u3044\u3057\u305f\u304f\u3054\u9023\u7d61\u3044\u305f\u3057\u307e\u3057\u305f\u3002\n> \n> **\u25a0 \u30d1\u30a4\u30ed\u30c3\u30c8\u6982\u8981**\n> - **\u671f\u9593**: 2026\u5e746\u67083\u65e5\uff08\u6c34\uff09\u301c 2026\u5e746\u670816\u65e5\uff08\u706b\uff09\n> - **\u3054\u5bfe\u5fdc\u5185\u5bb9**: \n>   1. \u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u30fbAPI\u9023\u643a\u306b\u95a2\u3059\u308b\u540c\u610f\u66f8\uff08\u6dfb\u4ed8\u307e\u305f\u306f\u4ee5\u4e0b\u30ea\u30f3\u30af\uff09\u306e\u3054\u78ba\u8a8d\u3068\u540c\u610f\n>   2. \u5b9f\u969b\u306e\u696d\u52d9\u3067\u4f7f\u7528\u3057\u305f\u300c\u500b\u4eba\u60c5\u5831\u3092\u30de\u30b9\u30ad\u30f3\u30b0\u3057\u305f\u72b6\u614b\u306e\u7d4c\u6b74\u66f8\u300d\u304a\u3088\u3073\u300c\u6848\u4ef6\u7968\u300d\u306e\u30c6\u30ad\u30b9\u30c8\u3092\u30c4\u30fc\u30eb\u306b\u5165\u529b\n>   3. AI\u304c\u751f\u6210\u3057\u305f\u30de\u30c3\u30c1\u30f3\u30b0\u30b9\u30b3\u30a2\u3001\u30de\u30c3\u30c1/\u4e0d\u8db3\u30b9\u30ad\u30eb\u3001\u9762\u8ac7\u60f3\u5b9a\u8cea\u554f\u306a\u3069\u306e\u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u8a55\u4fa1\uff08\u7c21\u6613\u30a2\u30f3\u30b1\u30fc\u30c8\uff09\n> - **\u6240\u8981\u6642\u9593**: \u671f\u9593\u4e2d\u30c8\u30fc\u30bf\u30eb\u30671\u301c2\u6642\u9593\u7a0b\u5ea6\uff08\u3054\u81ea\u8eab\u306e\u30da\u30fc\u30b9\u3067\u5b9f\u65bd\u3044\u305f\u3060\u3051\u307e\u3059\uff09\n> \n> \u672c\u30c4\u30fc\u30eb\u306fGoogle Gemini API\u3092\u4f7f\u7528\u3057\u3066\u3044\u307e\u3059\u304c\u3001**\u9001\u4fe1\u30c7\u30fc\u30bf\u304c\u5916\u90e8\u306e\u516c\u958b\u5b66\u7fd2\u30e2\u30c7\u30eb\u306b\u4e8c\u6b21\u5229\u7528\u3055\u308c\u306a\u3044\u5b89\u5168\u306aAPI\u63a5\u7d9a**\u3092\u9069\u7528\u3057\u3066\u304a\u308a\u307e\u3059\u3002\u8a73\u7d30\u306f\u6dfb\u4ed8\u306e\u540c\u610f\u66f8\u3092\u3054\u78ba\u8a8d\u304f\u3060\u3055\u3044\u3002\n> \n> **\u25bc \u53c2\u52a0\u540c\u610f\u66f8\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\uff08\u3054\u78ba\u8a8d\u304f\u3060\u3055\u3044\uff09**\n> [PILOT_CONSENT_TEMPLATE.md](PILOT_CONSENT_TEMPLATE.md)\n> \n> \u307e\u305a\u306f\u540c\u610f\u66f8\u306e\u5185\u5bb9\u3092\u3054\u78ba\u8a8d\u3044\u305f\u3060\u304d\u3001\u672c\u30d1\u30a4\u30ed\u30c3\u30c8\u3078\u306e\u3054\u5354\u529b\u304c\u53ef\u80fd\u304b\u3069\u3046\u304b\u3001\u672c\u65e5\u4e2d\u306b\u3053\u306e\u30b9\u30ec\u30c3\u30c9\u307e\u305f\u306fDM\u3067\u3054\u8fd4\u4fe1\u3044\u305f\u3060\u3051\u307e\u3059\u3068\u5e78\u3044\u3067\u3059\u3002\u540c\u610f\u304c\u78ba\u8a8d\u3067\u304d\u6b21\u7b2c\u3001\u30c4\u30fc\u30eb\u306eURL\u3068\u64cd\u4f5c\u30de\u30cb\u30e5\u30a2\u30eb\u3092\u304a\u9001\u308a\u3044\u305f\u3057\u307e\u3059\u3002\n> \n> \u4f55\u5352\u3054\u5354\u529b\u306e\u307b\u3069\u3088\u308d\u3057\u304f\u304a\u9858\u3044\u3044\u305f\u3057\u307e\u3059\uff01\n\n---\n\n## 4. \u30af\u30ed\u30fc\u30ba\u30c9\u904b\u7528\u306b\u304a\u3051\u308b\u30c7\u30fc\u30bf\u7ba1\u7406\u30eb\u30fc\u30eb\n\u30d1\u30a4\u30ed\u30c3\u30c8\u671f\u9593\u4e2d\u306e\u60c5\u5831\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u3092\u62c5\u4fdd\u3059\u308b\u305f\u3081\u3001\u4ee5\u4e0b\u306e\u30eb\u30fc\u30eb\u3092\u5fb9\u5e95\u3057\u307e\u3059\u3002\n\n1. **\u5b8c\u5168\u30de\u30b9\u30ad\u30f3\u30b0\u306e\u5fb9\u5e95**: \n   * \u53c2\u52a0\u8005\u304c\u30c4\u30fc\u30eb\u306b\u5165\u529b\u3059\u308b\u7d4c\u6b74\u66f8\u3084\u6848\u4ef6\u7968\u306f\u3001\u4e8b\u524d\u306b\u6c0f\u540d\u3001\u9023\u7d61\u5148\u3001\u7279\u5b9a\u306e\u53d6\u5f15\u5148\u4f01\u696d\u540d\u306a\u3069\u3092\u524a\u9664\u30fb\u533f\u540d\u5316\u3057\u305f\u30c7\u30fc\u30bf\u3092\u4f7f\u7528\u3059\u308b\u3088\u3046\u30de\u30cb\u30e5\u30a2\u30eb\u3067\u7fa9\u52d9\u4ed8\u3051\u307e\u3059\u3002\n2. **\u76e3\u67fb\u30ed\u30b0\u306e\u30e2\u30cb\u30bf\u30ea\u30f3\u30b0**: \n   * \u5224\u5b9a\u5b9f\u884c\u6642\u306b\u81ea\u52d5\u751f\u6210\u3055\u308c\u308b\u76e3\u67fb\u30ed\u30b0\uff08`/api/audit/recent` \u7d4c\u7531\uff09\u3092\u5bdb\u592a\u304c\u65e5\u6b21\u3067\u78ba\u8a8d\u3057\u3001\u610f\u56f3\u3057\u306a\u3044\u500b\u4eba\u8b58\u5225\u60c5\u5831\uff08PII\uff09\u306e\u6df7\u5165\u304c\u306a\u3044\u304b\u30c1\u30a7\u30c3\u30af\u3057\u307e\u3059\u3002\n3. **\u30c7\u30fc\u30bf\u6d88\u53bb\u306e\u5b9f\u65bd**: \n   * 2026\u5e746\u670816\u65e5\u306e\u30d1\u30a4\u30ed\u30c3\u30c8\u671f\u9593\u7d42\u4e86\u5f8c\u30013\u55b6\u696d\u65e5\u4ee5\u5185\u306b\u30c6\u30b9\u30c8\u7528
