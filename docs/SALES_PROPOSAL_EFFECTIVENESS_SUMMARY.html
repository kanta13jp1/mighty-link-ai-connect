    <script>
        const rawMarkdown = "# \u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0 \u55b6\u696d\u52b9\u679c\u6e2c\u5b9a\u30b5\u30de\u30ea\u30fc\uff06\u63d0\u6848\u30ac\u30a4\u30c9\n\n\u6700\u7d42\u66f4\u65b0\u65e5: 2026-07-24  \n\u62c5\u5f53: \u55b6\u696d\u62c5\u5f53 / Mighty Link AI Connect \u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u30c1\u30fc\u30e0  \n\u5bfe\u8c61: SES\u4e8b\u696d\u8005\u30fbIT\u4eba\u6750\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u30fbIT\u4f01\u696d\u55b6\u696d\u90e8\u9580 \u7d4c\u55b6\u5c64\u304a\u3088\u3073\u55b6\u696d\u8cac\u4efb\u8005\u5404\u4f4d  \n\n---\n\n## 1. \u30a8\u30b0\u30bc\u30af\u30c6\u30a3\u30d6\u30b5\u30de\u30ea\u30fc\n\n**\u300c\u6bce\u65e5\u5c4a\u304f\u5927\u91cf\u306e\u55b6\u696d\u30e1\u30fc\u30eb\u51e6\u7406\u306b\u8ffd\u308f\u308c\u3001\u672c\u6765\u306e\u5546\u8ac7\u30fb\u30de\u30c3\u30c1\u30f3\u30b0\u63d0\u6848\u306b\u6642\u9593\u304c\u5272\u3051\u306a\u3044\u300d** \u3068\u3044\u3046IT\u4eba\u6750\u30fbSES\u696d\u754c\u5171\u901a\u306e\u8ab2\u984c\u306b\u5bfe\u3057\u3001**Mighty Link AI Connect** \u306f AI\uff08Gemini 3.5/3.6\uff09\u306b\u3088\u308b\u81ea\u52d5\u53d6\u308a\u8fbc\u307f\u30fb\u8981\u4ef6\u62bd\u51fa\u30fb\u30ea\u30a2\u30eb\u30bf\u30a4\u30e0\u53cc\u65b9\u5411\u30de\u30c3\u30c1\u30f3\u30b0\u6a5f\u80fd\u3092\u63d0\u4f9b\u3057\u307e\u3059\u3002\n\n1\u65e51,000\u4ef6\u898f\u6a21\uff08\u6708\u9593\u7d0430,000\u4ef6\uff09\u306e\u5b9f\u55b6\u696d\u30e1\u30fc\u30eb\u3092\u5168\u4ef6\u81ea\u52d5\u89e3\u6790\u30fbDB\u5316\u3057\u3001**\u55b6\u696d\u5de5\u6570\u3092\u6708\u9593\u6700\u592750\u6642\u9593\u524a\u6e1b**\u3057\u306a\u304c\u3089\u3001**\u30b9\u30ad\u30eb\u30de\u30c3\u30c1\u30f3\u30b0\u7cbe\u5ea680%\u4ee5\u4e0a**\u3092\u5b9f\u8a3c\u3057\u3066\u3044\u307e\u3059\u3002\n\n```\n\u3010\u5f93\u6765\u306e\u624b\u52d5\u904b\u7528\u3011\n\u55b6\u696d\u30e1\u30fc\u30eb\u53d7\u4fe1 \u2794 \u76ee\u8996\u78ba\u8a8d\u30fb\u8981\u7d04 \u2794 \u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u624b\u5165\u529b \u2794 \u8981\u54e1\u30fb\u6848\u4ef6\u306e\u624b\u52d5\u30de\u30c3\u30c1\u30f3\u30b0\uff08\u6708\u9593\u7d0460\u6642\u9593\uff09\n\u3000\u3000\u25bc\n\u3010Mighty Link AI Connect \u5c0e\u5165\u5f8c\u3011\n\u30e1\u30fc\u30eb\u81ea\u52d5\u89e3\u6790\u30fbDB\u5316 \u2794 AI\u53cc\u65b9\u5411\u9ad8\u7cbe\u5ea6\u30de\u30c3\u30c1\u30f3\u30b0 \u2794 \u7d71\u5408\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3067\u627f\u8a8d\u30fb\u63d0\u6848\uff08\u6708\u9593\u7d0410\u6642\u9593\uff09\n \u2794 \u55b6\u696d\u5de5\u6570 83% \u524a\u6e1b\uff08\u670850\u6642\u9593\u306e\u5275\u51fa\uff09\uff01\n```\n\n---\n\n## 2. \u5b9f\u8a3c\u3055\u308c\u305f\u5b9a\u91cf\u52b9\u679c\u30fb\u6210\u679c\u6307\u6a19\uff08KPI\uff09\n\n2026-07-23\u6642\u70b9\u306e\u672c\u756a\u5b9f\u74b0\u5883\u30c7\u30fc\u30bf\uff081\u65e51,000\u4ef6\u30b9\u30b1\u30fc\u30eb\u51e6\u7406\uff09\u306b\u57fa\u3065\u304f\u691c\u8a3c\u7d50\u679c\uff1a\n\n| \u8a55\u4fa1\u9805\u76ee | \u5f93\u6765\u306e\u624b\u52d5\u904b\u7528 | Mighty Link AI Connect | \u55b6\u696d\u6539\u5584\u52b9\u679c |\n| --- | --- | --- | --- |\n| **\u30e1\u30fc\u30eb\u51e6\u7406\u6642\u9593 / 100\u4ef6** | \u7d04 2.5 \u6642\u9593 | **\u7d04 15 \u5206**\uff08AI\u62bd\u51fa\uff0b\u30ec\u30d3\u30e5\u30fc\uff09 | **90% \u524a\u6e1b** |\n| **\u6708\u9593\u55b6\u696d\u5de5\u6570 / 1\u62c5\u5f53** | \u7d04 60 \u6642\u9593 | **\u7d04 10 \u6642\u9593** | **\u670850\u6642\u9593\u306e\u5275\u51fa** |\n| **\u30b9\u30ad\u30eb\u62bd\u51fa\u30fb\u8981\u4ef6\u9069\u5408\u7387** | \u4eba\u624b\u306b\u3088\u308b\u30d0\u30e9\u3064\u304d\uff0860~70%\uff09 | **80% \u4ee5\u4e0a**\uff08Gemini AI\u69cb\u9020\u5316\uff09 | **\u7cbe\u5ea6\u5411\u4e0a\u30fb\u629c\u3051\u6f0f\u308c\u30bc\u30ed** |\n| **\u30de\u30c3\u30c1\u30f3\u30b0\u56de\u7b54\u901f\u5ea6** | \u53d7\u4fe1\u304b\u3089 4\u301c24 \u6642\u9593 | **\u30ea\u30a2\u30eb\u30bf\u30a4\u30e0\uff08\u6570\u5206\u4ee5\u5185\uff09** | **\u5148\u65b9\u63d0\u6848\u901f\u5ea6\u306e\u98db\u8e8d\u7684\u5411\u4e0a** |\n| **\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u30fb\u500b\u4eba\u60c5\u5831** | \u30e1\u30fc\u30eb\u8ee2\u9001\u30fb\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u6563\u9038 | **\u751fPII\u975e\u4fdd\u5b58\u30fb\u76e3\u67fb\u30ed\u30b0\u30fbRLS\u9069\u7528** | **\u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\u5b8c\u5168\u6e96\u62e0** |\n\n---\n\n## 3. \u4e3b\u306a\u6a5f\u80fd\u3068\u55b6\u696d\u6d3b\u7528\u30b7\u30ca\u30ea\u30aa\n\n### \u2460 1\u65e51,000\u4ef6\u898f\u6a21\u306e\u55b6\u696d\u30e1\u30fc\u30eb\u81ea\u52d5\u89e3\u6790\u30fbDB\u5316\n- **\u81ea\u52d5\u9023\u643a**: \u5171\u6709\u55b6\u696d\u30a2\u30c9\u30ec\u30b9\uff08POP3/Graph API/Webhook\u7b49\uff09\u5b9b\u306e\u6848\u4ef6\u30fb\u4eba\u6750\u30e1\u30fc\u30eb\u3092\u30ea\u30a2\u30eb\u30bf\u30a4\u30e0\u5168\u4ef6\u53d6\u308a\u8fbc\u307f\u3002\n- **AI\u69cb\u9020\u5316\u62bd\u51fa**: \u5fc5\u9808\u30b9\u30ad\u30eb\u3001\u5c1a\u53ef\u30b9\u30ad\u30eb\u3001\u5358\u4fa1\u3001\u52e4\u52d9\u5730\u3001\u30ea\u30e2\u30fc\u30c8\u53ef\u5426\u3001\u7a3c\u50cd\u6642\u671f\u3001\u5546\u6d41\u3092\u81ea\u52d5\u62bd\u51fa\u3002\n\n### \u2461 \u8981\u54e1 \u00d7 \u6848\u4ef6\u306eAI\u53cc\u65b9\u5411\u9ad8\u7cbe\u5ea6\u30de\u30c3\u30c1\u30f3\u30b0\n- **\u5373\u6642\u30b9\u30b3\u30a2\u30ea\u30f3\u30b0**: \u6848\u4ef6\u8981\u4ef6\u3068\u6c42\u8077\u8005\u30fb\u30d1\u30fc\u30c8\u30ca\u30fc\u8981\u54e1\u306e\u6761\u4ef6\u3092\u30d1\u30fc\u30bb\u30f3\u30bf\u30a4\u30eb\u6bd4\u3067AI\u5224\u5b9a\u3002\n- **\u9069\u5408\u6839\u62e0\u306e\u53ef\u8996\u5316**: \u5358\u306a\u308b\u30b9\u30b3\u30a2\u3060\u3051\u3067\u306a\u304f\u3001\u300c\u9069\u5408\u7406\u7531\u30fb\u975e\u9069\u5408\u7406\u7531\u300d\u3092\u30c6\u30ad\u30b9\u30c8\u3067\u660e\u793a\u3057\u3001\u55b6\u696d\u5224\u65ad\u3092\u30b5\u30dd\u30fc\u30c8\u3002\n\n### \u2462 \u7d71\u5408\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\uff08\u7ba1\u7406\u8005\u30fb\u55b6\u696d\u5411\u3051\u5171\u901a\u753b\u9762\uff09\n- **\u4e00\u5143\u7ba1\u7406**: \u9069\u6027\u8a3a\u65ad\u3001\u52e4\u6020\u7ba1\u7406\u3001\u55b6\u696d\u30e1\u30fc\u30eb\u30de\u30c3\u30c1\u30f3\u30b0\u7d50\u679c\u3092\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u4fdd\u8b77\u3055\u308c\u305fWeb\u753b\u9762\uff08Basic\u8a8d\u8a3c/\u30e6\u30fc\u30b6\u30fc\u8a8d\u8a3c\uff09\u3067\u3072\u3068\u76ee\u3067\u78ba\u8a8d\u53ef\u80fd\u3002\n- **\u4eba\u9593\u306e\u6700\u7d42\u30c1\u30a7\u30c3\u30af\uff08Human-in-the-Loop\uff09**: AI\u306e\u63d0\u6848\u3092\u4eba\u9593\u304c1\u30af\u30ea\u30c3\u30af\u3067\u30ec\u30d3\u30e5\u30fc\u30fb\u627f\u8a8d\u3057\u3066\u63d0\u6848\u3078\u79fb\u884c\u3002\n\n---\n\n## 4. \u5c0e\u5165\u8cbb\u7528\u30fb\u6599\u91d1\u30d7\u30e9\u30f3\uff08\u4fa1\u683c\u4ed5\u69d8\uff09\n\n\u67d4\u8edf\u306b\u5c0e\u5165\u3092\u958b\u59cb\u3067\u304d\u308b3\u3064\u306e\u30d7\u30e9\u30f3\u3092\u7528\u610f\u3057\u3066\u3044\u307e\u3059\uff08Standard: \u00a59,800/\u6708\uff08\u7a0e\u8fbc \u00a510,780\uff09\u3001Pro: \u00a529,800/\u6708\uff08\u7a0e\u8fbc \u00a532,780\uff09\u3001\u5e74\u984d\u6255\u3044\u306f10%\u30aa\u30d5\uff09\u3002\n\n```\n+------------------------+------------------------+------------------------+\n|       Free \u30d7\u30e9\u30f3       |     Standard \u30d7\u30e9\u30f3    |       Pro \u30d7\u30e9\u30f3       |\n|      \u00a50 / \u6708 (\u7121\u511f)     |    \u00a59,800 / \u6708 (\u7a0e\u5225)   |   \u00a529,800 / \u6708 (\u7a0e\u5225)  |\n+------------------------+------------------------+------------------------+\n| \u30fb\u57fa\u790e\u8a3a\u65ad/\u52e4\u6020\u6a5f\u80fd     | \u30fbFree\u306e\u5168\u6a5f\u80fd         | \u30fbStandard\u306e\u5168\u6a5f\u80fd     |\n| \u30fb\u55b6\u696d\u30e1\u30fc\u30eb\u89e3\u6790 50\u4ef6/\u6708 | \u30fb\u55b6\u696d\u30e1\u30fc\u30eb 1,000\u4ef6/\u6708| \u30fb\u55b6\u696d\u30e1\u30fc\u30eb \u7121\u5236\u9650    |\n| \u30fbBasic Auth\u30c7\u30e2\u30a2\u30af\u30bb\u30b9 | \u30fbAI\u53cc\u65b9\u5411\u30de\u30c3\u30c1\u30f3\u30b0   | \u30fb\u9ad8\u5ea6AI\u5206\u6790\u30fbAPI\u9023\u643a   |\n| \u30fb\u30b3\u30df\u30e5\u30cb\u30c6\u30a3\u30b5\u30dd\u30fc\u30c8  | \u30fb\u30e1\u30fc\u30eb\u30b5\u30dd\u30fc\u30c8 (SLA) | \u30fb\u5c02\u4efb\u30b5\u30dd\u30fc\u30c8/\u30ab\u30b9\u30bf\u30e0  |\n+------------------------+------------------------+------------------------+\n```\n\n---\n\n## 5. \u500b\u5225\u5546\u8ac7\u30fb\u5b9f\u6f14\u30c7\u30e2\u306e\u3054\u6848\u5185\n\n\u5b9f\u969b\u306e\u7d71\u5408\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u753b\u9762\u3068AI\u30de\u30c3\u30c1\u30f3\u30b0\u52d5\u4f5c\u3092\u3054\u78ba\u8a8d\u3044\u305f\u3060\u3051\u308b\u30c7\u30e2\u74b0\u5883\u3092\u3054\u6848\u5185\u3057\u3066\u304a\u308a\u307e\u3059\u3002\n\n1. **\u516c\u958b\u30c7\u30e2URL**: [https://kanta13jp1.github.io/mighty-link-ai-connect/](https://kanta13jp1.github.io/mighty-link-ai-connect/)\n2. **\u672c\u756a\u5b9f\u74b0\u5883URL**: `https://mightylink-app.com` \uff08\u8a8d\u8a3c\u30ac\u30fc\u30c9\u4ed8\u304d\u7d71\u5408\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\uff09\n3. **\u500b\u5225\u5546\u8ac7\u30fb\u30c7\u30e2\u5b9f\u6f14\uff0815\u5206\u301c30\u5206\uff09**:\n   - \u8cb4\u793e\u306e\u55b6\u696d\u30e1\u30fc\u30eb\u30b5\u30f3\u30d7\u30eb\u3092\u7528\u3044\u305fAI\u62bd\u51fa\u30fb\u30de\u30c3\u30c1\u30f3\u30b0\u7cbe\u5ea6\u306e\u30c7\u30e2\u30f3\u30b9\u30c8\u30ec\u30fc\u30b7\u30e7\u30f3\n   - \u8cb4\u793e\u306e\u55b6\u696d\u5de5\u6570\u524a\u6e1b\u30b7\u30df\u30e5\u30ec\u30fc\u30b7\u30e7\u30f3\u306e\u3054\u63d0\u793a\n\n---\n\n## 6. \u304a\u554f\u3044\u5408\u308f\u305b\u30fb\u304a\u7533\u3057\u8fbc\u307f\u7a93\u53e3\n\n- **\u30b5\u30fc\u30d3\u30b9\u540d\u79f0**: Mighty Link AI Connect\n- **\u904b\u55b6\u4e8b\u696d\u8005**: \u682a\u5f0f\u4f1a\u793e Mighty Link\n- **\u304a\u554f\u3044\u5408\u308f\u305b\u7a93\u53e3**: `k-umezawa@ml-mightylink.com` / \u30b5\u30dd\u30fc\u30c8\u30c7\u30b9\u30af\n- **\u95a2\u9023\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8**:\n  - [\u30b5\u30fc\u30d3\u30b9\u6599\u91d1\u30d7\u30e9\u30f3\u4ed5\u69d8\u66f8](PRICING_PLAN_SPECIFICATION.md)\n  - [\u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\
