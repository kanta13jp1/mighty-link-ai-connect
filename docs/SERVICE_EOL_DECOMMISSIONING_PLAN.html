u4f4d\u7f6e\u3065\u3051\u3068\u767a\u52d5\u6761\u4ef6\n\n\u30e9\u30a4\u30d5\u30b5\u30a4\u30af\u30eb\u306e\u6700\u7d42\u5de5\u7a0b\uff08\u4f01\u753b \u2192 \u8a2d\u8a08 \u2192 \u5b9f\u88c5 \u2192 \u30c6\u30b9\u30c8 \u2192 \u30ea\u30ea\u30fc\u30b9 \u2192 \u5b9f\u904b\u7528 \u2192 \u4fdd\u5b88 \u2192 **\u7d42\u4e86\u30fb\u5ec3\u6b62**\uff09\u3092\u62c5\u3046\u8a08\u753b\u3067\u3059\u3002\n\u3053\u308c\u307e\u3067 [T781](USER_DATA_SELF_EXPORT_RUNBOOK.md) \u304c\u30c7\u30fc\u30bf\u6301\u3061\u51fa\u3057\u624b\u6bb5\u3092\u3001[\u30b5\u30fc\u30d3\u30b9\u51cd\u7d50 Runbook](AI_SAAS_SERVICE_FREEZE_RUNBOOK.md) \u304c\u30d9\u30f3\u30c0\u30fc\u7248\u306e\u51cd\u7d50\u3092\u6271\u3063\u3066\u3044\u307e\u3057\u305f\u304c\u3001**\u7d42\u4e86\u305d\u306e\u3082\u306e\u306e\u5b9f\u884c\u9806\u5e8f\u3068\u62c5\u5f53**\u306f\u672a\u5b9a\u7fa9\u3067\u3057\u305f\u3002\u672c\u66f8\u304c\u305d\u308c\u3092\u57cb\u3081\u307e\u3059\u3002\n\n**\u767a\u52d5\u6761\u4ef6**: \u6b21\u306e\u3044\u305a\u308c\u304b\u304c\u4eba\u9593\u306e\u610f\u601d\u6c7a\u5b9a\u3068\u3057\u3066\u8a18\u9332\u3055\u308c\u305f\u3068\u304d\u3002\n\n| \u767a\u52d5\u4e8b\u7531 | \u5224\u65ad\u8005 | \u8a18\u9332\u5148 |\n| --- | --- | --- |\n| \u4e8b\u696d\u7d42\u4e86\u30fb\u30b5\u30fc\u30d3\u30b9\u5ec3\u6b62\u306e\u7d4c\u55b6\u5224\u65ad | \u793e\u9577 | \u8b70\u4e8b\u9332 + `data/WBS.tsv` + \u8ab2\u984c\u7ba1\u7406\u8868 |\n| \u6709\u511f\u5316\u5f8c\u306e\u64a4\u9000\uff08\u8ab2\u91d1\u505c\u6b62\u3092\u8d85\u3048\u308b\u5b8c\u5168\u7d42\u4e86\uff09 | \u793e\u9577 | [\u6709\u511f\u516c\u958b Go/No-Go \u610f\u601d\u6c7a\u5b9a\u30d1\u30c3\u30b1\u30fc\u30b8](PAID_LAUNCH_GO_NO_GO_DECISION_PACK_2026-07-24.md) \u00a75 |\n| \u4e8b\u696d\u8b72\u6e21\u30fb\u4f1a\u793e\u30a2\u30ab\u30a6\u30f3\u30c8\u79fb\u7ba1\u306b\u4f34\u3046\u73fe\u69cb\u6210\u306e\u5ec3\u6b62 | \u793e\u9577 + \u904b\u7528\u62c5\u5f53 | [\u30a2\u30ab\u30a6\u30f3\u30c8\u79fb\u884c Runbook](ACCOUNT_OWNERSHIP_MIGRATION_RUNBOOK.md) |\n\n> \u8ab2\u91d1\u306e\u4e0 e9\u64a4\u53ce\uff087\uff09\u3092\u884c\u3046\u3053\u3068\u3002\n- \u8a3c\u8de1\u4fdd\u5b58\uff088\uff09\u3088\u308a\u5148\u306b\u5916\u90e8\u30b5\u30fc\u30d3\u30b9\u89e3\u7d04\uff086\uff09\u30fb\u30a4\u30f3\u30d5\u30e9\u64a4\u53ce\uff087\uff09\u3092\u884c\u3046\u3053\u3068\u3002\u89e3\u7d04\u5f8c\u306f\u76e3\u67fb\u30ed\u30b0\u30fb\u8acb\u6c42\u66f8\u3092\u53d6\u5f97\u3067\u304d\u306a\u304f\u306a\u308b\u3002\n- \u8ab2\u91d1\u505c\u6b62\uff084\uff09\u3060\u3051\u3092\u5148\u884c\u3055\u305b\u3066\u901a\u77e5\uff082\uff09\u3092\u7701\u304f\u3053\u3068\u3002\u5951\u7d04\u4e0a\u306e\u544a\u77e5\u7fa9\u52d9\u3092\u6e80\u305f\u3055\u306a\u3044\u3002\n\n## 3. \u4e8b\u524d\u901a\u77e5\uff08\u5de5\u7a0b2\uff09\n\n- \u6839\u62e0\u6761\u9805: [\u5229\u7528\u898f\u7d04](TERMS_OF_SERVICE.md) **\u7b2c15\u6761\uff08\u30b5\u30fc\u30d3\u30b9\u5185\u5bb9\u306e\u5909\u66f4\u30fb\u7d42\u4e86\uff09**\u3002\n- **\u544a\u77e5\u671f\u9593\u306f\u672c\u8a08\u753b\u3067\u306f\u78ba\u5b9a\u3057\u306a\u3044\u3002** \u898f\u7d04 \u7b2c15\u6761\u306e\u544a\u77e5\u671f\u9593\u306f\u73fe\u5728 **\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011** \u306e\u672a\u78ba\u5b9a\u9805\u76ee\u3067\u3042\u308a\u3001\u78ba\u5b9a\u306f\u6cd5\u52d9\u78ba\u8a8d\uff08T798\uff09\u306b\u59d4\u306d\u308b\u3002\u5b9f\u884c\u6642\u306f\u898f\u7d04\u306e\u78ba\u5b9a\u5024\u306b\u5f93\u3046\u3053\u3068\u3002\n  - \u672a\u78ba\u5b9a\u9805\u76ee\u306e\u7ba1\u7406\u53f0\u5e33: `data/legal_review_signoff.tsv` \u304a\u3088\u3073 [\u6cd5\u52d9\u78ba\u8a8d\u30b5\u30a4\u30f3\u30aa\u30d5\u53f0\u5e33](LEGAL_REVIEW_SIGNOFF_TRACKER.md)\n  - \u672c\u8a08\u753b\u3067\u5177\u4f53\u7684\u306a\u65e5\u6570\u3092\u65ad\u5b9a\u3057\u3066\u306f\u306a\u3089\u306a\u3044\uff08\u78ba\u5b9a\u524d\u306b\u65e5\u6570\u3092\u7d04\u675f\u3059\u308b\u3068\u5951\u7d04\u4e0a\u306e\u9f5f\u9f6c\u306b\u306a\u308b\uff09\u3002\n- \u901a\u77e5\u624b\u6bb5: \u30b5\u30fc\u30d3\u30b9\u5185\u63b2\u793a\u3001\u767b\u9332\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u5b9b\
