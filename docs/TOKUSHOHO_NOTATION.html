*: \u30d7\u30e9\u30f3\u306e\u5229\u7528\u53ef\u80fd\u91cf\uff08\u8a3a\u65ad\u56de\u6570\u4e0a\u9650\u30fb\u30e6\u30fc\u30b6\u30fc\u6570\u7b49\uff09\n2. **\u8ca9\u58f2\u4fa1\u683c\u30fb\u5bfe\u4fa1**: \u7a0e\u8fbc\u4fa1\u683c\u3002\u30b5\u30d6\u30b9\u30af\u306f\u66f4\u65b0\u3054\u3068\u306e\u91d1\u984d\u3001\u5f93\u91cf\u8ab2\u91d1\u306f\u5358\u4fa1\u3068\u7b97\u5b9a\u65b9\u6cd5\n3. **\u652f\u6255\u306e\u6642\u671f\u30fb\u65b9\u6cd5**: \u521d\u56de\u8ab2\u91d1\u65e5\u3068\u66f4\u65b0\u8ab2\u91d1\u65e5\n4. **\u5f79\u52d9\u306e\u63d0\u4f9b\u6642\u671f**: \u6c7a\u6e08\u5b8c\u4e86\u5f8c\u76f4\u3061\u306b\u5229\u7528\u53ef\u80fd\u3067\u3042\u308b\u65e8\n5. **\u7533\u8fbc\u671f\u9593\u306e\u5b9a\u3081\u304c\u3042\u308b\u3068\u304d\u306f\u305d\u306e\u65e8**\n6. **\u7533\u8fbc\u307f\u306e\u64a4\u56de\u30fb\u89e3\u9664\u306b\u95a2\u3059\u308b\u4e8b\u9805**: \u89e3\u7d04\u65b9\u6cd5\u30fb\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc\u306e\u8981\u65e8\u3068\u8a73\u7d30\u30da\u30fc\u30b8\u3078\u306e\u30ea\u30f3\u30af\n\n> [!WARNING]\n> \u5b9a\u671f\u8cfc\u5165\uff08\u30b5\u30d6\u30b9\u30af\u30ea\u30d7\u30b7\u30e7\u30f3\uff09\u3067\u3042\u308b\u3053\u3068\u3092\u6700\u7d42\u78ba\u8a8d\u753b\u9762\u3067\u660e\u793a\u3057\u306a\u3044\u5b9f\u88c5\u306f\u7279\u5546\u6cd5\u9055\u53cd\uff08\u8aa4\u8a8d\u3055\u305b\u308b\u8868\u793a\u306e\u7981\u6b62\uff09\u3068\u306a\u308b\u305f\u3081\u3001Stripe Checkout \u306e `custom_text` / \u78ba\u8a8d\u753b\u9762\u6587\u8a00\u3067\u300c\u6bce\u6708\u81ea\u52d5\u66f4\u65b0\u3055\u308c\u308b\u300d\u65e8\u3092\u5fc5\u305a\u8868\u793a\u3059\u308b\u3002\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011\u6587\u8a00\u306e\u6700\u7d42\u78ba\u8a8d\u3002\n\n---\n\n## \u516c\u958b\u30fb\u904b\u7528\u30eb\u30fc\u30eb\n\n- **\u672c\u8868\u8a18\u30da\u30fc\u30b8\u306e\u6b63\u5f0f\u516c\u958b\u78ba\u8a8d\u306f Stripe \u30a2\u30ab\u30a6\u30f3\u30c8\u5be9\u67fb\uff08JCB \u5be9\u67fb\u542b\u3080\uff09\u306e\u524d\u63d0\u8981\u4ef6**\uff08Stripe \u516c\u5f0f: \u4e8b\u696d\u8005\u30b5\u30a4\u30c8\u306b\u540d\u79f0\u30fb\u4f4f\u6240\u30fb\u9023\u7d61\u5148\u30fb\u4fa1\u683c\u30fb\u8fd4\u91d1\u6761\u4ef6\u30fb\u652f\u6255\u6642\u671f/\u65b9\u6cd5\u30fb\u63d0\u4f9b\u6642\u671f\u306e\u8868\u8a18\u30da\u30fc\u30b8\u304c\u5fc5\u8981\uff09\u3002\u6709\u511f\u516c\u958b\uff08T862 \u5224\u65ad\u5f8c\u306e Stripe live \u9069\u7528\uff09\u306e\u524d\u306b T798 \u78ba\u5b9a\u7d50\u679c\u3068\u6700\u7d42\u4fa1\u683c\u3092\u53cd\u6620\u3059\u308b\u3002\n- \u516c\u958b\u30da\u30fc\u30b8\u306f\u5229\u7528\u898f\u7d04\u30fb\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u3068\u540c\u3058\u6cd5\u5b9a\u30da\u30fc\u30b8\u7fa4\u3068\u3057\u3066\u30d5\u30c3\u30bf\u30fc\u304b\u3089\u5e38\u6642\u30ea\u30f3\u30af\u3059\u308b\uff08T777\u5b8c\u4e86\u6e08\u307f\uff09\u3002\n- \u4e8b\u696d\u8005\u60c5\u5831\u30fb\u4fa1\u683c\u30fb\u652f\u6255\u6761\u4ef6\u306b\u5909\u66f4\u304c\u751f\u3058\u305f\u5834\u5408\u306f\u3001`docs/TERMS_AND_PRIVACY_ANNUAL_REVIEW_PROCESS.md` \u306e\u6539\u5b9a\u30d7\u30ed\u30bb\u30b9\u306b\u6e96\u3058\u3066\u672c\u8868\u8a18\u3082\u540c\u6642\u6539\u5b9a\u3059\u308b\u3002\n- \u672c\u8868\u8a18\u306e\u78ba\u5b9a\u524d\u306b\u6709\u511f\u30d7\u30e9\u30f3\u306e\u8ca9\u58f2\u3092\u958b\u59cb\u3057\u306a\u3044\uff08T791 \u306e\u524d\u63d0\u6761\u4ef6\uff09\u3002\n\n## \u95a2\u9023\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\n\n- [\u30b5\u30fc\u30d3\u30b9\u5229\u7528\u898f\u7d04\uff08\u521d\u7248\u30c9\u30e9\u30d5\u30c8\uff09](TERMS_OF_SERVICE.md)\n- [\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\uff08\u521d\u7248\u30c9\u30e9\u30d5\u30c8\uff09](PRIVACY_POLICY.md)\n- [\u8ab2\u91d1\u898f\u7d04\u30fb\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc\uff08\u521d\u7248\u30c9\u30e9\u30d5\u30c8\uff09](BILLING_AND_REFUND_POLICY.md)\n- [Stripe Billing \u7d71\u5408\u8a2d\u8a08\uff08T776\uff09](STRIPE_BILLING_INTEGRATION_DESIGN.md)\n- [\u5229\u7528\u898f\u7d04\u30fb\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u5e74\u6b21\u898b\u76f4\u3057\u3
