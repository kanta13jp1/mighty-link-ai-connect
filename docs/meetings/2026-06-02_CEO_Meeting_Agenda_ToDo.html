    <script>
        const rawMarkdown = "# 2026-06-02 \u793e\u9577\u6253\u3061\u5408\u308f\u305b \u5f53\u65e5\u30a2\u30b8\u30a7\u30f3\u30c0 \uff06 ToDo\u30ea\u30b9\u30c8\n\n\u672c\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u306f\u30012026\u5e746\u67082\u65e5\u306e\u793e\u9577\u6253\u3061\u5408\u308f\u305b\uff08Google Meet\uff09\u3092\u30ce\u30fc\u30df\u30b9\u3067\u9032\u884c\u3057\u3001\u6700\u9ad8\u7cbe\u5ea6\u306e\u30d7\u30ec\u30bc\u30f3\u30c6\u30fc\u30b7\u30e7\u30f3\u3068\u610f\u601d\u6c7a\u5b9a\u3092\u884c\u3046\u305f\u3081\u306e\u5f53\u65e5\u7528ToDo\u30ea\u30b9\u30c8\u3067\u3059\u3002\n\n---\n\n## \ud83d\udcc5 \u5f53\u65e5\u306e\u9032\u884c ToDo\u30ea\u30b9\u30c8 (\u30c1\u30a7\u30c3\u30af\u30dc\u30c3\u30af\u30b9\u4ed8\u304d)\n\n### 1. \u4f1a\u8b70\u524d\u306e\u6e96\u5099\u30d5\u30a7\u30fc\u30ba (\u958b\u59cb10\u5206\u524d\u307e\u3067)\n\n- [ ] Google Meet \u3092\u8d77\u52d5\u3057\u3001**\u300cGemini\u306b\u3088\u308b\u9332\u753b\u3068\u6587\u5b57\u8d77\u3053\u3057\uff08\u8b70\u4e8b\u9332\u81ea\u52d5\u4f5c\u6210\uff09\u300d\u3092\u6709\u52b9** \u306b\u3059\u308b\u3002\n- [ ] \u30d6\u30e9\u30a6\u30b6\u306e\u30bf\u30d6\u306b\u4ee5\u4e0b\u306e3\u3064\u3092\u4e8b\u524d\u306b\u958b\u3044\u3066\u304a\u304f\u3002\n  - **\u516c\u958b\u30c7\u30e2URL**: [https://kanta13jp1.github.io/mighty-link-ai-connect/](https://kanta13jp1.github.io/mighty-link-ai-connect/)\n  - **WBS\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8**: [Mighty-Link AI Connect WBS](https://docs.google.com/spreadsheets/d/1L99HCBHr4IsVUWqnUuG6OgoUmxEQUdfaYQim1n6etB8)\n  - **Google\u30ab\u30ec\u30f3\u30c0\u30fc** (Mighty Skill-Bridge \u958b\u767a\u8a08\u753b\u30ab\u30ec\u30f3\u30c0\u30fc)\n\n---\n\n### 2. \u30aa\u30fc\u30d7\u30cb\u30f3\u30b0 & \u5230\u9054\u5b9f\u7e3e\u306e\u30c7\u30e2\u5b9f\u6f14 (\u6240\u8981: 15\u5206)\n\n- [ ] **Jekyll build\u30d0\u30a4\u30d1\u30b9\u6210\u529f\u3068\u516c\u958b\u30c7\u30e2\u306e\u63d0\u793a**:\n  - Jekyll\u306e\u30b3\u30f3\u30d1\u30a4\u30eb\u30a8\u30e9\u30fc\u3092 `.nojekyll` \u306e\u8ff
