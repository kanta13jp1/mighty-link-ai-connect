    <script>
        const rawMarkdown = "# \ud83d\udcc9 Mighty Skill-Bridge: API & \u6708\u984d\u30b3\u30b9\u30c8\u5b9f\u6e2c\u30ec\u30dd\u30fc\u30c8 - 2026\u5e746\u6708 \u7b2c1\u9031\u76ee (COST_REPORT_2026-06.md)\n\n> **Mighty-Link AI Connect: Project \"Mighty Skill-Bridge\"**\n> *3\u30c4\u30fc\u30eb\u4e26\u8d70AI\u99c6\u52d5\u958b\u767a\u4f53\u5236\u306b\u304a\u3051\u308bAPI\u5229\u7528\u6599\u3001\u56fa\u5b9a\u30a4\u30f3\u30d5\u30e9\u8cbb\u7528\u3001\u304a\u3088\u3073\u5b89\u5168\u4e88\u7b97\u30e1\u30fc\u30bf\u30fc\uff08R11\u5bfe\u5fdc\uff09\u306e\u5b9f\u6e2c\u76e3\u67fb\u30ec\u30dd\u30fc\u30c8*\n\n---\n\n## 1. \u6982\u8981\u3068\u76ee\u7684\n\n\u672c\u5831\u544a\u66f8\u306f\u3001WBS\u30bf\u30b9\u30af **T707** \u304a\u3088\u3073\u30ea\u30b9\u30af\u7ba1\u7406\u9805\u76ee **R11 (\u6708\u984d\u30b3\u30b9\u30c8\u8d85\u904e\u30ea\u30b9\u30af)** \u306b\u57fa\u3065\u304d\u3001Antigravity + Gemini\u3001VSCode + Codex\u3001VSCode + Claude Code\u306e3\u30c4\u30fc\u30eb\u4e26\u8d70\u958b\u767a\u306b\u304a\u3051\u308b\u3001**2026\u5e746\u6708\u7b2c1\u9031\u76ee (6/1\u301c6/7) \u306e\u5b9f\u6e2c\u30b3\u30b9\u30c8**\u3092\u76e3\u67fb\u3057\u305f\u3082\u306e\u3067\u3059\u3002\n\n\u793e\u9577\u3068\u306e\u6253\u3061\u5408\u308f\u305b\u8ad6\u70b9 **Q-OPS-09** \u306b\u304a\u3044\u3066\u5408\u610f\u3057\u305f\u300c\u6708\u984d\u30b3\u30b9\u30c8\u4e0a\u9650\u5024 \u00a510,000 (\u307e\u305f\u306f\u5b9f\u5229\u7528\u306b\u5fdc\u3058\u305f\u30bb\u30fc\u30d5\u30ac\u30fc\u30c9\u95be\u5024)\u300d\u306b\u5bfe\u3057\u3001\u73fe\u5728\u306e\u6d88\u5316\u5b9f\u7e3e\u30681\u30f6\u6708\u306e\u7740\u5730\u4e88\u6e2c\u3001\u304a\u3088\u3073 Firebase \uff06 Supabase \u69cb\u6210\u6c7a\u5b9a\u306b\u4f34\u3046\u30a4\u30f3\u30d5\u30e9\u56fa\u5b9a\u8cbb\u306e\u5287\u7684\u306a\u524a\u6e1b\u6210\u679c\u3092\u5831\u544a\u3057\u307e\u3059\u3002\n\n---\n\n## 2. \u7b2c1\u9031\u76ee (6/1 \u301c 6/7) \u30b3\u30b9\u30c8\u5b9f\u6e2c\u5024\n\n3\u3064\u306eAI\u958b\u767a\u30ec\u30fc\u30f3\u304a\u3088\u3073\u672c\u756a/\u30 u30b9 (\u30a4\u30f3\u30d5\u30e9)** | Supabase (PostgreSQL) | \u30b5\u30fc\u30d0\u30ec\u30b9\u7121\u6599\u67a0 | **$0.00 / \u5b8c\u5168\u7121\u6599** | **$0.00** | 500MB\u307e\u3067\u306ePostgreSQL\u30c7\u30fc\u30bf\u30d9\u30fc\u30b9\u3068\u81ea\u52d5REST API\u3092\u5b8c\u5168\u7121\u6599\u3067\u7a3c\u50cd\u3002 |\n| **Google Workspace \u9023\u643a** | Google Workspace API | \u65e2\u5b58\u5951\u7d04\u306b\u5185\u5305 | **$0.00 (\u8ffd\u52a0\u306a\u3057)** | **$0.00** | <k-umezawa@ml-mightylink.com> \u30a2\u30ab\u30a6\u30f3\u30c8\u306e\u65e2\u5b58\u67a0\u3092\u5229\u7528\u3057\u3001\u8ffd\u52a0\u8cbb\u7528\u306f\u4e00\u5207\u4e0d\u8981\u3002 |\n| **\u5408\u8a08\u500b\u5225\u8ffd\u52a0\u30b3\u30b9\u30c8** | \u2014 | \u2014 | **$1.20 (\u7d04 180\u5186)** | **\u7d04 750\u5186 / \u6708** | **\u4e88\u7b97\u4e0a\u9650 \u00a510,000 \u306b\u5bfe\u3057\u3001\u9032\u6357\u7387 7.5% \u3067\u5b89\u5168\u570f** |\n\n---\n\n## 3. \u30ea\u30b9\u30af R11 (\u30b3\u30b9\u30c8\u8d85\u904e) \u306b\u5bfe\u3059\u308b\u5b89\u5168\u30bb\u30fc\u30d5\u30ac\u30fc\u30c9\u306e\u9069\u7528\u72b6\u6cc1\n\n3\u30c4\u30fc\u30eb\u4e26\u8d70\u306b\u304a\u3051\u308b\u4e88\u7b97\u30aa\u30fc\u30d0\u30fc\u3092\u9632\u3050\u305f\u3081\u3001FastAPI (`src/app.py`) \u306b\u5b9f\u88c5\u3055\u308c\u305f**API\u30b5\u30fc\u30ad\u30c3\u30c8\u30d6\u30ec\u30fc\u30ab\u30fc (\u81ea\u52d5\u906e\u65ad\u6a5f\u80fd)** \u304c\u6b63\u5e38\u306b\u7a3c\u50cd\u3057\u3066\u3044\u308b\u3053\u3068\u3092\u76e3\u67fb\u3057\u307e\u3057\u305f\u3002\n\n### \u5b89\u5168\u30bb\u30fc\u30d5\u30ac\u30fc\u30c9\u306e\u4ed5\u69d8\u3068\u5b9f\u6e2c\u72b6\u6cc1\uff1a\n1. **Gemini API \u547c\u3073\u51fa\u3057\u30ab\u30a6\u30f3\u30bf\u30fc\u3068\u30c7\u30a4\u30ea\u30fc\u4e0a\u9650\u5236\u9650**:\n   * `GEMINI_DAILY_CALL_LIMIT` \u3092 **20\u56de / \u65e5** \u306b\u56fa\u5b9a\u3002\n   * `GEMINI_DAILY_REPORTED_TOKEN_LIMIT` \u3092 **100,000 \u30c8\u30fc\u30af\u30f3 / \u65e5** \u306b\u5236\u9650\u3002\n   * \u5b9f\u6e2c\u5024\uff1a1\u65e5\u3042\u305f\u308a\u306e\u5e73\u5747\u547c\u3073\u51fa\u3057\u56de\u6570\u306f 4\u301c8\u56de\u3067\u3042\u308a\u3001\u4e0a\u9650\u306e40%\u4ee5\u4e0b\u3067\u63a8\u79fb\u3002\n2. **\u81ea\u52d5\u30b5\u30fc\u30ad\u30c3\u30c8\u30d6\u30ec\u30fc\u30ab\u30fc\u306e\u691c\u77e5**:\n   * \u4e07\u304c\u4e00\u3001\u30a8\u30e9\u30fc\u306e\u7121\u9650\u30eb\u30fc\u30d7\u3084\u4e0d\u6b63\u30a2\u30af\u30bb\u30b9\u304c\u767a\u751f\u3057\u305f\u5834\u5408\u3001API\u304c\u81ea\u52d5\u7684\u306b\u691c\u77e5\u3057\u3066 Gemini API \u3078\u306e\u30ea\u30af\u30a8\u30b9\u30c8\u3092\u906e\u65ad\u3057\u3001` deterministic_fallback_response`\uff08\u6c7a\u5b9a\u8ad6\u7684\u30ed\u30fc\u30ab\u30eb\u9ad8\u901f\u30e2\u30c3\u30af\uff09\u3078\u5207\u308a\u66ff\u3048\u308b\u30ed\u30b8\u30c3\u30af\u304c\u6b63\u5e38\u306b\u4f5c\u52d5\u3057\u3066\u3044\u307e\u3059\u3002\n   * \u3053\u308c\u306b\u3088\u308a\u3001\u610f\u56f3\u3057\u306a\u3044\u6570\u4e07\u5186\u898f\u6a21\u306eAPI\u9ad8\u984d\u8acb\u6c42\u30ea\u30b9\u30af\u306f **100% \u6280\u8853\u7684\u306b\u6392\u9664** \u3055\u308c\u3066\u3044\u307e\u3059\u3002\n\n### 2026-06-10 \u8ffd\u8a18: T736 \u65e5\u6b21\u53f0\u5e33\u76e3\u67fb\u306e\u904b\u7528\u9069\u7528\n\n`scripts/audit_external_api_usage.py` \u3092\u8ffd\u52a0\u3057\u3001`data/external_api_usage.jsonl` \u304b\u3089\u4ee5\u4e0b\u3092\u65e5\u6b21\u3067\u76e3\u67fb\u3067\u304d\u308b\u3088\u3046\u306b\u3057\u307e\u3057\u305f\u3002\n\n- Seedance / Gemini \u306e\u64cd\u4f5c\u5225\u8ab2\u91d1\u5bfe\u8c61\u547c\u3073\u51fa\u3057\u56de\u6570\n- \u30d6\u30ed\u30c3\u30af\u6e08\u307f\u547c\u3073\u51fa\u3057\u56de\u6570\n- \u30d7\u30ed\u30d0\u30a4\u30c0\u30fc\u5fdc\u7b54\u306b\u542b\u307e\u308c\u308b\u5831\u544a\u30c8\u30fc\u30af\u30f3\u6570\n- \u65e5\u6b21\u547c\u3073\u51fa\u3057\u4e0a\u9650\u30fb\u5831\u544a\u30c8\u30fc\u30af\u30f3\u4e0a\u9650\u306b\u5bfe\u3059\u308b warning / critical \u5224\u5b9a\n\n\u5b9f\u884c\u30b3\u30de\u30f3\u30c9:\n\n```powershell\npython scripts/audit_external_api_usage.py --write-default-report\n```\n\nCI\u3084\u30ea\u30ea\u30fc\u30b9\u524d\u30b2\u30fc\u30c8\u3067\u306f `--fail-on-alert` \u3092\u4ed8\u4e0e\u3059\u308b\u3053\u3068\u3067\u3001\u95be\u5024\u5230\u9054\u3084\u58ca\u308c\u305fJSONL\u884c\u3092\u691c\u77e5\u3057\u305f\u6642\u70b9\u3067\u975e\u30bc\u30ed\u7d42\u4e86\u3067\u304d\u307e\u3059\u3002\u3053\u308c\u306b\u3088\u308a\u3001`/admin` \u306e\u76ee\u8996\u78ba\u8a8d\u306b\u52a0\u3048\u3001\u65e5\u6b21\u30d0\u30c3\u30c1\u30fbGitHub Actions\u30fb\u624b\u5143\u691c\u8a3c\u3067\u540c\u3058\u53f0\u5e33\u76e3\u67fb\u3092\u518d\u73fe\u3067\u304d\u307e\u3059\u3002\n\n---\n\n## 4. \u7dcf\u8a55\u3068\u793e\u9577\u3078\u306e\u63d0\u8a00\n\n* **\u5727\u5012\u7684\u306a\u30a4\u30f3\u30d5\u30e9\u56fa\u5b9a\u8cbb\u524a\u6e1b\u306e\u9054\u6210**:\n  \u5f53\u521d\u3001\u30db\u30b9\u30c6\u30a3\u30f3\u30b0\u30b5\u30fc\u30d0\u30fc\u306b Render\uff08\u6708\u984d\u7d041,000\u5186\uff09\u3092\u60f3\u5b9a\u3057\u3066\u3044\u307e\u3057\u305f\u304c\u3001\u793e\u9577\u306e\u3054\u6307\u793a\u306b\u3088\u308a **Firebase & Supabase \u306e\u30b5\u30fc\u30d0\u30fc\u30ec\u30b9\u69cb\u6210** \u306b\u78ba\u5b9a\u3057\u305f\u3053\u3068\u3067\u3001**\u6708\u984d\u56fa\u5b9a\u8cbb\u3092 0\u5186\uff08\u5b8c\u5168\u7121\u6599\uff09\u306b\u6291\u3048\u8fbc\u3080\u3053\u3068\u306b\u6210\u529f**\u3057\u307e\u3057\u305f\u3002\n* **\u6301\u7d9a\u53ef\u80fd\u306a\u8d85\u5c0f\u898f\u6a21\u958b\u767a\u4f53\u5236\u306e\u8a3c\u660e**:\n  3\u3064\u306e\u5f37\u529b\u306aAI\u30c4\u30fc\u30eb\u3092\u30d5\u30eb\u7a3c\u50cd\u3055\u305b\u3001\u9ad8\u54c1\u8cea\u306a\u81ea\u52d5CI/CD\u304a\u3088\u3073Google Workspace\u81ea\u52d5\u540c\u671f\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u3092\u904b\u7528\u3057\u3064\u3064\u3001\u6708\u984d\u767a\u751f\u8cbb\u7528\u3092 **1,000\u5186\u4ee5\u4e0b** \u306b\u6291\u3048\u3089\u308c\u3066\u304a\u308a\u3001\u300c\u4e88\u7b97\u5185\u3067\u6301\u7d9a\u53ef\u80fd\u304b\u3064\u53cd\u5fa9\u7684\u306a\u5c0f\u898f\u6a21\u958b\u767a\u4f53\u5236\u3092\u69cb\u7bc9\u         document.getElementById('rendered-doc').innerHTML = marked.parse(rawMarkdown);

        document.querySelectorAll('pre code.language-mermaid').forEach((block) => {
            const pre = block.parentElement;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = block.textContent;
            pre.parentNode.replaceChild(div, pre);
        });

        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: true,
                theme: 'dark',
                securityLevel: 'loose'
            });
            mermaid.run();
        }
    </script>
</body>
</html>
