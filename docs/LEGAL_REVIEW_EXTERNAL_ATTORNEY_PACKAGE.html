    <script>
        const rawMarkdown = "# \u5916\u90e8\u5f01\u8b77\u58eb\u7528\u30ea\u30fc\u30ac\u30eb\u30ec\u30d3\u30e5\u30fc\u30d1\u30c3\u30b1\u30fc\u30b8\uff06\u8cea\u554f\u72b6 (R36 / T798 / T862)\n\n\u4f5c\u6210\u65e5: 2026-07-24 / \u4f5c\u6210\u8005: \u6cd5\u52d9\u62c5\u5f53 \u9ad8\u6a4b \u5065\u4e8c\n\u5bfe\u8c61\u30b5\u30fc\u30d3\u30b9: Mighty Skill-Bridge (AI\u6280\u8853\u8005\u30fb\u6848\u4ef6\u30de\u30c3\u30c1\u30f3\u30b0 & \u793e\u5185\u751f\u7523\u6027\u5411\u4e0a\u30d7\u30e9\u30c3\u30c8\u30d5\u30a9\u30fc\u30e0)\n\n> [!IMPORTANT]\n> **\u6982\u8981\u3068\u5229\u7528\u76ee\u7684**\n> \u672c\u6587\u66f8\u306f\u3001\u5f53\u793e\u306e\u6709\u511f\u5316\u5224\u65ad\uff08T862\uff09\u304a\u3088\u3073\u6b63\u5f0f\u516c\u958b\u306b\u5411\u3051\u3001\u5916\u90e8\u5c02\u9580\u5f01\u8b77\u58eb\u3078\u30ea\u30fc\u30ac\u30eb\u30ec\u30d3\u30e5\u30fc\uff08R36\uff09\u3092\u4f9d\u983c\u3059\u308b\u305f\u3081\u306e\u300c\u63d0\u793a\u8cc7\u6599\u30d1\u30c3\u30b1\u30fc\u30b8\u300d\u304a\u3088\u3073\u300c\u91cd\u70b9\u8ad6\u70b9\u8cea\u554f\u72b6\u300d\u3067\u3059\u3002\n> \u793e\u5185\u5229\u7528\u30d5\u30a7\u30fc\u30ba\uff08\u793e\u5185GA: `MSB-LEGAL-2026-07-GA`\uff09\u306b\u304a\u3051\u308b16\u306e\u6cd5\u52d9\u8ad6\u70b9\u306f\u793e\u5185\u6c7a\u5b9a\u306b\u3088\u308a\u78ba\u5b9a\u6e08\u307f\u3067\u3042\u308a\u3001\u672c\u30d1\u30c3\u30b1\u30fc\u30b8\u306f**\u3010\u6709\u511f\u516c\u958b\u524d\u5fc5\u98084\u9818\u57df\u3011**\u306b\u95a2\u3059\u308b\u5f01\u8b77\u58eb\u306b\u3088\u308b\u6cd5\u7684\u59a5\u5f53\u6027\u306e\u691c\u8a3c\u304a\u3088\u3073\u4fee\u6b63\u52a9\u8a00\u3092\u5f97\u308b\u3053\u3068\u3092\u76ee\u7684\u3068\u3057\u307e\u3059\u3002\n\n---\n\n## 1. \u30b5\u30fc\u30d3\u30b9\u6982\u8981\u3068\u6cd5\u52d9\u524d\u63d0\n\n1. **\u63d0\u4f9b\u4e3b\u4f53**: \u682a\u5f0f\u4f1a\u793eMightyLINK\uff08\u4ee3\u8868\u53d6\u7de0\u5f79: \u5c0f\u6797 \u96c5\u6c34\uff09\n2. **\u5bfe\u8c61\u30b5\u30fc\u30d3\u30b9**: Mighty Skill-Bridge\n   - AI\u3092\u6d3b\u7528\u3057\u305f\u30b9\u30ad\u30eb\u30b7\u30fc\u30c8\uff08\u7d4c\u6b74\u66f8\uff09\u89e3\u6790\u304a\u3088\u3073\u6848\u4ef6\u81ea\u52d5\u30de\u30c3\u30c1\u30f3\u30b0\u6a5f\u80fd\n   - \u55b6\u696d\u30e1\u30fc\u30eb\u81ea\u52d5\u4e0b\u66f8\u304d\u30fb\u9001\u4fe1\u88dc\u52a9\u6a5f\u80fd\n   - \u5f93\u696d\u54e1\u9069\u6027\u30fb\u72b6\u6cc1\u30a2\u30f3\u30b1\u30fc\u30c8\u6a5f\u80fd\uff08\u203b\u56de\u7b54\u306f\u30bb\u30c3\u30b7\u30e7\u30f3\u9650\u5b9a\u8a55\u4fa1\u3068\u3057\u3001DB\u6c38\u7d9a\u4fdd\u5b58\u3092\u884c\u308f\u306a\u3044\u6cd5\u52d9\u914d\u616e\u8a2d\u8a08\uff09\n   - \u52e4\u6020\u6253\u523b\u30fb\u52e4\u52d9\u8868\u89e3\u6790\u30fb\u627f\u8a8d\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\n3. **\u73fe\u5728\u306e\u30d5\u30a7\u30fc\u30ba**: \u793e\u5185GA\u904b\u7528\u4e2d\uff08\u7121\u511f\u793e\u5185\u5229\u7528\uff09\u3002\u6709\u511f\u516c\u958b\u5224\u65ad\uff08T862\uff09\u5f8c\u306b Stripe \u6c7a\u6e08\u3092\u6709\u52b9\u5316\u3057\u4e00\u822c\u516c\u958b\u4e88\u5b9a\u3002\n\n---\n\n## 2. \u30ec\u30d3\u30e5\u30fc\u5bfe\u8c61\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u4e00\u89a7\n\n| \u6587\u66f8\u540d | \u8a72\u5f53\u30d5\u30a1\u30a4\u30eb | \u5099\u8003 |\n| --- | --- | --- |\n| \u30b5\u30fc\u30d3\u30b9\u5229\u7528\u898f\u7d04 | [`docs/TERMS_OF_SERVICE.md`](TERMS_OF_SERVICE.md) | \u793e\u5185GA\u7248\u78ba\u5b9a\u6e08 (`MSB-LEGAL-2026-07-GA`) |\n| \u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc | [`docs/PRIVACY_POLICY.md`](PRIVACY_POLICY.md) | \u500b\u60c5\u6cd5\u7b2c21, 27, 28, 32\u6761\u5bfe\u5fdc |\n| \u8ab2\u91d1\u898f\u7d04\u30fb\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc | [`docs/BILLING_AND_REFUND_POLICY.md`](BILLING_AND_REFUND_POLICY.md) | \u6709\u511f\u5316\u524d\u5fc5\u9808\u8ad6\u70b9\u53cd\u6620\u30c9\u30e9\u30d5\u30c8 |\n| \u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u306b\u57fa\u3065\u304f\u8868\u8a18 | [`docs/TOKUSHOHO_NOTATION.md`](TOKUSHOHO_NOTATION.md) | \u6539\u6b63\u7279\u5546\u6cd5\u6700\u7d42\u78ba\u8a8d\u753b\u97626\u9805\u76ee\u5bfe\u5fdc |\n| \u5f93\u696d\u54e1\u9069\u6027\u30c4\u30fc\u30eb\u6cd5\u52d9\u8a2d\u8a08 | [`docs/EMPLOYEE_ASSESSMENT_VENDOR_RFI_DPA_CHECKLIST.md`](EMPLOYEE_ASSESSMENT_VENDOR_RFI_DPA_CHECKLIST.md) | \u751f\u30c7\u30fc\u30bf\u975e\u4fdd\u6301\u539f\u5247\u30fbDPA\u57fa\u6e96 |\n\n---\n\n## 3. \u5916\u90e8\u5f01\u8b77\u58eb\u3078\u306e\u91cd\u70b9\u8cea\u554f\u72b6 (\u51684\u9818\u57df)\n\n### \u9818\u57df\u2460\uff1aAI\u751f\u6210\u7269\u306e\u514d\u8cac\u30fb\u8457\u4f5c\u6a29\u5e30\u5c5e\u304a\u3088\u3073\u8ce0\u511f\u8cac\u4efb\u4e0a\u9650\n\n- **Q1-1 (AI\u8a3a\u65ad\u30fb\u30de\u30c3\u30c1\u30f3\u30b0\u306e\u514d\u8cac)**:\n  - \u5229\u7528\u898f\u7d04\u7b2c6\u6761\u306b\u304a\u3044\u3066\u3001AI\u306b\u3088\u308b\u89e3\u6790\u30fb\u30de\u30c3\u30c1\u30f3\u30b0\u7d50\u679c\u306b\u3064\u3044\u3066\u300c\u6b63\u78ba\u6027\u30fb\u9069\u5408\u6027\u3092\u4fdd\u8a3c\u305b\u305a\u3001\u5229\u7528\u8005\u306e\u81ea\u5df1\u8cac\u4efb\u306b\u304a\u3044\u3066\u5229\u7528\u3059\u308b\u300d\u65e8\u3092\u898f\u5b9a\u3057\u3066\u3044\u307e\u3059\u3002\u3053\u306e\u514d\u8cac\u69cb\u6210\u306f\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u7b2c8\u6761\uff08\u4e8b\u696d\u8005\u306e\u640d\u5bb3\u8ce0\u511f\u8cac\u4efb\u3092\u5168\u90e8\u514d\u9664\u3059\u308b\u6761\u9805\u306e\u7121\u52b9\uff09\u3068\u306e\u95a2\u4fc2\u3067\u554f\u984c\u3042\u308a\u307e\u305b\u3093\u304b\uff1f\n  - **\u793e\u5185\u30c9\u30e9\u30d5\u30c8\u6848**: \u6545\u610f\u307e\u305f\u306f\u91cd\u904e\u5931\u304c\u3042\u308b\u5834\u5408\u3092\u9664\u304d\u3001\u514d\u8cac\u3055\u308c\u308b\u65e8\u3092\u4f46\u3057\u66f8\u304d\u3068\u3057\u3066\u660e\u8a18\u3002\n- **Q1-2 (AI\u751f\u6210\u7269\u306e\u6a29\u5229\u5e30\u5c5e)**:\n  - \u5229\u7528\u898f\u7d04\u7b2c10\u6761\u306b\u304a\u3044\u3066\u3001\u5229\u7528\u8005\u304c\u5165\u529b\u3057\u305f\u30c7\u30fc\u30bf\u304b\u3089\u751f\u6210\u3055\u308c\u305f\u51fa\u529b\uff08\u30de\u30c3\u30c1\u30f3\u30b0\u7d50\u679c\u3001\u30e1\u30fc\u30eb\u4e0b\u66f8\u304d\u7b49\uff09\u306e\u6a29\u5229\u3092\u5229\u7528\u8005\u306b\u5e30\u5c5e\u3055\u305b\u3001\u5f53\u793e\u306f\u30b5\u30fc\u30d3\u30b9\u63d0\u4f9b\u306b\u5fc5\u8981\u306a\u7bc4\u56f2\u3067\u7121\u511f\u5229\u7528\u8a31\u8afe\u3092\u53d7\u3051\u308b\u69cb\u6210\u3068\u3057\u3066\u3044\u307e\u3059\u3002\u8457\u4f5c\u6a29\u6cd5\u4e0a\u306e\u89b3\u70b9\u304b\u3089\u554f\u984c\u3042\u308a\u307e\u305b\u3093\u304b\uff1f\n- **Q1-3 (\u640d\u5bb3\u8ce0\u511f\u984d\u306e\u4e0a\u9650)**:\n  - \u5229\u7528\u898f\u7d04\u7b2c14\u6761\u306b\u304a\u3044\u3066\u3001\u5f53\u793e\u306e\u640d\u5bb3\u8ce0\u511f\u8cac\u4efb\u306e\u4e0a\u9650\u3092\u300c\u76f4\u8fd112\u304b\u6708\u9593\u306b\u5229\u7528\u8005\u304c\u5f53\u793e\u306b\u652f\u6255\u3063\u305f\u5bfe\u4fa1\u306e\u5408\u8a08\u984d\u300d\u307e\u305f\u306f\u300c1\u4e07\u5186\u300d\u306e\u3044\u305a\u308c\u304b\u9ad8\u3044\u984d\u306b\u5236\u9650\u3057\u3066\u3044\u307e\u3059\u3002\u6cd5\u4eba\u30fb\u500b\u4eba\u53cc\u65b9\u3092\u5bfe\u8c61\u3068\u3059\u308bB2B/B2C\u6df7\u5728\u30b5\u30fc\u30d3\u30b9\u3068\u3057\u3066\u59a5\u5f53\u3067\u3057\u3087\u3046\u304b\uff1f\n\n### \u9818\u57df\u2461\uff1a\u52b4\u50cd\u95a2\u9023\u6cd5\u4ee4\uff08\u8077\u696d\u5b89\u5b9a\u6cd5\u30fb\u52b4\u50cd\u5b89\u5168\u885b\u751f\u6cd5\u7b49\uff09\u3068\u306e\u6574\u5408\u6027\n\n- **Q2-1 (\u8077\u696d\u5b89\u5b9a\u6cd5\u3068\u306e\u95a2\u4fc2)**:\n  - \u672c\u30b5\u30fc\u30d3\u30b9\u306e\u30de\u30c3\u30c1\u30f3\u30b0\u6a5f\u80fd\u306f\u3001\u30b9\u30ad\u30eb\u60c5\u5831\u3068\u6c42\u4eba\u6848\u4ef6\u60c5\u5831\u306e\u6a5f\u68b0\u7684\u7167\u5408\u30fb\u63d0\u793a\u3092\u884c\u3046\u3082\u306e\u3067\u3042\u308a\u3001\u6c42\u8077\u30fb\u6c42\u4eba\u306e\u7533\u3057\u8fbc\u307f\u306e\u53d7\u8a17\u3084\u500b\u5225\u306e\u65a1\u65cb\u3092\u884c\u3046\u3082\u306e\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u8077\u696d\u5b89\u5b9a\u6cd5\u7b2c5\u6761\u306e5\uff08\u6c42\u4eba\u60c5\u5831\u306e\u7684\u78ba\u306a\u8868\u793a\u7b49\uff09\u304a\u3088\u3073\u8077\u696d\u7d39\u4ecb\u4e8b\u696d\u306e\u8a31\u8a8d\u53ef\u898f\u5236\u306b\u8a72\u5f53\u3057\u306a\u3044\u69cb\u6210\u3068\u3057\u3066\u59a5\u5f53\u3067\u3057\u3087\u3046\u304b\uff1f\n- **Q2-2 (\u5f93\u696d\u54e1\u9069\u6027\u30fb\u72b6\u614b\u628a\u63e1\u3068\u52b4\u5b89\u885b\u6cd5)**:\n  - \u793e\u5185\u5411\u3051\u9069\u6027\u30fb\u72b6\u614b\u8a3a\u65ad\u30c4\u30fc\u30eb\u306b\u304a\u3044\u3066\u3001\u7cbe\u795e\u72b6\u614b\u3084\u5065\u5eb7\u72b6\u614b\u306b\u95a2\u3059\u308b\u30c7\u30fc\u30bf\u306fDB\u3078\u6c38\u7d9a\u4fdd\u5b58\u305b\u305a\u3001\u30c7\u30e2\u753b\u9762\u4e0a\u3067\u306e\u30bb\u30c3\u30b7\u30e7\u30f3\u9650\u5b9a\u8868\u793a\u3068\u3057\u3066\u3044\u307e\u3059\u3002\u52b4\u5b89\u885b\u6cd5\u7b2c66\u6761\u306e10\uff08\u30b9\u30c8\u30ec\u30b9\u30c1\u30a7\u30c3\u30af\uff09\u7b49\u306e\u898f\u5236\u5bfe\u8c61\u5916\u3068\u3057\u3066\u6574\u7406\u53ef\u80fd\u3067\u3057\u3087\u3046\u304b\uff1f\n  - **\u793e\u5185\u30c9\u30e9\u30d5\u30c8\u6848**: \u533b\u7642\u884c\u70ba\u30fb\u5fc3\u7406\u8a3a\u65ad\u3067\u306f\u306a\u304f\u30bb\u30c3\u30b7\u30e7\u30f3\u9650\u308a\u306e\u30bb\u30eb\u30d5\u30c1\u30a7\u30c3\u30af\u3068\u3057\u3066\u4f4d\u7f6e\u3065\u3051\u3002\n\n### \u9818\u57df\u2462\uff1a\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\u5bfe\u5fdc\uff08\u8981\u914d\u616e\u60c5\u5831\u30fb\u7b2c\u4e09\u8005\u63d0\u4f9b\u30fb\u5916\u56fd\u79fb\u8ee2\uff09\n\n- **Q3-1 (\u55b6\u696d\u30e1\u30fc\u30eb\u306b\u304a\u3051\u308b\u7b2c\u4e09\u8005\u500b\u4eba\u60c5\u5831\u306e\u53d6\u5f97)**:\n  - \u55b6\u696d\u30e1\u30fc\u30eb\u6a5f\u80fd\u306b\u304a\u3044\u3066\u3001\u53d6\u5f15\u5148\u62c5\u5f53\u8005\u306e\u6c0f\u540d\u30fb\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u7b49\u3092\u500b\u4eba\u30c7\u30fc\u30bf\u3068\u3057\u3066\u5229\u7528\u3057\u307e\u3059\u3002\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\u7b2c20\u6761\uff08\u9069\u6b63\u306a\u53d6\u5f97\uff09\u30fb\u7b2c21\u6761\uff08\u5229\u7528\u76ee\u7684\u306e\u901a\u77e5\u30fb\u516c\u8868\uff09\u306e\u89b3\u70b9\u304b\u3089\u3001\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u00a72/\u00a73\u306e\u516c\u8868\u8a18\u8f09\u3067\u5341\u5206\u306a\u53d6\u5f97\u6839\u62e0\u3068\u306a\u308a\u307e\u3059\u304b\uff1f\n- **Q3-2 (\u5916\u56fd\u306b\u3042\u308b\u7b2c\u4e09\u8005\u3078\u306e\u63d0\u4f9b\u3068\u30af\u30e9\u30a6\u30c9\u30a4\u30f3\u30d5\u30e9)**:\n  - \u5f53\u793e\u306f Supabase / OpenAI / Anthropic \u7b49\u306e\u5916\u90e8\u30af\u30e9\u30a6\u30c9\u30fbAI API\u30b5\u30fc\u30d3\u30b9\u3092\u5229\u7528\u3057\u3066\u3044\u307e\u3059\u3002\u6cd5\u7b2c28\u6761\uff08\u5916\u56fd\u306b\u3042\u308b\u7b2c\u4e09\u8005\u3078\u306e\u63d0\u4f9b\u306e\u5236\u9650\uff09\u306e\u89b3\u70b9\u304b\u3089\u3001\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u00a75\u3067\u306e\u300c\u5229\u7528\u8005\u306e\u540c\u610f\u307e\u305f\u306f\u540c\u610f\u3068\u540c\u7b49\u306e\u4fdd\u8b77\u63aa\u7f6e\u300d\u306e\u8a18\u8f09\u5185\u5bb9\u3067\u6cd5\u7684\u8981\u4ef6\u3092\u6e80\u305f\u3057\u3066\u3044\u307e\u3059\u304b\uff1f\n\n### \u9818\u57df\u2463\uff1a\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u30fb\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u5bfe\u5fdc\uff08\u89e3\u7d04\u30fb\u8fd4\u91d1\u30fb\u81ea\u52d5\u66f4\u65b0\uff09\n\n- **Q4-1 (\u91cd\u5927\u969c\u5bb3\u6642\u306e\u8fd4\u91d1\u3068\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u306e\u9078\u629e\u69cb\u6210)**:\n  - \u8ab2\u91d1\u898f\u7d04\u7b2c5\u6761\u7b2c2\u9805\u306b\u304a\u3044\u3066\u3001\u5f53\u793e\u306e\u8cac\u306b\u5e30\u3059\u3079\u304d\u91cd\u5927\u969c\u5bb3\u6642\u306e\u88dc\u511f\u3068\u3057\u3066\u300c\u6b21\u56de\u66f4\u65b0\u6642\u306b\u5229\u7528\u3067\u304d\u308b\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u300d\u3092\u7b2c\u4e00\u9078\u629e\u3068\u3057\u3001\u89e3\u7d04\u6642\u307e\u305f\u306f\u9867\u5ba2\u5e0c\u671b\u6642\u306b\u300cStripe\u8fd4\u91d1\u300d\u3092\u884c\u3046\u69cb\u6210\u3068\u3057\u3066\u3044\u307e\u3059\u3002\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u304a\u3088\u3073\u5b9f\u52d9\u7684\u89b3\u70b9\u304b\u3089\u59a5\u5f53\u3067\u3057\u3087\u3046\u304b\uff1f\n- **Q4-2 (\u4f8b\u5916\u8fd4\u91d1\u6642\u306eStripe\u6c7a\u6e08\u624b\u6570\u6599\u63a7\u9664)**:\n  - \u5229\u7528\u8005\u90fd\u5408\u306b\u3088\u308b\u4f8b\u5916\u7684\u306a\u8fd4\u91d1\u51e6\u7406\u306b\u304a\u3044\u3066\u3001\u8fd4\u91d1\u4e0d\u53ef\u3067\u3042\u308b Stripe \u6c7a\u6e08\u624b\u6570\u6599\uff08\u7d043.6%\uff09\u3092\u8fd4\u91d1\u984d\u304b\u3089\u63a7\u9664\u3059\u308b\u898f\u5b9a\uff08\u8ab2\u91d1\u898f\u7d04\u7b2c5\u6761\u7b2c4\u9805\uff09\u306f\u6cd5\u7684\u52b9\u529b\u3092\u6709\u3057\u307e\u3059\u304b\uff1f\n- **Q4-3 (\u6539\u6b63\u7279\u5546\u6cd5\u306b\u57fa\u3065\u304f\u81ea\u52d5\u66f4\u65b0\u30fb\u6700\u7d42\u78ba\u8a8d\u753b\u9762)**:\n  - \u5b9a\u671f\u8cfc\u5165\uff08\u30b5\u30d6\u30b9\u30af\u30ea\u30d7\u30b7\u30e7\u30f3\uff09\u306e\u7533\u8fbc\u6700\u7d42\u78ba\u8a8d\u753b\u9762\u306b\u304a\u3044\u3066\u3001(1)\u6570\u91cf\u30fb\u671f\u9593\u3001(2)\u8ca9\u58f2\u4fa1\u683c\u3001(3)\u652f\u6255\u6642\u671f\u30fb\u65b9\u6cd5\u3001(4)\u5f15\u6e21\u6642\u671f\u3001(5)\u7533\u3057\u8fbc\u307f\u306e\u64a4\u56de\u30fb\u89e3\u7d04\u306b\u95a2\u3059\u308b\u4e8b\u9805\u3001(6)\u7533\u8fbc\u671f\u9593\u3092\u660e\u78ba\u306b\u8868\u793a\u3059\u308b\u8a2d\u8a08\uff08\u7279\u5546\u6cd5\u8868\u8a18\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\uff09\u306f\u3001\u6539\u6b63\u7279\u5546\u6cd5\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u306e\u57fa\u6e96\u3092\u6e80\u305f\u3057\u3066\u3044\u307e\u3059\u304b\uff1f\n\n---\n\n## 4. \u4eca\u5f8c\u306e\u5f01\u8b77\u58eb\u30ec\u30d3\u30e5\u30fc\u5b9f\u65bd\u624b\u9806\u3068\u30b9\u30b1\u30b8\u30e5\u30fc\u30eb\n\n1. **\u5f01\u8b77\u58eb\u9078\u5b9a\u30fb\u53d7\u4efb**: R36 \u62c5\u5f53\u5916\u90e8\u5f01\u8b77\u58eb\uff08IT/\u500b\u4eba\u60c5\u5831/\u6d88\u8cbb\u8005\u6cd5\u5c02\u9580\uff09\u3078\u306e\u6b63\u5f0f\u6253\u8a3a\u304a\u3088\u3073NDA\u7de0\u7d50\n2. **\u30ec\u30d3\u30e5\u30fc\u5b9f\u65bd**: \u672c\u30d1\u30c3\u30b1\u30fc\u30b8\uff08`LEGAL_REVIEW_EXTERNAL_ATTORNEY_PACKAGE.md`\uff09\u304a\u3088\u3073
