    <script>
        const rawMarkdown = "# \ud83c\uddef\ud83c\uddf5 \u65e5\u672c\u8a9e UI/UX \u30b9\u30bf\u30a4\u30eb\u30ac\u30a4\u30c9 \uff06 \u30c9\u30e1\u30a4\u30f3\u6b63\u5247\u7528\u8a9e\u96c6\n\n\u672c\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u306f\u3001MightyLINK AI Connect \u306b\u304a\u3051\u308b UI/UX \u6587\u8a00\u3001\u30a8\u30e9\u30fc\u30e1\u30c3\u30bb\u30fc\u30b8\u3001\u30d8\u30eb\u30d7\u30c6\u30ad\u30b9\u30c8\u3001\u304a\u3088\u3073\u64cd\u4f5c\u6848\u5185\u306e\u65e5\u672c\u8a9e\u8868\u8a18\u306b\u95a2\u3059\u308b\u7d71\u4e00\u57fa\u6e96\u3092\u5b9a\u3081\u308b\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u3067\u3059\u3002\n\n---\n\n## 1. \u57fa\u672c\u65b9\u91dd\uff08\u30c8\u30fc\u30f3\uff06\u30de\u30ca\u30fc\uff09\n\n1. **\u30d3\u30b8\u30cd\u30b9\u4e01\u5be7\u4f53\uff08\u300c\u3067\u3059\u30fb\u307e\u3059\u300d\u8abf\uff09\u306e\u7d71\u4e00**\n   - \u753b\u9762\u4e0a\u306e\u30e1\u30c3\u30bb\u30fc\u30b8\u3001\u30c0\u30a4\u30a2\u30ed\u30b0\u3001\u30ac\u30a4\u30c9\u30c6\u30ad\u30b9\u30c8\u306f\u300c\u3067\u3059\u30fb\u307e\u3059\u300d\u8abf\u3092\u57fa\u672c\u3068\u3057\u307e\u3059\u3002\n   - \u4f8b: `\u4fdd\u5b58\u3057\u307e\u3057\u305f` / `\u8a2d\u5b9a\u3092\u66f4\u65b0\u3057\u3066\u304f\u3060\u3055\u3044` / `\u7ba1\u7406\u8005\u8a8d\u8a3c\u304c\u5fc5\u8981\u3067\u3059`\n\n2. **\u30dc\u30bf\u30f3\u30fb\u30bf\u30a4\u30c8\u30eb\u7b49\u306e\u4f53\u8a00\u6b62\u3081\u6d3b\u7528**\n   - \u30ca\u30d3\u30b2\u30fc\u30b7\u30e7\u30f3\u30bf\u30d6\u3001\u30dc\u30bf\u30f3\u3001\u898b\u51fa\u3057\u3001\u7b87\u6761\u66f8\u304d\u30e9\u30d9\u30eb\u306f\u8996\u8a8d\u6027\u3068\u5373\u6642\u7406\u89e3\u3092\u8003\u616e\u3057\u3001\u7c21\u6f54\u306a\u4f53\u8a00\u6b62\u3081\u307e\u305f\u306f\u52d5\u4f5c\u540d\u3092\u7528\u3044\u307e\u3059\u3002\n   - \u4f8b: `\u56de\u7b54\u3092\u9001\u4fe1` / `CSV\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9` / `\u8cea\u554f\u3092\u751f\u6210` / `\u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9`\n\n3. **\u5ba2\u89b3\u7684\u30b5\u30dd\u30fc\u30c8\u8abf\uff08\u533b\u7642\u7528\u8a9e\u30fb\u51e6\u9047\u65ad\u5b9a\u306e\u6392\u9664\uff09**\n   - \u300c\u8a3a\u65ad\u300d\u300c\u3046\u3064\u300d\u300c\u7cbe\u795e\u969c\u5bb3\u300d\u300c\u9069\u6027\u4e0d\u53ef\u300d\u306a\u3069\u306e\u533b\u7642\u7528\u8a9e\u3084\u4eba\u7684\u51e6\u9047\u3092\u65ad\u5b9a\u3059\u308b\u8868\u73fe\u3092\u53b3\u683c\u306b\u6392\u9664\u3057\u307e\u3059\u3002\n   - \u4ee3\u308f\u308a\u306b\u300c\u30b3\u30f3\u30c7\u30a3\u30b7\u30e7\u30f3\u300d\u300c\u7167\u5408\u50be\u5411\u300d\u300c\u9762\u8ac7\u3067\u306e\u5bfe\u8a71\u6750\u6599\u300d\u306a\u3069\u306e\u5ba2\u89b3\u7684\u304b\u3064\u5b89\u5fc3\u611f\u3092\u4e0e\u3048\u308b\u30b5\u30dd\u30fc\u30c8\u8868\u73fe\u3092\u9078\u629e\u3057\u307e\u3059\u3002\n   - \u4f8b: `\u7cbe\u795e\u72b6\u614b\u5224\u5b9a` \u274c \u2192 `\u30b3\u30f3\u30c7\u30a3\u30b7\u30e7\u30f3\u50be\u5411` \u2b55\n   - \u4f8b: `\u4e0d\u63a1\u7528\u63a8\u5968` \u274c \u2192 `\u8ffd\u52a0\u30d2\u30a2\u30ea\u30f3\u30b0\u30fb\u9762\u8ac7\u3067\u306e\u78ba\u8a8d\u4e8b\u9805` \u2b55\n\n---\n\n## 2. \u30c9\u30e1\u30a4\u30f3\u6b63\u5247\u7528\u8a9e\u96c6\uff08Glossary\uff09\n\nUI\u5168\u57df\u306b\u304a\u3051\u308b\u8868\u8a18\u63fa\u308c\u3092\u9632\u6b62\u3059\u308b\u305f\u3081\u3001\u4e3b\u8981\u6a5f\u80fd\u30fb\u6982\u5ff5\u306e\u6b63\u5247\u540d\u79f0\u3092\u4ee5\u4e0b\u306e\u3088\u3046\u306b\u5236\u5b9a\u3057\u307e\u3059\u3002\n\n| \u30c9\u30e1\u30a4\u30f3\u9818\u57df | \u6b63\u5247\u540d\u79f0 | \u8a31\u5bb9\u3059\u308b\u7565\u79f0\u30fb\u6587\u8108\u8868\u73fe | \u975e\u63a8\u5968\u30fb\u8868\u8a18\u63fa\u308cNG\u4f8b |\n|:---|:---|:---|:---|\n| **\u55b6\u696d\u30e1\u30fc\u30ebAI** | **\u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0** | \u55b6\u696d\u30e1\u30fc\u30eb\u30de\u30c3\u30c1\u30f3\u30b0, AI\u30de\u30c3\u30c1\u30f3\u30b0 | \u6848\u4ef6\u30de\u30c3\u30c1, \u30e1\u30fc\u30ebAI, Sales Email Match |\n| **\u9069\u6027\u30fb\u554f\u8a3a** | **\u793e\u5185\u9069\u6027\u30fb\u30e2\u30c1\u30d9\u30fc\u30b7\u30e7\u30f3\u8a3a\u65ad** | \u81ea\u5df1\u8a3a\u65ad\u30c7\u30e2, \u9069\u6027\u8a3a\u65ad | \u7cbe\u795e\u5224\u5b9a, \u30e1\u30f3\u30bf\u30eb\u30c1\u30a7\u30c3\u30af, \u5fc3\u7406\u30c6\u30b9\u30c8 |\n| **\u52e4\u6020\u30fb\u52e4\u52d9\u8868** | **\u52e4\u52d9\u8868\u30fb\u52e4\u6020\u7ba1\u7406** | \u52e4\u6020\u6253\u523b, \u52e4\u52d9\u8868\u89e3\u6790 | \u30bf\u30a4\u30e0\u30ab\u30fc\u30c9, \u51fa\u9000\u52e4\u30a2\u30d7\u30ea, \u4f5c\u696d\u5831\u544a |\n| **\u7ba1\u7406\u30fb\u904b\u7528** | **\u7ba1\u7406\u8005\u7d71\u5408\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9** | \u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9, \u7ba1\u7406\u753b\u9762 | Admin UI, \u7d71\u5408\u30dc\u30fc\u30c9, \u30aa\u30da\u30ec\u30fc\u30b7\u30e7\u30f3\u753b\u9762 |\n\n---\n\n## 3. \u30a8\u30e9\u30fc\u30e1\u30c3\u30bb\u30fc\u30b8\u8a2d\u8a08\u539f\u5247\n\n\u30e6\u30fc\u30b6\u30fc\u304c\u64cd\u4f5c\u306b\u5931\u6557\u3057\u305f\u969b\u3001\u56f0\u60d1\u3055\u305b\u305a\u6b21\u306e\u6b63\u3057\u3044\u64cd\u4f5c\u306b\u8a98\u5c0e\u3059\u308b\u305f\u3081\u306e\u8a2d\u8a08\u539f\u5247\u3067\u3059\u3002\n\n1. **\u6280\u8853\u30a8\u30e9\u30fc\u30b3\u30fc\u30c9\u30fb\u82f1\u8a9e\u30e1\u30c3\u30bb\u30fc\u30b8\u306e\u975e\u9732\u51fa**\n   - `400 Bad Request`, `401 Unauthorized`, `500 Internal Server Error`, `TypeError` \u306a\u3069\u306e\u751f\u306e\u82f1\u8a9e\u3084\u30b3\u30fc\u30c9\u3092\u76f4\u63a5\u898b\u305b\u305a\u3001\u81ea\u7136\u306a\u65e5\u672c\u8a9e\u6587\u9762\u3067\u901a\u77e5\u3057\u307e\u3059\u3002\n\n2. **\u539f\u56e0\u3068\u30a2\u30af\u30b7\u30e7\u30f3\uff08\u89e3\u6c7a\u7b56\uff09\u306e\u540c\u6642\u63d0\u793a**\n   - \u5358\u306b\u300c\u30a8\u30e9\u30fc\u304c\u767a\u751f\u3057\u307e\u3057\u305f\u300d\u3068\u544a\u3052\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u300c\u4f55\u304c\u539f\u56e0\u3067\u300d\u300c\u3069\u3046\u3059\u308c\u3070\u89e3\u6c7a\u3059\u308b\u304b\u300d\u3092\u660e\u8a18\u3057\u307e\u3059\u3002\n   - \u826f\u597d\u306a\u4f8b: `\u30d5\u30ea\u30fc\u8a18\u8ff0\u306f10\u6587\u5b57\u4ee5\u4e0a\u3067\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044\u3002`\n   - \u826f\u597d\u306a\u4f8b: `\u7ba1\u7406\u8005\u8a8d\u8a3c\u304c\u5fc5\u8981\u3067\u3059\u3002\u6b63\u3057\u3044\u30d1\u30b9\u30ef\u30fc\u30c9\u3092\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044\u3002`\n   - NG\u4f8b: `Invalid payload detail`\n   - NG\u4f8b: `\u30a8\u30e9\u30fc\u30b3\u30fc\u30c9 400`\n\n3. **\u63a5\u7d9a\u30a8\u30e9\u30fc\u6642\u306e\u89aa\u5207\u306a\u30d5\u30a9\u30fc\u30eb\u30d0\u30c3\u30af**\n   - \u771f\u306e\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u5207\u65ad\u3084\u30b5\u30fc\u30d0\u30fc\u672a\u5230\u9054\u6642\u306b\u306f\u3001\u300c\u30b5\u30fc\u30d0\u30fc\u306b\u63a5\u7d9a\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u3002\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u63a5\u7d9a\u3092\u3054\u78ba\u8a8d\u306e\u3046\u3048\u518d\u8a66\u884c\u3057\u3066\u304f\u3060\u3055\u3044\u3002\u300d\u3068\u5206\u304b\u308a\u3084\u3059\u304f\u6848\u5185\u3057\u307e\u3059\u3002\n\n---\n\n## 4. \u4fdd\u5b88\u30fbCI\u81ea\u52d5\u30ac\u30fc\u30c9\u3068\u306e\u9023\u643a\n\n- \u672c\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u306b\u5b9a\u3081\u3089\u308c\u305f\u7528\u8a9e\u898f\u5247\u304a\u3088\u3073\u30a8\u30e9\u30fc\u8868\u73fe\u65b9\u91dd\u306f\u3001`scripts/audit_japanese_wording_consistency.py` \u304a\u3088\u3073 `tests/test_japanese_wording_consistency.py` \u306b\u3088\u3063\u3066\u7d99\u7d9a\u7684\u306b\u81ea\u52d5\u691c\u8a3c\u3055\u308c\u307e\u3059\u3002\n- UI\u6587\u8a00\u3092\u66f4\u65b0\u3059\u308b\u969b\u306f\u3001\u672c\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u304a\u3088\u3073\u6b63\u5247\u7528\u8a9e\u96c6\u3092\u53c2\u7167\u3057\u305f\u4e0a\u3067\u5b9f\u88c5\u3092\u884c\u3063\u3066\u304f\u3060\u3055\u3044\u3002\n";
