<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README — Mighty-Link Documentation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0b0f19;
            color: #e2e8f0;
            padding: 32px 20px;
            margin: 0;
        }
        .doc-container {
            max-width: 980px;
            margin: 0 auto;
            background: #131b2e;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            color: #8bdcff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .markdown-body {
            background-color: transparent !important;
            color: #e2e8f0 !important;
            font-size: 15px;
            line-height: 1.7;
        }
        .mermaid {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="doc-container">
        <a href="../../index.html" class="back-link">← ホームに戻る</a>
        <article class="markdown-body" id="rendered-doc"></article>
    </div>
    <script>
        const rawMarkdown = "# MightyLINK Antigravity Live Demo\n\nThis public repository supports the August 26 Antigravity workshop. It demonstrates a test-first workflow: define acceptance criteria, build with an IDE agent, inspect the same workspace from CLI and SDK, verify in a browser, and publish to GitHub Pages.\n\n- All content is synthetic. Customer, employee, credential, and production data are prohibited.\n- The comparison covers only Codex, Claude Code, Claude Cowork, Kiro, and Antigravity.\n- Product facts were checked against official sources on 2026-08-13 JST.\n- Official icons are stored locally so they remain visible on GitHub Pages; `ICON_SOURCES.md` records provenance.\n- `/grill-me` and `/find-skills` are baseline workspace Skills in `.agents/skills/`.\n- `anthropics/skills@frontend-design` is installed project-locally during the demo and removed after rehearsal.\n- The production MightyLINK repository and Firebase Hosting are not used.\n\n## Test-first flow\n\nRead `TEST_SPEC.md` before implementation. Run the contract tests after every material change:\n\n```powershell\npython -m unittest discover -s tests -v\nnode --check app.js\nnode --check product-data.js\n```\n\nThe tests prevent scope drift, missing official icons, undated updates, unofficial source domains, incomplete comparison axes, and the return of unverified fixed quota claims.\n\n## Demo files\n\n1. `PROMPT_00_GRILL_ME.txt`\n2. `PROMPT_01_FIND_SKILLS.txt`\n3. `PROMPT_02_INSTALL_SKILL.txt`\n4. `PROMPT_03_BUILD.txt`\n5. `PROMPT_04_APPLY_SKILL.txt`\n6. `PROMPT_05_MCP_CHECK.txt`\n7. `PROMPT_06_PUBLISH.txt`\n8. `PROMPT_10_CLI_READONLY.txt`\n9. `PROMPT_11_SDK_READONLY.txt`\n\n`SOURCE_AUDIT.md` records the official evidence behind each product card. `SELF_REVIEW.md` records ten distinct review passes and the resulting fixes. `antigravity_sdk_readonly.py` runs the SDK audit with `BuiltinTools.read_only()`.\n\n## Rehearsal reset\n\nRemove only the live-installed Skill, then revert the rehearsal publish commit and push the revert. Do not use `reset --hard` or force push.\n\n```powershell\nnpx skills remove frontend-design --agent antigravity -y\n$skillsRoot = (Resolve-Path .agents/skills).Path\n$skillPath = Join-Path $skillsRoot 'frontend-design'\nif (Test-Path -LiteralPath $skillPath) {\n  if ((Split-Path $skillPath -Parent) -ne $skillsRoot) { throw 'Unexpected Skill path' }\n  Get-ChildItem -LiteralPath $skillPath -File | Remove-Item -Force\n  Remove-Item -LiteralPath $skillPath -Force\n}\nif (Test-Path -LiteralPath .\\skills-lock.json) { Remove-Item -LiteralPath .\\skills-lock.json -Force }\nnpx skills list --json\ngit revert --no-edit <rehearsal-publish-commit-sha>\ngit push origin main\n```\n";
        document.getElementById('rendered-doc').innerHTML = marked.parse(rawMarkdown);

        // Render Mermaid code blocks
        document.querySelectorAll('pre code.language-mermaid').forEach((block) => {
            const pre = block.parentElement;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = block.textContent;
            pre.parentNode.replaceChild(div, pre);
        });

        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: true,
                theme: 'dark',
                securityLevel: 'loose'
            });
            mermaid.run();
        }
    </script>
</body>
</html>
