<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOURCE_AUDIT — Mighty-Link Documentation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0b0f19;
            color: #e2e8f0;
            padding: 32px 20px;
            margin: 0;
        }
        .doc-container {
            max-width: 980px;
            margin: 0 auto;
            background: #131b2e;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #1e293b;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            color: #8bdcff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .markdown-body {
            background-color: transparent !important;
            color: #e2e8f0 !important;
            font-size: 15px;
            line-height: 1.7;
        }
        .mermaid {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="doc-container">
        <a href="../../index.html" class="back-link">← ホームに戻る</a>
        <article class="markdown-body" id="rendered-doc"></article>
    </div>
    <script>
        const rawMarkdown = "# Official Source Audit\n\nVerified 2026-08-13 JST. All factual links below are first-party product pages, official repositories, or official product video channels.\n\n| Product | Current version evidence | Latest official update | Latest official video | Latest official blog |\n| --- | --- | --- | --- | --- |\n| Codex | CLI `0.147.0`, 2026-08-07: https://github.com/openai/codex/releases/tag/rust-v0.147.0 | Agent Plugins, conversation sections, MCP and security fixes, 2026-08-07 | Codex for Solutions Engineers, 2026-07-01: https://www.youtube.com/watch?v=08hgAtg-P_8 | Custom Code Review rules for Codex, 2026-07-20: https://learn.chatgpt.com/blog/custom-code-review-rules-for-codex |\n| Claude Code | `2.1.229`, 2026-08-12: https://github.com/anthropics/claude-code/releases/tag/v2.1.229 | Remote Control continuation, Plugin command sources, Windows and streaming fixes, 2026-08-12 | How auto mode works with Claude Code, 2026-08-04: https://www.youtube.com/watch?v=b8SV4U6fEIc | Auto mode is now the default, 2026-08-07: https://claude.com/blog/auto-mode-default-in-claude-code |\n| Claude Cowork | No public product version; release-note evidence dated 2026-07-07: https://support.claude.com/en/articles/12138966-release-notes | Chrome side panel product update, 2026-08-12 | Claude Cowork is now your Chrome side panel, 2026-08-12: https://www.youtube.com/watch?v=C-5wF6tkQ2Q | Working with Claude Fable 5 in Claude Cowork, 2026-07-16: https://claude.com/blog/working-with-claude-fable-5-in-claude-cowork |\n| Kiro | IDE `1.0.293`, 2026-08-11: https://kiro.dev/changelog/ide/1-0-293/ | Cloud Sessions and Agent Focus Mode Upgrades, 2026-08-11 | Introducing Kiro Crew, 2026-08-04: https://www.youtube.com/watch?v=iOIS1OZLkI0 | Claude Opus 5 is now available in Kiro, 2026-07-24: https://kiro.dev/blog/opus-5/ |\n| Antigravity | `2.8.0`, 2026-08-12: https://antigravity.google/changelog?app=antigravity | Persistent Sidebar Folders, Crash Fixes, and UI Enhancements, 2026-08-12 | Mission Report Ep. 06, 2026-08-11: https://www.youtube.com/watch?v=tiFLdJJGpno | Introducing Custom Agents, 2026-08-12: https://antigravity.google/blog/introducing-custom-agents |\n\n## Interpretation rules\n\n- `Current version` means the product or CLI version the provider publicly labels, not the underlying model version.\n- A later video can describe a newer product surface than the latest Cowork release-note entry without becoming a semantic product version.\n- Prices and quotas are summarized only when the provider publishes them. Variable capacity is not converted into a made-up request count.\n";
        document.getElementById('rendered-doc').innerHTML = marked.parse(rawMarkdown);

        // Render Mermaid code blocks
        document.querySelectorAll('pre code.language-mermaid').forEach((block) => {
            const pre = block.parentElement;
            const div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = block.textContent;
            pre.parentNode.replaceChild(div, pre);
        });

        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: true,
                theme: 'dark',
                securityLevel: 'loose'
            });
            mermaid.run();
        }
    </script>
</body>
</html>
