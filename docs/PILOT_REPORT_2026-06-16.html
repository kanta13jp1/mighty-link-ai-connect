    <script>
        const rawMarkdown = "# \ud83d\udcca Mighty Skill-Bridge: \u793e\u5185\u30d1\u30a4\u30ed\u30c3\u30c8\u7d50\u679c\u30b5\u30de\u30ea\u5831\u544a\u66f8 (2026-06-16)\n\n> **Mighty-Link AI Connect Project**\n> *2026\u5e746\u67083\u65e5\u301c6\u670816\u65e5\u306e\u793e\u5185\u30d1\u30a4\u30ed\u30c3\u30c8\u671f\u9593\u306b\u304a\u3051\u308b\u7b2c1\u9031\uff086\u67083\u65e5\u301c6\u67086\u65e5\u6642\u70b9\uff09\u306e\u904b\u7528\u5b9f\u7e3e\u30fb\u8a55\u4fa1\u304a\u3088\u3073\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u691c\u8a3c\u30b5\u30de\u30ea*\n\n---\n\n## 1. \u6982\u8981\u3068\u76ee\u7684\n\u672c\u30d1\u30a4\u30ed\u30c3\u30c8\u306f\u3001\u793e\u9577\u610f\u601d\u6c7a\u5b9a\uff08\u65b9\u5411\u6027A\uff1aAI\u30d5\u30a3\u30c3\u30c8\u8a3a\u65ad\u652f\u63f4\uff09\u306b\u57fa\u3065\u304d\u3001\u65b0\u958b\u767a\u3055\u308c\u305f **\u300eMighty Skill-Bridge\uff08\u30a8\u30f3\u30b8\u30cb\u30a2\uff06\u6848\u4ef6 AI\u30d5\u30a3\u30c3\u30c8\u30b7\u30df\u30e5\u30ec\u30fc\u30bf\u30fc\uff09\u300f** \u3092\u793e\u5185\u306e\u4eba\u6750\u62c5\u5f53\u304a\u3088\u3073\u55b6\u696d\u62c5\u5f53\u306e\u5354\u529b\u3092\u5f97\u3066\u5b9f\u7a3c\u50cd\u3055\u305b\u3001\u305d\u306e\u9069\u5408\u6027\u30fb\u64cd\u4f5c\u6027\u30fb\u30a4\u30f3\u30d5\u30e9\u306e\u5b89\u5b9a\u6027\u3001\u304a\u3088\u3073\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u30fb\u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\uff08\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\uff09\u9762\u3092\u691c\u8a3c\u3059\u308b\u3053\u3068\u3092\u76ee\u7684\u3068\u3057\u3066\u3044\u307e\u3059\u3002\n\n---\n\n## 2. \u7b2c1\u9031\uff086\u67083\u65e5\u301c6\u67086\u65e5\uff09\u306e\u5b9f\u65bd\u5b9f\u7e3e\n\u7b2c1\u9031\u306b\u304a\u3044\u3066\u3001\u4ee5\u4e0b\u306e\u958b\u767a\u304a\u3088\u3073\u691c\u8a3c\u30de\u30a4\u30eb\u30b9\u30c8\u30fc\u30f3\u3092\u3059\u3079\u3066\u30af\u30ea\u30a2\u3057\u307e\u3057\u305f\u3002\n\n### \u2460 \u30a4\u30f3\u30d5\u30e9\u304a\u3088\u3073\u8a8d\u8a3c\u30ec\u30a4\u30e4\u30fc\u306e\u69cb\u7bc9 (T715/T732)\n* **\u8a8d\u8a3c\u5c64 (Basic Auth) \u306e\u9069\u7528**: \u516c\u958bURL\uff08GitHub Pages/FastAPI\uff09\u306b `HTTPBasic` \u304a\u3088\u3073 `BasicAuthStaticFiles` \u306b\u3088\u308b\u7c21\u6613\u8a8d\u8a3c\u3092\u5c0e\u5165\u3057\u3001\u7b2c\u4e09\u8005\u306b\u3088\u308b\u7121\u8a31\u53ef\u30a2\u30af\u30bb\u30b9\u3092\u9632\u3050\u30bb\u30ad\u30e5\u30a2\u306a\u691c\u8a3c\u74b0\u5883\u3092\u6574\u5099\u3057\u307e\u3057\u305f\u3002\n* **\u30c7\u30fc\u30bf\u30d9\u30fc\u30b9\u30d7\u30ed\u30d3\u30b8\u30e7\u30cb\u30f3\u30b0**: \u30ed\u30fc\u30ab\u30eb SQLite \u3068\u672c\u756a\u7528 PostgreSQL (Supabase) \u306e\u30c7\u30e5\u30a2\u30ebDB\u63a5\u7d9a\u30c9\u30e9\u30a4\u30d0\u30fc\u3092\u5b9f\u88c5\u5b8c\u4e86\u3057\u3001\u63a5\u7d9a\u5931\u6557\u6642\u306e\u81ea\u52d5 SQLite \u30d5\u30a9\u30fc\u30eb\u30d0\u30c3\u30af\u6a5f\u69cb\u306b\u3088\u308a\u3001\u30c7\u30e2\u74b0\u5883\u306e100%\u7a3c\u50cd\u3092\u4fdd\u8a3c\u3057\u307e\u3057\u305f\u3002\n\n### \u2461 \u30c6\u30b9\u30c8\u30c7\u30fc\u30bf\u30bb\u30c3\u30c8\u306e\u6e96\u5099\u3068\u6d41\u3057\u8fbc\u307f (T713)\n* **\u30b5\u30f3\u30d7\u30eb\u7d4c\u6b74\u66f8 5\u4ef6 / \u6848\u4ef6\u7968 5\u4ef6**: \u500b\u4eba\u8b58\u5225\u60c5\u5831\uff08\u6c0f\u540d\u3001\u96fb\u8a71\u756a\u53f7\u3001\u5177\u4f53\u7684\u306a\u4f01\u696d\u540d\u7b49\uff09\u3092\u5b89\u5168\u306b\u30de\u30b9\u30ad\u30f3\u30b0\u3057\u305f\u30c0\u30df\u30fc\u30c7\u30fc\u30bf\u30bb\u30c3\u30c8\u3092\u4f5c\u6210\u3057\u3001AI\u89e3\u6790\u7528\u306e\u5165\u529b\u30c7\u30fc\u30bf\u3068\u3057\u3066 Workspace \u5185\u306b\u6e96\u5099\u3057\u307e\u3057\u305f\u3002\n\n### \u2462 4\u6b21\u5143AI\u30d5\u30a3\u30c3\u30c8\u8a3a\u65ad\u306e\u5b9f\u884c\u3068UI\u53ef\u8996\u5316 (T712/T714)\n* **\u9069\u5408\u7387\u30fb4\u8ef8\u30b9\u30b3\u30a2\u306e\u53ef\u8996\u5316**:\n  * Skill\uff08\u6280\u8853\u9069\u5408\uff09\n  * Culture\uff08\u30ab\u30eb\u30c1\u30e3\u30fc\u30de\u30c3\u30c1\uff09\n  * Growth\uff08\u6210\u9577\u30dd\u30c6\u30f3\u30b7\u30e3\u30eb\uff09\n  * Performing\uff08\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9\u4e88\u6e2c\uff09\n* \u89e3\u6790\u3055\u308c\u305f\u8a55\u4fa1\u6839\u62e0\u304a\u3088\u3073 `matched_skills` / `missing_skills` \u304cUI\u4e0a\u3067\u8996\u899a\u7684\u306b\u628a\u63e1\u3067\u304d\u308b\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3092\u6574\u5099\u3057\u3001\u9762\u8ac7\u60f3\u5b9a\u8cea\u554f\u306e\u81ea\u52d5\u751f\u6210\u30d5\u30ed\u30fc\u3092\u691c\u8a3c\u3057\u307e\u3057\u305f\u3002\n\n---\n\n## 3. \u73fe\u6642\u70b9\u3067\u306e\u8a55\u4fa1\u3068\u76e3\u67fb\u7d50\u679c\n\n### 3.1 \u8a3a\u65ad\u7d50\u679c\u306e\u7cbe\u5ea6\u8a55\u4fa1\n\u30de\u30b9\u30ad\u30f3\u30b0\u6e08\u307f\u306e\u30b5\u30f3\u30d7\u30eb\u7d4c\u6b74\u66f8\u3068\u6848\u4ef6\u7968\u3092\u7528\u3044\u305f\u30c6\u30b9\u30c8\u30de\u30c3\u30c1\u30f3\u30b0\u3067\u306f\u3001\u30a8\u30f3\u30b8\u30cb\u30a2\u3068\u6848\u4ef6\u306e\u30df\u30b9\u30de\u30c3\u30c1\u3092\u5373\u5ea7\u306b\u691c\u77e5\u3057\u3001\u9069\u683c\u6027\u306e\u9ad8\u3044\u5019\u88dc\u8005\u3092\u4e0a\u4f4d\u306b\u30b9\u30b3\u30a2\u30ea\u30f3\u30b0\u3059\u308b\u3053\u3068\u306b\u6210\u529f\u3057\u3066\u3044\u307e\u3059\u3002\u9762\u8ac7\u8cea\u554f\u306e\u751f\u6210\u7cbe\u5ea6\u3082\u3001\u62c5\u5f53\u8005\u306e\u4e8b\u524d\u6e96\u5099\u5de5\u6570\u3092\u7d0470%\u524a\u6e1b\u3067\u304d\u308b\u898b\u8fbc\u307f\u304c\u7acb\u3063\u3066\u3044\u307e\u3059\u3002\n\n### 3.2 \u30b3\u30b9\u30c8\u30fb\u30af\u30a9\u30fc\u30bf\u30e1\u30fc\u30bf\u30fc\u76e3\u67fb (T707/T736)\n* \u671f\u9593\u4e2d\u306e\u5b9fAPI\u6d88\u8cbb\uff1aGemini API \u306e\u30ad\u30e3\u30c3\u30b7\u30e5\u6a5f\u80fd\uff08TTL 1\u6642\u9593\uff09\u306e\u6d3b\u7528\u306b\u3088\u308a\u3001\u30c8\u30fc\u30af\u30f3\u6d88\u8cbb\u91cf\u3092\u4e88\u6e2c\u5024\u3088\u308a\u7d0490%\u6291\u3048\u8fbc\u307f\u3001\u6708\u984d\u56fa\u5b9a\u8cbb $0\uff08\u5b8c\u5168\u7121\u6599\u67a0\u5185\uff09\u3067\u306e\u904b\u7528\u3092\u7dad\u6301\u3057\u3066\u3044\u307e\u3059\u3002\n* `scripts/monitor_managed_agents_cost.py` \u3092\u7528\u3044\u305f\u65e5\u6b21\u30b3\u30b9\u30c8\u53f0\u5e33\u3082\u6b63\u5e38\u306b\u6a5f\u80fd\u3057\u3066\u304a\u308a\u3001\u30bd\u30d5\u30c8\u30ea\u30df\u30c3\u30c8\uff08$10/\u6708\uff09\u304a\u3088\u3073\u30cf\u30fc\u30c9\u30ea\u30df\u30c3\u30c8\uff08$20/\u6708\uff09\u306e\u81ea\u52d5\u906e\u65ad\u30ed\u30b8\u30c3\u30af\u304c\u5b89\u5168\u306b\u52d5\u4f5c\u3059\u308b\u3053\u3068\u3092\u78ba\u8a8d\u3057\u3066\u3044\u307e\u3059\u3002\n\n---\n\n## 4. \u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\u3068\u6cd5\u52d9\u5408\u610f\u306e\u9032\u6357 (T710)\n\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\u304a\u3088\u3073GDPR\u306b\u6e96\u62e0\u3059\u308b\u305f\u3081\u3001\u4ee5\u4e0b\u306e\u5bfe\u5fdc\u3092\u5b8c\u4e86\u30fb\u9032\u884c\u3057\u3066\u3044\u307e\u3059\uff1a\n1. **\u5229\u7528\u540c\u610f\u66f8\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\u306e\u8d77\u7968**: \u30d1\u30a4\u30ed\u30c3\u30c8\u53c2\u52a0\u8005\u304c\u8a3a\u65ad\u3092\u958b\u59cb\u3059\u308b\u524d\u306b\u3001\u30c7\u30fc\u30bf\u306e\u53d6\u6271\u65b9\u6cd5\u3084\u4fdd\u7ba1\u671f\u9593\uff08\u7d42\u4e86\u5f8c3\u55b6\u696d\u65e5\u4ee5\u5185\u306b\u5b8c\u5168\u6d88\u53bb\uff09\u306b\u540c\u610f\u3059\u308b\u305f\u3081\u306e\u7f72\u540d\u30fb\u78ba\u8a8d\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\u3092\u4f5c\u6210\u3057\u307e\u3057\u305f\u3002\n2. **\u6cd5\u52d9\u30ec\u30d3\u30e5\u30fc**: \u5916\u90e8\u5c02\u9580\u5f01\u8b77\u58eb\u3068\u306eNDA\u4e0b\u3067\u306e\u30ec\u30d3\u30e5\u30fc\u30926\u67089\u65e5\u307e\u3067\u306b\u5b8c\u4e86\u3055\u305b\u308b\u305f\u3081\u3001\u73fe\u5728\u8cc7\u6599\u306e\u6700\u7d42\u78ba\u8a8d\u3092\u9032\u3081\u3066\u3044\u307e\u3059\u3002\n\n---\n\n## 5. \u6b21\u9031\uff086\u67089\u65e5\u301c6\u670816\u65e5\uff09\u306e\u30a2\u30af\u30b7\u30e7\u30f3\n* **[T717]** \u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u4e0a\u306e\u300e\u30d1\u30a4\u30ed\u30c3\u30c8\u96c6\u8a08\u300f\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3078\u306e\u30c7\u30fc\u30bf\u53cd\u6620\u3068\u30b0\u30e9\u30d5\u5316\u3002\n* **[T740]** \u30ab\u30b9\u30bf\u30e0\u30c9\u30e1\u30a4\u30f3\u3078\u306eDNS\u79fb\u884c\u691c\u8a3c\u3068SSL\u8a3c\u660e\u66f8\u81ea\u52d5\u66f4\u65b0\u78ba\u8a8d\u3002\n* **[T741]** Supabase PostgreSQL \u306e\u81ea\u52d5\u65e5\u6b21\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\u904b\u7528\u306e\u8a2d\u8a08\u304a\u3088\u3073\u691c\u8a3c\u3002\n* **[6\u670816\u65e5 17:30]** \u5b9a\u4f8b\u30ec\u30d3\u30e5\u30fc\u306b\u304a\u3044\u3066\u3001\u5c0f\u6797\u96c5\u6c34 CEO \u3078\u30d1\u30a4\u30ed\u30c3\u30c8\u6700\u7d42\u5831\u544a\u3092\u63d0\u793a\u3057\u3001\u5b9f\u904b\u7528\u3078\u306eGo/No-Go\u5224\u5b9a\uff08T746\uff09\u3092\u884c\u3046\u3002\n";
