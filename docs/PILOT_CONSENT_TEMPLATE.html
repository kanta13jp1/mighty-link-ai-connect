        const rawMarkdown = "# Mighty Skill-Bridge\uff1aAI\u30d5\u30a3\u30c3\u30c8\u8a3a\u65ad\u30d1\u30a4\u30ed\u30c3\u30c8\u53c2\u52a0\u540c\u610f\u66f8\uff08\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\uff09\n\n**\u6587\u66f8\u756a\u53f7**: MSB-COMP-2026-001  \n**\u9069\u7528\u958b\u59cb\u65e5**: 2026\u5e746\u67083\u65e5  \n**\u5bfe\u8c61\u7bc4\u56f2**: \u672c\u30d7\u30ed\u30c8\u30bf\u30a4\u30d7\u30d1\u30a4\u30ed\u30c3\u30c8\u30d7\u30ed\u30b0\u30e9\u30e0\uff08\u65b9\u5411\u6027A\uff1aAI\u30d5\u30a3\u30c3\u30c8\u8a3a\u65ad\u652f\u63f4\uff09\u53c2\u52a0\u306e\u5168\u793e\u5185\u5f93\u696d\u54e1\u304a\u3088\u3073\u5019\u88dc\u8005  \n**\u7ba1\u7406\u533a\u5206**: \u793e\u5185\u79d8\u30fb\u8981\u540c\u610f\u7f72\u540d  \n\n---\n\n\u682a\u5f0f\u4f1a\u793e Mighty-Link\uff08\u4ee5\u4e0b\u300c\u5f53\u793e\u300d\u3068\u3044\u3046\uff09\u304c\u5b9f\u65bd\u3059\u308b\u300cMighty Skill-Bridge\uff1aAI\u30d5\u30a3\u30c3\u30c8\u8a3a\u65ad\u30d1\u30a4\u30ed\u30c3\u30c8\u30d7\u30ed\u30b0\u30e9\u30e0\u300d\uff08\u4ee5\u4e0b\u300c\u672c\u30d1\u30a4\u30ed\u30c3\u30c8\u300d\u3068\u3044\u3046\uff09\u3078\u306e\u53c2\u52a0\u306b\u3042\u305f\u308a\u3001\u53c2\u52a0\u8005\uff08\u4ee5\u4e0b\u300c\u7532\u300d\u3068\u3044\u3046\uff09\u306f\u3001\u5f53\u793e\uff08\u4ee5\u4e0b\u300c\u4e59\u300d\u3068\u3044\u3046\uff09\u306b\u3088\u308b\u500b\u4eba\u60c5\u5831\u306e\u53ce\u96c6\u3001\u51e6\u7406\u3001\u304a\u3088\u3073AI\u30e2\u30c7\u30eb\uff08Google Gemini API \u7b49\uff09\u3078\u306e\u6d41\u3057\u8fbc\u307f\u306b\u304a\u3051\u308b\u533f\u540d\u5316\u898f\u5247\u306b\u3064\u3044\u3066\u3001\u4ee5\u4e0b\u306e\u6761\u9805\u306b\u540c\u610f\u3059\u308b\u3082\u306e\u3068\u3057\u307e\u3059\u3002\n\n### \u7b2c1\u6761\uff08\u5229\u7528\u76ee\u7684\uff09\n\u4e59\u306f\u3001\u7532\u304b\u3089\u63d0\u4f9b\u3055\u308c\u305f\u7d4c\u6b74\u66f8\uff08\u30ec\u30b8\u30e5\u30e1\uff09\u3001\u30b9\u30ad\u30eb\u30bb\u30c3\u30c8\u3001\u304a\u3088\u3073\u30a2\u30f3\u30b1\u30fc\u30c8\u30c7\u30fc\u30bf\u3092\u3001\u4ee5\u4e0b\u306e\u76ee\u7684\u306e\u7bc4\u56f2\u5185\u3067\u306e\u307f\u5229\u7528\u3057\u307e\u3059\u3002\n1. AI\u3092\u7528\u3044\u305f\u8077\u52d9\u9069\u6027\u30fb\u6848\u4ef6\u30de\u30c3\u30c1\u30f3\u30b0\uff08\u65b9\u5411\u6027A\uff09\u306e\u30a2\u30eb\u30b4\u30ea\u30ba\u30e0\u7cbe\u5ea6\u691c\u8a3c\u3002\n2. \u5f93\u696d\u54e1\u9593\u306e\u30b9\u30ad\u30eb\u30ae\u30e3\u30c3\u30d7\u53ef\u8996\u5316\u304a\u3088\u3073\u793e\u5185\u80b2\u6210\u30ed\u30fc\u30c9\u30de\u30c3\u30d7\u81ea\u52d5\u751f\u6210\u6a5f\u80fd\u306e\u8a55\u4fa1\u3002\n3. \u672c\u30b7\u30b9\u30c6\u30e0\u306e\u30e6\u30fc\u30b6\u30d3\u30ea\u30c6\u30a3\u5411\u4e0a\u304a\u3088\u3073\u6a5f\u80fd\u6539\u5584\u3002\n\n### \u7b2c2\u6761\uff08\u53ce\u96c6\u3059\u308b\u60c5\u5831\u9805\u76ee\u3068\u53b3\u683c\u306a\u533f\u540d\u5316\u63aa\u7f6e\uff09\n\u4e59\u306f\u3001\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\u304a\u3088\u3073\u4e59\u306e\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u306b\u57fa\u3065\u304d\u3001\u53ce\u96c6\u3059\u308b\u30c7\u30fc\u30bf\u306b\u5bfe\u3057\u3066\u4ee5\u4e0b\u306e\u901a\u308a\u53b3\u683c\u306a\u533f\u540d\u5316\u30fb\u30de\u30b9\u30ad\u30f3\u30b0\uff08\u500b\u4eba\u8b58\u5225\u7b26\u53f7\u306e\u9664\u53bb\uff09\u63aa\u7f6e\u3092\u65bd\u3057\u305f\u4e0a\u3067AI\u30a8\u30f3\u30b8\u30f3\u3078\u9023\u643a\u3057\u307e\u3059\u3002\n\n1. **\u76f4\u63a5\u7684\u306a\u8b58\u5225\u5b50\u306e\u5b8c\u5168\u9664\u53bb\uff08\u30de\u30b9\u30ad\u30f3\u30b0\uff09**\uff1a\n   * \u6c0f\u540d\u3001\u751f\u5e74\u6708\u65e5\u3001\u4f4f\u6240\u3001\u96fb\u8a71\u756a\u53f7\u3001\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u3001\u6240\u5c5e\u90e8\u7f72\u540d\u3001\u304a\u3088\u3073\u7279\u5b9a\u306e\u500b\u4eba\u3092\u5bb9\u6613\u306b\u8b58\u5225\u3067\u304d\u308b\u56fa\u6709\u540d\u8a5e\u306fAI\u30b7\u30b9\u30c6\u30e0\u306b\u9001\u4fe1\u3059\u308b\u524d\u306b\u5b8c\u5168\u306b\u524a\u9664\u3001\u307e\u305f\u306f\u30c0\u30df\u30fcID\uff08\u4f8b\uff1a`Candidate-A01` \u7b49\uff09\u306b\u7f6e\u63db\u3057\u307e\u3059\u3002\n2. **\u7d4c\u6b74\u66f8\u60c5\u5831\u306e\u4e00\u822c\u5316**\uff1a\n   * \u904e\u53bb\u306e\u52e4\u52d9\u5148\u4f01\u696d\u540d\u3001\u5b66\u6821\u540d\u3001\u5177\u4f53\u7684\u306a\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u56fa\u6709\u540d\u79f0\u7b49\u306f\u3001\u4e00\u822c\u7684\u306a\u696d\u7a2e\u30fb\u8077\u7a2e\uff08\u4f8b\uff1a\u300c\u5927\u624bSIer\u3067\u306eJava\u958b\u767a\u300d\u27a1\ufe0f\u300cIT\u30b5\u30fc\u30d3\u30b9\u4f01\u696d\u3067\u306e\u30aa\u30d6\u30b8\u30a7\u30af\u30c8\u6307\u5411\u8a00\u8a9e\u958b\u767a\u300d\uff09\u306b\u7f6e\u63db\u30fb\u4e38\u3081\u51e6\u7406\u3092\u884c\u3044\u3001AI\u306e\u6587\u8108\u89e3\u6790\u306b\u5fc5\u8981\u306a\u30b9\u30ad\u30eb\u60c5\u5831\u306e\u307f\u3092\u62bd\u51fa\u3057\u307e\u3059\u3002\n\n### \u7b2c3\u6761\uff08\u5916\u90e8AI API\uff08Google Gemini API \u7b49\uff09\u9023\u643a\u306b\u304a\u3051\u308b\u5b89\u5168\u7ba1\u7406\u63aa\u7f6e\uff09\n1. \u4e59\u306f\u3001\u7532\u306e\u30c7\u30fc\u30bf\u3092AI\u51e6\u7406\u3059\u308b\u306b\u3042\u305f\u308a\u3001Google Cloud / Gemini API \u306e\u300c\u30c7\u30fc\u30bf\u4fdd\u8b77\u304a\u3088\u3073\u30aa\u30d7\u30c8\u30a2\u30a6\u30c8\u898f\u7d04\u300d\u3092\u9069\u7528\u3057\u3001**\u9001\u4fe1\u3055\u308c\u305f\u30c7\u30fc\u30bf\u304c\u5916\u90e8\u30e2\u30c7\u30eb\u306e\u516c\u958b\u5b66\u7fd2\u30c7\u30fc\u30bf\u3068\u3057\u3066\u4e8c\u6b21\u5229\u7528\u30fb\u84c4\u7a4d\u3055\u308c\u306a\u3044\u30d7\u30e9\u30a4\u30d9\u30fc\u30c8\u30fbAPI\u30a8\u30f3\u30c9\u30dd\u30a4\u30f3\u30c8**\u3092\u4f7f\u7528\u3057\u307e\u3059\u3002\n2. \u4e59\u306f\u3001\u5916\u90e8API\u3068\u306e\u901a\u4fe1\u7d4c\u8def\u3092SSL/TLS\u306b\u3088\u308a\u6697\u53f7\u5316\u3057\u3001\u30c7\u30fc\u30bf\u306e\u6f0f\u6d29\u30fb\u4e0d\u6b63\u30a2\u30af\u30bb\u30b9\u3092\u9632\u6b62\u3057\u307e\u3059\u3002\n\n### \u7b2c4\u6761\uff08\u30c7\u30fc\u30bf\u306e\u4fdd\u5b58\u671f\u9593\u304a\u3088\u3073\u6d88\u53bb\uff09\n1. \u4e59\u306f\u3001\u672c\u30d1\u30a4\u30ed\u30c3\u30c8\u8a55\u4fa1\u671f\u9593\uff082026\u5e746\u67083\u65e5\u301c2026\u5e746\u670816\u65e5\uff09\u304c\u7d42\u4e86\u3057\u305f\u5f8c\u3001\u307e\u305f\u306f\u7532\u304b\u3089\u524a\u9664\u4f9d\u983c\u304c\u3042\u3063\u305f\u5834\u5408\u3001\u53ce\u96c6\u3057\u305f\u751f\u30c7\u30fc\u30bf\u304a\u3088\u3073AI\u751f\u6210\u7d50\u679c\u30923\u55b6\u696d\u65e5\u4ee5\u5185\u306b\u7269\u7406\u7684\u30fb\u8ad6\u7406\u7684\u306b\u5fa9\u5143\u4e0d\u53ef\u80fd\u306a\u65b9\u6cd5\u3067\u5b8c\u5168\u6d88\u53bb\u3057\u307e\u3059\u3002\n2. \u30b7\u30b9\u30c6\u30e0\u76e3\u67fb\u7528\u306e\u5224\u5b9a\u30ed\u30b0\uff08JSONL\uff09\u306f\u3001\u5b8c\u5168\u533f\u540d\u5316\u3055\u308c\u305fID\u60c5\u5831\u306e\u307f\u3092\u4fdd\u6301\u3057\u3001\u6700\u59276\u30f6\u6708\u4fdd\u7ba1\u3057\u305f\u5f8c\u306b\u81ea\u52d5\u6d88\u53bb\u3055\u308c\u307e\u3059\u3002\n\n### \u7b2c5\u6761\uff08\u540c\u610f\u306e\u64a4\u56de\uff09\n\u7532\u306f\u3001\u672c\u30d1\u30a4\u30ed\u30c3\u30c8\u306e\u5b9f\u65bd\u671f\u9593\u4e2d\u3001\u3044\u3064\u3067\u3082\u4e59\u306b\u5bfe\u3057\u3066\u66f8\u9762\u307e\u305f\u306f\u30e1\u30fc\u30eb\u306b\u3066\u901a\u77e5\u3059\u308b\u3053\u3068\u306b\u3088\u308a\u3001\u672c\u540c\u610f\u3092\u64a4\u56de\u3057\u3001\u53c2\u52a0\u3092\u4e2d\u6b62\u3059\u308b\u3053\u3068\u304c\u3067\u304d\u307e\u3059\u3002\u3053\u306e\u5834\u5408\u3001\u4e59\u306f\u901f\u3084\u304b\u306b\u7532\u306e\u30c7\u30fc\u30bf\u3092\u7834\u68c4\u3057\u307e\u3059\u3002\n\n---\n\n## \u270d\ufe0f \u540c\u610f\u7f72\u540d\u6b04\n\n\u672c\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\u306f\u3001\u30d1\u30a4\u30ed\u30c3\u30c8\u53c2\u52a0\u6642\u306b\u96fb\u5b50\u7684\uff08Notion\u30d5\u30a9\u30fc\u30e0\u307e\u305f\u306f\u540c\u610f\u7528UI\uff09\u307e\u305f\u306f\u66f8\u9762\u306b\u3066\u7f72\u540d\u3092\u53d6\u5f97\u3059\u308b\u969b\u306e\u30de\u30b9\u30bf\u30fc\u30d5\u30a9\u30fc\u30e0\u3068\u3057\u3066\u4f7f\u7528\u3057\u307e\u3059\u3002\n\n\u300c\u79c1\u306f\u3001\u4e0a\u8a18\u300eAI\u30d5\u30a3\u30c3\u30c8\u8a3a\u65ad\u30d1\u30a4\u30ed\u30c3\u30c8\u53c2\u52a0\u540c\u610f\u66f8\u300f\u306e\u5185\u5bb9\u3092\u5341\u5206\u306b\u7406\u89e3\u3057\u3001\u79c1\u306e\u500b\u4eba\u60c5\u5831\u304a\u3088\u3073\u30b9\u30ad\u30eb\u30c7\u30fc\u30bf\u306e\u533f\u540d\u5316\u51e6\u7406\u306a\u3089\u3073\u306bAI\u30e2\u30c7\u30eb\u3078\u306e\u9001\u4fe1\u30fb\u5229\u7528\u306b\u540c\u610f\u3057\u307e\u3059\u3002\u300d\n\n**\u540c\u610f\u65e5**: 2026\u5e74____\u6708____\u65e5  \n\n**\u53c2\u52a0\u8005\u6c0f\u540d\uff08\u7f72\u540d\uff09**: _________________________________  \n";
