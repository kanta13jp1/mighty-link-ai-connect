    <script>
        const rawMarkdown = "# Mighty Skill-Bridge CEO\u30d7\u30ec\u30bc\u30f3\u969c\u5bb3\u6642\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\uff06\u30d5\u30a7\u30a4\u30eb\u30aa\u30fc\u30d0\u30fc\u30ac\u30a4\u30c9\n\n\u672c\u30ac\u30a4\u30c9\u306f\u30012026\u5e746\u67082\u65e5\u306e\u793e\u9577\u30d7\u30ec\u30bc\u30f3\u304a\u3088\u3073\u30c7\u30e2\u5b9f\u884c\u6642\u306b\u3001\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u969c\u5bb3\u3001API\u30a8\u30e9\u30fc\u3001\u5916\u90e8\u30c4\u30fc\u30eb\u306e\u30c8\u30e9\u30d6\u30eb\u304c\u767a\u751f\u3057\u305f\u5834\u5408\u306b\u8fc5\u901f\u306b\u5bfe\u51e6\u3059\u308b\u305f\u3081\u306e\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\u624b\u9806\u3092\u307e\u3068\u3081\u305f\u3082\u306e\u3067\u3059\u3002\n\n---\n\n## 1. \u516c\u958b\u30c7\u30e2URL\u969c\u5bb3\u6642\u306e\u30d5\u30a7\u30a4\u30eb\u30aa\u30fc\u30d0\u30fc\uff08\u30ed\u30fc\u30ab\u30eb\u8d77\u52d5\u624b\u9806\uff09\n\n\u3082\u3057 GitHub Pages \u306b\u30c7\u30d7\u30ed\u30a4\u3055\u308c\u305f\u516c\u958bURL [https://kanta13jp1.github.io/mighty-link-ai-connect/](https://kanta13jp1.github.io/mighty-link-ai-connect/) \u304c\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u5207\u65ad\u7b49\u306e\u7406\u7531\u3067\u958b\u3051\u306a\u3044\u5834\u5408\u3001\u30ed\u30fc\u30ab\u30eb\u74b0\u5883\u3067\u30e2\u30c3\u30af\u30a2\u30c3\u30d7\u30b5\u30fc\u30d0\u30fc\u3092\u5373\u5ea7\u306b\u8d77\u52d5\u3057\u3066\u30c7\u30e2\u3092\u7d99\u7d9a\u3057\u307e\u3059\u3002\n\n### \u25a0 \u30ed\u30fc\u30ab\u30eb\u8d77\u52d5\u30b3\u30de\u30f3\u30c9\n\n1. \u30ea\u30dd\u30b8\u30c8\u30ea\u306e\u30eb\u30fc\u30c8\u30c7\u30a3\u30ec\u30af\u30c8\u30ea\u3067\u3001PowerShell\u3092\u958b\u304d\u307e\u3059\u3002\n2. \u4ee5\u4e0b\u306e\u30b3\u30de\u30f3\u30c9\u3092\u5b9f\u884c\u3057\u3066\u3001AI\u30e2\u30c3\u30af\u3092\u5f37\u5236\u3057\u305f\u72b6\u614b\u3067\u30ed\u30fc\u30ab\u30eb\u30b5\u30fc\u30d0\u30fc\u3092\u8d77\u52d5\u3057\u307e\u3059\u3002\n\n   ```powershell\n   $env:AI_FORCE_MOCK=\"1\"\n   python src/app.py\n   ```\n\n   *(\u203b Linux/macOS\u7b49\u306e bash \u74b0\u5883\u306e\u5834\u5408\u306f `AI_FORCE_MOCK=1 python src/app.py` \u3092\u5b9f\u884c)*\n3. \u8d77\u52d5\u5f8c\u3001\u30d6\u30e9\u30a6\u30b6\u3067 [http://127.0.0.1:8000/](http://127.0.0.1:8000/) \u306b\u30a2\u30af\u30bb\u30b9\u3057\u307e\u3059\u3002\n4. \u3053\u308c\u306b\u3088\u308a\u3001\u5b8c\u5168\u306b\u30ed\u30fc\u30ab\u30eb\u304b\u3064\u7121\u505c\u6b62\u3067 Seedance\u98a8 UI \u30c7\u30e2\u304c\u6b63\u5e38\u52d5\u4f5c\u3057\u307e\u3059\u3002\n\n---\n\n## 2. \u9759\u7684\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\u8cc7\u6599\u306e\u6d3b\u7528\uff08\u5b8c\u5168\u30aa\u30d5\u30e9\u30a4\u30f3\u6642\uff09\n\nPC\u3084\u30b5\u30fc\u30d0\u30fc\u306e\u6a5f\u80fd\u304c\u5b8c\u5168\u306b\u505c\u6b62\u3057\u3066\u3044\u308b\u3001\u3042\u308b\u3044\u306f\u30ed\u30fc\u30ab\u30eb\u8d77\u52d5\u304c\u4e0d\u53ef\u80fd\u306a\u5834\u5408\u306e\u6700\u7d42\u624b\u6bb5\u3068\u3057\u3066\u3001\u3042\u3089\u304b\u3058\u3081\u64ae\u5f71\u3055\u308c\u305f\u9ad8\u89e3\u50cf\u5ea6\u30b9\u30af\u30ea\u30fc\u30f3\u30b7\u30e7\u30c3\u30c8\u304a\u3088\u3073\u5404\u7a2e\u4ed5\u69d8\u66f8PDF\u3092\u6d3b\u7528\u3057\u307e\u3059\u3002\n\n- **\u9759\u7684\u30b9\u30af\u30ea\u30fc\u30f3\u30b7\u30e7\u30c3\u30c8\u306e\u4fdd\u5b58\u5834\u6240**:\n  `exports/knowledge_flow/screenshots/` \u914d\u4e0b\u306b\u3001\u30d5\u30ed\u30f3\u30c8\u30a8\u30f3\u30c9UI\u306e\u5404\u72b6\u614b\uff08\u5206\u6790\u5165\u529b\u3001\u5206\u6790\u4e2d\u3001\u7d50\u679c\u8868\u793a\u3001\u30ec\u30fc\u30c0\u30fc\u30c1\u30e3\u30fc\u30c8\u7b49\uff09\u306e\u753b\u50cf\u304c\u683c\u7d0d\u3055\u308c\u3066\u3044\u307e\u3059\u3002\n- **PPTX \u30d7\u30ec\u30bc\u30f3\u8cc7\u6599\u306e\u6d3b\u7528**:\n  \u30ed\u30fc\u30ab\u30eb\u304a\u3088\u3073Google Drive\u4e0a\u306e `mighty_skill_bridge_ceo_presentation_2026-06-02_branded.pptx` \u306b\u306f\u3001\u30d5\u30ed\u30f3\u30c8\u30a8\u30f3\u30c9\u306e\u30c7\u30b6\u30a4\u30f3\u30ef\u30a4\u30e4\u30fc\u30d5\u30ec\u30fc\u30e0\u3084\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u56f3\u304c\u57cb\u3081\u8fbc\u307e\u308c\u3066\u3044\u307e\u3059\u3002\u30b9\u30e9\u30a4\u30c9\u3092\u6620\u3059\u3060\u3051\u3067\u30c7\u30b6\u30a4\u30f3\u30af\u30aa\u30ea\u30c6\u30a3\u3092\u5341\u5206\u306b\u30a2\u30d4\u30fc\u30eb\u3067\u304d\u307e\u3059\u3002\n\n---\n\n## 3. Google\u30ab\u30ec\u30f3\u30c0\u30fc\u969c\u5bb3\u6642\u306e ICS\u624b\u52d5\u30a4\u30f3\u30dd\u30fc\u30c8\u624b\u9806\n\nGoogle Calendar API\u306e\u4e0d\u5177\u5408\u3084\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u898f\u5236\u306b\u3088\u308a\u3001\u958b\u767a\u8a08\u753b\u30ab\u30ec\u30f3\u30c0\u30fc\uff08Google\u30ab\u30ec\u30f3\u30c0\u30fc\uff09\u304c\u540c\u671f\u3055\u308c\u306a\u3044\u3001\u307e\u305f\u306f\u8868\u793a\u3055\u308c\u306a\u3044\u5834\u5408\u3001\u30ed\u30fc\u30ab\u30eb\u306b\u66f8\u304d\u51fa\u3055\u308c\u3066\u3044\u308bICS\u30d5\u30a1\u30a4\u30eb\u304b\u3089\u624b\u52d5\u3067\u30ab\u30ec\u30f3\u30c0\u30fc\u3092\u5fa9\u65e7\u30fb\u518d\u73fe\u3057\u307e\u3059\u3002\n\n### \u25a0 ICS\u624b\u52d5\u30a4\u30f3\u30dd\u30fc\u30c8\u624b\u9806\n\n1. \u30d1\u30bd\u30b3\u30f3\u3067 [Google \u30ab\u30ec\u30f3\u30c0\u30fc](https://calendar.google.com/) \u3092\u958b\u304d\u307e\u3059\u3002\n2. \u53f3\u4e0a\u306e\u8a2d\u5b9a\u30a2\u30a4\u30b3\u30f3\uff08\u6b6f\u8eca\u30de\u30fc\u30af\uff09 \u2794 **[\u8a2d\u5b9a]** \u3092\u30af\u30ea\u30c3\u30af\u3057\u307e\u3059\u3002\n3. \u5de6\u5074\u306e\u30e1\u30cb\u30e5\u30fc\u3067 **[\u30a4\u30f3\u30dd\u30fc\u30c8 / \u30a8\u30af\u30b9\u30dd\u30fc\u30c8]** \u3092\u30af\u30ea\u30c3\u30af\u3057\u307e\u3059\u3002\n4. **[\u30d1\u30bd\u30b3\u30f3\u304b\u3089\u30d5\u30a1\u30a4\u30eb\u3092\u9078\u629e]** \u3092\u30af\u30ea\u30c3\u30af\u3057\u3001\u30ea\u30dd\u30b8\u30c8\u30ea\u5185\u306e\u4ee5\u4e0b\u306e\u30d5\u30a1\u30a4\u30eb\u3092\u9078\u629e\u3057\u307e\u3059\u3002\n   - `exports/mighty_development_plan.ics`\n5. \u30a4\u30f3\u30dd\u30fc\u30c8\u5148\u3068\u3057\u3066\u3001\u5fa9\u65e7\u7528\u307e\u305f\u306f\u30c7\u30e2\u7528\u306b\u65b0\u3057\u304f\u4f5c\u6210\u3057\u305f\u30de\u30a4\u30ab\u30ec\u30f3\u30c0\u30fc\uff08\u4f8b: \u300cMighty Skill-Bridge \u958b\u767a\u8a08\u753b\uff08\u4ee3\u66ff\uff09\u300d\uff09\u3092\u9078\u629e\u3057\u307e\u3059\u3002\n6. **[\u30a4\u30f3\u30dd\u30fc\u30c8]** \u3092\u30af\u30ea\u30c3\u30af\u3057\u307e\u3059\u3002\n7. \u6570\u79d2\u3067\u30ab\u30ec\u30f3\u30c0\u30fc\u4e0a\u306b\u5168\u30bf\u30b9\u30af\u306e\u4e88\u5b9a\uff08\u958b\u59cb\u301c\u7d42\u4e86\uff09\u304c\u7dba\u9e97\u306b\u518d\u73fe\u3055\u308c\u307e\u3059\u3002\n\n---\n\n## 4. Google Sheets \u969c\u5bb3\u6642\u306e\u30ed\u30fc\u30ab\u30eb\u4ee3\u66ff\u5bfe\u5fdc\n\n\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\uff08WBS\u3084\u8ab2\u984c\u7ba1\u7406\u7b49\uff09\u304cGoogle\u306e\u30b5\u30fc\u30d3\u30b9\u30c0\u30a6\u30f3\u306b\u3088\u308a\u958b\u3051\u306a\u3044\u5834\u5408\u3001\u30ed\u30fc\u30ab\u30eb\u306eTSV\u30d5\u30a1\u30a4\u30eb\u7fa4\u3092Excel\u3084CSV\u30a8\u30c7\u30a3\u30bf\u3067\u958b\u304d\u3001\u30d7\u30ed\u30b8\u30a7\u30af\u30bf\u30fc\u306b\u6295\u5f71\u3057\u3066\u9032\u884c\u3057\u307e\u3059\u3002\n\n- WBS\u30c7\u30fc\u30bf: `data/WBS.tsv`\n- \u8ab2\u984c\u7ba1\u7406\u8868: `data/issues_tracker.tsv`\n- QA\u30ea\u30b9\u30c8: `data/qa_tracker.tsv`\n- \u30c6\u30b9\u30c8\u7d50\u679c: `data/test_results.tsv`\n- \u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u30ed\u30b0: `data/security_log.tsv`\n- \u30c7\u30d7\u30ed\u30a4\u5b9f\u884c\u30ed\u30b0: `data/deploy_log.tsv`\n";
