        const rawMarkdown = "# \u5229\u7528\u898f\u7d04\u30fb\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc \u5e74\u6b21\u898b\u76f4\u3057\u30fb\u6539\u5b9a\u30d7\u30ed\u30bb\u30b9 (T772)\n\n**Mighty Skill-Bridge** \u306e\u5229\u7528\u898f\u7d04\u304a\u3088\u3073\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u3092\u3001\u6cd5\u6539\u6b63\u30fb\u30b5\u30fc\u30d3\u30b9\u5909\u66f4\u306b\u8ffd\u5f93\u3057\u3066\u5e74\u6b21\u3067\u898b\u76f4\u3057\u30fb\u6539\u5b9a\u3059\u308b\u305f\u3081\u306e\u30d7\u30ed\u30bb\u30b9\u3092\u5b9a\u7fa9\u3057\u307e\u3059\u3002\n\n---\n\n## \u30d0\u30fc\u30b8\u30e7\u30f3\u5c65\u6b74\n\n| \u65e5\u4ed8 | \u30d0\u30fc\u30b8\u30e7\u30f3 | \u5185\u5bb9 | \u8d77\u7a3f\u8005 |\n| :--- | :--- | :--- | :--- |\n| 2026-06-10 | v1.0.0 | \u521d\u7248\u4f5c\u6210\uff08\u5e74\u6b21\u30c1\u30a7\u30c3\u30af\u30ea\u30b9\u30c8\u30fb\u6539\u5b9a\u624b\u9806\u30fb\u901a\u77e5\u30d5\u30ed\u30fc\uff09 | Claude Code |\n\n---\n\n## 1. \u5e74\u6b21\u898b\u76f4\u3057\u30b9\u30b1\u30b8\u30e5\u30fc\u30eb\n\n| \u6708 | \u4f5c\u696d\u5185\u5bb9 | \u62c5\u5f53 |\n| :--- | :--- | :--- |\n| **\u6bce\u5e741\u6708** | \u6cd5\u6539\u6b63\u30c1\u30a7\u30c3\u30af\u30fb\u6539\u5b9a\u8981\u5426\u306e\u5224\u65ad | Claude Code + \u4eba\u9593 |\n| **\u6bce\u5e742\u6708** | \u6539\u5b9a\u6848\u4f5c\u6210\u30fb\u6cd5\u52d9\u78ba\u8a8d | \u4eba\u9593 + \u5916\u90e8\u5f01\u8b77\u58eb\uff08\u5fc5\u8981\u6642\uff09 |\n| **\u6bce\u5e743\u6708** | \u30e6\u30fc\u30b6\u30fc\u901a\u77e5\u30fb\u6539\u5b9a\u7248\u516c\u958b | \u958b\u767a\u62c5\u5f53 |\n\n---\n\n## 2. \u6cd5\u6539\u6b63\u30c1\u30a7\u30c3\u30af\u30ea\u30b9\u30c8\uff08\u5e74\u6b21\uff09\n\n### 2.1 \u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\uff08\u65e5\u672c\uff09\n\n```\n[ ] \u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u59d4\u54e1\u4f1a\u306e\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u6539\u6b63\u901a\u77e5\u3092\u78ba\u8a8d\n    https://www.ppc.go.jp/personalinfo/legal/\n[ ] \u300c\u8981\u914d\u616e\u500b\u4eba\u6
