c\u30b9\u30c1\u30a7\u30c3\u30af\u305d\u306e\u3082\u306e\u3067\u306f\u306a\u3044**\u304c\u3001\u985e\u4f3c\u306e\u81ea\u5df1\u7533\u544a\u30c7\u30fc\u30bf\u3092\u6271\u3046\u305f\u3081\u3001\u540c\u8da3\u65e8\u306e\u4e0d\u5229\u76ca\u53d6\u6271\u3044\u7981\u6b62\u3092\u660e\u8a18\u3057\u3066\u5236\u5ea6\u8a72\u5f53\u6027\u306e\u7591\u7fa9\u3092\u4e0b\u3052\u308b\u69cb\u6210\u3002\u8077\u696d\u5b89\u5b9a\u6cd5\u7b2c5\u6761\u306e5\uff08\u6c42\u8077\u8005\u7b49\u306e\u500b\u4eba\u60c5\u5831\u306e\u53d6\u6271\u3044\uff09\u3082\u53c2\u7167\u3002\n- **\u78ba\u5b9a\u306b\u5fc5\u8981\u306a\u5165\u529b**: \u5f01\u8b77\u58eb\u78ba\u8a8d \u2014 (a) \u672c\u6a5f\u80fd\u304c\u30b9\u30c8\u30ec\u30b9\u30c1\u30a7\u30c3\u30af\u5236\u5ea6\u306e\u9069\u7528\u5bfe\u8c61\u5916\u3067\u3042\u308b\u3053\u3068\u306e\u78ba\u8a8d\u3001(b) \u4e0a\u8a18\u8ffd\u52a0\u6587\u8a00\u3067\u8db3\u308a\u308b\u304b\u3001(c) \u5c31\u696d\u898f\u5247\u30fb\u52b4\u4f7f\u5354\u5b9a\u5074\u306e\u624b\u5f53\u3066\u306e\u8981\u5426\u3002\n\n### T798-03 SLA\u76ee\u6a19\u5024\u3092\u5951\u7d04\u4e0a\u306e\u4fdd\u8a3c\u3068\u3057\u306a\u3044\u514d\u8cac\u69cb\u6210\u306e\u59a5\u5f53\u6027\uff08\u7b2c5\u6761\uff09\n\n- **\u533a\u5206**: \u5f01\u8b77\u58eb\u78ba\u8a8d\u304c\u5fc5\u8981\n- **\u30c9\u30e9\u30d5\u30c8\u56de\u7b54**: \u73fe\u884c\u69cb\u6210\uff08\u300c\u76ee\u6a19\u5024\u3067\u3042\u308a\u3001\u9054\u6210\u3092\u4fdd\u8a3c\u3059\u308b\u3082\u306e\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u300d\uff09\u3092\u7dad\u6301\u3002\u7121\u511f\u306e\u793e\u5185\u5229\u7528\u30d5\u30a7\u30fc\u30ba\u3067\u306f\u5408\u7406\u7684\u3068\u8003\u3048\u3089\u308c\u308b\u3002\u6709\u511f\u5316\u6642\u306f\u3001\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u30fb\u72ec\u5360\u7981\u6b62\u6cd5\u4e0a\u306e\u512a\u8d8a\u7684\u5730\u4f4d\u306e\u89b3\u70b9\u304b\u3089\u518d\u78ba\u8a8d\u3059\u308b\u3002\n- **\u6839\u62e0**: \u73fe\u6642\u70b9\u306f\u7121\u511f\u63d0\u4f9b\uff08\u5229\u7528\u898f\u7d04 \u7b2c7\u6761\u7b2c1\u9805\uff09\u3067\u3042\u308a\u3001\u5bfe\u4fa1\u306b\u5bfe\u3059\u308b\u50b5\u52d9\u4e0d\u5c65\u884c\u8cac\u4efb\u306e\u554f\u984c\u304c\u751f\u3058\u306b\u304f\u3044\u3002\u6709\u511f\u5316\u5f8c\u306f\u3001SLA\u672a\u9054\u6642\u306e\u6551\u6e08\uff08\u8fd4\u91d1\u30fb\u30af\u30ec\u30b8\u30c3\u30c8\uff09\u3092\u8ab2\u91d1\u898f\u7d04\u5074\uff08T798-17\uff09\u3068\u6574\u5408\u3055\u305b\u308b\u5fc5\u8981\u304c\u3042\u308b\u3002\n- **\u78ba\u5b9a\u306b\u5fc5\u8981\u306a\u5165\u529b**: \u5f01\u8b77\u58eb\u78ba\u8a8d \u2014 \u7121\u511f\u30d5\u30a7\u30fc\u30ba\u3067\u306e\u514d\u8cac\u69cb\u6210\u306e\u6709\u52b9\u6027\u3001\u304a\u3088\u3073\u6709\u511f\u5316\u6642\u306e\u898b\u76f4\u3057\u8981\u5426\u3002\n\n### T798-04 AI\u8a3a\u65ad\u7d50\u679c\u306e\u514d\u8cac\u7bc4\u56f2\u30fb\u52b4\u50cd\u95a2\u9023\u6cd5\u4ee4\u3068\u306e\u6574\u5408\uff08\u7b2c6\u6761\uff09\n\n- **\u533a\u5206**: \u5f01\u8b77\u58eb\u78ba\u8a8d\u304c\u5fc5\u8981\n- **\u30c9\u30e9\u30d5\u30c8\u56de\u7b54**: \u73fe\u884c\u306e\u300c\u53c2\u8003\u60c5\u5831\u300d\u300cAI\u8a3a\u65ad\u7d50\u679c\u306e\u307f\u306b\u4f9d\u62e0\u3057\u3066\u884c\u3063\u3066\u306f\u306a\u3089\u305a\u3001\u6700\u7d42\u5224\u65ad\u306f\u5229\u7528\u8005\u81ea\u8eab\u306e\u8cac\u4efb\u3067\u884c\u3046\u300d\u3092\u7dad\u6301\u3002\u52a0\u3048\u3066\u7b2c8\u6761\uff08\u7981\u6b62\u4e8b\u9805\uff09\u306e\u300c\u5dee\u5225\u7684\u306a\u9078\u8003\u30fb\u8a55\u4fa1\u306b\u5229\u7528\u3059\u308b\u884c\u70ba\u300d\u3068\u76f8\u4e92\u53c2\u7167\u3055\u305b\u308b\u3002\n- **\u6839\u62e0**: \u8077\u696d\u5b89\u5b9a\u6cd5\u7b2c5\u6761\u306e5\u304a\u3088\u3073\u540c\u6307\u91dd\u306f\u3001\u52df\u96c6\u30fb\u63a1\u7528\u306b\u304a\u3051\u308b\u500b\u4eba\u60c5\u5831\u306e\u53ce\u96c6\u76ee\u7684\u3092\u9650\u5b9a\u3057\u3066\u3044\u308b\u3002AI\u306b\u3088\u308b\u81ea\u52d5\u7684\u306a\u9078\u5225\u3092\u884c\u308f\u305a\u4eba\u9593\u306e\u6700\u7d42\u5224\u65ad\u3092\u5fc5\u9808\u3068\u3059\u308b\u69cb\u6210\u306f\u3001EU AI Act \u306e\u9ad8\u30ea\u30b9\u30af\u5206\u985e\uff08\u96c7\u7528\u5206\u91ce\uff09\u3067\u6c42\u3081\u3089\u308c\u308b\u4eba\u9593\u306b\u3088\u308b\u76e3\u7763\uff08human oversight\uff09\u3068\u3082\u6574\u5408\u3059\u308b\u3002\u5c06\u6765\u306e\u6d77\u5916\u5c55\u958b\u6642\u306b\u518d\u78ba\u8a8d\u3002\n- **\u78ba\u5b9a\u306b\u5fc5\u8981\u306a\u5165\u529b**: \u5f01\u8b77\u58eb\u78ba\u8a8d \u2014 \u514d\u8cac\u6587\u8a00\u304c\u6d88\u8cbb\u8005\u5951\u7d04\u6cd5\u7b2c8\u6761\uff08\u4e8b\u696d\u8005\u306e\u640d\u5bb3\u8ce0\u511f\u8cac\u4efb\u3092\u514d\u9664\u3059\u308b\u6761\u9805\u306e\u7121\u52b9\uff09\u306b\u62b5\u89e6\u3057\u306a\u3044\u7bc4\u56f2\u304b\u3002\n\n### T798-05 \u5229\u7528\u6599\u91d1\u6761\u9805\u3068\u500b\u5225\u898f\u5b9a\u306e\u512a\u5148\u95a2\u4fc2\uff08\u7b2c7\u6761\uff09\n\n- **\u533a\u5206**: \u5f01\u8b77\u58eb\u78ba\u8a8d\u304c\u5fc5\u8981\n- **\u30c9\u30e9\u30d5\u30c8\u56de\u7b54**: \u7b2c7\u6761\u672b\u5c3e\u306b\u512a\u5148\u9806\u4f4d\u3092\u660e\u8a18\u3059\u308b\u6848\u3002\n  > \u672c\u898f\u7d04\u3068\u8ab2\u91d1\u898f\u7d04\u30fb\u8fd4\u91d1\u30dd\u30ea\u30b7\u30fc\u304a\u3088\u3073\u7279\u5b9a\u5546\u53d6\u5f15\u6cd5\u306b\u57fa\u3065\u304f\u8868\u8a18\u306e\u5185\u5bb9\u304c\u7570\u306a\u308b\u5834\u5408\u3001\u5f53\u8a72\u500b\u5225\u898f\u5b9a\u304c\u672c\u898f\u7d04\u306b\u512a\u5148\u3057\u3066\u9069\u7528\u3055\u308c\u307e\u3059\u3002\n- **\u6839\u62e0**: \u7b2c1\u6761\u7b2c3\u9805\u304c\u500b\u5225\u898f\u5b9a\u3092\u300c\u672c\u898f\u7d04\u306e\u4e00\u90e8\u3092\u69cb\u6210\u3059\u308b\u300d\u3068\u3057\u3066\u3044\u308b\u306e\u307f\u3067\u512a\u5148\u52a3\u5f8c\u304c\u4e0d\u660e\u3002\u5b9a\u578b\u7d04\u6b3e\uff08\u6c11\u6cd5\u7b2c548\u6761\u306e2\u4ee5\u4e0b\uff09\u3068\u3057\u3066\u3001\u5229\u7528\u8005\u304c\u8a8d\u8b58\u3057\u3084\u3059\u3044\u5f62\u3067\u512a\u5148\u95a2\u4fc2\u3092\u660e\u793a\u3059\u308b\u3002\n- **\u78ba\u5b9a\u306b\u5fc5\u8981\u306a\u5165\u529b**: \u5f01\u8b77\u58eb\u78ba\u8a8d \u2014 \u500b\u5225\u898f 30e1\u30fc\u30eb\u7167\u5408\u306e\u307f\u306b\u7559\u3081\u306a\u3044\u6848\u3002\n  - \u624b\u6570\u6599: \u5f53\u9762\u7121\u511f\uff08\u793e\u5185\u5229\u7528\u30d5\u30a7\u30fc\u30ba\u306e\u305f\u3081\uff09\n  - \u672c\u4eba\u78ba\u8a8d: \u767b\u9332\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u304b\u3089\u306e\u8acb\u6c42\u3067\u3042\u308b\u3053\u3068\u306b\u52a0\u3048\u3001\u5f53\u8a72\u30a2\u30ab\u30a6\u30f3\u30c8\u3067\u306e\u30ed\u30b0\u30a4\u30f3\u72b6\u614b\u306e\u78ba\u8a8d\u3092\u3082\u3063\u3066\u672c\u4eba\u78ba\u8a8d\u3068\u3059\u308b\n- **\u6839\u62e0**: \u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u6cd5\u7b2c38\u6761\u306f\u624b\u6570\u6599\u306e\u5fb4\u53ce\u3092\u8a8d\u3081\u308b\u304c\uff08\u5b9f\u8cbb\u306e\u7bc4\u56f2\u5185\uff09\u3001\u5fb4\u53ce\u306f\u4efb\u610f\u3002\u540c\u7b2c37\u6761\u7b2c3\u9805\u306f\u672c\u4eba\u78ba\u8a8d\u306e\u305f\u3081\u306b\u5fc5\u8981\u306a\u63aa\u7f6e\u3092\u6c42\u3081\u3066\u304a\u308a\u3001**\u30e1\u30fc\u30eb\u7167\u5408\u306e\u307f\u3067\u306f\u7b2c\u4e09\u8005\u306b\u3088\u308b\u6210\u308a\u3059\u307e\u3057\u306e\u30ea\u30b9\u30af\u304c\u6b8b\u308b**\u305f\u3081\u3001\u30ed\u30b0\u30a4\u30f3\u72b6\u614b\u306e\u78ba\u8a8d\u3092\u4f75\u7528\u3059\u308b\u69cb\u6210\u3002\n- **\u78ba\u5b9a\u306b\u5fc5\u8981\u306a\u5165\u529b**: \u5f01\u8b77\u58eb\u78ba\u8a8d \u2014 \u4e0a\u8a18\u306e\u672c\u4eba\u78ba\u8a8d\u6c34\u6e96\u3067\u8db3\u308a\u308b\u304b\uff08\u4ee3\u7406\u4eba\u8acb\u6c42\u306e\u53d6\u6271\u3044\u3092\u542b\u3080\uff09\u3002\n\n### T798-15 \u672a\u6210\u5e74\u8005\u306e\u5bfe\u8c61\u5e74\u9f62\u660e\u8a18\u30fb\u6cd5\u5b9a\u4ee3\u7406\u4eba\u540c\u610f\uff08\u00a711\uff09\n\n- **\u533a\u5206**: \u793e\u5185\u6c7a\u5b9a\u3067\u78ba\u5b9a\u53ef\uff08\u5f01\u8b77\u58eb\u306f\u6700\u7d42\u78ba\u8a8d\u306e\u307f\uff09\n- **\u30c9\u30e9\u30d5\u30c8\u56de\u7b54**: \u73fe\u884c\u306e\u300c\u6cd5\u4eba\u3068\u305d\u306e\u5f79\u8077\u54e1\u30fb\u53d6\u5f15\u5019\u88dc\u8005\u3092\u5bfe\u8c61\u3068\u3057\u300118\u6b73\u672a\u6e80\u306e\u5229\u7528\u306f\u60f3\u5b9a\u3057\u3066\u3044\u306a\u3044\u300d\u3092\u7dad\u6301\u3057\u3001**\u300c\u60f3\u5b9a\u3057\u3066\u3044\u307e\u305b\u3093\u300d\u304b\u3089\u300c\u5229\u7528\u3067\u304d\u307e\u305b\u3093\u300d\u3078\u6539\u3081\u308b**\u3002\u5b9f\u969b\u306e\u5229\u7528\u8005\u306f\u7ba1\u7406\u8005\u767a\u884c\u30a2\u30ab\u30a6\u30f3\u30c8\uff08T752\uff09\u306b\u9650\u3089\u308c\u308b\u305f\u3081\u3001\u672a\u6210\u5e74\u8005\u304c\u81ea\u5df1\u5224\u65ad\u3067\u5229\u7528\u767b\u9332\u3059\u308b\u7d4c\u8def\u304c\u5b58\u5728\u3057\u306a\u3044\u3002\n- **\u6839\u62e0**: \u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u59d4\u54e1\u4f1a\u306e\u30ac\u30a4\u30c9\u30e9\u30a4\u30f3\u306f\u3001\u4e00\u822c\u306b12\u301c15\u6b73\u672a\u6e80\u306b\u3064\u3044\u3066\u6cd5\u5b9a\u4ee3\u7406\u4eba\u306e\u540c\u610f\u3092\u6c42\u3081\u308b\u8003\u3048\u65b9\u3092\u793a\u3059\u3002\u672c\u30b5\u30fc\u30d3\u30b9\u306f**\u7ba1\u7406\u8005\u304c\u30a2\u30ab\u30a6\u30f3\u30c8\u3092\u767a\u884c\u3059\u308b\u904b\u7528**\uff08T752/T833\uff09\u3067\u3042\u308a\u3001\u5229\u7528\u4e3b\u4f53\u306f\u6cd5\u4eba\u306e\u5f79\u8077\u54e1\u306b\u9650\u5b9a\u3055\u308c\u308b\u305f\u3081\u3001\u6cd5\u5b9a\u4ee3\u7406\u4eba\u540c\u610f\u306e\u8a2d\u8a08\u306f\u4e0d\u8981\u3002\n- **\u78ba\u5b9a\u306b\u5fc5\u8981\u306a\u5165\u529b**: \u793e\u5185\u6c7a\u5b9a\uff08\u300c\u5229\u7528\u3067\u304d\u307e\u305b\u3093\u300d\u3078\u306e\u5909\u66f4\u53ef\u5426\uff09\uff0b \u5f01\u8b77\u58eb\u306e\u6700\u7d42\u78ba\u8a8d\u3002\n\n### T798-16 GDPR\u9069\u7528\u30b9\u30b3\u30fc\u30d7\u30fbDPA\u30ea\u30f3\u30af\u306e\u660e\u793a\uff08\u00a712\uff09\n\n- **\u533a\u5206**: \u793e\u5185\u6c7a\u5b9a\u3067\u78ba\u5b9a\u53ef\uff08\u5f01\u8b77\u58eb\u306f\u6700\u7d42\u78ba\u8a8d\u306e\u307f\uff09\n- **\u30c9\u30e9\u30d5\u30c8\u56de\u7b54**: \u5bfe\u8c61\u3092**\u65e5\u672c\u56fd\u5185\u306e\u6cd5\u4eba\u304a\u3088\u3073\u305d\u306e\u5f79\u8077\u54e1\u306b\u9650\u5b9a**\u3059\u308b\u65e8\u3092\u660e\u8a18\u3057\u3001GDPR \u306e\u9069\u7528\u5bfe\u8c61\u5916\u3067\u3042\u308b\u3053\u3068\u3092\u524d\u63d0\u3068\u3059\u308b\u3002\u00a712 \u3092\u6b21\u306e\u8da3\u65e8\u3078\u6539\u3081\u308b\u6848\u3002\n  > \u672c\u30b5\u30fc\u30d3\u30b9\u306f\u65e5\u672c\u56fd\u5185\u306e\u6cd5\u4eba\u304a\u3088\u3073\u305d\u306e\u5f79\u8077\u54e1\u306b\u3088\u308b\u5229\u7528\u3092\u5bfe\u8c61\u3068\u3057\u3066\u304a\u308a\u3001EU\u57df\u5185\u306e\u500b\u4eba\u306b\u5bfe\u3059\u308b\u5546\u54c1\u30fb\u30b5\u30fc\u30d3\u30b9\u306e\u63d0\u4f9b\u307e\u305f\u306f\u884c\u52d5\u306e\u76e3\u8996\u3092\u884c\u3044\u307e\u305b\u3093\u3002\u5c06\u6765 EU \u57df\u5185\u306e\u500b\u4eba\u30c7\u30fc\u30bf\u3092\u53d6\u308a\u6271\u3046\u5834\u5408\u306f\u3001GDPR \u306b\u57fa\u3065\u304f\u5bfe\u5fdc\u3092\u5225\u9014\u5b9a\u3081\u307e\u3059\u3002\n- **\u6839\u62e0**: GDPR \u7b2c3\u6761\u7b2c2\u9805\u306e\u57df\u5916\u9069\u7528\u306f\u3001EU\u57df\u5185\u306e\u30c7\u30fc\u30bf\u4e3b\u4f53\u3078\u306e\u5546\u54c1\u30fb\u30b5\u30fc\u30d3\u30b9\u63d0\u4f9b\u3001\u307e\u305f\u306f\u884c\u52d5\u306e\u76e3\u8996\u3092\u8981\u4ef6\u3068\u3059\u308b\u3002\u73fe\u72b6\u306f\u30af\u30ed\u30fc\u30ba\u30c9\u306a\u793e\u5185\u5229\u7528\uff08[PILOT_CLOSED_OPERATION_DESIGN.md](PILOT_CLOSED_OPERATION_DESIGN.md)\u3001T833 \u793e\u5185GA\uff09\u3067\u3042\u308a\u3001\u3044\u305a\u308c\u306b\u3082\u8a72\u5f53\u3057\u306a\u3044\u3002**\u73fe\u884c\u6587\u306f\u300cGDPR \u306b\u57fa\u3065\u304f\u6a29\u5229\u306b\u5bfe\u5fdc\u3057\u307e\u3059\u300d\u3068\u7d04\u675f\u3057\u3066\u3057\u307e\u3063\u3066\u304a\u308a\u3001\u5b9f\u88c5\uff08EU\u5411\u3051\u5bfe\u5fdc\u306a\u3057\uff09\u3068\u4e0d\u6574\u5408**\u3002\n- **\u78ba\u5b9a\u306b\u5fc5\u8981\u306a\u5165\u529b**: \u793e\u5185\u6c7a\u5b9a\uff08\u5bfe\u8c61\u3092\u56fd\u5185\u9650\u5b9a\u3068\u660e\u8a18\u3057\u3066\u3088\u3044\u304b\u3002\u6d77\u5916\u5c55\u958b\u4e88\u5b9a\u306e\u6709\u7121\uff09\uff0b \u5f01\u8b77\u58eb\u306e\u6700\u7d42\u78ba\u8a8d\u3002\n\n---\n\n## \u6709\u511f\u516c\u958b\u524d\u5fc5\u9808\uff08T862\u30b2\u30fc\u30c8\u30fb\u672c\u66f8\u306e\u5bfe\u8c61\u5916\uff09\n\n\u53f0\u5e33\u306e\u6b8b\u308a4\u4ef6\uff08\u8ab2\u91d1\u898f\u7d043\u4ef6\u30fb\u7279\u5546\u6cd5\u8868\u8a181\u4ef6\uff09\u306f\u3001**\u6709\u511f\u516c\u958b\u306e\u5b9f\u65bd\u5224\u65ad\uff08T862\uff09\u5f8c**\u306b\u78ba\u5b9a\u3057\u307e\u3059\u3002\u672c\u66f8\u3067\u306f\u6271\u3044\u307e\u305b\u3093\u3002\n\n| \u53f0\u5e33ID | \u8ad6\u70b9 |\n| --- | --- |\n| T798-17 | \u91cd\u5927\u969c\u5bb3\u6642\u306e\u8fd4\u91d1/\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u306e\u9078\u629e\u69cb\u6210\u30fb\u7b97\u5b9a\u57fa\u6e96 |\n| T798-18 | \u5229\u7528\u8005\u90fd\u5408\u8fd4\u91d1\u6642\u306e\u6c7a\u6e08\u624b\u6570\u6599\u63a7\u9664\u306e\u53ef\u5426\u30fb\u8868\u793a\u65b9\u6cd5 |\n| T798-19 | \u8fd4\u91d1\u8acb\u6c42\u671f\u9650\uff0830\u65e5\uff09\u306e\u59a5\u5f53\u6027 |\n| T798-20 | \u5b9a\u671f\u8cfc\u5165\uff08\u81ea\u52d5\u66f4\u65b0\uff09\u660e\u793a\u6587\u8a00\u306e\u6700\u7d42\u78ba\u8a8d |\n\n---\n\n## \u78ba\u5b9a\u5f8c\u306e\u624b\u9806\n\n1. \u4f1a\u793e\u4e8b\u5b9f4\u4ef6\uff08T798-01/09/10/11\uff09\u3092\u57cb\u3081\u308b\u3002\n2. \u5f01\u8b77\u58eb\u30ec\u30d3\u30e5\u30fc\uff08R36\uff09\u3067 `\u5f01\u8b77\u58eb\u78ba\u8a8d\u304c\u5fc5\u8981` \u306e\u9805\u76ee\u3092\u78ba\u8a8d\u30fb\u4fee\u6b63\u3059\u308b\u3002\n3. `data/legal_review_signoff.tsv` \u306e\u8a72\u5f53\u884c\u3092 `\u72b6\u614b=\u78ba\u5b9a` \u306b\u3057\u3001`\u78ba\u5b9a\u5185\u5bb9/\u6839\u62e0`\u30fb`\u78ba\u8a8d\u8005`\u30fb`\u78ba\u8a8d\u65e5` \u3092\u8a18\u5165\u3059\u308b\u3002\n4. \u672c\u6587\uff08\u5229\u7528\u898f\u7d04\u30fb\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\uff09\u306e `\u3010\u8981\u6cd5\u52d9\u78ba\u8a8d\u3011` \u30de\u30fc\u30ab\u30fc\u3092\u78ba\u5b9a\u6587\u8a00\u3078\u7f6e\u63db\u3059\u308b\u3002\n5. \u30b9\u30c6\u30fc\u30bf\u30b9\u30d0\u30ca\u30fc\u3092\u300c\u78ba\u5b9a\u7248\uff08\u793
