    <script>
        const rawMarkdown = "# \ud83e\udded WBS\u30e9\u30a4\u30d5\u30b5\u30a4\u30af\u30eb\u7db2\u7f85\u6027\u30fb\u65e5\u7a0b\u6574\u5408\u30ac\u30fc\u30c9 (T889)\n\n> `data/WBS.tsv` \u304c **\u4f01\u753b \u2192 \u8a2d\u8a08 \u2192 \u5b9f\u88c5 \u2192 \u30c6\u30b9\u30c8 \u2192 \u30ea\u30ea\u30fc\u30b9 \u2192 \u5b9f\u904b\u7528 \u2192 \u4fdd\u5b88** \u306e\u5168\u5de5\u7a0b\u3092\u3001\u78ba\u5b9a\u30b9\u30bf\u30c3\u30af\uff08\u30ec\u30b8\u30b9\u30c8\u30e9=**\u304a\u540d\u524d.com** / \u30d0\u30c3\u30af\u30a8\u30f3\u30c9=**Firebase** / DB=**Supabase**\uff09\u306b\u308f\u305f\u3063\u3066\u6f0f\u308c\u306a\u304f\u6301\u3061\u3001\u30b9\u30c6\u30fc\u30bf\u30b9\u30fb\u5217\u30fb\u65e5\u7a0b\u304c\u58ca\u308c\u3066\u3044\u306a\u3044\u3053\u3068\u3092\u3001**\u4eba\u9593\u304c\u624b\u9806\u3069\u304a\u308a\u5b9f\u884c\u3057\u3066 OK/NG \u3092\u5224\u65ad\u3067\u304d\u308b**\u3088\u3046\u306b\u5b9a\u7fa9\u3057\u305f\u30ac\u30fc\u30c9\u4ed5\u69d8\u66f8\u3002\n>\n> \u3053\u308c\u307e\u3067\u5de5\u7a0b\u7db2\u7f85\u306f\u624b\u52d5\u30ec\u30d3\u30e5\u30fc\uff08`docs/WBS_PROCESS_COVERAGE_AUDIT_2026-06-13.md` / `..._2026-06-25.md`\uff09\u3060\u3051\u3067\u78ba\u8a8d\u3057\u3066\u3044\u305f\u3002\u672c\u66f8\u306f\u305d\u308c\u3092 **10\u4eee\u8aac\u306e\u81ea\u52d5\u76e3\u67fb** \u306b\u7f6e\u304d\u63db\u3048\u3001\u30e9\u30a4\u30d5\u30b5\u30a4\u30af\u30eb\u306e\u30ae\u30e3\u30c3\u30d7\u30fb\u4e0d\u6b63\u30b9\u30c6\u30fc\u30bf\u30b9\u30fb\u65e5\u7a0b\u9006\u8ee2\uff08\u958b\u59cb\u65e5 > \u7d42\u4e86\u4e88\u5b9a\u65e5\uff09\u3092 CI \u3067\u843d\u3068\u3059\u3002\n\n---\n\n## 1. \u76ee\u7684\n\n- WBS \u306e\u5168\u30bf\u30b9\u30af\u304c\u5b8c\u4e86\u3057\u305f\u3068\u304d\u3001\u305d\u306e\u307e\u307e\u300c\u4f01\u753b\u304b\u3089\u4fdd\u5b88\u307e\u3067\u6f0f\u308c\u306a\u304f\u958b\u767a\u5b8c\u4e86\u300d\u3068\u5ba3\u8a00\u3067\u304d\u308b\u72b6\u614b\u3092\u3001\u6a5f\u68b0\u7684\u306b\u4fdd\u8a3c\u3059\u308b\u3002\n- \u5f8c\u6bb5\u5de5\u7a0b\uff08\u30ea\u30ea\u30fc\u30b9\u2192\u5b9f\u904b\u7528\u2192\u4fdd\u5b88\uff09\u3068\u5b8c\u6210\u5224\u5b9a\u30b2\u30fc\u30c8\u304c\u30c6\u30fc\u30eb\u304b\u3089\u6b20\u843d\u3057\u3066\u3044\u306a\u3044\u3053\u3068\u3092\u4fdd\u8a3c\u3059\u308b\u3002\n- \u65e5\u7a0b\u30c7\u30fc\u30bf\u306e\u7834\u640d\uff08\u6b20\u843d\u30fb\u9006\u8ee2\uff09\u3092\u65e9\u671f\u306b\u691c\u51fa\u3059\u308b\u3002\n\n## 2. \u5b9f\u884c\u65b9\u6cd5\n\n```powershell\npython scripts/audit_wbs_lifecycle_coverage.py\npython -m pytest tests/test_wbs_lifecycle_coverage.py -q\n```\n\n\u76e3\u67fb\u306f `exports/wbs_lifecycle_coverage_audit.{json,md}` \u306b\u7d50\u679c\u3092\u51fa\u529b\u3057\u300110\u4eee\u8aac\u3059\u3079\u3066 PASS \u3067\u7d42\u4e86\u30b3\u30fc\u30c9 0\u30011\u3064\u3067\u3082 FAIL \u3067 1 \u3092\u8fd4\u3059\u3002\n\n## 3. 10\u4eee\u8aac\uff08\u4eba\u9593\u304c\u78ba\u8a8d\u3067\u304d\u308b\u89b3\u70b9\uff09\n\n| \u4eee\u8aac | \u5185\u5bb9 | OK \u3068\u8a00\u3048\u308b\u6761\u4ef6 |\n| :-- | :-- | :-- |\n| H1 | \u30bf\u30b9\u30af\u4ef6\u6570\u3068\u30d8\u30c3\u30c0 | \u30bf\u30b9\u30af\u304c 50 \u4ef6\u4ee5\u4e0a\u3042\u308a\u3001\u30d8\u30c3\u30c0\u304c\u65e2\u5b9a\u306e10\u5217\uff08\u30bf\u30b9\u30afID\u301c\u7d42\u4e86\u4e88\u5b9a\u65e5\uff09\u3068\u5b8c\u5168\u4e00\u81f4 |\n| H2 | \u30bf\u30b9\u30afID\u4e00\u610f | \u91cd\u8907\u3059\u308b\u30bf\u30b9\u30afID\u304c 0 \u4ef6 |\n| H3 | \u30e9\u30a4\u30d5\u30b5\u30a4\u30af\u30eb7\u5de5\u7a0b\u7db2\u7f85 | \u4f01\u753b/\u8a2d\u8a08/\u5b9f\u88c5/\u30c6\u30b9\u30c8/\u30ea\u30ea\u30fc\u30b9/\u5b9f\u904b\u7528/\u4fdd\u5b88 \u306e\u5404\u5de5\u7a0b\u3092\u793a\u3059\u30bf\u30b9\u30af\u304c**\u5404\u22651\u4ef6**\u5b58\u5728\uff08\u672a\u7db2\u7f85\u5de5\u7a0b=\u306a\u3057\uff09 |\n| H4 | \u78ba\u5b9a\u30b9\u30bf\u30c3\u30af\u7db2\u7f85 | \u304a\u540d\u524d.com / Firebase / Supabase \u3092\u6271\u3046\u30bf\u30b9\u30af\u304c**\u5404\u22651\u4ef6**\u5b58\u5728\uff08\u672a\u7db2\u7f85\u30b9\u30bf\u30c3\u30af=\u306a\u3057\uff09 |\n| H5 | \u5fc5\u9808\u5217\u
