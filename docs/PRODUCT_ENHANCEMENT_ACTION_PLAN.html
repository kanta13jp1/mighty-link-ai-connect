    <script>
        const rawMarkdown = "# \ud83d\ude80 \u30d7\u30ed\u30c0\u30af\u30c8\u5f37\u53164\u5927\u30a2\u30af\u30b7\u30e7\u30f3\u4ed5\u69d8\u66f8\u30fb\u8a2d\u8a08\u66f8 (T960\u301cT963)\n\n\u672c\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u306f\u3001PdM\u30ec\u30d3\u30e5\u30fc\u306b\u3088\u308b\u30d2\u30c3\u30c8\u30d7\u30ed\u30c0\u30af\u30c8\u6bd4\u8f03\uff08Linear, Slack, SmartHR, Harvey\u7b49\uff09\u306b\u57fa\u3065\u304d\u3001PMF\u6df1\u5316\u30fb\u53c2\u5165\u969c\u58c1\u69cb\u7bc9\u30fb\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u7d71\u5408\u3092\u63a8\u9032\u3059\u308b4\u5927\u30a2\u30af\u30b7\u30e7\u30f3\u306e\u6280\u8853\u4ed5\u69d8\u304a\u3088\u3073\u8a2d\u8a08\u3092\u5b9a\u7fa9\u3059\u308b\u4ed5\u69d8\u66f8\u3067\u3059\u3002\n\n---\n\n## 1. Action 1: \u30ad\u30e9\u30fc\u6a5f\u80fd\u306e\u7814\u304e\u6f84\u307e\u3057 (T960)\n\n### 1.1 \u80cc\u666f\u3068\u76ee\u7684\nSES\u30fb\u4eba\u6750\u4f01\u696d\u306e\u6700\u91cd\u8981\u30da\u30a4\u30f3\u3067\u3042\u308b\u300c\u65e5\u6b211,000\u4ef6\u306e\u55b6\u696d\u30e1\u30fc\u30eb\u9078\u5225\u30fb\u9069\u5408\u4eba\u6750\u62bd\u51fa\u300d\u3078\u5168\u30d7\u30ed\u30c0\u30af\u30c8\u4fa1\u5024\u3092\u96c6\u4e2d\u3055\u305b\u3001\u6210\u7d04\u6642\u9593\u30923\u301c4\u6642\u9593\u304b\u30893\u301c5\u5206\uff0895%\u4ee5\u4e0a\u524a\u6e1b\uff09\u3078\u3068\u77ed\u7e2e\u3059\u308b North Star KPI \u3092\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u6700\u524d\u9762\u306b\u53ef\u8996\u5316\u3059\u308b\u3002\n\n### 1.2 \u4e3b\u306a\u4ed5\u69d8\n- **North Star KPI \u306e\u5b9a\u7fa9**: `\u55b6\u696d\u30de\u30c3\u30c1\u30f3\u30b0\u6210\u7d04\u6642\u9593\u524a\u6e1b\u7387 = (\u5f93\u6765\u5e73\u5747\u6240\u8981\u6642\u9593 - MightyLINK\u6240\u8981\u6642\u9593) / \u5f93\u6765\u5e73\u5747\u6240\u8981\u6642\u9593 >= 95%`\n- **\u30d7\u30ed\u30c0\u30af\u30c8\u60c5\u5831\u968e\u5c64\u306e\u518d\u7de8**:\n  - \u30e1\u30a4\u30f3\u9818\u57df: \u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0\u30fb\u9069\u5408\u30e9\u30f3\u30ad\u30f3\u30b0\u30fb\u30ea\u30a2\u30eb\u30bf\u30a4\u30e0\u65b0\u7740\u901f\u5831\n  - \u30b5\u30d6/\u88dc\u52a9\u9818\u57df: \u52e4\u6020CSV\u96c6\u8a08\u30fb\u793e\u5185\u30e2\u30c1\u30d9\u30fc\u30b7\u30e7\u30f3\u8a3a\u65ad\uff08\u30de\u30c3\u30c1\u30f3\u30b0\u6642\u306e\u88dc\u52a9\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u30c7\u30fc\u30bf\u3068\u3057\u3066\u6d3b\u7528\uff09\n\n---\n\n## 2. Action 2: \u30a4\u30f3\u30b5\u30a4\u30c9\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u5316\u30fbSlack/Teams\u901a\u77e5 (T961)\n\n### 2.1 \u80cc\u666f\u3068\u76ee\u7684\n\u30e6\u30fc\u30b6\u30fc\u304cWeb\u753b\u9762\uff08`index.html`\uff09\u3092\u5e38\u6642\u76e3\u8996\u3057\u306a\u304f\u3066\u3082\u3001\u666e\u6bb5\u696d\u52d9\u3067\u5229\u7528\u3059\u308b Slack / Teams \u306bAI\u304c\u5373\u6642\u901a\u77e5\u30fb\u65e5\u6b21\u30b5\u30de\u30ea\u3092\u5c4a\u3051\u308b\u3053\u3068\u3067\u3001\u30b9\u30a4\u30c3\u30c1\u30f3\u30b0\u30b3\u30b9\u30c8\u3092\u30bc\u30ed\u306b\u3059\u308b\u3002\n\n### 2.2 \u4e3b\u306a\u4ed5\u69d8\n- **\u30e2\u30b8\u30e5\u30fc\u30eb**: `src/slack_teams_notification.py`\n- **\u901a\u77e5\u30c8\u30ea\u30ac\u30fc**:\n  1. **\u5373\u6642\u30ab\u30fc\u30c9\u901a\u77e5**: \u30de\u30c3\u30c1\u5ea6\u30b9\u30b3\u30a2 **80% \u4ee5\u4e0a** \u306e\u9ad8\u9069\u5408\u6848\u4ef6\u30fb\u4eba\u6750\u304c\u691c\u51fa\u3055\u308c\u305f\u77ac\u9593\u306b Webhook \u7d4c\u7531\u3067\u30ab\u30fc\u30c9\u5f62\u5f0f\uff08\u30ea\u30c3\u30c1\u30d5\u30a9\u30fc\u30de\u30c3\u30c8\uff09\u3067\u901a\u77e5\u3002\n  2. **\u6bce\u671d9:00 \u65e5\u6b21\u30c0\u30a4\u30b8\u30a7\u30b9\u30c8**: \u524d\u65e5\u53d6\u308a\u8fbc\u307f\u5168\u30e1\u30fc\u30eb\u4ef6\u6570\u3001\u6700\u9ad8\u30de\u30c3\u30c1\u4ef6\u6570\u3001\u672a\u5bfe\u5fdc\u4ef6\u6570\u3092\u96c6\u8a08\u3057\u3066\u81ea\u52d5\u6295\u7a3f\u3002\n- **\u904e\u5270\u901a\u77e5\u9632\u6b62**: \u30b9\u30b3\u30a2 80% \u672a\u6e80\u306f\u5373\u6642\u901a\u77e5\u305b\u305a\u3001\u65e5\u6b21\u30b5\u30de\u30ea\u304a\u3088\u3073Web\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3067\u306e\u307f\u691c\u7d22\u53ef\u80fd\u3068\u3059\u308b\u3002\n\n---\n\n## 3. Action 3: AI\u81ea\u5df1\u5b66\u7fd2\u30d5\u30e9\u30a4\u30db\u30a4\u30fc\u30eb (T962)\n\n### 3.1 \u80cc\u666f\u3068\u76ee\u7684\n\u55b6\u696d\u62c5\u5f53\u304c\u30de\u30c3\u30c1\u30f3\u30b0\u7d50\u679c\u306b\u5bfe\u3057\u3066\u884c\u3063\u305f\u300c\u63a1\u7528\uff08\u5fdc\u52df/\u63d0\u6848\uff09\u300d\u300c\u5374\u4e0b\uff08\u898b\u9001\u308a\uff09\u300d\u306e\u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u30ed\u30b0\uff08`email_match_feedback`\uff09\u3092AI\u30d7\u30ed\u30f3\u30d7\u30c8\u3078\u52d5\u7684\u306b\u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u3057\u3001\u4f7f\u3048\u3070\u4f7f\u3046\u307b\u3069\u4f01\u696d\u56fa\u6709\u306e\u55dc\u597d\u306b\u81ea\u52d5\u6700\u9069\u5316\u3055\u308c\u308b\u53c2\u5165\u969c\u58c1\uff08Moat\uff09\u3092\u5f62\u6210\u3059\u308b\u3002\n\n### 3.2 \u4e3b\u306a\u4ed5\u69d8\n- **\u30e2\u30b8\u30e5\u30fc\u30eb**: `src/ai_feedback_flywheel.py`\n- **\u5b66\u7fd2\u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u751f\u6210\u30ed\u30b8\u30c3\u30af**:\n  - \u904e\u53bb\u306e\u76f4\u8fd1\u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\uff08\u904e\u53bb30\u65e5\u30fb\u6700\u592750\u4ef6\uff09\u3092\u89e3\u6790\u3002\n  - \u300c\u9ad8\u8a55\u4fa1\u30b9\u30ad\u30eb\u50be\u5411\uff08\u4f8b: Python 3\u5e74\u4ee5\u4e0a\uff0bFastAPI\u304c\u597d\u307e\u308c\u308b\uff09\u300d\u304a\u3088\u3073\u300c\u5374\u4e0b\u7406\u7531\uff08\u4f8b: \u5358\u4fa1\u4e0a\u9650\u8d85\u904e\u3001\u30d5\u30eb\u51fa\u793eNG\u3001\u7279\u5b9aFW\u672a\u7d4c\u9a13\uff09\u300d\u3092\u30b5\u30de\u30ea\u5316\u3002\n  - \u6b21\u56deAI\u30de\u30c3\u30c1\u30f3\u30b0\u30d7\u30ed\u30f3\u30d7\u30c8\u306e\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\uff08Few-Shot / Preference Guidance\uff09\u3078\u81ea\u52d5\u6ce8\u5165\u3002\n\n---\n\n## 4. Action 4: Pro/Enterprise\u5358\u4fa1\u306e\u5411\u4e0a\uff08\u30df\u30ad\u30ef\u30e1AI\u9023\u643a\uff09 (T963)\n\n### 4.1 \u80cc\u666f\u3068\u76ee\u7684\n\u30b9\u30ad\u30eb\u9762\uff08Technical Hard Skills\uff09\u3060\u3051\u3067\u306a\u304f\u3001\u5916\u90e8\u9069\u6027\u8a3a\u65ad\u30c4\u30fc\u30eb\u300c\u30df\u30ad\u30ef\u30e1AI\u300d\u306e\u9069\u6027\u30fb\u6027\u683c\u30fb\u30b9\u30c8\u30ec\u30b9\u8010\u6027\u30c7\u30fc\u30bf\uff08Soft Traits\uff09\u3092\u7d44\u307f\u5408\u308f\u305b\u305f\u300c\u591a\u6b21\u5143\u76f8\u6027\u5224\u5b9a\u300d\u3092\u63d0\u4f9b\u3057\u3001Standard\u30d7\u30e9\u30f3\uff08\u00a59,800/\u6708\uff09/ Pro\u30d7\u30e9\u30f3\uff08\u00a529,800/\u6708\uff09\u304a\u3088\u3073 Enterprise \u30d7\u30e9\u30f3\u3078\u306e\u30a2\u30c3\u30d7\u30b0\u30ec\u30fc\u30c9\u52d5\u6a5f\u3092\u5f37\u5316\u3059\u308b\u3002\n\n### 4.2 \u4e3b\u306a\u4ed5\u69d8\n- **\u30e2\u30b8\u30e5\u30fc\u30eb**: `src/mikiwame_ai_integration.py`\n- **\u8a55\u4fa1\u30a2\u30eb\u30b4\u30ea\u30ba\u30e0**:\n  - `\u7dcf\u5408\u9069\u5408\u30b9\u30b3\u30a2 = (\u30b9\u30ad\u30eb\u4e00\u81f4\u30b9\u30b3\u30a2 \u00d7 0.6) + (\u30df\u30ad\u30ef\u30e1\u9069\u6027\u76f8\u6027\u30b9\u30b3\u30a2 \u00d7 0.4)`\n  - \u30a8\u30f3\u30b8\u30cb\u30a2\u306e\u9069\u6027\u30bf\u30a4\u30d7\uff08\u4f8b: \u63a2\u6c42\u30fb\u81ea\u5f8b\u578b / \u5354\u8abf\u30fb\u30b5\u30dd\u30fc\u30bf\u30fc\u578b\uff09\u3068\u6848\u4ef6\u306e\u8077\u5834\u74b0\u5883\uff08\u4f8b: \u6025\u6210\u9577\u30b9\u30bf\u30fc\u30c8\u30a2\u30c3\u30d7 / \u5805\u5b9f\u306a\u5927\u624b\u30d7\u30e9\u30a4\u30e0\u6848\u4ef6\uff09\u306e\u30b7\u30ca\u30b8\u30fc\u3092AI\u89e3\u8aac\u4ed8\u304d\u3067\u7b97\u51fa\u3002\n";
