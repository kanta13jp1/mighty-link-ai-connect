    <script>
        const rawMarkdown = "# Mighty Skill-Bridge \u7ba1\u7406\u8005\u7ba1\u7406\u7814\u4fee\u30cf\u30f3\u30c9\u30d6\u30c3\u30af (\u30b3\u30fc\u30b9\u2462)\n\n> **\u5bfe\u8c61\u8aad\u8005**: \u30b7\u30b9\u30c6\u30e0\u7ba1\u7406\u8005\u3001\u4e8b\u696d\u8cac\u4efb\u8005\u3001\u904b\u7528\u62c5\u5f53\u30ea\u30fc\u30c9  \n> **\u53d7\u8b1b\u306e\u76ee\u7684**: \u7d71\u5408\u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u306e\u64cd\u4f5c\u3001\u30e6\u30fc\u30b6\u30fc\u30a2\u30ab\u30a6\u30f3\u30c8\u767a\u884c\u3068\u6a29\u9650\u7ba1\u7406\u3001\u4eee\u540d\u5316\u76e3\u67fb\u30ed\u30b0\u306e\u5b9a\u671f\u70b9\u691c\u3001\u304a\u3088\u3073\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u30fb\u969c\u5bb3\u5bfe\u5fdc\u624b\u9806\u3092\u7fd2\u5f97\u3059\u308b\u3002  \n> **\u6700\u7d42\u66f4\u65b0\u65e5**: 2026-07-24  \n> **\u95a2\u9023\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8**: [\u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9Runbook](../ADMIN_OPERATIONS_DASHBOARD_RUNBOOK.md), [\u76e3\u67fb\u30ed\u30b0\u8a2d\u8a08\u66f8](../AUDIT_LOG_MASKING_AND_ENCRYPTION.md)\n\n---\n\n## 1. \u7814\u4fee\u306e\u30a2\u30a6\u30c8\u30e9\u30a4\u30f3\u3068\u5230\u9054\u76ee\u6a19\n\n\u672c\u30b3\u30fc\u30b9\u3067\u306f\u3001Mighty Skill-Bridge \u3092\u5b89\u5168\u30fb\u5b89\u5b9a\u7684\u304b\u3064\u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\u3092\u9806\u5b88\u3057\u3066\u904b\u7528\u3059\u308b\u305f\u3081\u306e\u7ba1\u7406\u8005\u696d\u52d9\u3092\u7db2\u7f85\u3057\u307e\u3059\u3002\n\n### \u5230\u9054\u76ee\u6a19\n1. **\u7d71\u5408\u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9**\uff08`#admin-dashboard-section` / `/admin`\uff09\u3092\u4f7f\u3044\u3053\u306a\u305b\u3001\u5229\u7528\u72b6\u6cc1\u30fb\u8a3a\u65ad\u30fb\u52e4\u6020\u306e\u5168\u4f53\u7d71\u8a08\u3092\u628a\u63e1\u3067\u304d\u308b\u3002\n2. \u30a2\u30ab\u30a6\u30f3\u30c8\u767a\u884c\u30fb\u521d\u671f\u30a2\u30af\u30c6\u30a3\u30d9\u30fc\u30b7\u30e7\u30f3\u7ba1\u7406\u304a\u3088\u3073\u4eee\u540d\u5316ID\uff08`onb-<hash>`\uff09\u306b\u57fa\u3065\u304f\u76e3\u67fb\u30ed\u30b0\u306e\u78ba\u8a8d\u304c\u3067\u304d\u308b\u3002\n3. \u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u30a4\u30f3\u30b7\u30c7\u30f3\u30c8\u767a\u751f\u6642\u3084\u30b7\u30b9\u30c6\u30e0\u969c\u5bb3\u6642\u306e\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\u30fb\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u624b\u9806\u3092\u5b9f\u884c\u3067\u304d\u308b\u3002\n\n---\n\n## 2. \u30e2\u30b8\u30e5\u30fc\u30eb1: \u7d71\u5408\u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u306e\u904b\u7528\n\n### 2.1 \u6982\u8981\n\u7d71\u5408\u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u306f\u3001\u30b7\u30b9\u30c6\u30e0\u5168\u822c\u306e\u7a3c\u50cd\u72b6\u614b\u3001\u793e\u5185\u30a2\u30f3\u30b1\u30fc\u30c8\u96c6\u8a08\u3001\u52e4\u6020\u30c7\u30fc\u30bf\u627f\u8a8d\u72b6\u6cc1\u3001\u304a\u3088\u3073AI API\u306e\u5229\u7528\u4e0a\u9650\uff08Quota/Billing\uff09\u3092\u4e00\u62ec\u76e3\u8996\u3059\u308b\u753b\u9762\u3067\u3059\u3002\n\n### 2.2 \u4e3b\u306a\u95b2\u89a7\u30fb\u64cd\u4f5c\u9805\u76ee\n1. **\u30e6\u30fc\u30b6\u30fc\u72b6\u614b\u4e00\u89a7**: \u30a2\u30af\u30c6\u30a3\u30d9\u30fc\u30b7\u30e7\u30f3\u5b8c\u4e86\u6e08\u307f\u30e6\u30fc\u30b6\u30fc\u6570\u306e\u78ba\u8a8d\u3068\u65b0\u898f\u30a2\u30ab\u30a6\u30f3\u30c8\u306e\u767a\u884c\u3002\n2. **AI\u8a3a\u65ad\u30fb\u30de\u30c3\u30c1\u30f3\u30b0\u30ed\u30b0\u70b9\u691c**: AI\u30b3\u30a2\u6a5f\u80fd\u306e\u5b9f\u884c\u5c65\u6b74\u3068\u30a8\u30e9\u30fc\u7387\u306e\u76e3\u8996\u3002\n3. **API\u30b3\u30b9\u30c8\u30fb\u30af\u30a9\u30fc\u30bf\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9**: Daily API\u5236\u9650\u3084\u30c8\u30fc\u30af\u30f3\u6d88\u8cbb\u91cf\u306e\u30e2\u30cb\u30bf\u30ea\u30f3\u30b0\u3002\n\n---\n\n## 3. \u30e2\u30b8\u30e5\u30fc\u30eb2: \u30a2\u30ab\u30a6\u30f3\u30c8\u7ba1\u7406\u3068\u76e3\u67fb\u30ed\u30b0\uff08Audit Log\uff09\u70b9\u691c\n\n### 3.1 \u30a2\u30ab\u30a6\u30f3\u30c8\u767a\u884c\u624b\u9806\n1. \u7ba1\u7406\u8005\u753b\u9762\u306e\u300c\u30a2\u30ab\u30a6\u30f3\u30c8\u767a\u884c\u300d\u30e1\u30cb\u30e5\u30fc\u304b\u3089\u5bfe\u8c61\u793e\u54e1\u306e\u8b58\u5225ID\u3092\u767a\u884c\u3057\u307e\u3059\u3002\n2. \u5bfe\u8c61\u793e\u54e1\u306b\u521d\u671f\u8a2d\u5b9a\u7528\u6848\u5185\u3092\u5b89\u5168\u306b\u9001\u4ed8\u3057\u307e\u3059\u3002\n\n### 3.2 \u4eee\u540d\u5316\u76e3\u67fb\u30ed\u30b0\u306e\u5b9a\u671f\u70b9\u691c\n- \u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u4fdd\u8b77\u65b9\u91dd\u306b\u57fa\u3065\u304d\u3001\u5229\u7528\u8005\u306e\u751f\u30a2\u30c9\u30ec\u30b9\u3084PII\uff08\u500b\u4eba\u8b58\u5225\u60c5\u5831\uff09\u306f\u76e3\u67fb\u30ed\u30b0\u306b\u76f4\u63a5\u66f8\u304d\u8fbc\u307e\u308c\u307e\u305b\u3093\u3002\n- \u30ed\u30b0\u306b\u306f `onb-<digest>` \u5f62\u5f0f\u3067\u4eee\u540d\u5316\u3055\u308c\u305fID\u3068\u30bf\u30a4\u30e0\u30b9\u30bf\u30f3\u30d7\u3001\u5b9f\u884c\u64cd\u4f5c\u304c\u8a18\u9332\u3055\u308c\u307e\u3059\u3002\n- \u6708\u6b21\u3067 [\u76e3\u67fb\u30ed\u30b0\u8a2d\u8a08\u66f8](../AUDIT_LOG_MASKING_AND_ENCRYPTION.md) \u306b\u5f93\u3044\u30ed\u30b0\u6574\u5408\u6027\u3068\u4e0d\u6b63\u30a2\u30af\u30bb\u30b9\u306e\u6709\u7121\u3092\u70b9\u691c\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n---\n\n## 4. \u30e2\u30b8\u30e5\u30fc\u30eb3: \u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u30fb\u969c\u5bb3\u5bfe\u5fdc\u3068\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\n\n### 4.1 Break-glass\uff08\u7dca\u6025\u30a2\u30af\u30bb\u30b9\uff09\u624b\u9806\n\u4e07\u304c\u4e00\u3001\u901a\u5e38\u8a8d\u8a3c\u57fa\u76e4\u3084\u7ba1\u7406\u30a2\u30ab\u30a6\u30f3\u30c8\u3078\u306e\u30a2\u30af\u30bb\u30b9\u304c\u906e\u65ad\u3055\u308c\u305f\u5834\u5408\u306f\u3001[Break-glass\u904b\u7528\u624b\u9806](../OPERATIONS_HANDOVER_REHEARSAL_RUNBOOK.md)\u306b\u5f93\u3063\u3066\u7dca\u6025\u9375\u3092\u7528\u3044\u305f\u30bb\u30ad\u30e5\u30a2\u5fa9\u65e7\u3092\u884c\u3044\u307e\u3059\u3002\n\n### 4.2 \u969c\u5bb3\u5bfe\u5fdc\u30fb\u554f\u3044\u5408\u308f\u305b\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\n1. \u30b7\u30b9\u30c6\u30e0\u30a8\u30e9\u30fc\uff08500/502\u7b49\uff09\u306e\u691c\u77e5\u6642\u306f\u3001FastAPI/Firebase\u30ed\u30b0\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002\n2. \u30c7\u30fc\u30bf\u30d9\u30fc\u30b9\u5fa9\u65e7\u304c\u5fc5\u8981\u306a\u5834\u5408\u306f [Supabase\u30ea\u30b9\u30c8\u30a2Runbook](../SUPABASE_BACKUP_RESTORE_RUNBOOK.md) \u306b\u5f93\u3044\u6700\u65b0\u30d0\u30c3\u30af\u30a2\u30c3\u30d7\u304b\u3089\u5fa9\u5143\u3057\u307e\u3059\u3002\n3. \u30e6\u30fc\u30b6\u30fc\u304b\u3089\u306e\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u30fb\u30c7\u30fc\u30bf\u524a\u9664\u4f9d\u983c\u306b\u5bfe\u3057\u3066\u306f [\u500b\u4eba\u60c5\u5831\u958b\u793a\u7b49\u306b\u95a2\u3059\u308b\u904b\u7528\u624b\u9806\u66f8](../PERSONAL_INFO_DISCLOSURE_PROCEDURES.md) \u306eSLA\uff083\u55b6\u696d\u65e5\u4ee5\u5185\u5bfe\u5fdc\uff09\u3092\u53b3\u5b88\u3057\u307e\u3059\u3002\n\n---\n\n## 5. \u3088\u304f\u3042\u308b\u8cea\u554f\u30fbFAQ (\u7ba1\u7406\u8005\u5411\u3051)\n\n**Q. \u30e6\u30fc\u30b6\u30fc\u304b\u3089\u30a2\u30af\u30c6\u30a3\u30d9\u30fc\u30b7\u30e7\u30f3\u30ad\u30fc\u306e\u7d1b\u5931\u3084\u30ed\u30b0\u30a4\u30f3\u4e0d\u80fd\u306e\u9023\u7d61\u304c\u3042\u3063\u305f\u5834\u5408\u306f\u3069\u3046\u5bfe\u5fdc\u3057\u307e\u3059\u304b\uff1f**  \nA. \u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3088\u308a\u5bfe\u8c61\u30a2\u30ab\u30a6\u30f3\u30c8\u306e\u521d\u671f\u5316\u30fb\u518d\u767a\u884c\u51e6\u7406\u3092\u5b9f\u65bd\u3057\u3001\u672c\u4eba\u78ba\u8a8d\u306e\u3046\u3048\u518d\u767a\u884c\u3092\u884c\u3063\u3066\u304f\u3060\u3055\u3044\u3002\n\n**Q. \u6708\u6b21\u3067\u5b9f\u65bd\u3059\u3079\u304d\u7ba1\u7406\u8005\u76e3\u67fb\u4f5c\u696d\u306f\u3069\u3053\u306b\u30c1\u30a7\u30c3\u30af\u30ea\u30b9\u30c8\u304c\u3042\u308a\u307e\u3059\u304b\uff1f**  \nA. [\u5b9a\u4f8b\u904b\u7528\u30ab\u30ec\u30f3\u30c0\u30fc](../OPERATIONS_CADENCE_CALENDAR.md) \u304a\u3088\u3073 [\u6708\u6b21\u54c1\u8cea\u30ec\u30dd\u30fc\u30c8\u7d0d\u54c1\u624b\u9806\u66f8](../MONTHLY_QUALITY_REPORT_DELIVERY_RUNBOOK.md) \u306b\u6708\u6b21\u30c1\u30a7\u30c3\u30af\u30ea\u30b9\u30c8\u304c\u5b9a\u7fa9\u3055\u308c\u3066\u3044\u307e\u3059\u3002\n";
