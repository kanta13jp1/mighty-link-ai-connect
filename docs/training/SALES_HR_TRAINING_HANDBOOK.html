    <script>
        const rawMarkdown = "# Mighty Skill-Bridge \u55b6\u696d\u30fbHR\u5c02\u9580\u7814\u4fee\u30cf\u30f3\u30c9\u30d6\u30c3\u30af (\u30b3\u30fc\u30b9\u2461)\n\n> **\u5bfe\u8c61\u8aad\u8005**: \u55b6\u696d\u62c5\u5f53\u8005\u3001HR/\u63a1\u7528\u62c5\u5f53\u8005\u3001\u4eba\u6750\u30b3\u30fc\u30c7\u30a3\u30cd\u30fc\u30bf\u30fc  \n> **\u53d7\u8b1b\u306e\u76ee\u7684**: 4\u8ef8AI\u30d5\u30a3\u30c3\u30c8\u5206\u6790\u306e\u8a55\u4fa1\u69cb\u9020\u3068\u6d3b\u7528\u65b9\u6cd5\u3001\u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0\u306e\u53d7\u767a\u4fe1\u6bd4\u8f03\u30fb\u5019\u88dc\u9078\u5b9a\u30d5\u30ed\u30fc\u3001\u304a\u3088\u3073\u500b\u4eba\u60c5\u5831\u30fbAI\u502b\u7406\u9075\u5b88\u30eb\u30fc\u30eb\u3092\u7fd2\u5f97\u3059\u308b\u3002  \n> **\u6700\u7d42\u66f4\u65b0\u65e5**: 2026-07-24  \n> **\u95a2\u9023\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8**: [\u30e6\u30fc\u30b6\u30fc\u64cd\u4f5c\u30ac\u30a4\u30c9\u30fbFAQ](../USER_GUIDE_AND_FAQ.md), [\u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0\u8981\u4ef6\u5b9a\u7fa9\u66f8](../SALES_EMAIL_AI_MATCHING_REQUIREMENTS.md)\n\n---\n\n## 1. \u7814\u4fee\u306e\u30a2\u30a6\u30c8\u30e9\u30a4\u30f3\u3068\u5230\u9054\u76ee\u6a19\n\n\u672c\u30b3\u30fc\u30b9\u3067\u306f\u3001\u30a8\u30f3\u30b8\u30cb\u30a2\u4eba\u6750\u3068\u6848\u4ef6\u306e\u6700\u9069\u306a\u30a2\u30b5\u30a4\u30f3\u3092\u8fc5\u901f\u5316\u3059\u308b\u305f\u3081\u306e\u30b3\u30a2\u6a5f\u80fd\uff08AI\u30d5\u30a3\u30c3\u30c8\u5206\u6790\u30fb\u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0\uff09\u306e\u696d\u52d9\u6d3b\u7528\u65b9\u6cd5\u3092\u7fd2\u5f97\u3057\u307e\u3059\u3002\n\n### \u5230\u9054\u76ee\u6a19\n1. **4\u8ef8AI\u30d5\u30a3\u30c3\u30c8\u5206\u6790**\uff08Skill / Culture / Growth / Performing\uff09\u306e\u8a55\u4fa1\u6982\u5ff5\u3092\u7406\u89e3\u3057\u3001\u63d0\u6848\u3084\u9762\u8ac7\u6e96\u5099\u306e\u53c2\u8003\u60c5\u5831\u3068\u3057\u3066\u6b63\u3057\u304f\u89e3\u91c8\u3067\u304d\u308b\u3002\n2. **\u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0**\u6a5f\u80fd\u3092\u4f7f\u3044\u3001BP\u5404\u793e\u304b\u3089\u5c4a\u304f\u6848\u4ef6/\u8981\u54e1\u30e1\u30fc\u30eb\u306e\u81ea\u52d5\u89e3\u6790\u30fb\u53cc\u65b9\u5411\u6bd4\u8f03\u30fb\u5019\u88dc\u63d0\u793a\u3092\u5b9f\u884c\u3067\u304d\u308b\u3002\n3. AI\u306b\u3088\u308b\u8a55\u4fa1\u30b9\u30b3\u30a2\u306f\u300c\u4eba\u9593\u306b\u3088\u308b\u5224\u65ad\u306e\u88dc\u52a9\u300d\u3067\u3042\u308b\u539f\u5247\uff08\u500b\u4eba\u60c5\u5831\u4fdd\u8b77\u30fbAI\u88dc\u8db3\u5229\u7528\u30eb\u30fc\u30eb\uff09\u3092\u7406\u89e3\u3057\u3001\u4e0d\u9069\u5207\u306a\u81ea\u52d5\u6c7a\u5b9a\u3092\u884c\u308f\u306a\u3044\u904b\u7528\u3092\u5fb9\u5e95\u3059\u308b\u3002\n\n---\n\n## 2. \u30e2\u30b8\u30e5\u30fc\u30eb1: 4\u8ef8AI\u30d5\u30a3\u30c3\u30c8\u5206\u6790\u306e\u7406\u89e3\u3068\u6d3b\u7528\n\n### 2.1 4\u8ef8\u8a55\u4fa1\u30e2\u30c7\u30eb\u306e\u69cb\u6210\nMighty Skill-Bridge \u306f\u3001\u5358\u306a\u308b\u30ad\u30fc\u30ef\u30fc\u30c9\u306e\u4e00\u81f4\u5ea6\u3060\u3051\u3067\u306a\u304f\u4ee5\u4e0b\u306e4\u3064\u306e\u8996\u70b9\u3067\u30a8\u30f3\u30b8\u30cb\u30a2\u3068\u6848\u4ef6\u306e\u76f8\u6027\u3092\u5224\u5b9a\u3057\u307e\u3059\u3002\n\n| \u8a55\u4fa1\u8ef8 | \u6e2c\u5b9a\u5185\u5bb9 | \u6d3b\u7528\u30dd\u30a4\u30f3\u30c8 |\n| --- | --- | --- |\n| **Skill Fit** | \u5fc5\u9808\u30b9\u30ad\u30eb\u30fb\u7d4c\u9a13\u5e74\u6570\u30fb\u4f7f\u7528\u30c4\u30fc\u30eb\u306e\u4e00\u81f4\u5ea6 | \u30a2\u30b5\u30a4\u30f3\u76f4\u5f8c\u306e\u5373\u6226\u529b\u6027\u306e\u5224\u5b9a |\n| **Culture Fit** | \u958b\u767a\u30b9\u30bf\u30a4\u30eb\u30fb\u30c1\u30fc\u30e0\u898f\u6a21\u30fb\u30b3\u30df\u30e5\u30cb\u30b1\u30fc\u30b7\u30e7\u30f3\u50be\u5411 | \u8077\u5834\u74b0\u5883\u3084\u30ab\u30eb\u30c1\u30e3\u30fc\u3078\u306e\u9069\u5fdc\u6027 |\n| **Growth Fit** | \u672c\u4eba\u306e\u4f38\u3070\u3057\u305f\u3044\u30b9\u30ad\u30eb\u30fb\u30ad\u30e3\u30ea\u30a2\u5fd7\u5411\u3068\u306e\u5408\u81f4\u5ea6 | \u9577\u671f\u7684\u306a\u30e2\u30c1\u30d9\u30fc\u30b7\u30e7\u30f3\u30fb\u80b2\u6210\u89b3\u70b9 |\n| **Performing Fit** | \u904e\u53bb\u306e\u540c\u7a2e\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u3067\u306e\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9\u50be\u5411 | \u6210\u679c\u767a\u63ee\u306e\u78ba\u5b9f\u6027\u306e\u4e88\u6e2c |\n\n### 2.2 \u696d\u52d9\u5229\u7528\u306e\u624b\u9806\n1. \u30ca\u30d3\u30b2\u30fc\u30b7\u30e7\u30f3\u304b\u3089\u300c\u30d5\u30a3\u30c3\u30c8\u5206\u6790\u300d\uff08`#matching-section` \u307e\u305f\u306f\u30b9\u30ad\u30eb\u30b7\u30fc\u30c8\u5165\u529b\uff09\u3092\u958b\u304d\u307e\u3059\u3002\n2. \u5bfe\u8c61\u30a8\u30f3\u30b8\u30cb\u30a2\u306e\u30b9\u30ad\u30eb\u30c7\u30fc\u30bf\u304a\u3088\u3073\u5bfe\u8c61\u6848\u4ef6\u306e\u8981\u4ef6\u5b9a\u7fa9\u3092\u5165\u529b\uff08\u307e\u305f\u306f\u9078\u629e\uff09\u3057\u307e\u3059\u3002\n3. \u300cAnalyze\u300d\u3092\u5b9f\u884c\u3057\u3001\u30ec\u30fc\u30c0\u30fc\u30c1\u30e3\u30fc\u30c8\u3068\u751f\u6210\u3055\u308c\u305f\u5206\u6790\u30b3\u30e1\u30f3\u30c8\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002\n4. **\u6ce8\u610f\u4e8b\u9805**: \u8a3a\u65ad\u7d50\u679c\u3092\u30af\u30e9\u30a4\u30a2\u30f3\u30c8\u3084\u5916\u90e8\u3078\u5171\u6709\u3059\u308b\u969b\u306f\u3001\u30a8\u30f3\u30b8\u30cb\u30a2\u306e\u6c0f\u540d\u3084\u9023\u7d61\u5148\u306a\u3069\u306e\u500b\u4eba\u60c5\u5831\u3092\u9664\u5916\u3057\u3001\u8981\u7d04\u3055\u308c\u305f\u9069\u6027\u30b3\u30e1\u30f3\u30c8\u306e\u307f\u3092\u4f7f\u7528\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n---\n\n## 3. \u30e2\u30b8\u30e5\u30fc\u30eb2: \u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0\n\n### 3.1 \u6982\u8981\n\u65e5\u3005\u53d7\u4fe1\u3059\u308b\u5927\u91cf\u306e\u30d1\u30fc\u30c8\u30ca\u30fc\u4f01\u696d\uff08BP\uff09\u304b\u3089\u306e\u6848\u4ef6\u60c5\u5831\u30e1\u30fc\u30eb\u30fb\u8981\u54e1\u63d0\u6848\u30e1\u30fc\u30eb\u3092\u81ea\u52d5\u30d1\u30fc\u30b9\u3057\u3001\u6700\u9069\u306a\u30da\u30a2\u30ea\u30f3\u30b0\u5019\u88dc\u3092\u63d0\u6848\u3059\u308b\u6a5f\u80fd\u3067\u3059\u3002\n\n### 3.2 \u696d\u52d9\u30d5\u30ed\u30fc\n1. **\u69cb\u9020\u5316\u30c7\u30fc\u30bf\u306e\u78ba\u8a8d**: \u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u7d4c\u7531\u3067\u30d1\u30fc\u30b9\u3055\u308c\u305f\u6848\u4ef6\u30fb\u4eba\u6750\u30c7\u30fc\u30bf\u3092\u4e00\u89a7\u3067\u78ba\u8a8d\u3057\u307e\u3059\u3002\n2. **\u53cc\u65b9\u5411\u30de\u30c3\u30c1\u30f3\u30b0\u8868\u793a**:  \n   - \u300c\u3053\u306e\u6848\u4ef6\u306b\u5408\u3046\u4eba\u6750\u300d\u3092\u30b9\u30b3\u30a2\u9806\u306b\u95b2\u89a7\n   - \u300c\u3053\u306e\u4eba\u6750\u306b\u5408\u3046\u6848\u4ef6\u300d\u3092\u30b9\u30b3\u30a2\u9806\u306b\u95b2\u89a7\n3. **\u4e00\u81f4\u30fb\u4e0d\u4e00\u81f4\u7406\u7531\u306e\u691c\u8a3c**: \u30b9\u30b3\u30a2\u3060\u3051\u3067\u306a\u304f\u300c\u306a\u305c\u3053\u306e\u30b9\u30b3\u30a2\u306a\u306e\u304b\uff08\u4e00\u81f4\u30b9\u30ad\u30eb\u30fb\u4e0d\u4e00\u81f4\u8981\u56e0\uff09\u300d\u306e\u30c6\u30ad\u30b9\u30c8\u8aac\u660e\u3092\u78ba\u8a8d\u3057\u3001\u4eba\u9593\u306e\u76ee\uff08\u55b6\u696d/HR\uff09\u3067\u6700\u7d42\u5224\u65ad\u3092\u884c\u3044\u307e\u3059\u3002\n\n---\n\n## 4. \u30e2\u30b8\u30e5\u30fc\u30eb3: \u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\u3068AI\u5229\u7528\u539f\u5247\n\n### 4.1 AI\u88dc\u8db3\u5229\u7528\u306e\u5fb9\u5e95\uff08\u4eba\u9593\u306b\u3088\u308b\u6700\u7d42\u6c7a\u5b9a\uff09\n- \u672c\u30b7\u30b9\u30c6\u30e0\u306e\u5206\u6790\u30fb\u5224\u5b9a\u7d50\u679c\u306f**\u610f\u601d\u6c7a\u5b9a\u306e\u88dc\u52a9\u8cc7\u6599**\u3067\u3059\u3002\u5408\u5426\u30fb\u30a2\u30b5\u30a4\u30f3\u306e\u53ef\u5426\u3092AI\u30b9\u30b3\u30a2\u306e\u307f\u3067\u81ea\u52d5\u6c7a\u5b9a\u3057\u3066\u306f\u306a\u308a\u307e\u305b\u3093\u3002\n- \u5fc5\u305a\u62c5\u5f53\u55b6\u696d\u30fb\u9762\u63a5\u5b98\u30fb\u7ba1\u7406\u8005\u304c\u7dcf\u5408\u7684\u306b\u4eba\u9593\u30ec\u30d3\u30e5\u30fc\u3092\u5b9f\u65bd\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n### 4.2 \u500b\u4eba\u60c5\u5831\u30fb\u6a5f\u5bc6\u4fdd\u6301\u30eb\u30fc\u30eb\n- \u751f\u30e1\u30fc\u30eb\u672c\u6587\u3001\u5951\u7d04\u91d1\u984d\u5b9f\u5024\u3001\u9867\u5ba2\u56fa\u6709\u306e\u6975\u79d8\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u540d\u306f\u30b7\u30b9\u30c6\u30e0\u5916\u3078\u9732\u51fa\u3055\u305b\u306a\u3044\u3088\u3046\u30de\u30b9\u30af\u30fb\u4eee\u540d\u5316\u51e6\u7406\u304c\u65bd\u3055\u308c\u3066\u3044\u307e\u3059\u3002\n- Sheets\u3084\u30ed\u30fc\u30ab\u30eb\u30e1\u30e2\u3078\u306e\u8ee2\u8a18\u6642\u306b\u500b\u4eba\u60c5\u5831\uff08\u751f\u6c0f\u540d\u3001\u96fb\u8a71\u756a\u53f7\u3001\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\uff09\u3092\u66f8\u304d\u8fbc\u307e\u306a\u3044\u3088\u3046\u53b3\u5b88\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n---\n\n## 5. \u3088\u304f\u3042\u308b\u8cea\u554f\u30fbFAQ (\u55b6\u696d/HR\u5411\u3051)\n\n**Q. AI\u306e\u5224\u5b9a\u30b9\u30b3\u30a2\u304c\u4f4e\u3044\u5834\u5408\u3001\u305d\u306e\u6848\u4ef6\u306b\u306f\u63d0\u6848\u3067\u304d\u306a\u3044\u3068\u3044\u3046\u3053\u3068\u3067\u3059\u304b\uff1f**  \nA. \u3044\u3044\u3048\u3002AI\u30b9\u30b3\u30a2\u306f\u904e\u53bb\u306e\u30c7\u30fc\u30bf\u306b\u57fa\u3065\u304f\u50be\u5411\u5024\u3067\u3059\u3002Growth Fit\uff08\u6210\u9577\u6027\uff09\u304c\u9ad8\u3044\u5834\u5408\u3084\u3001\u5468\u8fba\u30b9\u30ad\u30eb\u306e\u5fdc\u7528\u304c\u52b9\u304f\u30b1\u30fc\u30b9\u3082\u3042\u308a\u307e\u3059\u306e\u3067\u3001\u30b9\u30b3\u30a2\u306e\u6839\u62e0\u30c6\u30ad\u30b9\u30c8\u3092\u53c2\u8003\u306b\u4eba\u9593\u304c\u7dcf\u5408\u5224\u65ad\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n**Q. \u55b6\u696d\u30e1\u30fc\u30eb\u306e\u30d1\u30fc\u30b9\u5185\u5bb9\u306b\u8aa4\u308a\u304c\u3042\u308b\u5834\u5408\u306f\u3069\u3046\u4fee\u6b63\u3057\u307e\u3059\u304b\uff1f**  \nA. \u55b6\u696d\u30e1\u30fc\u30eb\u4eba\u9593\u30ec\u30d3\u30e5\u30fc\u753b\u9762\uff08Human Review Runbook\u6e96\u62e0\uff09\u304b\u3089\u624b\u52d5\u4fee\u6b63\u304a\u3088\u3073\u30bf\u30b0\u88dc\u5b8c\u304c\u53ef\u80fd\u3067\u3059\u3002\n";
