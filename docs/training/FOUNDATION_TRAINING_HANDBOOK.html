    <script>
        const rawMarkdown = "# Mighty Skill-Bridge \u5168\u793e\u54e1\u57fa\u790e\u7814\u4fee\u30cf\u30f3\u30c9\u30d6\u30c3\u30af (\u30b3\u30fc\u30b9\u2460)\n\n> **\u5bfe\u8c61\u8aad\u8005**: \u793e\u5185\u4e00\u822c\u5229\u7528\u30e6\u30fc\u30b6\u30fc\u3001\u5168\u793e\u54e1  \n> **\u53d7\u8b1b\u306e\u76ee\u7684**: Mighty Skill-Bridge\u306e\u521d\u671f\u30bb\u30c3\u30c8\u30a2\u30c3\u30d7\uff08\u30a2\u30ab\u30a6\u30f3\u30c8\u6709\u52b9\u5316\uff09\u3001\u793e\u5185\u9069\u6027\u30fb\u72b6\u6cc1\u30a2\u30f3\u30b1\u30fc\u30c8\u306e\u56de\u7b54\u3001\u304a\u3088\u3073\u52e4\u6020\u6253\u523b\u30fb\u52e4\u52d9\u8868\u30c7\u30fc\u30bf\u306e\u767b\u9332\u624b\u9806\u3092\u7406\u89e3\u30fb\u5b9f\u8df5\u3059\u308b\u3002  \n> **\u6700\u7d42\u66f4\u65b0\u65e5**: 2026-07-24  \n> **\u95a2\u9023\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8**: [\u30e6\u30fc\u30b6\u30fc\u64cd\u4f5c\u30ac\u30a4\u30c9\u30fbFAQ](../USER_GUIDE_AND_FAQ.md)\n\n---\n\n## 1. \u7814\u4fee\u306e\u30a2\u30a6\u30c8\u30e9\u30a4\u30f3\u3068\u5230\u9054\u76ee\u6a19\n\n\u672c\u30b3\u30fc\u30b9\u3067\u306f\u3001Mighty Skill-Bridge\u3092\u65e5\u5e38\u696d\u52d9\u3067\u5229\u7528\u3059\u308b\u5168\u793e\u54e1\u304c\u77e5\u3063\u3066\u304a\u304f\u3079\u304d\u57fa\u672c\u64cd\u4f5c\u3068\u30eb\u30fc\u30eb\u3092\u5b66\u3073\u307e\u3059\u3002\n\n### \u5230\u9054\u76ee\u6a19\n1. \u767a\u884c\u3055\u308c\u305f\u7ba1\u7406\u8005\u30a2\u30ab\u30a6\u30f3\u30c8\u3092\u7528\u3044\u3066\u521d\u671f\u30bb\u30c3\u30c8\u30a2\u30c3\u30d7\uff08\u30aa\u30f3\u30dc\u30fc\u30c7\u30a3\u30f3\u30b0\uff09\u3092\u5b8c\u4e86\u3057\u3001\u30a2\u30ab\u30a6\u30f3\u30c8\u3092\u30a2\u30af\u30c6\u30a3\u30d9\u30fc\u30b7\u30e7\u30f3\u3067\u304d\u308b\u3002\n2. \u793e\u5185\u5411\u3051\u9069\u6027\u30fb\u72b6\u6cc1\u30a2\u30f3\u30b1\u30fc\u30c8\u306b\u56de\u7b54\u3057\u3001\u81ea\u8eab\u306e\u30b9\u30ad\u30eb\u30fb\u5e0c\u671b\u6761\u4ef6\u3092\u5b89\u5168\u306b\u767b\u9332\u3067\u304d\u308b\u3002\n3. \u52e4\u6020\u6253\u523b\u304a\u3088\u3073\u52e4\u6020\u30c7\u30fc\u30bf\uff08CSV\u89e3\u6790\uff09\u306e\u5229\u7528\u624b\u9806\u3092\u628a\u63e1\u3057\u3001\u6708\u6b21\u306e\u52e4\u52d9\u72b6\u6cc1\u3092\u6b63\u3057\u304f\u8a18\u9332\u3067\u304d\u308b\u3002\n\n---\n\n## 2. \u30e2\u30b8\u30e5\u30fc\u30eb1: \u521d\u671f\u30bb\u30c3\u30c8\u30a2\u30c3\u30d7\u3068\u30a2\u30ab\u30a6\u30f3\u30c8\u6709\u52b9\u5316\uff08T752\uff09\n\n### 2.1 \u6982\u8981\u3068\u904b\u7528\u30eb\u30fc\u30eb\nMighty Skill-Bridge \u306f**\u7ba1\u7406\u8005\u306b\u3088\u308b\u4e8b\u524d\u30a2\u30ab\u30a6\u30f3\u30c8\u767a\u884c**\u65b9\u5f0f\u3092\u63a1\u7528\u3057\u3066\u3044\u307e\u3059\u3002  \n\u5229\u7528\u8005\u306f\u81ea\u5df1\u30b5\u30a4\u30f3\u30a2\u30c3\u30d7\u3092\u884c\u3046\u306e\u3067\u306f\u306a\u304f\u3001\u7ba1\u7406\u8005\u304c\u767a\u884c\u3057\u305f\u521d\u671f\u8a8d\u8a3c\u60c5\u5831\u3092\u53d7\u3051\u53d6\u3063\u3066\u521d\u671f\u8a2d\u5b9a\u3092\u884c\u3044\u307e\u3059\u3002\n\n### 2.2 \u521d\u671f\u30bb\u30c3\u30c8\u30a2\u30c3\u30d7\u306e\u624b\u9806\n1. **\u753b\u9762\u30a2\u30af\u30bb\u30b9**:  \n   \u793e\u5185\u6307\u5b9aURL\uff08\u30ed\u30fc\u30ab\u30eb\u74b0\u5883\u307e\u305f\u306f\u793e\u5185\u30db\u30b9\u30c6\u30a3\u30f3\u30b0\u74b0\u5883\uff09\u3078\u30a2\u30af\u30bb\u30b9\u3057\u3001\u30ca\u30d3\u30b2\u30fc\u30b7\u30e7\u30f3\u306e\u300c\u521d\u671f\u30bb\u30c3\u30c8\u30a2\u30c3\u30d7\u300d\uff08`#onboarding-section`\uff09\u3092\u958b\u304d\u307e\u3059\u3002\n2. **\u30b9\u30c6\u30c3\u30d7\u306e\u5b9f\u884c**:  \n   - **\u30a2\u30ab\u30a6\u30f3\u30c8\u78ba\u8a8d**: \u767a\u884c\u3055\u308c\u305f\u793e\u5185\u30e1\u30fc\u30eb\u30a2\u30c9\u30ec\u30b9\u3067\u30b5\u30a4\u30f3\u30a4\u30f3\u3057\u3066\u3044\u308b\u304b\u78ba\u8a8d\u3057\u307e\u3059\u3002\n   - **\u898f\u7d04\u540c\u610f**: \u5229\u7528\u898f\u7d04\u3001\u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30dd\u30ea\u30b7\u30fc\u3001\u7279\u5546\u6cd5\u8868\u8a18\u7b49\u306e\u78ba\u8a8d\u30c1\u30a7\u30c3\u30af\u30dc\u30c3\u30af\u30b9\u3092\u6709\u52b9\u5316\u3057\u307e\u3059\u3002\n   - **\u8868\u793a\u540d\u30fb\u6240\u5c5e\u767b\u9332**: \u793e\u5185\u8b58\u5225\u7528\u306e\u8868\u793a\u540d\u304a\u3088\u3073\u6240\u5c5e\u90e8\u7f72\u3092\u5165\u529b\u3057\u307e\u3059\uff08\u751f\u5e74\u6708\u65e5\u3084\u4f4f\u6240\u7b49\u306e\u4e0d\u8981\u306a\u500b\u4eba\u60c5\u5831\u306f\u5165\u529b\u3057\u306a\u3044\u3067\u304f\u3060\u3055\u3044\uff09\u3002\n   - **\u521d\u56de\u30c6\u30b9\u30c8\u5b9f\u65bd\uff08\u4efb\u610f\uff09**: \u8a3a\u65ad\u30fb\u30a2\u30f3\u30b1\u30fc\u30c8\u6a5f\u80fd\u3092\u4e00\u5ea6\u4f53\u9a13\u3057\u3001\u753b\u9762\u306e\u898b\u65b9\u306b\u6163\u308c\u307e\u3059\u3002\n3. **\u30a2\u30af\u30c6\u30a3\u30d9\u30fc\u30b7\u30e7\u30f3\u5b9f\u884c**:  \n   \u300c\u30a2\u30ab\u30a6\u30f3\u30c8\u3092\u6709\u52b9\u5316\u3059\u308b\u300d\u30dc\u30bf\u30f3\u3092\u30af\u30ea\u30c3\u30af\u3057\u307e\u3059\u3002\u5fc5\u9808\u30b9\u30c6\u30c3\u30d7\u304c\u3059\u3079\u3066\u5b8c\u4e86\u3057\u3066\u3044\u308c\u3070\u3001\u30a2\u30af\u30c6\u30a3\u30d9\u30fc\u30b7\u30e7\u30f3\u304c\u6210\u529f\u3057\u307e\u3059\u3002\n\n### 2.3 \u30d7\u30e9\u30a4\u30d0\u30b7\u30fc\u30fb\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u4fdd\u8b77\u306b\u3064\u3044\u3066\n- \u5165\u529b\u3057\u305f\u30a2\u30ab\u30a6\u30f3\u30c8\u8b58\u5225\u5b50\u306f\u30b5\u30fc\u30d0\u5074\u3067\u4eee\u540d\u5316\uff08`onb-<hash>`\uff09\u3055\u308c\u3066\u76e3\u67fb\u30ed\u30b0\u3078\u8a18\u9332\u3055\u308c\u307e\u3059\u3002\u751f\u5024\u306f\u4fdd\u5b58\u3055\u308c\u307e\u305b\u3093\u3002\n- \u9032\u6357\u72b6\u6cc1\u306f\u30d6\u30e9\u30a6\u30b6\u30ed\u30fc\u30ab\u30eb\u30b9\u30c8\u30ec\u30fc\u30b8\uff08`msb_onboarding_progress_v1`\uff09\u306b\u4fdd\u6301\u3055\u308c\u308b\u305f\u3081\u3001\u5b89\u5168\u306b\u4e2d\u65ad\u30fb\u518d\u958b\u304c\u53ef\u80fd\u3067\u3059\u3002\n\n---\n\n## 3. \u30e2\u30b8\u30e5\u30fc\u30eb2: \u793e\u5185\u9069\u6027\u30fb\u72b6\u6cc1\u30a2\u30f3\u30b1\u30fc\u30c8\uff08`#survey-section`\uff09\n\n### 3.1 \u76ee\u7684\n\u5b9a\u671f\u7684\u306a\u793e\u5185\u30a2\u30f3\u30b1\u30fc\u30c8\u3092\u901a\u3058\u3001\u5404\u30e1\u30f3\u30d0\u30fc\u306e\u73fe\u72b6\u306e\u62c5\u5f53\u696d\u52d9\u30fb\u30e2\u30c1\u30d9\u30fc\u30b7\u30e7\u30f3\u30fb\u4f38\u3070\u3057\u305f\u3044\u30b9\u30ad\u30eb\u9818\u57df\u3092\u53ef\u8996\u5316\u3057\u3001\u9069\u5207\u306a\u6848\u4ef6\u30de\u30c3\u30c1\u30f3\u30b0\u3084\u30d5\u30a9\u30ed\u30fc\u306b\u5f79\u7acb\u3066\u307e\u3059\u3002\n\n### 3.2 \u56de\u7b54\u624b\u9806\n1. \u30ca\u30d3\u30b2\u30fc\u30b7\u30e7\u30f3\u306e\u300c\u9069\u6027\u30a2\u30f3\u30b1\u30fc\u30c8\u300d\u3092\u9078\u629e\u3057\u307e\u3059\u3002\n2. \u63d0\u793a\u3055\u308c\u308b\u9078\u629e\u80a2\u30fb\u81ea\u5df1\u8a55\u4fa1\u9805\u76ee\uff08\u30b9\u30ad\u30eb\u30ec\u30d9\u30eb\u3001\u696d\u52d9\u6e80\u8db3\u5ea6\u3001\u30ad\u30e3\u30ea\u30a2\u5fd7\u5411\u7b49\uff09\u3092\u5165\u529b\u3057\u307e\u3059\u3002\n3. \u9001\u4fe1\u30dc\u30bf\u30f3\u3092\u62bc\u3057\u3001\u5b8c\u4e86\u30e1\u30c3\u30bb\u30fc\u30b8\u304c\u8868\u793a\u3055\u308c\u305f\u3053\u3068\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002\n\n---\n\n## 4. \u30e2\u30b8\u30e5\u30fc\u30eb3: \u52e4\u6020\u7ba1\u7406\u3068\u52e4\u52d9\u8868CSV\u89e3\u6790\uff08`#attendance-section`\uff09\n\n### 4.1 \u76ee\u7684\n\u65e5\u3005\u306e\u52e4\u6020\u6253\u523b\u304a\u3088\u3073\u6708\u6b21\u52e4\u52d9\u8868CSV\u306e\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u30fb\u78ba\u8a8d\u3092\u7c21\u5358\u306b\u884c\u3046\u305f\u3081\u306e\u6a5f\u80fd\u3067\u3059\u3002\n\n### 4.2 \u64cd\u4f5c\u624b\u9806\n- **\u65e5\u5e38\u6253\u523b**: \u51fa\u9000\u52e4\u6642\u306b\u300c\u51fa\u52e4\u300d\u300c\u9000\u52e4\u300d\u30dc\u30bf\u30f3\u3092\u62bc\u4e0b\u3057\u3066\u81ea\u767a\u7684\u306b\u8a18\u9332\u3057\u307e\u3059\u3002\n- **CSV\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9**: \u6708\u672b\u3084\u9031\u6b21\u3067\u51fa\u529b\u3057\u305f\u52e4\u6020CSV\u30d5\u30a1\u30a4\u30eb\u3092\u30c9\u30e9\u30c3\u30b0\uff06\u30c9\u30ed\u30c3\u30d7\u3067\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u3057\u3001\u81ea\u52d5\u30d1\u30fc\u30b9\u7d50\u679c\uff08\u52b4\u50cd\u6642\u9593\u3001\u6b8b\u696d\u6642\u9593\u3001\u7570\u5e38\u5024\u30a2\u30e9\u30fc\u30c8\u306a\u3069\uff09\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002\n\n---\n\n## 5. \u3088\u304f\u3042\u308b\u8cea\u554f\u30fbFAQ (\u5168\u793e\u54e1\u5411\u3051)\n\n**Q. \u30a2\u30ab\u30a6\u30f3\u30c8\u6709\u52b9\u5316\u304c\u5931\u6557\u3057\u307e\u3059\u3002\u3069\u3046\u3059\u308c\u3070\u3088\u3044\u3067\u3059\u304b\uff1f**  \nA. \u5fc5\u9808\u9805\u76ee\uff08\u898f\u7d04\u3078\u306e\u540c\u610f\u3001\u8868\u793a\u540d\u30fb\u6240\u5c5e\u306e\u5165\u529b\uff09\u304c\u6f0f\u308c\u3066\u3044\u308b\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002\u753b\u9762\u306e\u30a2\u30e9\u30fc\u30c8\u30e1\u30c3\u30bb\u30fc\u30b8\u3092\u78ba\u8a8d\u3057\u3001\u672a\u5b8c\u4e86\u306e\u30b9\u30c6\u30c3\u30d7\u3092\u5b8c\u4e86\u3055\u305b\u3066\u304b\u3089\u518d\u5ea6\u304a\u8a66\u3057\u304f\u3060\u3055\u3044\u3002\n\n**Q. \u30a2\u30f3\u30b1\u30fc\u30c8\u306e\u56de\u7b54\u5185\u5bb9\u306f\u4ed6\u306e\u793e\u54e1\u306b\u516c\u958b\u3055\u308c\u307e\u3059\u304b\uff1f**  \nA. \u56de\u7b54\u5185\u5bb9\u306f\u4eba\u4e8b\u30fb\u7ba1\u7406\u8005\u304a\u3088\u3073\u30de\u30c3\u30c1\u30f3\u30b0\u62c5\u5f53\u8005\u306e\u307f\u304c\u53c2\u7167\u3057\u3001\u4e0d\u5fc5\u8981\u306a\u7b2c\u4e09\u8005\u3084\u5916\u90e8\u3078\u958b\u793a\u3055\u308c\u308b\u3053\u3068\u306f\u3042\u308a\u307e\u305b\u3093\u3002\n";
