    <script>

u6642\u306e\u8fd4\u91d1\u30fb\u30af\u30ec\u30b8\u30c3\u30c8\u69cb\u6210\uff09**:\n   - \u5f53\u793e\u306e\u8cac\u306b\u5e30\u3059\u3079\u304d\u91cd\u5927\u306a\u969c\u5bb3\u306b\u3088\u308a SLA \u76ee\u6a19\u3092\u4e0b\u56de\u3063\u305f\u5834\u5408\u3001\u539f\u5247\u3068\u3057\u3066\u6b21\u56de\u66f4\u65b0\u6642\u306b\u9069\u7528\u53ef\u80fd\u306a\u30af\u30ec\u30b8\u30c3\u30c8\u4ed8\u4e0e\u3092\u7b2c\u4e00\u9078\u629e\u3068\u3057\u3001\u89e3\u7d04\u6642\u3084\u9867\u5ba2\u306e\u7533\u3057\u51fa\u306b\u5bfe\u3057\u3066 Stripe Refunds API \u7d4c\u7531\u3067\u306e\u73fe\u91d1\u8fd4\u91d1\u3092\u884c\u3046\uff08[`docs/BILLING_AND_REFUND_POLICY.md`](BILLING_AND_REFUND_POLICY.md) \u7b2c5\u6761\u7b2c2\u9805\uff09\u3002\n2. **T798-18\uff08\u4f8b\u5916\u8fd4\u91d1\u6642\u306e Stripe \u6c7a\u6e08\u624b\u6570\u6599\u63a7\u9664\uff09**:\n   - \u5f53\u793e\u306b\u904e\u5931\u306e\u306a\u3044\u4f8b\u5916\u7684\u306a\u8fd4\u91d1\u51e6\u7406\u306b\u304a\u3044\u3066\u3001\u8fd4\u9084\u3055\u308c\u306a\u3044 Stripe \u6c7a\u6e08\u624b\u6570\u6599\u76f8\u5f53\u984d\uff08\u7d043.6%\uff09\u3092\u63a7\u9664\u3059\u308b\uff08\u540c \u7b2c5\u6761\u7b2c4\u9805\uff09\u3002\n3. **T798-19\uff08\u8fd4\u91d1\u8acb\u6c42\u671f\u9650 30\u65e5\uff09**:\n   - \u8fd4\u91d1\u8acb\u6c42\u306f\u5bfe\u8c61\u8acb\u6c42\u767a\u751f\u65e5\u304b\u3089 30 \u65e5\u4ee5\u5185\u306b\u30b5\u30dd\u30fc\u30c8\u7a93\u53e3\u3078\u7533\u3057\u51fa\u308b\u3082\u306e\u3068\u3059\u308b\uff08\u540c \u7b2c5\u6761\u7b2c5\u9805\uff09\u3002\n4. **T798-20\uff08\u6539\u6b63\u7279\u5546\u6cd5\u30fb\u6700\u7d42\u78ba\u8a8d\u753b\u9762\u306e\u81ea\u52d5\u66f4\u65b0\u8868\u793a\uff09**:\n   - \u7533\u8fbc\u6700\u7d42\u78ba\u8a8d\u753b\u9762\u306b\u3066(1)\u6570\u91cf\u30fb\u671f\u9593\u3001(2)\u8ca9\u58f2\u4fa1\u683c\u3001(3)\u652f\u6255\u6642\u671f\u30fb\u65b9\u6cd5\u3001(4)\u5f15\u6e21\u6642\u671f\u3001(5)\u89e3\u7d04\u65b9\u6cd5\u3001(6)\u7533\u8fbc\u671f\u9593\u3092\u660e\u8a18\u3059\u308b\uff08[`docs/TOKUSHOHO_NOTATION.md`](TOKUSHOHO_NOTATION.md)\uff09\u3002\n\n---\n\n## 3. \u6cd5\u52d9\u62c5\u5f53\u6c7a\u88c1\u30b3\u30e1\u30f3\u30c8\n\n> \u5916\u90e8\u5f01\u8b77\u58eb\uff08R36\uff09\u304b\u3089\u306e\u6cd5\u7684\u9069\u5408\u8a55\u4fa1\u306e\u53d7\u9818\u3001\u306a\u3089\u3073\u306b\u6cd5\u52d9\u78ba\u8a8d\u30b5\u30a4\u30f3\u30aa\u30d5\u53f0\u5e33\uff08`data/legal_review_signoff.tsv`\uff09\u306b\u304a\u3051\u308b\u516820\u9805\u76ee\u306e\u300c\u78ba\u5b9a\u300d\u5b8c\u4e86\u306b\u4f34\u3044\u3001\u6cd5\u52d9\u62c5\u5f53\u3068\u3057\u3066 **Mighty Skill-Bridge \u306e\u6709\u511f\u7248\u4e00\u822c\u516c\u958b\uff08Stripe Live\u30e2\u30fc\u30c9\u306e\u6709\u52b9\u5316\uff09\u3092\u6b63\u5f0f\u306b\u627f\u8a8d\u3044\u305f\u3057\u307e\u3059**\u3002\n>\n> \u9069\u5207\u306a\u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\u7ba1\u7406\u3068\u900f\u660e\u6027\u306e\u3042\u308b\u898f\u7d04\u540c\u610f\u30fb\u89e3\u7d04\u5c0e\u7dda\u306b\u3088\u308a\u3001\u30e6\u30fc\u30b6\u30fc\u306e\u6a29\u5229\u4fdd\u8b77\u3068\u5f53\u793e\u306e\u30d3\u30b8\u30cd\u30b9\u6210\u9577\u306e\u4e21\u7acb\u304c\u56f3\u3089\u308c\u3066\u3044\u308b\u3068\u8a55\u4fa1\u3057\u307e\u3059\u3002\n\n**\u6cd5\u52d9\u62c5\u5f53**: \u9ad8\u6a4b \u5065\u4e8c  \n**\u4ee3\u8868\u53d6\u7de0\u5f79**: \u5c0f\u6797 \u96c5\u6c34  \n**\u627f\u8a8d\u65e5\u6642**: 2026\u5e748\u670815\u65e5\n";
