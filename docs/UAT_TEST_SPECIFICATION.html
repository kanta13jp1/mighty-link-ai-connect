    <script>
        const rawMarkdown = "# \ud83e\uddea Mighty Skill-Bridge: UAT \u30c6\u30b9\u30c8\u4ed5\u69d8\u66f8 (UAT_TEST_SPECIFICATION)\n\n> **\u4eba\u9593\u304c\u624b\u9806\u3069\u304a\u308a\u306b\u5b9f\u884c\u3057\u3001OK / NG \u3092\u5224\u65ad\u3067\u304d\u308b**\u53d7\u5165\u30c6\u30b9\u30c8\uff08UAT\uff09\u4ed5\u69d8\u66f8\u3002\n> T845\u300c\u5168\u6a5f\u80fd\u672c\u756a\u53d7\u5165E2E/UAT\u6700\u7d42\u518d\u691c\u8a3c\u300d\u306e**\u624b\u52d5\u5b9f\u884c\u306e\u6b63\u672c**\u3068\u3057\u3066\u4f7f\u7528\u3059\u308b\u3002\u81ea\u52d5E2E\uff08\u30a2\u30d7\u30ea\u5c64\uff09\u306f T845_1\uff08`scripts/run_ga_acceptance_e2e.py`\uff09\u304c\u62c5\u4fdd\u3057\u3001\u672c\u66f8\u306f\u4eba\u9593\u304c\u672c\u756a\u76f8\u5f53\u74b0\u5883\u3067\u6700\u7d42\u78ba\u8a8d\u3059\u308b\u7bc4\u56f2\u3092\u5b9a\u7fa9\u3059\u308b\u3002\n>\n> \u672c\u66f8\u306e\u5b8c\u5168\u6027\u30fb\u6574\u5408\u6027\u306f [`scripts/audit_uat_test_spec.py`](../scripts/audit_uat_test_spec.py)\uff0810\u4eee\u8aac\uff09\u3068 `tests/test_uat_test_spec.py` \u304c CI \u3067\u7d99\u7d9a\u691c\u8a3c\u3059\u308b\uff08\u5404\u30b1\u30fc\u30b9\u306e\u5fc5\u9808\u9805\u76ee\u30fbOK/NG\u5224\u5b9a\u30fb\u5b9f\u5728WBS/API\u53c2\u7167\u30fb\u30c9\u30e1\u30a4\u30f3\u7db2\u7f85\uff09\u3002\n\n---\n\n## 1. \u76ee\u7684\u3068\u5bfe\u8c61\u7bc4\u56f2\n\n- **\u76ee\u7684**: \u793e\u5185GA\u5bfe\u8c61\u6a5f\u80fd\u304c\u672c\u756a\u76f8\u5f53\u74b0\u5883\u3067\u4ed5\u69d8\u3069\u304a\u308a\u52d5\u4f5c\u3059\u308b\u3053\u3068\u3092\u3001\u4eba\u9593\u304c\u518d\u73fe\u53ef\u80fd\u306a\u624b\u9806\u3067\u78ba\u8a8d\u3057\u3001\u5408\u5426\uff08OK/NG\uff09\u3092\u8a18\u9332\u3059\u308b\u3002\n- **\u5bfe\u8c61\u7bc4\u56f2**: \u9069\u6027\u30a2\u30f3\u30b1\u30fc\u30c8 / \u52e4\u6020 / \u55b6\u696d\u30e1\u30fc\u30ebAI\u30de\u30c3\u30c1\u30f3\u30b0 / \u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9 / \u6cd5\u5b9a\u540c\u610f\u30b2\u30fc\u30c8 / \u30c7\u30fc\u30bf\u30a8\u30af\u30b9\u30dd\u30fc\u30c8\u30fb\u524a\u9664 / \u30b5\u30dd\u30fc\u30c8 / \u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u30fbNPS / \u30e9\u30a4\u30c8\u30e2\u30fc\u30c9 / \u30d8\u30eb\u30b9\u30c1\u30a7\u30c3\u30af\u30fb\u516c\u958b\u30c7\u30e2 / \u30ec\u30fc\u30c8\u30ea\u30df\u30c3\u30c8\u3002\n- **\u5bfe\u8c61\u5916**: \u6709\u511f\u8ab2\u91d1\u306e live \u5b9f\u884c\uff08T862 \u5224\u65ad\u5f8c\uff09\u3001\u5916\u90e8\u30e1\u30fc\u30eb\u5b9f\u63a5\u7d9a\u306e\u5b9f\u30c7\u30fc\u30bf\uff08T836 \u53d7\u9818\u5f8c\uff09\u3002\u3053\u308c\u3089\u306f\u8a72\u5f53WBS\u306e\u30b2\u30fc\u30c8\u3067\u5225\u9014\u5b9f\u65bd\u3059\u308b\u3002\n\n## 2. \u4e8b\u524d\u6e96\u5099\uff08\u30c6\u30b9\u30c8\u74b0\u5883\u30fb\u8a8d\u8a3c\u30fb\u30c7\u30fc\u30bf\uff09\n\n| \u9805\u76ee | \u5185\u5bb9 |\n| :--- | :--- |\n| \u672c\u756aURL | `https://mightylink-app.com/` \u304a\u3088\u3073 Firebase Hosting \u65e2\u5b9aURL |\n| \u8a8d\u8a3c | Firebase Auth\uff08\u4fdd\u8b77API\u306f ID \u30c8\u30fc\u30af\u30f3\u691c\u8a3c\u3002\u30c6\u30b9\u30c8\u306f Auth Emulator \u307e\u305f\u306f\u30c6\u30b9\u30c8\u7528\u30a2\u30ab\u30a6\u30f3\u30c8\u3067\u5b9f\u65bd\uff09\u3002\u516c\u5f0f: ID \u30c8\u30fc\u30af\u30f3\u306f Admin SDK \u3067\u691c\u8a3c\u3001\u8a8d\u8a3c\u4fdd\u8b77\u30d5\u30ed\u30fc\u306f Auth Emulator \u3067\u30c6\u30b9\u30c8\uff08Firebase Auth docs 2026-07-03 \u78ba\u8a8d\uff09 |\n| \u7ba1\u7406\u8005API | Basic \u8a8d\u8a3c\uff08`BASIC_AUTH` \u74b0\u5883\u5909\u6570\uff09\u3002\u30c6\u30b9\u30c8\u5b9f\u65bd\u8005\u306f\u7ba1\u7406\u8005\u8cc7\u683c\u60c5\u5831\u3092\u5b89\u5168\u7d4c\u8def\u3067\u53d7\u9818\u3059\u308b |\n| \u30c7\u30fc\u30bf\u78ba\u8a8d | Supabase\uff08\u672c\u756a PostgreSQL 17.6\u30fbRLS \u6709\u52b9\uff09\u3002\u4fdd\u5b58\u78ba\u8a8d\u306f\u7ba1\u7406\u8005\u96c6\u8a08API \u307e\u305f\u306f\u904b\u7528\u8005\u306eSQL\u78ba\u8a8d\u3067\u884c\u3046 |\n| \u30c6\u30b9\u30c8\u30c7\u30fc\u30bf | \u500b\u4eba\u60c5\u5831\u3092\u542b\u307e\u306a\u3044\u5408\u6210\u30c7\u30fc\u30bf\uff08\u30b5\u30f3\u30d7\u30eb\u7d4c\u6b74\u66f8/\u6848\u4ef6\u7968\u3001\u5408\u6210\u52e4\u52d9\u8868 CSV/Excel\uff09\u3092\u4f7f\u7528\u3059\u308b |\n| \u540c\u610f\u30d0\u30fc\u30b8\u30e7\u30f3 | \u8a3a\u65ad\u7cfbAPI\u306f `LEGAL_CONSENT_VERSION = MSB-LEGAL-2026-06-DRAFT` \u306e\u540c\u610f\u3092\u5fc5\u9808\u3068\u3059\u308b |\n\n## 3. \u5224\u5b9a\u306e\u51e1\u4f8b\n\n- **OK**: \u300cOK\u5224\u5b9a\u300d\u306b\u8a18\u8f09\u3057\u305f\u6761\u4ef6\u3092**\u3059\u3079\u3066**\u6e80\u305f\u3059\u3002\n- **NG**: \u300cNG\u5224\u5b9a\u300d\u306b\u8a18\u8f09\u3057\u305f\u4e8b\u8c61\u304c**\u4e00\u3064\u3067\u3082**\u767a\u751f\u3059\u308b\u3002\n- **N/A**: \u524d\u63d0\u6761\u4ef6\u3092\u6e80\u305f\u305b\u305a\u30c6\u30b9\u30c8\u4e0d\u80fd\uff08\u7406\u7531\u3092\u5099\u8003\u306b\u8a18\u8f09\uff09\u3002\n\n\u5404\u30b1\u30fc\u30b9\u306e\u300c\u5b9f\u65bd\u7d50\u679c\u300d\u6b04\u306b OK / NG \u3092\u8a18\u5165\u3057\u3001\u5b9f\u65bd\u65e5\u30fb\u5b9f\u65bd\u8005\u30fb\u5099\u8003\u3092\u6b8b\u3059\u3053\u3068\u3002NG \u306f\u8ab2\u984c\u7ba1\u7406\u8868\uff08`data/issues_tracker.tsv`\uff09\u3078\u8d77\u7968\u3059\u308b\u3002\n\n> **\u26a0\ufe0f \u540c\u610f\u30fb\u5fc5\u9808\u9805\u76ee\u30b2\u30fc\u30c8\u3092\u691c\u8a3c\u3059\u308b\u969b\u306e\u6ce8\u8a18\uff08\u91cd\u8981\uff09**\n> \u30d6\u30e9\u30a6\u30b6\u306e HTML5 \u5fc5\u9808\u691c\u8a3c\u306f\u3001\u30d5\u30a9\u30fc\u30e0\u5185\u3067 **DOM \u9806\u306b\u6700\u521d\u306b\u898b\u3064\u304b\u3063\u305f\u7a7a\u306e\u5fc5\u9808\u9805\u76ee**\u3067\u30a8\u30e9\u30fc\u3092\u8868\u793a\u3057\u3066\u505c\u6b62\u3059\u308b\u3002\u3057\u305f\u304c\u3063\u3066\u3001\u3042\u308b\u7279\u5b9a\u306e\u30b2\u30fc\u30c8\uff08\u4f8b: \u540c\u610f\u30c1\u30a7\u30c3\u30af\uff09\u3060\u3051\u3092\u691c\u8a3c\u3057\u305f\u3044\u5834\u5408\u306f\u3001**\u305d\u308c\u4ee5\u5916\u306e\u5fc5\u9808\u9805\u76ee\u3092\u5148\u306b\u3059\u3079\u3066\u5165\u529b**\u3057\u3001\u691c\u8a3c\u3057\u305f\u3044\u9805\u76ee\u3060\u3051\u3092\u7a7a/\u672a\u5165\u529b\u306b\u3059\u308b\u3053\u3068\u3002\u3055\u3082\u306a\u3044\u3068\u5225\u306e\u7a7a\u6b04\uff08\u4f8b: \u793e\u5185\u78ba\u8a8d\u30b3\u30fc\u30c9\uff09\u3067\u30d6\u30ed\u30c3\u30af\u3055\u308c\u3001\u76ee\u7684\u306e\u30b2\u30fc\u30c8\u3092\u691c\u8a3c\u3067\u304d\u306a\u3044\uff08\uff1d\u305d\u306e\u624b\u9806\u306f OK \u3067\u306f\u306a\u304f **N/A** \u3068\u3057\u3001\u6761\u4ef6\u3092\u6574\u3048\u3066\u518d\u5b9f\u884c\u3059\u308b\uff09\u3002\n> \u307e\u305f\u3001\u30af\u30e9\u30a4\u30a2\u30f3\u30c8\u5074\u691c\u8a3c\u306f DevTools \u7b49\u3067\u56de\u907f\u53ef\u80fd\u306a\u305f\u3081\u3001\u91cd\u8981\u306a\u30b2\u30fc\u30c8\uff08\u540c\u610f\u30fb\u8a8d\u8a3c\uff09\u306f**\u30b5\u30fc\u30d0\u30fc\u5074\u306e\u62d2\u5426\uff08HTTP 400/401 \u7b49\uff09**\u3082\u4f75\u305b\u3066\u78ba\u8a8d\u3059\u308b\u3002\n\n---\n\n## 4. \u30c6\u30b9\u30c8\u30b1\u30fc\u30b9\n\n### TS-01 \u9069\u6027\u30a2\u30f3\u30b1\u30fc\u30c8\u306e\u540c\u610f\u5fc5\u9808\u9001\u4fe1\n- **\u5bfe\u8c61\u6a5f\u80fd**: \u793e\u5185\u9069\u6027\u30fb\u72b6\u6cc1\u30a2\u30f3\u30b1\u30fc\u30c8\uff08\u540c\u610f\u30b2\u30fc\u30c8\uff09\n- **\u95a2\u9023WBS**: T840\n- **\u95a2\u9023API**: POST /api/employee-assessment/responses\n- **\u524d\u63d0\u6761\u4ef6**: \u672c\u756aURL\u306b\u30a2\u30af\u30bb\u30b9\u3067\u304d\u3001\u793e\u5185\u78ba\u8a8d\u30b3\u30fc\u30c9\u3092\u4fdd\u6709\u3057\u3066\u3044\u308b\u3002\u500b\u4eba\u60c5\u5831\u3092\u542b\u307e\u306a\u3044\u5408\u6210\u56de\u7b54\u3092\u7528\u610f\u3059\u308b\u3002\u30d5\u30a9\u30fc\u30e0\u306e\u5fc5\u9808\u9805\u76ee\u306f\u300c\u793e\u5185\u78ba\u8a8d\u30b3\u30fc\u30c9\uff083\u6587\u5b57\u4ee5\u4e0a\uff09\u300d\u300c\u90e8\u7f72\u30ab\u30c6\u30b4\u30ea\u300d\u300c\u30d5\u30ea\u30fc\u8a18\u8ff0\uff08**10\u6587\u5b57\u4ee5\u4e0a**\u3001\u30b5\u30fc\u30d0\u30fc\u691c\u8a3c\u3042\u308a\uff09\u300d\u300c\u540c\u610f\u30c1\u30a7\u30c3\u30af\u300d\u306e4\u3064\uff08\u3044\u305a\u308c\u3082 HTML5 `required`\uff09\u3002\u203b\u540c\u610f\u30b2\u30fc\u30c8\u3092\u5207\u308a\u5206\u3051\u308b\u305f\u3081\u3001\u540c\u610f\u4ee5\u5916\u306e\u5fc5\u9808\u9805\u76ee\u306f\u5148\u306b\u57cb\u3081\u308b\u3053\u3068\uff08\u00a73 \u306e\u6ce8\u8a18\u53c2\u7167\uff09\u3002\n- **\u30c6\u30b9\u30c8\u624b\u9806**:\n  1. \u30db\u30fc\u30e0\u753b\u9762\u306e\u30a2\u30f3\u30b1\u30fc\u30c8\u30bb\u30af\u30b7\u30e7\u30f3\u3092\u958b\u304f\u3002\n  2. **\u540c\u610f\u30c1\u30a7\u30c3\u30af\u4ee5\u5916\u306e\u5fc5\u9808\u9805\u76ee**\uff08\u793e\u5185\u78ba\u8a8d\u30b3\u30fc\u30c9\u30fb\u90e8\u7f72\u30ab\u30c6\u30b4\u30ea\u30fb**\u30d5\u30ea\u30fc\u8a18\u8ff0\u306f10\u6587\u5b57\u4ee5\u4e0a**\uff09\u3092\u3059\u3079\u3066\u5165\u529b\u3057\u3001motivation/culture \u3092\u9078\u629e\u3057\u3001**\u540c\u610f\u30c1\u30a7\u30c3\u30af\u3060\u3051\u3092\u5916\u3057\u305f\u307e\u307e**\u300c\u9001\u4fe1\u300d\u3059\u308b\u3002\n  3. \u540c\u610f\u30c1\u30a7\u30c3\u30af\u3082\u5165\u308c\u3066\uff08\u5168\u9805\u76ee\u5165\u529b\u306e\u72b6\u614b\u3067\uff09\u9001\u4fe1\u3059\u308b\u3002\n  4. \uff08\u30b5\u30fc\u30d0\u30fc\u5074\u691c\u8a3c\uff09DevTools \u7b49\u3067\u30af\u30e9\u30a4\u30a2\u30f3\u30c8\u691c\u8a3c\u3092\u56de\u907f\u3057\u3001`consented=false` \u306e\u307e\u307e `POST /api/employee-assessment/responses` \u3092\u9001\u4fe1\u3059\u308b\u3002\n  5. \u30d5\u30ea\u30fc\u8a18\u8ff0\u30929\u6587\u5b57\u4ee5\u4e0b\uff08\u4f8b\u300c\u30c6\u30b9\u30c8\u300d\uff09\u306b\u3057\u3066\u9001\u4fe1\u3057\u3001UI \u306e\u30a8\u30e9\u30fc\u30e1\u30c3\u30bb\u30fc\u30b8\u3092\u78ba\u8a8d\u3059\u308b\u3002\n- **\u671f\u5f85\u7d50\u679c**: \u624b\u98062\u306f\u30d6\u30e9\u30a6\u30b6\u304c**\u540c\u610f\u30c1\u30a7\u30c3\u30af\u30dc\u30c3\u30af\u30b9**\u3067\u300c\u3053\u306e\u30c1\u30a7\u30c3\u30af\u30dc\u30c3\u30af\u30b9\u3092\u30aa\u30f3\u306b\u3057\u3066\u304f\u3060\u3055\u3044\u300d\u3068\u8868\u793a\u3057\u9001\u4fe1\u4e0d\u53ef\uff08`\u672a\u9001\u4fe1`\u306e\u307e\u307e\uff09\u3002\u624b\u98063\u306f\u6210\u529f\u8868\u793a\u3068 `response_id`\uff081\u4ee5\u4e0a\uff09\u304c\u8fd4\u308b\u3002\u624b\u98064\u306f\u30b5\u30fc\u30d0\u30fc\u304c HTTP 400\uff08`consent is required before storing the response`\uff09\u3067\u62d2\u5426\u3059\u308b\u3002\u624b\u98065\u306f UI \u304c\u7406\u7531\uff08\u300c\u30d5\u30ea\u30fc\u8a18\u8ff0\u306f10\u6587\u5b57\u4ee5\u4e0a\u3067\u5165\u529b\u3057\u3066\u304f\u3060\u3055\u3044\u300d\u7b49\u306e\u5177\u4f53\u7684\u30e1\u30c3\u30bb\u30fc\u30b8\uff09\u3092\u8868\u793a\u3059\u308b\uff08\u300c\u63a5\u7d9a\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u300d\u7b49\u306e\u8aa4\u8868\u793a\u306f NG\uff09\u3002\n- **OK\u5224\u5b9a**: \u624b\u98062\u3067**\u540c\u610f\u30c1\u30a7\u30c3\u30af\u30dc\u30c3\u30af\u30b9**\u3092\u7406\u7531\u306b\u9001\u4fe1\u62d2\u5426\u3001\u624b\u98063\u3067\u6210\u529f\u3057 `response_id` \u304c\u8fd4\u308b\u3001\u624b\u98064\u3067\u30b5\u30fc\u30d0\u30fc\u304c 400 \u62d2\u5426\u3001\u624b\u98065\u3067 UI \u304c\u5177\u4f53\u7684\u306a\u7406\u7531\u3092\u8868\u793a\u3001\u306e4\u70b9\u3092\u3059\u3079\u3066\u6e80\u305f\u3059\u3002\n- **NG\u5224\u5b9a**: \u540c\u610f\u306a\u3057\u3067\u30af\u30e9\u30a4\u30a2\u30f3\u30c8\u307e\u305f\u306f\u30b5\u30fc\u30d0\u30fc\u304c\u4fdd\u5b58\u3092\u53d7\u7406\u3059\u308b\uff0f\u5168\u9805\u76ee\uff0b\u540c\u610f\u3042\u308a\u304b\u3064\u30d5\u30ea\u30fc\u8a18\u8ff010\u6587\u5b57\u4ee5\u4e0a\u3067 400\u30fb500 \u306b\u306a\u308b\uff0f\u624b\u98062\u306e\u30d6\u30ed\u30c3\u30af\u7406\u7531\u304c\u540c\u610f\u4ee5\u5916\u306e\u9805\u76ee\uff08\u4f8b: \u793e\u5185\u78ba\u8a8d\u30b3\u30fc\u30c9\uff09\u306b\u306a\u308a\u540c\u610f\u30b2\u30fc\u30c8\u3092\u691c\u8a3c\u3067\u304d\u306a\u3044\uff0f\u624b\u98065\u3067\u300c\u63a5\u7d9a\u3067\u304d\u307e\u305b\u3093\u3067\u3057\u305f\u300d\u7b49\u3001\u5b9f\u969b\u306e 400 \u7406\u7531\u3092\u96a0\u3059\u8aa4\u8868\u793a\u306b\u306a\u308b\u3002\n- **\u5b9f\u65bd\u7d50\u679c**: \u2610 OK\u3000\u2610 NG\u3000\uff0f\u3000\u5b9f\u65bd\u65e5: ______\u3000\u5b9f\u65bd\u8005: ______\u3000\u5099\u8003: ______\n\n### TS-02 \u9069\u6027\u30a2\u30f3\u30b1\u30fc\u30c8\u306e\u7ba1\u7406\u8005\u96c6\u8a08\uff08\u8981\u914d\u616e\u60c5\u5831\u306e\u975e\u8868\u793a\uff09\n- **\u5bfe\u8c61\u6a5f\u80fd**: \u9069\u6027\u30a2\u30f3\u30b1\u30fc\u30c8\u306e\u7ba1\u7406\u8005\u96c6\u8a08 / \u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\n- **\u95a2\u9023WBS**: T842\n- **\u95a2\u9023API**: GET /api/employee-assessment/responses/summary\n- **\u524d\u63d0\u6761\u4ef6**: TS-01 \u3067\u6700\u4f4e1\u4ef6\u306e\u5408\u6210\u56de\u7b54\u304c\u4fdd\u5b58\u6e08\u307f\u3002\u7ba1\u7406\u8005 Basic \u8a8d\u8a3c\u60c5\u5831\u3092\u4fdd\u6709\u3057\u3066\u3044\u308b\u3002\n- **\u30c6\u30b9\u30c8\u624b\u9806**:\n  1. \u7ba1\u7406\u8005\u8cc7\u683c\u60c5\u5831\u3067\u96c6\u8a08API\u307e\u305f\u306f\u7ba1\u7406\u8005\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3092\u958b\u304f\u3002\n  2. \u96c6\u8a08\u5024\uff08\u4ef6\u6570\u30fb\u5e73\u5747\u7b49\uff09\u3068\u500b\u5225\u9805\u76ee\u306e\u533f\u540d\u5316\u72b6\u614b\u3092\u78ba\u8a8d\u3059\u308b\u3002\n- **\u671f\u5f85\u7d50\u679c**: \u96c6\u8a08\u5024\u304c\u8868\u793a\u3055\u308c\u3001\u6c0f\u540d\u7b49\u306e\u76f4\u63a5\u8b58\u5225\u5b50\u3084\u7cbe\u795e\u72b6\u614b\u30b9\u30b3\u30a2\u306e\u751f\u5024\u304c\u51fa\u529b\u3055\u308c\u306a\u3044\uff08\u4eee\u540d\u30fb\u96c6\u8a08\u306e\u307f\uff09\u3002\n- **OK\u5224\u5b9a**: \u96c6\u8a08\u304c\u8868\u793a\u3055\u308c\u3001\u76f4\u63a5\u8b58\u5225\u5b50\u30fb\u8981\u914d\u616e\u751f\u5024\u304c\u4e00\u5207\u8868\u793a\u3055\u308c\u306a\u3044\u3002\n- **NG\u5224\u5b9a**: \u8a8d\u8a3c\u306a\u3057\u3067\u96c6\u8a08\u306b\u30a2\u30af\u30bb\u30b9\u3067\u304d\u308b\u3001\u307e\u305f\u306f\u76f4\u63a5\u8b58\u5225\u5b50/\u8981\u914d\u616e\u751f\u5024\u304c\u8868\u793a\u3055\u308c\u308b\u3002\n- **\u5b9f\u65bd\u7d50\u679c**: \u2610 OK\u3000\u2610 NG\u3000\uff0f\u3000\u5b9f\u65bd\u65e5: ______\u3000\u5b9f\u65bd\u8005: ______\u3000\u5099\u8003: ______\n\n### TS-03 \u52e4\u6020\u6253\u523b\u306e\u8a18\u9332\n- **\u5bfe\u8c61\u6a5f\u80fd**: \u52e4\u6020\u6253\u523b\uff08clock_in/out\u30fbbreak\uff09\n- **\u95a2\u9023WBS**: T841\n- **\u95a2\u9023API**: POST /api/attendance/punch\n- **\u524d\u63d0\u6761\u4ef6**: \u793e\u5185\u78ba\u8a8d\u30b3\u30fc\u30c9\u3068\u540c\u610f\u3092\u6e80\u305f\u3057\u3066\u3044\u308b\u3002\n- **\u30c6\u30b9\u30c8\u624b\u9806**:\n  1. \u52e4\u6020\u30bb\u30af\u30b7\u30e7\u30f3\u3067\u300c\u51fa\u52e4\uff08clock_in\uff09\u300d\u3092\u6253\u523b\u3059\u308b\u3002\n  2. \u7d9a\u3051\u3066\u300c\u9000\u52e4\uff08clock_out\uff09\u300d\u3092\u6253\u523b\u3059\u308b\u3002\n  3. \u5fdc\u7b54\u306e\u6210\u529f\u53ef\u5426\u3068 `punch_id` \u3092\u78ba\u8a8d\u3059\u308b\u3002\n- **\u671f\u5f85\u7d50\u679c**: \u5404\u6253\u523b\u304c\u6210\u529f\u3057\u3001`punch_id`\uff081\u4ee5\u4e0a\uff09\u304c\u8fd4\u308b\u3002\u539f\u672c\u30fb\u76f4\u63a5\u8b58\u5225\u5b50\u306f\u4fdd\u5b58\u3055\u308c\u306a\u3044\uff08\u4eee\u540d\u904b\u7528\uff09\u3002\n- **OK\u5224\u5b9a**: 2\u56de\u306e\u6253\u523b\u304c\u3044\u305a\u308c\u3082\u6210\u529f\u3057 `punch_id` \u304c\u8fd4\u308b\u3002\n- **NG\u5224\u5b9a**: \u3044\u305a\u308c\u304b\u306e\u6253\u523b\u304c\u5931\u6557\u3059\u308b\u3001\u307e\u305f\u306f\u76f4\u63a5\u8b58\u5225\u5b50\u304c\u4fdd\u5b58\u30fb\u8868\u793a\u3055\u308c\u308b\u3002\n- **\u5b9f\u65bd\u7d50\u679c**: \u2610 OK\u3000\u2610 NG\u3000\uff0f\u3000\u5b9f\u65bd\u65e5: ______\u3000\u5b9f\u65bd\u8005: ______\u3000\u5099\u8003: ______\n\n### TS-04 \u52e4\u52d9\u8868\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u306e\u89e3\u6790\uff08CSV / Excel / \u5b9f\u69d8\u5f0f\uff09\n- **\u5bfe\u8c61\u6a5f\u80fd**: \u52e4\u6020\u30fb\u52e4\u52d9\u8868\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u89e3\u6790\n- **\u95a2\u9023WBS**: T874\n- **\u95a2\u9023API**: POST /api/attendance/timesheet/parse\n- **\u524d\u63d0\u6761\u4ef6**: \u5408\u6210\u52e4\u52d9\u8868\u3092 `.csv` / `.xlsx` / `.xls`\uff08SRA\u69d8\u5f0f\u542b\u3080\uff09\u30 0c6\u30af\u30c1\u30e3\u610f\u601d\u6c7a\u5b9a\u8a18\u9332\uff08ADR\uff09\u306e\u5b8c\u5168\u6027\n- **\u5bfe\u8c61\u6a5f\u80fd**: \u672c\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u306e\u4e3b\u8981\u306a\u6280\u8853\u30fb\u69cb\u6210\u306e\u610f\u601d\u6c7a\u5b9a\u3092\u300c\u306a\u305c\u305d\u3046\u6c7a\u3081\u305f\u304b\u30fb\u4f55\u3092\u5374\u4e0b\u3057\u305f\u304b\u30fb\u305d\u306e\u7d50\u679c\u3069\u3046\u306a\u308b\u304b\u300d\u307e\u3067\u542b\u3081\u3066\u8a18\u9332\u3059\u308b `docs/ARCHITECTURE_DECISION_RECORDS.md` \u3068\u3001\u305d\u306e\u5b8c\u5168\u6027\u3092\u691c\u8a3c\u3059\u308bCI\u30ac\u30fc\u30c9\uff08`scripts/audit_architecture_decisions.py`\uff09\u3002\u5f93\u6765 `HOSTING_AND_DATABASE_SELECTION.md` \u304c\u30db\u30b9\u30c6\u30a3\u30f3\u30b0/DB\u306e\u307f\u3092\u6271\u3044\u3001\u30c9\u30e1\u30a4\u30f3\u30fbAI\u30e2\u30c7\u30eb\u30fb\u8ab2\u91d1\u57fa\u76e4\u30fb3\u30ec\u30fc\u30f3\u958b\u767a\u4f53\u5236\u306e\u6c7a\u5b9a\u6839\u62e0\u306f\u5404docs\u306b\u6563\u5728\u3057\u3066\u3044\u305f\u3002\u4f1a\u793e\u3078\u306e\u904b\u7528\u5f15\u7d99\u304e\uff08T850\uff09\u3068\u958b\u767a\u5b8c\u4e86\u5224\u5b9a\uff08T849\uff09\u3067\u300c\u306a\u305c\u3053\u306e\u69cb\u6210\u306a\u306e\u304b\u300d\u3092\u7b2c\u4e09\u8005\u304c\u8ffd\u3048\u308b\u3088\u3046\u306b\u3059\u308b\u3002\n- **\u95a2\u9023WBS**: T912\uff08\u95a2\u9023: T850 \u904b\u7528\u5f15\u7d99\u304e / T849 GA\u30af\u30ed\u30fc\u30ba / T740 \u672c\u756a\u30c9\u30e1\u30a4\u30f3 / T776 \u8ab2\u91d1\u8a2d\u8a08 / T664 3\u30ec\u30fc\u30f3\u4f53\u5236\uff09\n- **\u524d\u63d0\u6761\u4ef6**: Python 3.x \u304c\u52d5\u4f5c\u3059\u308b\u3002`docs/` \u3092\u95b2\u89a7\u3067\u304d\u308b\u3002\n- **\u30c6\u30b9\u30c8\u624b\u9806**:\n  1. `python scripts/audit_architecture_decisions.py` \u3092\u5b9f\u884c\u3057\u3001\u7d42\u4e86\u30b3\u30fc\u30c90\u3067\u5b8c\u4e86\u3057\u3001`exports/architecture_decisions_audit.md` \u306b10\u4eee\u8aac\u306e\u691c\u8a3c\u7d50\u679c\u8868\u304c\u51fa\u529b\u3055\u308c\u3
