    <script>
        const rawMarkdown = "# Mighty Skill-Bridge \u30bb\u30c3\u30c8\u30a2\u30c3\u30d7\u30fb\u904b\u7528\u624b\u9806\u66f8\n\n\u3053\u306e\u624b\u9806\u66f8\u306f\u3001Mighty-Link AI Connect / Mighty Skill-Bridge \u306e\u30ed\u30fc\u30ab\u30eb\u5b9f\u884c\u3001Google Workspace \u9023\u643a\u3001WBS \u540c\u671f\u3001\u5171\u6709\u4f5c\u696d\u3092\u518d\u73fe\u3067\u304d\u308b\u3088\u3046\u306b\u307e\u3068\u3081\u305f\u3082\u306e\u3067\u3059\u3002\n\n## 1. \u73fe\u5728\u306e\u524d\u63d0\n\n- \u5b9f\u884c\u30a2\u30ab\u30a6\u30f3\u30c8: `k-umezawa@ml-mightylink.com`\n- \u5171\u6709\u5148: `kobayashi-masami@ml-mightylink.com`\n- Google Cloud \u30d7\u30ed\u30b8\u30a7\u30af\u30c8: `mighty-link-ai-connect`\n- \u9032\u6357\u7ba1\u7406\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8 ID: `1L99HCBHr4IsVUWqnUuG6OgoUmxEQUdfaYQim1n6etB8`\n- WBS \u30ab\u30ec\u30f3\u30c0\u30fc\u540d: `Mighty Skill-Bridge \u958b\u767a\u8a08\u753b`\n- \u30ed\u30fc\u30ab\u30eb\u30b5\u30fc\u30d0\u30fc: `http://localhost:8000`\n\n\u8a73\u7d30\u306a\u79fb\u884c\u4f5c\u696d\u30ed\u30b0\u306f [GOOGLE_WORKSPACE_MIGRATION_RUNBOOK.md](GOOGLE_WORKSPACE_MIGRATION_RUNBOOK.md) \u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\nGemini quota \u5236\u9650\u4e2d\u306e Codex \u7d99\u7d9a\u904b\u7528\u306f [CODEX_CONTINUATION_NOTES.md](CODEX_CONTINUATION_NOTES.md) \u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n## 2. \u30d5\u30a9\u30eb\u30c0\u69cb\u6210\n\n```text\nmighty-link-ai-connect/\n\u251c\u2500\u2500 src/\n\u2502   \u251c\u2500\u2500 app.py\n\u2502   \u2514\u2500\u2500 index.html\n\u251c\u2500\u2500 scripts/\n\u2502   \u251c\u2500\u2500 sync_wbs_to_calendar.py\n\u2502   \u251c\u2500\u2500 sync_wbs_to_sheets.py\n\u2502   \u251c\u2500\u2500 generate_knowledge_flow_demo.py\n\u2502   \u251c\u2500\u2500 share_resources.py\n\u2502   \u2514\u2500\u2500 verify_public_demo.py\n\u251c\u2500\u2500 docs/\n\u2502   \u251c\u2500\u2500 SETUP_GUIDE.md\n\u2502   \u251c\u2500\u2500 GOOGLE_WORKSPACE_MIGRATION_RUNBOOK.md\n\u2502   \u251c\u2500\u2500 CODEX_CONTINUATION_NOTES.md\n\u2502   \u251c\u2500\u2500 BACKEND_AI_PIPELINE.md\n\u2502   \u251c\u2500\u2500 CEO_PRESENTATION_PREP_2026-06-02.md\n\u2502   \u251c\u2500\u2500 CEO_PRESENTATION_DECISION_PACK_2026-06-02.md\n\u2502   \u251c\u2500\u2500 DEVELOPMENT_KNOWLEDGE_FLOW.md\n\u2502   \u251c\u2500\u2500 PROJECT_STRUCTURE.md\n\u2502   \u251c\u2500\u2500 WBS.md\n\u2502   \u251c\u2500\u2500 WBS_SYNC_GUIDE.md\n\u2502   \u251c\u2500\u2500 ANTIGRAVITY_GUIDE.md\n\u2502   \u251c\u2500\u2500 database.md\n\u2502   \u2514\u2500\u2500 requirements.md\n\u251c\u2500\u2500 data/\n\u2502   \u251c\u2500\u2500 WBS.tsv\n\u2502   \u2514\u2500\u2500 audit/\n\u251c\u2500\u2500 exports/\n\u2502   \u251c\u2500\u2500 mighty_development_plan.ics\n\u2502   \u2514\u2500\u2500 knowledge_flow/\n\u251c\u2500\u2500 credentials.json\n\u251c\u2500\u2500 client_secret.json\n\u251c\u2500\u2500 authorized_user.json\n\u251c\u2500\u2500 credentials.json.template\n\u251c\u2500\u2500 requirements.txt\n\u251c\u2500\u2500 README.md\n\u2514\u2500\u2500 .gitignore\n```\n\n\u8a8d\u8a3c\u30d5\u30a1\u30a4\u30eb\u306f\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u30eb\u30fc\u30c8\u76f4\u4e0b\u306b\u7f6e\u304d\u307e\u3059\u3002`.gitignore` \u3067 Git \u7ba1\u7406\u5bfe\u8c61\u5916\u306b\u3057\u3066\u3044\u308b\u305f\u3081\u3001GitHub \u3078\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u3057\u306a\u3044\u3067\u304f\u3060\u3055\u3044\u3002\n\n## 3. \u521d\u56de\u30bb\u30c3\u30c8\u30a2\u30c3\u30d7\n\n\u4f9d\u5b58\u30e9\u30a4\u30d6\u30e9\u30ea\u3092\u30a4\u30f3\u30b9\u30c8\u30fc\u30eb\u3057\u307e\u3059\u3002\n\n```powershell\npip install -r requirements.txt\n```\n\nGoogle Cloud Console \u5074\u3067\u306f\u3001\u4ee5\u4e0b\u306e API \u3068 OAuth \u8a2d\u5b9a\u304c\u5fc5\u8981\u3067\u3059\u3002\n\n- Google Sheets API\n- Google Drive API\n- Google Calendar API\n- OAuth 2.0 \u30c7\u30b9\u30af\u30c8\u30c3\u30d7\u30af\u30e9\u30a4\u30a2\u30f3\u30c8\n- \u30c6\u30b9\u30c8\u30e6\u30fc\u30b6\u30fc: `k-umezawa@ml-mightylink.com`\n\nOAuth \u30af\u30e9\u30a4\u30a2\u30f3\u30c8 JSON \u306f `client_secret.json` \u306b\u30ea\u30cd\u30fc\u30e0\u3057\u3066\u3001\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u30eb\u30fc\u30c8\u3078\u914d\u7f6e\u3057\u307e\u3059\u3002\n\n## 4. \u958b\u767a\u30c4\u30fc\u30eb\u5207\u308a\u66ff\u3048\u65b9\u91dd\n\n\u901a\u5e38\u958b\u767a\u306f Antigravity + Gemini \u3067\u9032\u3081\u307e\u3059\u3002Antigravity \u5074\u3067 Gemini \u306e baseline quota \u5236\u9650\u306b\u9054\u3057\u305f\u5834\u5408\u306f\u3001\u4f5c\u696d\u3092\u6b62\u3081\u305a\u306b VSCode + Codex \u3078\u5207\u308a\u66ff\u3048\u3066\u958b\u767a\u3092\u7d99\u7d9a\u3057\u307e\u3059\u3002\n\n\u5207\u308a\u66ff\u3048\u6642\u306e\u904b\u7528\u30eb\u30fc\u30eb:\n\n- \u5b9f\u88c5\u3001\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u6574\u5099\u3001\u30ed\u30fc\u30ab\u30eb\u691c\u8a3c\u3001Git \u64cd\u4f5c\u306f VSCode + Codex \u3067\u7d99\u7d9a\u3059\u308b\u3002\n- Gemini API \u306e quota \u3092\u6d88\u8cbb\u3057\u306a\u3044\u3088\u3046\u3001\u5fc5\u8981\u306b\u5fdc\u3058\u3066 `AI_FORCE_MOCK=1` \u3067 FastAPI \u3092\u8d77\u52d5\u3059\u308b\u3002\n- Google Workspace \u9023\u643a\u306f\u65e2\u5b58\u306e `authorized_user.json` \u3092\u4f7f\u3044\u3001`k-umezawa@ml-mightylink.com` \u306e OAuth \u8a8d\u8a3c\u3092\u7d99\u7d9a\u5229\u7528\u3059\u308b\u3002\n- quota \u56de\u5fa9\u5f8c\u306b Gemini live \u5b9f\u884c\u3078\u623b\u3059\u5834\u5408\u306f\u3001`AI_FORCE_MOCK` \u3092\u89e3\u9664\u3057\u3066\u30b5\u30fc\u30d0\u30fc\u3092\u518d\u8d77\u52d5\u3059\u308b\u3002\n\nquota \u5236\u9650\u6642\u306e\u8a73\u7d30\u624b\u9806\u306f [CODEX_CONTINUATION_NOTES.md](CODEX_CONTINUATION_NOTES.md) \u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n## 5. WBS \u3092 Google \u30ab\u30ec\u30f3\u30c0\u30fc\u3078\u540c\u671f\n\n```powershell\npython scripts/sync_wbs_to_calendar.py\n```\n\n\u521d\u56de\u5b9f\u884c\u6642\u306f\u30d6\u30e9\u30a6\u30b6\u304c\u958b\u304d\u307e\u3059\u3002`k-umezawa@ml-mighty ace_account.py --reauth` \u3092\u5b9f\u884c\u3057\u307e\u3059\u3002\n\n## 6. WBS \u3092 Google Sheets \u3078\u540c\u671f\n\n\u65e2\u5b58\u306e\u9032\u6357\u7ba1\u7406\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u3078\u540c\u671f\u3059\u308b\u5834\u5408:\n\n```powershell\npython scripts/sync_wbs_to_sheets.py 1L99HCBHr4IsVUWqnUuG6OgoUmxEQUdfaYQim1n6etB8\n```\n\n\u540c\u671f\u5143\u30c7\u30fc\u30bf\u306f [data/WBS.tsv](../data/WBS.tsv) \u3067\u3059\u3002\n\n\u73fe\u5728\u306e\u540c\u671f\u30b9\u30af\u30ea\u30d7\u30c8\u306f\u3001\u53c2\u8003\u30d5\u30a1\u30a4\u30eb `\u3010\u6b21\u671fCATS\u3011WBS_\u5206\u6790\u8a08\u753b\u5de5\u7a0b(\u5f8c\u534a).xlsx` \u306e\u69cb\u6210\u3092\u8e0f\u307e\u3048\u3001\u4ee5\u4e0b\u306e 3 \u30bf\u30d6\u3092\u81ea\u52d5\u751f\u6210\u3057\u307e\u3059\u3002\n\n- `Mighty-Link WBS`: \u968e\u5c64WBS\u3001\u30d5\u30a7\u30fc\u30ba\u884c\u3001\u4e88\u5b9a/\u9032\u6357\u3001\u30a2\u30e9\u30fc\u30c8\u3001\u56fa\u5b9a\u30d8\u30c3\u30c0\u30fc\u3001\u30d5\u30a3\u30eb\u30bf\u4ed8\u304d\u306e\u7ba1\u7406\u8868\n- `WBS Summary`: \u30d5\u30a7\u30fc\u30ba\u5225\u306e\u7dcf\u6570\u3001\u5b8c\u4e86\u6570\u3001\u672a\u7740\u624b\u6570\u3001\u5b8c\u4e86\u7387\u3001\u671f\u9593\u306e\u96c6\u8a08\n- `WBS Timeline`: \u30bf\u30b9\u30af\u5225\u306e\u958b\u59cb\u65e5\u3001\u7d42\u4e86\u65e5\u3001\u4e88\u5b9a\u5de5\u6570\u3001\u9032\u6357\u7387\u306e\u6a2a\u65ad\u78ba\u8a8d\u8868\n\n## 7. \u5c0f\u6797\u793e\u9577\u3078\u30ab\u30ec\u30f3\u30c0\u30fc\u3068 Sheets \u3092\u5171\u6709\n\n```powershell\npython scripts/share_resources.py\n```\n\n\u3053\u306e\u30b9\u30af\u30ea\u30d7\u30c8\u306f `authorized_user.json` \u306e OAuth \u30c8\u30fc\u30af\u30f3\u3092\u4f7f\u3044\u3001\u4ee5\u4e0b\u3092\u5b9f\u884c\u3057\u307e\u3059\u3002\n\n- `Mighty Skill-Bridge \u958b\u767a\u8a08\u753b` \u30ab\u30ec\u30f3\u30c0\u30fc\u3092 `writer` \u6a29\u9650\u3067\u5171\u6709\n- \u9032\u6357\u7ba1\u7406\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u3092 `writer` \u6a29\u9650\u3067\u5171 \u30bb\u30c3\u30b7\u30e7\u30f3\u306e\u7d42\u4e86\u6642\u306f\u3001WBS\u30bf\u30b9\u30af\u3092\u6700\u4f4e1\u4ef6\u5b8c\u4e86\u3055\u305b\u3001Sheets/Calendar\u540c\u671f\u3001commit\u3001push\u3001`main`/`master`\u53cd\u6620\u307e\u3067\u884c\u3044\u307e\u3059\u3002\n\n## 9. FastAPI \u30b5\u30fc\u30d0\u30fc\u8d77\u52d5\n\n\u901a\u5e38\u8d77\u52d5:\n\n```powershell\npython src/app.py\n```\n\n\u5225\u30a6\u30a3\u30f3\u30c9\u30a6\u3092\u4f7f\u308f\u305a\u30d0\u30c3\u30af\u30b0\u30e9\u30a6\u30f3\u30c9\u8d77\u52d5\u3059\u308b\u5834\u5408:\n\n```powershell\nStart-Process -WindowStyle Hidden -FilePath python -ArgumentList \"src/app.py\" -WorkingDirectory .\n```\n\n\u30d6\u30e9\u30a6\u30b6\u3067 `http://localhost:8000` \u3092\u958b\u304d\u3001\u753b\u9762\u306e\u63a5\u7d9a\u72b6\u614b\u304c `Live Connected` \u306b\u306a\u308b\u3053\u3068\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002\n\n## 10. \u516c\u958b\u30c7\u30e2URL\u306e\u30c7\u30b0\u30ec\u9632\u6b62\n\n\u793e\u9577\u5171\u6709\u6e08\u307f\u306e\u516c\u958bURL `https://kanta13jp1.github.io/mighty-link-ai-connect/` \u306f GitHub Pages \u306e\u672c\u756a\u30c7\u30e2\u9762\u3068\u3057\u3066\u6271\u3044\u307e\u3059\u3002\n\n\u91cd\u8981\u30eb\u30fc\u30eb:\n\n- \u30eb\u30fc\u30c8\u76f4\u4e0b\u306e `index.html` \u306f\u524a\u9664\u30fb\u79fb\u52d5\u3057\u306a\u3044\u3002\n- FastAPI \u7528\u306e `src/index.html` \u3092\u5909\u66f4\u3059\u308b\u5834\u5408\u3067\u3082\u3001\u516c\u958bURL\u7528\u306e `index.html` \u3078\u306e\u5f71\u97ff\u3092\u5fc5\u305a\u78ba\u8a8d\u3059\u308b\u3002\n- push \u524d\u306b `scripts/verify_public_demo.py` \u3092\u5b9f\u884c\u3057\u3001README fallback \u3084 UI \u30de\u30fc\u30ab\u30fc\u6b20\u843d\u304c\u306a\u3044\u3053\u3068\u3092\u78ba\u8a8d\u3059\u308b\u3002\n- `main` / `master` \u3078\u306e push \u6642\u306f GitHub Actions `Public Demo Guard` \u304c root `index.html` \u3092\u691c\u8a3c\u3059\u308b\u3002\n\n\u30ed\u30fc\u30ab\u30eb\u691c\u8a3c:\n\n```powershell\npython scripts/verify_public_demo.py\n```\n\n\u516c\u958bURL\u53cd\u6620\u5f8c\u306e\u691c\u8a3c:\n\n```powershell\npython scripts/verify_public_demo.py --url https://kanta13jp1.github.io/mighty-link-ai-connect/\n```\n\n## 11. AI \u76e3\u67fb\u30ed\u30b0\u306e\u78ba\u8a8d\n\n`/api/parse` \u3068 `/api/match` \u306e\u5b9f\u884c\u7d50\u679c\u306f\u3001\u5f8c\u304b\u3089\u5224\u5b9a\u6839\u62e0\u3092\u78ba\u8a8d\u3067\u304d\u308b\u3088\u3046\u306b `data/audit/ai_audit.jsonl` \u3078\u4fdd\u5b58\u3055\u308c\u307e\u3059\u3002\u30ed\u30b0\u672c\u4f53\u306f `.gitignore` \u5bfe\u8c61\u3067\u3001Git \u306b\u306f\u542b\u3081\u307e\u305b\u3093\u3002\n\n\u76f4\u8fd1\u30ed\u30b0\u3092\u78ba\u8a8d\u3059\u308b\u5834\u5408:\n\n```powershell\nInvoke-RestMethod \"http://127.0.0.1:8000/api/audit/recent?limit=10\"\n```\n\n\u30ec\u30b9\u30dd\u30f3\u30b9\u306b\u306f `audit_event_id`\u3001AI mode\u3001\u30b9\u30b3\u30a2\u3001matched/missing skills\u3001\u77ed\u3044 excerpt \u304c\u542b\u307e\u308c\u307e\u3059\u3002\u539f\u6587\u5168\u6587\u306f\u4fdd\u5b58\u3057\u307e\u305b\u3093\u3002\n\n## 12. \u3088\u304f\u3042\u308b\u30c8\u30e9\u30d6\u30eb\n\n### Gemini \u306e quota \u5236\u9650\u304c\u51fa\u3066\u3044\u308b\n\nAntigravity \u5074\u3067 Gemini \u306e baseline quota \u5236\u9650\u306b\u9054\u3057\u305f\u5834\u5408\u306f\u3001VSCode + Codex \u3067\u958b\u767a\u3092\u7d99\u7d9a\u3057\u307e\u3059\u3002Gemini API \u3092\u6d88\u8cbb\u3057\u306a\u3044 `AI_FORCE_MOCK=1` \u3067\u8d77\u52d5\u3057\u307e\u3059\u3002\n\n```powershell\n$env:AI_FORCE_MOCK = \"1\"\npython src/app.py\n```\n\n\u3053\u306e\u72b6\u614b\u3067\u3082 Sheets \u9023\u643a\u3068\u753b\u9762\u30c7\u30e2\u306f\u7d99\u7d9a\u3067\u304d\u307e\u3059\u3002\u5b9f\u88c5\u30fb\u691c\u8a3c\u4f5c\u696d\u306f Codex \u5074\u3067\u9032\u3081\u307e\u3059\u3002\n\u30d0\u30c3\u30af\u30a8\u30f3\u30c9\u306e deterministic fallback \u3068 Gemini \u5fa9\u5e30\u6642\u306e\u63a5\u7d9a\u65b9\u91dd\u306f [BACKEND_AI_PIPELINE.md](BACKEND_AI_PIPELINE.md) \u3092\u53c2\u7167\u3057\u3066\u304f\u3060\u3055\u3044\u3002\n\n### OAuth \u3067\u300c\u3053\u306e\u30a2\u30d7\u30ea\u306f\u30d6\u30ed\u30c3\u30af\u3055\u308c\u3066\u3044\u307e\u3059\u300d\u3068\u8868\u793a\u3055\u308c\u308b\n\nGoogle Cloud Console \u306e\u5bfe\u8c61\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u3067\u3001OAuth \u540c\u610f\u753b\u9762\u306e\u30c6\u30b9\u30c8\u30e6\u30fc\u30b6\u30fc\u306b `k-umezawa@ml-mightylink.com` \u3092\u8ffd\u52a0\u3057\u307e\u3059\u3002\n\n### NotebookLM CLI \u306e\u30ed\u30b0\u30a4\u30f3\u304c\u9014\u4e2d\u3067\u843d\u3061\u308b\n\n`notebooklm login` \u304cGoogle Accounts\u306e\u753b\u9762\u9077\u79fb\u4e2d\u65ad\u3067\u5931\u6557\u3059\u308b\u5834\u5408\u306f\u3001Workspace\u5c02\u7528\u306e\u88dc\u52a9\u30ed\u30b0\u30a4\u30f3\u3092\u4f7f\u3044\u307e\u3059\u3002\n\n```powershell\npython scripts/notebooklm_login_workspace.py\npython scripts/sync_docs_to_notebooklm.py --skip-asks --skip-source-refresh --source-timeout-seconds 60\npython scripts/generate_ceo_presentation_deck.py\n```\n\n\u30d6\u30e9\u30a6\u30b6\u3067\u306f `k-umezawa@ml-mightylink.com` \u3092\u9078\u629e\u3057\u307e\u3059\u3002\u8a8d\u8a3c\u5f8c\u3001NotebookLM\u306e\u30db\u30fc\u30e0\u304c\u8868\u793a\u3055\u308c\u305f\u3089\u30bf\u30fc\u30df\u30ca\u30eb\u3067Enter\u3092\u62bc\u3059\u3068\u3001CLI\u7528\u306estorage state\u304c\u4fdd\u5b58\u3055\u308c\u307e\u3059\u3002\n\nNotebookLM\u3067\u53d6\u5f97\u3057\u305f\u793e\u9577\u5411\u3051\u8349\u6848\u3092PowerPoint\u5316\u3059\u308b\u5834\u5408\u306f\u3001`scripts/generate_ceo_presentation_deck.py` \u3092\u5b9f\u884c\u3057\u307e\u3059\u3002\u6210\u679c\u7269\u306f `exports/knowledge_flow/mighty_skill_bridge_ceo_presentation_2026-06-02.pptx` \u306b\u4fdd\u5b58\u3055\u308c\u307e\u3059\u3002\n\n### \u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u5171\u6709\u6642\u306b 404 File not found \u304c\u51fa\u308b\n\n\u30b9\u30d7\u30ec\u30c3\u30c9\u30b7\u30fc\u30c8\u306e\u30aa\u30fc\u30ca\u30fc\u6a29\u9650\u3092\u6301\u3064\u30a2\u30ab\u30a6\u30f3\u30c8\u304b\u3089\u3001`k-umezawa@ml-mightylink.com` \u3092\u7de8\u96c6\u8005\u3068\u3057\u3066\u5171\u6709\u3057\u307e\u3059\u3002\u305d\u306e\u5f8c\u3001`python scripts/share_resources.py` \u3092\u518d\u5b9f\u884c\u3057\u307e\u3059\u3002\n\n### `Live Connected` \u306b\u306a\u3089\u306a\u3044\n\n`client_secret.json` \u3068 `authorized_user.json` \u304c\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u30eb\u30fc\u30c8\u76f4\u4e0b\u306b\u3042\u308b\u304b\u78ba\u8a8d\u3057\u3001`python src/app.py` \u3067\u8d77\u52d5\u3057\u76f4\u3057\u307e\u3059\u3002\n\n## 2026-05-22 \u8ffd\u52a0: Seedance API \u52d5\u753b\u30c7\u30e2\n\n\u516c\u958b\u30c7\u30e2\u306e\u7b2c\u4e00\u753b\u9762\u306f `exports/seedance_demo/mighty_skill_bridge_seedance_demo.mp4` \u3092\u8868\u793a\u3057\u307e\u3059\u3002\u30ed\u30fc\u30ab\u30eb FastAPI \u8d77\u52d5\u6642\u306f `/api/seedance/video-demo` \u304b\u3089 Seedance API \u3078\u63a5\u7d9a\u3067\u304d\u307e\u3059\u3002\n\n```powershell\npython scripts/generate_seedance_demo_video.py\n$env:SEEDANCE_API_KEY = \"<your seedance or modelark api key>\"\n$env:SEEDANCE_API_URL = \"<seedance create task endpoint>\"\n$env:SEEDANCE_MODEL = \"seedance-1-0-pro\"\n# \u30bf\u30b9\u30af\u53d6\u5f97\u578bAPI\u306e\u5834\u5408\u306e\u307f:\n$env:SEEDANCE_RESULT_API_URL_TEMPLATE = \"<result endpoint with {task_id}>\"\npython src/app.py\n```\n\nAPI\u30ad\u30fc\u3084\u30a8\u30f3\u30c9\u30dd\u30a4\u30f3\u30c8\u304c\u672a\u8a2d\u5b9a\u306e\u5834\u5408\u3001`/api/seedance/video-demo` \u306f\u5b89\u5168\u306a\u30ed\u30fc\u30ab\u30eb\u52d5\u753b\u3092\u8fd4\u3057\u307e\u3059\u3002\u79d8\u5bc6\u60c5\u5831\u306f `client_secret.json` \u306a\u3069\u3068\u540c\u3058\u304fGit\u3078\u542b\u3081\u307e\u305b\u3093\u3002\n\n## 2026-05-22 Seedance API 400 debug note\n\nFor ModelArk Seedance 2.0, the local adapter now uses a content-task payload by default:\n\n```powershell\n$env:SEEDANCE_API_KEY = \"<BytePlus ModelArk API key>\"\n$env:SEEDANCE_API_URL = \"https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks\"\n$env:SEEDANCE_RESULT_API_URL_TEMPLATE = \"https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks/{task_id}\"\n$env:SEEDANCE_MODEL = \"dreamina-seedance-2-0-260128\"\n$env:SEEDANCE_API_ENABLED = \"1\"\n```\n\n`/api/seedance/video-demo` sends `content: [{type: \"text\", text: prompt}]`, `ratio`, and `duration`. If another BytePlus media endpoint requires the older `prompt` field, set this before starting FastAPI:\n\n```powershell\n$env:SEEDANCE_PAYLOAD_STYLE = \"prompt_legacy\"\n```\n\nAfter changing environment variables or pulling code, restart `python src/app.py`. A `fallback` response with `seedance_live: true` means credentials are loaded but BytePlus returned an API error; check `fallback_reason` for the provider response body.\n\n## 2026-05-22 Seedance async result polling\n\nModelArk video generation is asynchronous. A successful create request can return a `task_id` before the generated video URL is ready. The local adapter now polls the result endpoint after task creation:\n\n```powershell\n$env:SEEDANCE_RESULT_API_URL_TEMPLATE = \"https://ark.ap-southeast.bytepluses.com/api/v3/contents/generations/tasks/{task_id}\"\n$env:SEEDANCE_POLL_TIMEOUT_SECONDS = \"30\"\n$env:SEEDANCE_POLL_INTERVAL_SECONDS = \"5\"\npython src/app.py\n```\n\nCheck polling readiness:\n\n```powershell\nInvoke-RestMethod http://127.0.0.1:8000/api/health\n```\n\nExpected fields:\n\n```text\nseedance_live: True\nseedance_result_polling: True\nseedance_poll_timeout_seconds: 30\n```\n\nIf `fallback_reason` says the task was accepted but no URL was returned within the timeout, increase `SEEDANCE_POLL_TIMEOUT_SECONDS`, restart FastAPI, and retry.\n\nThe browser also continues polling after a `pending` response. It calls:\n\n```text\n/api/seedance/video-task/{task_id}\n```\n\nevery 10 seconds for up to about 10 minutes, then replaces the preview video when a generated URL is returned. If DevTools still shows `task_status=running`, keep the page open or raise the polling window for longer generation jobs.\n\n## 2026-05-22 Seedance cost guard and saved default video\n\nSeedance API billing calls are disabled by default. Even if `SEEDANCE_API_KEY` is set, FastAPI returns the saved local video unless this flag is set before startup:\n\n```powershell\n$env:SEEDANCE_API_ENABLED = \"1\"\npython src/app.py\n```\n\nFor normal demos, leave `SEEDANCE_API_ENABLED` unset. The default video is:\n\n```text\nexports/seedance_demo/mighty_skill_bridge_seedance_demo.mp4\n```\n\nThe generated Seedance result has been saved to that path, and the previous procedural fallback is kept at:\n\n```text\nexports/seedance_demo/mighty_skill_bridge_procedural_fallback.mp4\n```\n\nThe UI exposes a `Download Video` button that downloads the currently displayed video. Token/resource usage should be checked from BytePlus Console:\n\n```text\nModelArk > Usage\nModelArk > Model activation > Media > Dreamina-Seedance-2.0\n```\n\nThe API response used by this demo does not currently expose token consumption, so the source of truth for spend is the BytePlus usage/resource-pack screens.\n\n## 2026-05-22 External API guard dashboard\n\nLocal FastAPI exposes a billing-safety dashboard:\n\n```text\nhttp://127.0.0.1:8000/admin\n```\n\nThe dashboard reads a local, gitignored JSONL ledger:\n\n```text\ndata/external_api_usage.jsonl\n```\n\nIt shows:\n\n- Daily billable call counts\n- Blocked calls\n- Provider-reported token counts when available\n- Seedance saved-default video metadata\n- Recent external API events without prompts, API keys, or signed video URLs\n\nThe same data is available as JSON:\n\n```powershell\nInvoke-RestMethod http://127.0.0.1:8000/api/admin/usage\n```\n\nExport the raw local ledger:\n\n```text\nhttp://127.0.0.1:8000/api/admin/usage/export\n```\n\nDefault circuit-breaker values:\n\n```powershell\n$env:SEEDANCE_API_ENABLED = \"\"          # external Seedance calls disabled by default\n$env:SEEDANCE_DAILY_GENERATION_LIMIT = \"1\"\n$env:GEMINI_DAILY_CALL_LIMIT = \"20\"\n$env:GEMINI_DAILY_REPORTED_TOKEN_LIMIT = \"100000\"\n```\n\nDaily usage ledger audit (T736):\n\n```powershell\npython scripts/audit_external_api_usage.py --write-default-report\n```\n\nThis reads `data/external_api_usage.jsonl`, checks the Seedance and Gemini daily call/token thresholds, prints warning or critical alerts, and writes `reports/daily_usage_audit_<date>.json`. To use it as a CI or pre-release gate, add `--fail-on-alert`.\n\nTo intentionally generate a new Seedance video:\n\n```powershell\n$env:SEEDANCE_API_ENABLED = \"1\"\n$env:SEEDANCE_DAILY_GENERATION_LIMIT = \"1\"\npython src/app.py\n```\n\nAfter generation, unset `SEEDANCE_API_ENABLED` and restart FastAPI. BytePlus ModelArk usage/resource-pack screens remain the authoritative billing view because Seedance video responses may not include token usage.\n\n## 2026-05-22 Favicon and local route polish\n\nThe project root now includes a branded `favicon.ico`. It is used by both:\n\n```text\nhttps://kanta13jp1.github.io/mighty-link-ai-connect/favicon.ico\nhttp://127.0.0.1:8000/favicon.ico\n```\n\nFastAPI serves it through an explicit `/favicon.ico` route, and both `index.html` and `src/index.html` declare it in the document head. If the browser still shows a missing icon after pulling this change, restart FastAPI and hard-refresh the tab.\n\nThe admin usage JSON is available from either path:\n\n```text\nhttp://127.0.0.1:8000/api/admin/usage\nhttp://127.0.0.1:8000/admin/usage\n```\n\nOn Windows, the local server also switches to `WindowsSelectorEventLoopPolicy` before starting Uvicorn. This reduces noisy `ConnectionResetError` traces that can appear when Chrome cancels or resumes partial video requests during MP4 preview playback.\n\nGemini live mode now uses the current `google-genai` package instead of the deprecated `google-generativeai` package. Reinstall dependencies after pulling this change:\n\n```powershell\npip install -r requirements.txt\n```\n\n## 2026-05-23 Chrome DevTools workspace route\n\nChrome DevTools can request the following local-only endpoint when DevTools is open against `localhost` or `127.0.0.1`:\n\n```text\n/.well-known/appspecific/com.chrome.devtools.json\n```\n\nFastAPI now responds with Chrome's Automatic Workspace connection JSON:\n\n```json\n{\n  \"workspace\": {\n    \"root\": \"<absolute local project root>\",\n    \"uuid\": \"<stable project uuid>\"\n  }\n}\n```\n\nThis removes the noisy 404 from local server logs and lets Chrome offer a workspace connection in DevTools. The response intentionally includes the absolute local project path, so this route is for the local FastAPI development server only. The public GitHub Pages demo does not use this FastAPI route.\n\n## 2026-05-23 Seedance-style demo navigation and footer\n\nThe public and local demo HTML is generated from:\n\n```text\nscripts/render_seedance_video_demo_ui.py\n```\n\nRun this script whenever the demo shell changes so the CEO-facing GitHub Pages file and the FastAPI-served file stay aligned:\n\n```powershell\npython scripts/render_seedance_video_demo_ui.py\n```\n\nThe first viewport now keeps the saved Seedance video as the default visual, keeps `Generate Video` wired to `/api/seedance/video-demo`, and keeps `Download Video` pointed at the currently displayed MP4. The navigation mirrors the Seedance-style information architecture used for the demo:\n\n- `Home`\n- `Models`\n- `Blog & Publication`\n- `Join Us`\n- `EN / JP`\n\nThe header shrinks on scroll by toggling the `.scrolled` class, and the footer exposes `Models`, `Teams`, and `Learn More` columns. Do not remove the existing public-demo guard markers (`bridge-btn`, `runAnalysis()`, `knowledge-flow-demo`, `generateKnowledgeFlowArtifacts`, `sampleEngineer`, `radarChart`) when polishing this screen.\n\nNormal demos should keep billing calls disabled:\n\n```powershell\n$env:SEEDANCE_API_ENABLED = \"\"\n```\n\n## 2026-06-03 Firebase CI/CD credentials\n\nGitHub Actions deploys Firebase Hosting and Functions through `.github/workflows/deploy.yml`.\nThe workflow now prefers Firebase CLI Application Default Credentials, matching the current Firebase CLI guidance, and only falls back to `FIREBASE_TOKEN` for legacy compatibility.\n\nRepository configuration:\n\n- Variable `FIREBASE_DEPLOY_TARGETS`: Firebase deploy targets. Defaults to `hosting`. If this repository variable is set to `hosting,functions`, the workflow still deploys Hosting only unless `FIREBASE_FUNCTIONS_DEPLOY_ENABLED=true`.\n- Variable `FIREBASE_FUNCTIONS_DEPLOY_ENABLED`: set to `true` only after the Firebase project is upgraded to Blaze and the CI service account can update Cloud Functions / Cloud Run invoker IAM policies.\n- Variable `FIREBASE_PROJECT_ID`: Firebase project ID. Defaults to `.firebaserc` / workflow value `mighty-link-ai-connect-13d22` when unset.\n- Secret `FIREBASE_SERVICE_ACCOUNT_JSON`: full JSON key for a service account allowed to deploy Firebase Hosting and Functions.\n- Secret `FIREBASE_SERVICE_ACCOUNT_MIGHTY_LINK_AI_CONNECT`: also accepted for compatibility with the default Firebase Hosting GitHub integration naming pattern.\n- Secret `FIREBASE_TOKEN`: legacy fallback. If this is present but the token owner cannot access the target Firebase project, CI fails with `Failed to get Firebase project`.\n\nIf the deploy log says the project cannot be accessed, first confirm that the Firebase project exists with exactly the same ID as `FIREBASE_PROJECT_ID` (currently `mighty-link-ai-connect-13d22`), then confirm the service account or legacy token user has deploy permission for that project. If the log says `Unable to set the invoker for the IAM policy`, keep `FIREBASE_FUNCTIONS_DEPLOY_ENABLED` unset/false until the service account has the required Functions/Cloud Run IAM permissions.\n\n## 2026-06-11 Firebase/Supabase staging guard (T788)\n\n\u672c\u756a\u53cd\u6620\u524d\u306e\u78ba\u8a8d\u306f [STAGING_ENVIRONMENT_OPERATION_RUNBOOK.md](STAGING_ENVIRONMENT_OPERATION_RUNBOOK.md) \u3092\u6b63\u3068\u3057\u307e\u3059\u3002Firebase Hosting \u306f preview channel `staging` \u3092\u4f7f\u3044\u3001Functions deploy \u306f `FIREBASE_FUNCTIONS_DEPLOY_ENABLED=true` \u3068 `ALLOW_STAGING_FUNCTIONS_DEPLOY=true` \u306e\u4e21\u65b9\u304c\u660e\u793a\u3055\u308c\u308b\u307e\u3067\u5bfe\u8c61\u5916\u306b\u3057\u307e\u3059\u3002\n\nstaging deploy \u307e\u305f\u306f Supabase migration \u306e\u524d\u306b\u3001production \u3068 staging \u306e\u6df7\u5728\u304c\u306a\u3044\u3053\u3068\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002\n\n```powershell\npython scripts/verify_staging_environment_config.py --fail-on-critical\n```\n\nJSON\u306e\u76e3\u67fb\u30ed\u30b0\u304c\u5fc5\u8981\u306a\u5834\u5408:\n\n```powershell\npython scripts/verify_staging_environment_config.py --json --output reports/staging_environment_config.json\n```\n\n`SUPABASE_STAGING_URL` / `SUPABASE_PROD_URL`\u3001anon key\u3001JWT secret fingerprint\u3001service role key \u306f\u540c\u4e00\u7981\u6b62\u3067\u3059\u3002raw secret \u306f docs\u3001WBS\u3001Sheets\u3001Git\u5dee\u5206\u3078\u66f8\u304b\u305a\u3001fingerprint \u3060\u3051\u3092\u6bd4\u8f03\u7528\u306b\u4f7f\u3044\u307e\u3059\u3002\n";
        document.getElementById('rendered-doc').innerHTML = marked.parse(rawMarkdown);
